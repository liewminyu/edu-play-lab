<style>
:root{
  --ink:#4e3b78;--ink2:#796492;--line:#e6d9f3;--accent:#8867ef;--accent2:#f6d9ee;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f9effb,#f8f4ff 52%,#eef5ff)}
button,input,select{font:inherit}
button{color:var(--ink)}
.app{height:100dvh;padding:calc(8px + var(--safeT)) calc(10px + var(--safeR)) calc(8px + var(--safeB)) calc(10px + var(--safeL));display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px}
.topbar,.tabs,.tray,.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.topbar{border-radius:22px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#ffd4ea,#dcd1ff 58%,#d7eaff)}
.title{min-width:0}.title h1{margin:0;font-size:clamp(1.2rem,2vw,1.75rem);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{display:block;color:var(--ink2);font-weight:700;margin-top:4px}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #ded2ef;background:linear-gradient(180deg,#fff,#f8f3ff);border-radius:13px;padding:9px 11px;font-weight:800;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.9)}.btn.primary{background:linear-gradient(135deg,#8e72f4,#735ce5);border-color:#735ce5;color:white}.btn.magic{background:linear-gradient(135deg,#ffe0ef,#eadcff)}
.tabs{border-radius:18px;padding:6px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar,.chiprow::-webkit-scrollbar{display:none}.tab{flex:1 0 auto;min-width:110px;border:0;background:transparent;border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer}.tab.active{background:linear-gradient(135deg,#eadcff,#ffe2f0);box-shadow:inset 0 0 0 1px #dac7ef}
.workspace{min-height:0;position:relative}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px);border-radius:20px}
.controls,.left,.right,.editTargets,.smallActions{display:none!important}

.stageTools{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px}

.stageInner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:6px}
.sceneShell{position:relative;flex:0 0 auto}
.scene{position:absolute;left:0;top:0;width:1086px;height:1448px;transform-origin:top left;touch-action:none;user-select:none}
.layerWrap{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 50%;pointer-events:none}.backgroundLayer{object-fit:cover}
.layerDrawer{position:absolute;z-index:80;top:51px;right:9px;bottom:9px;width:min(250px,42vw);padding:11px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:17px;box-shadow:0 16px 38px rgba(81,60,120,.22);backdrop-filter:blur(18px);overflow:auto;transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease}
.layerDrawer.open{transform:translateX(0);opacity:1;pointer-events:auto}
.drawerHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.drawerHead h2{font-size:.95rem;margin:0}.drawerClose{width:34px;height:34px;padding:0;border-radius:10px}
.layerList{display:grid;gap:5px}.layerRow{display:grid;grid-template-columns:30px minmax(0,1fr) 32px 32px;align-items:center;gap:4px;border:1px solid #e4daf2;background:rgba(255,255,255,.92);border-radius:10px;padding:5px;cursor:pointer;transition:.15s}.layerRow:hover{background:#fbf8ff}.layerRow.selected{background:linear-gradient(135deg,#efe4ff,#ffe8f3);border-color:#9f87f1;box-shadow:inset 0 0 0 1px rgba(135,104,239,.16)}.layerName{font-size:.76rem;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layerName::after{content:''}.layerRow.selected .layerName::after{content:'  • selected';font-size:.66rem;color:#7c67c8}.iconBtn{border:1px solid #e1d6f0;background:#fff;border-radius:8px;min-height:29px;font-weight:900}.iconBtn.off{opacity:.45}
.sectionCard{border:1px solid #e7dcf3;border-radius:12px;padding:8px;background:rgba(255,255,255,.74);margin-top:9px}.quick{display:grid;grid-template-columns:1fr;gap:6px}.quick .btn{font-size:.78rem;padding:8px}.subtle{font-size:.76rem;color:var(--ink2);line-height:1.32}
.tray{border-radius:16px;padding:6px 9px;min-height:54px;display:flex;align-items:center}.trayTitle{display:none}.chiprow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:1px 0;scrollbar-width:none;width:100%}.chip{flex:0 0 auto;border:1px solid #e1d6ef;background:#fff;border-radius:999px;padding:8px 12px;font-size:.8rem;font-weight:850;cursor:pointer;white-space:nowrap}.chip.active{background:linear-gradient(135deg,#8e72f4,#755ee7);border-color:#755ee7;color:#fff;box-shadow:0 4px 11px rgba(117,94,231,.19)}
.toast{position:fixed;left:50%;bottom:calc(70px + var(--safeB));transform:translateX(-50%) translateY(20px);background:rgba(67,49,93,.92);color:#fff;padding:10px 14px;border-radius:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:9999}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
/* iPad and landscape tablets: use the height for the doll, not sidebars. */
@media(max-height:1050px) and (orientation:landscape){
  .app{padding:calc(5px + var(--safeT)) calc(7px + var(--safeR)) calc(5px + var(--safeB)) calc(7px + var(--safeL));gap:5px;grid-template-rows:auto auto minmax(0,1fr) auto}
  .topbar{min-height:50px;padding:6px 8px;border-radius:18px}.logo{width:38px;height:38px;border-radius:13px;font-size:20px}.title h1{font-size:clamp(1.05rem,2vw,1.5rem)}.title small{font-size:.72rem;margin-top:2px}

@media(orientation:portrait){

  .topbar{min-height:48px;padding:5px 7px;border-radius:17px}.logo{width:36px;height:36px;border-radius:12px;font-size:19px}.brand{gap:7px}.title h1{font-size:1.08rem}.title small{display:none}
  .actions{gap:4px;flex-wrap:nowrap}.actions .btn{padding:7px 8px;border-radius:10px;font-size:.8rem}.actions .btn span.label{display:none}#saveBtn span.label{display:inline}
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:4px;border-radius:15px;overflow:visible}.tab{min-width:0;padding:7px 4px;font-size:.78rem;line-height:1.05}
  .stagePanel{padding:5px;border-radius:17px;gap:4px}.stageTools{min-height:31px;padding:0 2px}.stageHint{font-size:.73rem}.stageActions{gap:4px}.stageActions .btn{padding:6px 8px;font-size:.72rem;border-radius:9px}
  .stageViewport{border-radius:13px}.stageInner{padding:3px}
  .layerDrawer{top:39px;right:5px;bottom:5px;width:min(310px,44vw);padding:9px;border-radius:14px}.drawerHead{margin-bottom:6px}.drawerHead h2{font-size:.9rem}.layerList{gap:4px}.layerRow{padding:4px;grid-template-columns:28px minmax(0,1fr) 30px 30px}.layerName{font-size:.72rem}.iconBtn{min-height:27px;padding:4px}
  .sectionCard{padding:7px;margin-top:7px}.subtle{font-size:.7rem}.quick .btn{font-size:.72rem;padding:7px}
  .tray{min-height:48px;padding:5px 7px;border-radius:14px}.chiprow{gap:5px}.chip{padding:7px 10px;font-size:.76rem}
  .toast{bottom:calc(58px + var(--safeB));font-size:.82rem}
}
@media(max-width:650px){.logo{width:32px;height:32px}.brand{gap:5px}.title h1{font-size:.95rem}#saveBtn span.label{display:none}.layerDrawer{width:min(300px,72vw)}}.actions .btn span.label{display:none}.brand{gap:7px}.title h1{font-size:1rem}.layerDrawer{top:47px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">✨</div><div class="title"><h1>Megan's Magic Dollmaker 2.3</h1><small>Dress up, drag, pinch, twist and make a wallpaper</small></div></div>
    <div class="actions">
      <button class="btn magic" id="surpriseBtn">🎲 <span class="label">Surprise Me</span></button>
      <button class="btn" id="matchBtn">🪄 <span class="label">Match Look</span></button>
      <button class="btn" id="fullscreenBtn">⛶</button>
      <button class="btn primary" id="saveBtn">💾 <span class="label">Save Wallpaper</span></button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="workspace">
    <section class="stagePanel">
      <div class="stageTools">
        <div class="stageHint" id="stageHint">Outfit selected • drag to move · pinch to resize · twist to rotate</div>
        <div class="stageActions">
          <button class="btn" id="resetTargetBtn">↻ Reset Selected</button>
          <button class="btn" id="layersBtn">☰ Layers</button>
        </div>
      </div>
      <div class="stageViewport" id="stageViewport"><div class="stageInner"><div class="sceneShell" id="sceneShell"><div class="scene" id="scene">
        <div class="layerWrap" id="backgroundWrap"><img class="layer backgroundLayer" id="backgroundLayer" alt="Background"></div>
        <div class="layerWrap" id="outfitWrap" data-layer="outfit"><img class="layer" id="outfitLayer" alt="Outfit"></div>
        <div class="layerWrap" id="backHairWrap" data-layer="backHair"><img class="layer" id="backHairLayer" alt="Back hair"></div>
        <div class="layerWrap" id="baseHeadWrap" data-layer="baseHead"><img class="layer" id="baseHeadLayer" src="assets/base_head.webp" alt="Megan base head"></div>
        <div class="layerWrap" id="makeupWrap" data-layer="makeup"><img class="layer" id="makeupLayer" alt="Makeup"></div>
        <div class="layerWrap" id="frontHairWrap" data-layer="frontHair"><img class="layer" id="frontHairLayer" alt="Front hair"></div>
        <div class="layerWrap" id="headpieceWrap" data-layer="headpiece"><img class="layer" id="headpieceLayer" alt="Headpiece"></div>
        <div class="layerWrap" id="effectWrap" data-layer="effect"><img class="layer" id="effectLayer" alt="Magic effect"></div>
      </div></div></div></div>
      <aside class="layerDrawer" id="layerDrawer">
        <div class="drawerHead"><h2>Layer Order</h2><button class="btn drawerClose" id="closeLayersBtn">×</button></div>
        <div class="subtle" style="margin-bottom:7px">Top item appears in front.</div>
        <div class="layerList" id="layerList"></div>
        <div class="sectionCard"><h2 style="font-size:.9rem;margin:0 0 6px">Current Look</h2><div class="subtle" id="lookSummary"></div></div>
        <div class="sectionCard"><div class="quick"><button class="btn" id="resetLookBtn">↻ Reset Look</button></div></div>
      </aside>
    </section>
  </main>

  <section class="tray"><div class="trayTitle" id="trayTitle">Outfit</div><div class="chiprow" id="chiprow"></div></section>
</div>
<div class="toast" id="toast"></div>
<script>

const BW=1086,BH=1448;
const A='assets/';
const HAIR=[

{id:'naturalGlow',label:'Natural Glow',img:A+'natural_glow.webp',cfg:{x:16,y:6,scale:84,rotate:-5.6,opacity:100}},
{id:'flowerFairy',label:'Flower Fairy',img:A+'flower_fairy.webp',cfg:{x:15,y:4,scale:80.5,rotate:-5.8,opacity:100}},

{id:'galaStage',label:'Princess Gala',img:A+'bg_gala.webp'},

const EFFECTS=[

{id:'sakura',label:'Sakura Bloom',img:A+'fx_sakura.webp'},

{id:'royalHeart',label:'Royal Heart',img:A+'fx_royal.webp'}
];
const CATEGORIES={background:{label:'Background',items:BACKGROUNDS},outfit:{label:'Outfit',items:OUTFITS},hair:{label:'Hairstyle',items:HAIR},headpiece:{label:'Headpiece',items:HEADPIECES},makeup:{label:'Makeup',items:MAKEUP},effect:{label:'Magic Effect',items:EFFECTS}};
const DEFAULT_OUTFIT={x:-1,y:285,scale:128,rotate:0,opacity:100};

function clone(x){return JSON.parse(JSON.stringify(x))}
function mapDefaults(items,base){return Object.fromEntries(items.filter(x=>x.id!=='none').map(x=>[x.id,clone(base)]))}
function newState(){return{selection:clone(DEFAULT_SELECTION),activeCategory:'outfit',editTarget:'outfit',selectedLayer:'outfit',headGroup:clone(DEFAULT_HEAD),outfits:mapDefaults(OUTFITS,DEFAULT_OUTFIT),backgrounds:mapDefaults(BACKGROUNDS,DEFAULT_BG),effects:mapDefaults(EFFECTS,DEFAULT_FX),layerOrder:DEFAULT_ORDER.slice(),visible:{background:true,outfit:true,backHair:true,baseHead:true,makeup:true,frontHair:true,headpiece:true,effect:true},viewZoom:100}}
const STORAGE='megan-dollmaker-2-state-v1';
let state=loadState();
function loadState(){
  try{const raw=localStorage.getItem(STORAGE);if(raw){const s=Object.assign(newState(),JSON.parse(raw));normalizeState(s);return s}}catch(e){}
  const s=newState();
  // Best-effort migration from the outfit calibrator when testing locally in the same browser origin.
  for(const key of ['megan-outfit-calibrator-v4','megan-outfit-calibrator-v3']){try{const raw=localStorage.getItem(key);if(!raw)continue;const p=JSON.parse(raw);if(p.headGroup)Object.assign(s.headGroup,p.headGroup);const o=p.outfits||p;for(const id in s.outfits)if(o[id])Object.assign(s.outfits[id],o[id]);if(Array.isArray(p.layerOrder))s.layerOrder=p.layerOrder.filter(x=>DEFAULT_ORDER.includes(x));break}catch(e){}}
  normalizeState(s);return s

// Direct touch/mouse manipulation: drag, pinch and two-finger twist.
const pointers=new Map();let gesture=null;
function pointerPair(){return [...pointers.values()].slice(0,2)}
function pairDistance(p){return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}

function normalizeDeg(d){while(d>180)d-=360;while(d<-180)d+=360;return d}
els.scene.addEventListener('pointerdown',e=>{
  const c=currentCfg();if(!c)return;
  els.scene.setPointerCapture?.(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    gesture={type:'drag',x:e.clientX,y:e.clientY,startX:c.x,startY:c.y};
  }else if(pointers.size>=2){
    const p=pointerPair();
    gesture={type:'transform',dist:Math.max(1,pairDistance(p)),angle:pairAngle(p),scale:c.scale,rotate:c.rotate};
  }
  e.preventDefault();
});
els.scene.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)||!gesture)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const c=currentCfg();if(!c)return;
  const sceneScale=fitScale*(state.viewZoom/100);
  if(pointers.size===1&&gesture.type==='drag'){
    c.x=gesture.startX+(e.clientX-gesture.x)/sceneScale;
    c.y=gesture.startY+(e.clientY-gesture.y)/sceneScale;
  }else if(pointers.size>=2){
    const p=pointerPair(),d=Math.max(1,pairDistance(p)),a=pairAngle(p);

    // Hold one thumb still and move the other finger around it to rotate.
    c.rotate=normalizeDeg(gesture.rotate+(a-gesture.angle)*180/Math.PI);
  }

  e.preventDefault();
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size===0){gesture=null;saveState();}
  else if(pointers.size===1){

    const p=pointerPair(),c=currentCfg();
    gesture={type:'transform',dist:Math.max(1,pairDistance(p)),angle:pairAngle(p),scale:c.scale,rotate:c.rotate};

// Image helpers for export
function ready(img){return img.complete&&img.naturalWidth>0?Promise.resolve():new Promise((res,rej)=>{img.onload=()=>res();img.onerror=()=>rej()})}
function applyCanvasTransform(ctx,cfg){ctx.translate(BW/2+cfg.x,BH/2+cfg.y);ctx.rotate(cfg.rotate*Math.PI/180);ctx.scale(cfg.scale/100,cfg.scale/100);ctx.translate(-BW/2,-BH/2);ctx.globalAlpha*=cfg.opacity/100}
function drawContain(ctx,img){const s=Math.min(BW/img.naturalWidth,BH/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;ctx.drawImage(img,(BW-w)/2,(BH-h)/2,w,h)}
function drawCover(ctx,img){const s=Math.max(BW/img.naturalWidth,BH/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;ctx.drawImage(img,(BW-w)/2,(BH-h)/2,w,h)}

async function renderWallpaper(){

}
