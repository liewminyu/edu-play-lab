function frac(n,d,size='medium'){return `<span class="frac ${size}"><span>${n}</span><span class="bar"></span><span>${d}</span></span>`;}
function ftxt(n,d){return `${n}/${d}`;}
function seq(arr){return `<span class="sequence">${arr.map((x,i)=>`${i?'<span class="seq-arrow">→</span>':''}${frac(x[0],x[1],'small')}`).join('')}</span>`;}
function barModel(parts,shade=1,color='#5aa7e4',vertical=true){
 const w=250,h=84,sw=3,innerW=w-4,innerH=h-4;
 let s=`<svg viewBox="0 0 ${w} ${h}" width="250" height="84" aria-hidden="true">`;
 if(vertical){
   const pw=innerW/parts;
   for(let i=0;i<parts;i++)if(i<shade)s+=`<rect x="${2+i*pw}" y="2" width="${pw}" height="${innerH}" fill="${color}" opacity=".95"/>`;
   s+=`<rect x="2" y="2" width="${innerW}" height="${innerH}" rx="3" fill="none" stroke="#0b3d68" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
   for(let i=1;i<parts;i++)s+=`<line x1="${2+i*pw}" y1="2" x2="${2+i*pw}" y2="${h-2}" stroke="#0b3d68" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
 }else{
   const ph=innerH/parts;
   for(let i=0;i<parts;i++)if(i<shade)s+=`<rect x="2" y="${2+i*ph}" width="${innerW}" height="${ph}" fill="${color}" opacity=".95"/>`;
   s+=`<rect x="2" y="2" width="${innerW}" height="${innerH}" rx="3" fill="none" stroke="#0b3d68" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
   for(let i=1;i<parts;i++)s+=`<line x1="2" y1="${2+i*ph}" x2="${w-2}" y2="${2+i*ph}" stroke="#0b3d68" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
 }
 return s+'</svg>';
}
function circleModel(parts,shade=1,color='#8b69d5'){
 const cx=70,cy=70,r=56,sw=3;let s=`<svg viewBox="0 0 140 140" width="140" height="140" aria-hidden="true">`;
 for(let i=0;i<parts;i++){
   const a1=-Math.PI/2+i*2*Math.PI/parts,a2=-Math.PI/2+(i+1)*2*Math.PI/parts;
   const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2),large=(2*Math.PI/parts)>Math.PI?1:0;
   if(i<shade)s+=`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${color}" opacity=".95"/>`;
 }
 s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0b3d68" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
 for(let i=0;i<parts;i++){
   const a=-Math.PI/2+i*2*Math.PI/parts,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
   s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#0b3d68" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
 }
 return s+'</svg>';
}
function pairModels(left,right){return `<div class="model-wrap"><div class="model-frame">${renderModel(left)}</div><div class="versus">vs</div><div class="model-frame">${renderModel(right)}</div></div>`;}
function renderModel(m){return m.shape==='circle'?circleModel(m.parts,m.shade,m.color):barModel(m.parts,m.shade,m.color,m.vertical!==false);}
function fracCards(list){return `<div class="fraction-row">${list.map(x=>`<div class="fraction-card">${frac(x[0],x[1],'big')}</div>`).join('')}</div>`;}
function signCompare(a,b){return `<div class="fraction-row"><div class="fraction-card">${frac(a[0],a[1],'big')}</div><div class="sign-box">?</div><div class="fraction-card">${frac(b[0],b[1],'big')}</div></div>`;}

const categories=[
 {id:'match',name:'Match or No Match?',short:'Match?',icon:'🟰',clues:{
  100:{type:'match',question:'Are these shaded fractions equal?',visual:()=>pairModels({shape:'bar',parts:2,shade:1,color:'#5aa7e4',vertical:true},{shape:'bar',parts:2,shade:1,color:'#9b72d2',vertical:false}),options:['=','≠'],answer:'=',explanation:'Both show one-half.'},

  300:{type:'match',question:'Are these shaded fractions equal?',visual:()=>pairModels({shape:'bar',parts:4,shade:1,color:'#5aa7e4',vertical:true},{shape:'bar',parts:4,shade:1,color:'#9b72d2',vertical:false}),options:['=','≠'],answer:'=',explanation:'Both show one-fourth.'},
  400:{type:'match',question:'Are these shaded fractions equal?',visual:()=>pairModels({shape:'bar',parts:6,shade:1,color:'#5aa7e4'},{shape:'bar',parts:8,shade:1,color:'#9b72d2'}),options:['=','≠'],answer:'≠',explanation:'One-sixth is not equal to one-eighth.'},
  500:{type:'match',question:'Are these shaded fractions equal?',visual:()=>pairModels({shape:'bar',parts:9,shade:1,color:'#5aa7e4',vertical:true},{shape:'bar',parts:9,shade:1,color:'#9b72d2',vertical:true}),options:['=','≠'],answer:'=',explanation:'Both show one-ninth.'}
 }},
 {id:'reveal',name:'Fraction Reveal',short:'Reveal',icon:'🎭',clues:{
  100:{question:'What fraction is shaded?',visual:()=>`<div class="model-frame">${barModel(2,1,'#5aa7e4')}</div>`,options:[ftxt(1,2),ftxt(1,3),ftxt(2,2)],answer:ftxt(1,2),explanation:'One out of two equal parts is shaded.'},
  200:{question:'What fraction is shaded?',visual:()=>`<div class="model-frame">${circleModel(4,1,'#9b72d2')}</div>`,options:[ftxt(1,3),ftxt(1,4),ftxt(4,1)],answer:ftxt(1,4),explanation:'One out of four equal parts is shaded.'},
  300:{question:'What fraction is shaded?',visual:()=>`<div class="model-frame">${barModel(5,1,'#5aa7e4')}</div>`,options:[ftxt(1,5),ftxt(1,6),ftxt(5,1)],answer:ftxt(1,5),explanation:'One out of five equal parts is shaded.'},
  400:{question:'What fraction is shaded?',visual:()=>`<div class="model-frame">${circleModel(8,1,'#9b72d2')}</div>`,options:[ftxt(1,7),ftxt(1,8),ftxt(1,9)],answer:ftxt(1,8),explanation:'One out of eight equal parts is shaded.'},
  500:{question:'What fraction is shaded?',visual:()=>`<div class="model-frame">${barModel(10,1,'#5aa7e4')}</div>`,options:[ftxt(1,9),ftxt(1,10),ftxt(1,12)],answer:ftxt(1,10),explanation:'One out of ten equal parts is shaded.'}
 }},
 {id:'sign',name:'Sign Showdown',short:'Signs',icon:'⚔️',clues:{
  100:{question:'Choose the correct sign.',visual:()=>signCompare([1,2],[1,4]),options:['<','>','='],answer:'>',explanation:'One-half is greater than one-fourth.'},

 {id:'greatest',name:'Crown the Greatest',short:'Greatest',icon:'👑',clues:{

     if(work){work.style.opacity='1';if(x.correct){work.style.outline='3px solid #6ccb8b';work.querySelectorAll('.order-card').forEach(c=>c.classList.add('correct-order'));}}
     if(!x.correct&&correctBox){
       const tokens=x.clue.answer.split('|');
       correctBox.innerHTML=`<div class="order-correct-title">Correct order</div><div class="order-correct-row">${tokens.map(t=>{const [n,d]=t.split('/');return `<div class="order-card correct-order">${frac(n,d,'big')}</div>`}).join('')}</div>`;
       correctBox.classList.remove('hidden');
     }
   }else if(zone){
     zone.querySelectorAll('.answer-btn').forEach(btn=>{if(btn.dataset.answer===String(x.clue.answer))btn.classList.add('correct');btn.disabled=true});
   }
 });
 const btn=$('#stageBtn');btn.textContent=state.roundIndex===9?'🏁 Final Scores':'Next Round →';btn.classList.remove('live');btn.classList.add('ready');btn.disabled=false;
}
function nextRound(){state.roundIndex++;state.lastResult=null;if(state.roundIndex>=10){state.finished=true;saveState();renderEnd()}else{saveState();renderRound()}}
function renderEnd(){const ranking=groupOrder.map(g=>({id:g,...groups[g],money:state.money[g],correct:state.correct[g]})).sort((a,b)=>b.money-a.money||b.correct-a.correct),top=ranking[0].money,moneyLeaders=ranking.filter(x=>x.money===top);let winners=moneyLeaders,tieNote='';if(moneyLeaders.length>1){const best=Math.max(...moneyLeaders.map(x=>x.correct));winners=moneyLeaders.filter(x=>x.correct===best);tieNote=winners.length===1?`Tie-breaker: most correct answers (${best}).`:`Still tied on ${best} correct answers, so the championship is shared.`}const winnerText=winners.length===1?winners[0].name:winners.map(w=>w.name.replace(' Group','')).join(' & ')+' Groups',winnerColor=winners.length===1?winners[0].color:'linear-gradient(90deg,#ffe47f,#83d2f3,#c39af6)';app.innerHTML=`<main class="screen"><div class="topbar"><div class="brand"><div class="brand-badge">🏆</div><div><h1>Fraction Triple Jeopardy Complete!</h1><p>All 30 pupils answered one clue.</p></div></div><div></div>${toolbar()}</div><section class="end-wrap"><div class="winner-panel"><div class="trophy">🏆</div><p>${winners.length===1?'Champion Group':'Joint Champions'}</p><div class="winner-chip" style="background:${winnerColor}">${escapeHTML(winnerText)}</div><h2>${fmtMoney(top)}</h2><p>${tieNote||'Great fraction thinking and teamwork!'}</p><div class="overlay-actions"><button class="primary-btn" id="againBtn">💵 New Game</button></div></div><div class="ranking-panel"><h3>Final Money Board</h3>${ranking.map((r,i)=>`<div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-group" style="background:${r.color}">${escapeHTML(r.name)}</div><div class="rank-money">${fmtMoney(r.money)}<small>${r.correct} correct</small></div></div>`).join('')}</div></section></main>`;bindToolbar();confetti(90);$('#againBtn').onclick=()=>{if(confirm('Start a fresh Fraction Triple Jeopardy game?')){state=freshState();saveState();renderRound()}}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escapeAttr(s){return escapeHTML(s)}
renderIntro();
})();
</script>
