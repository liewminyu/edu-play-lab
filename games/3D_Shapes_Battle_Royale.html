<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Shapes Battle Royale — Shared Setup</title>
<style>
:root{
  --bg1:#071720;--bg2:#10352c;--panel:#182a47;--panel2:#243a5d;
  --text:#f7fbff;--muted:#bdc9dc;--gold:#ffd166;--good:#55e6a5;--bad:#ff6b7a;
  --shadow:0 12px 32px rgba(0,0,0,.30);
  --red:#ff7f88;--yellow:#ffe29a;--green:#bfdda8;--orange:#ffc58f;--purple:#cfa7f3;--blue:#a9c8e8
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}
button{font:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 12% 13%,rgba(75,199,132,.19),transparent 30%),
  radial-gradient(circle at 88% 17%,rgba(255,209,102,.12),transparent 29%),
  linear-gradient(135deg,var(--bg1),var(--bg2))}
#app{position:relative;width:100%;height:100%;z-index:1}.hidden{display:none!important}
.screen{width:100%;height:100%;padding:clamp(9px,1.15vw,19px);display:flex;flex-direction:column;gap:clamp(7px,.9vh,12px)}
.topbar{display:grid;grid-template-columns:minmax(330px,1fr) auto minmax(155px,1fr);align-items:center;gap:13px;min-height:58px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-badge{font-size:clamp(30px,3vw,48px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.34))}
.brand h1{margin:0;font-size:clamp(22px,2.35vw,40px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand p{margin:5px 0 0;color:var(--muted);font-size:clamp(11px,1vw,16px)}
.toolbar{display:flex;gap:8px;justify-content:flex-end}.icon-btn,.primary-btn,.secondary-btn,.stage-btn,.ready-btn,.answer-btn{border:0;cursor:pointer;font-weight:1000;transition:transform .11s ease,filter .13s ease,opacity .13s ease,background .15s ease}
.icon-btn:active,.primary-btn:active,.secondary-btn:active,.stage-btn:active,.ready-btn:active,.answer-btn:active{transform:scale(.97)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:#23385f;color:#fff;font-size:21px;box-shadow:var(--shadow)}
.primary-btn{padding:14px 24px;border-radius:15px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#182239;font-size:clamp(17px,1.45vw,24px);box-shadow:var(--shadow)}
.secondary-btn{padding:13px 20px;border-radius:15px;background:#2c4774;color:#fff;font-size:clamp(15px,1.2vw,20px);box-shadow:var(--shadow)}
.stage-btn{min-width:clamp(225px,20vw,330px);padding:13px 22px;border-radius:16px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033;font-size:clamp(16px,1.4vw,23px);box-shadow:0 0 20px rgba(255,209,102,.42),var(--shadow)}
.stage-btn.waiting{background:#33445f;color:#aebbd0;box-shadow:none;opacity:.62;cursor:not-allowed}.stage-btn.go{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825;animation:goGlow .72s ease-in-out infinite alternate}.stage-btn.live{background:#263a5e;color:#c6d1e2;box-shadow:none;opacity:.78;cursor:default}.stage-btn.answer{background:linear-gradient(135deg,#71c7ff,#5592f6);color:#10284b;animation:answerGlow .76s ease-in-out infinite alternate}.stage-btn.next{background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033}
@keyframes goGlow{to{filter:brightness(1.14);box-shadow:0 0 28px rgba(85,230,165,.74),var(--shadow)}}@keyframes answerGlow{to{filter:brightness(1.13);box-shadow:0 0 28px rgba(113,199,255,.70),var(--shadow)}}

/* Intro */
.intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.cover-card{position:relative;width:min(1160px,100%);height:100%;background:linear-gradient(145deg,rgba(31,48,80,.97),rgba(17,29,50,.97));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,52px)}
.cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 20%,rgba(88,166,255,.10),transparent 28%),radial-gradient(circle at 82% 22%,rgba(255,209,102,.08),transparent 24%),radial-gradient(circle at 50% 100%,rgba(85,230,165,.08),transparent 36%)}
.cover-inner{position:relative;z-index:2;max-width:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.45);color:var(--gold);font-weight:1000;font-size:clamp(12px,1.02vw,17px);letter-spacing:.04em;text-transform:uppercase}
.cover-title{font-size:clamp(48px,6vw,92px);line-height:.94;margin:20px 0 14px;max-width:900px;text-shadow:0 8px 25px rgba(0,0,0,.35)}
.cover-title em{color:var(--gold);font-style:normal}
.cover-subtitle{font-size:clamp(19px,1.7vw,29px);color:#dbe7fb;max-width:760px;line-height:1.3;margin:0}
.cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:min(360px,80vw)}
.cover-mini-steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-step{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#e6eefb;font-size:clamp(14px,1.15vw,19px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.cover-step strong{color:var(--gold)}
.cover-arrow{font-size:clamp(18px,1.4vw,24px);color:rgba(255,209,102,.92);font-weight:1000}
.cover-animation{position:absolute;left:0;right:0;bottom:10px;height:128px;pointer-events:none;z-index:1}
.float-shape{position:absolute;bottom:0;opacity:.9;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));animation:floatBob 3.8s ease-in-out infinite alternate}
.float-shape svg{display:block}
.float-shape.shape-1{left:8%;animation-duration:4.2s;transform:rotate(-8deg)}
.float-shape.shape-2{left:24%;bottom:18px;animation-duration:3.5s;animation-delay:.4s;transform:scale(.92)}
.float-shape.shape-3{left:44%;bottom:-4px;animation-duration:4.6s;animation-delay:.2s}
.float-shape.shape-4{left:64%;bottom:16px;animation-duration:3.9s;animation-delay:.7s;transform:scale(.94) rotate(7deg)}
.float-shape.shape-5{left:82%;bottom:2px;animation-duration:4.4s;animation-delay:.3s;transform:rotate(-6deg)}
@keyframes floatBob{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-14px) scale(1.04)}}

</style>
<link rel="stylesheet" href="../shared/game-setup.css">
</head>
<body>
<div id="app"></div>
<div id="overlayRoot"></div>
<script src="../shared/player-scheduler.js"></script>
<script src="../shared/game-setup.js"></script>
<script>
(() => {
'use strict';

const STORAGE_KEY='SgLDC_3DShapes_BattleRoyale_v10';
const groupOrder=EduPlayGameSetup.GROUP_IDS;
let groups={};
let setupConfig=null;
function applySetup(cfg){groups=EduPlayGameSetup.toGroups(cfg);}
function loadSetup(){const cfg=EduPlayGameSetup.load();if(cfg)applySetup(cfg);return cfg;}
function setupReady(cfg){return EduPlayGameSetup.isReady(cfg);}
function renderSetup(){
  phase='setup';
  EduPlayGameSetup.open({
    app,
    overlayRoot,
    toolbarHTML:()=>toolbar(),
    bindToolbar,
    onBack:renderIntro,
    onApply:cfg=>{setupConfig=cfg;applySetup(cfg);},
    gameStateKey:STORAGE_KEY,
    errorSound:()=>wrongSound(),
    successSound:()=>correctSound()
  });
}


const QUESTIONS=[
  {
    type:'complete',category:'Complete a group',title:'Complete the 3D-shape group.',
    label:'Solids with no vertices',shown:['cylinder'],answer:'sphere',options:['sphere','cone','cube']
  },
  {
    type:'pattern',category:'Complete the pattern',title:'Complete the 3D-shape pattern.',
    pattern:['cube','sphere','cube','sphere',null],answer:['cube'],
    options:[['cube'],['sphere'],['cone']]
  },
  {
    type:'property',category:'Edges',title:'Count the edges.',
    shape:'cube',property:'edges',answer:'12',options:['8','10','12']
  },
  {
    type:'multiAction',category:'Movement',title:'How can the solid move?',
    shape:'sphere',answer:['roll','slide'],options:['roll','slide','stack']
  },
  {
    type:'complete',category:'Complete a group',title:'Complete the 3D-shape group.',
    label:'Solids with 6 flat faces',shown:['cube'],answer:'cuboid',options:['cuboid','cylinder','cone']
  },
  {
    type:'pattern',category:'Complete the pattern',title:'Complete the 3D-shape pattern.',
    pattern:['cone','cylinder','sphere','cone',null,null],answer:['cylinder','sphere'],
    options:[['cylinder','sphere'],['sphere','cone'],['cone','cylinder']]
  },
  {
    type:'property',category:'Faces',title:'Count the flat faces.',
    shape:'cuboid',property:'faces',answer:'6',options:['4','6','8']
  },
  {
    type:'multiAction',category:'Movement',title:'How can the solid move?',
    shape:'cylinder',answer:['roll','slide','stack'],options:['roll','slide','stack']
  },
  {
    type:'pattern',category:'Complete the pattern',title:'Complete the 3D-shape pattern.',
    pattern:['cube','cuboid','cone','cube',null,null,null],answer:['cuboid','cone','cube'],
    options:[['cuboid','cone','cube'],['cone','cube','cuboid'],['cube','cuboid','cone']]
  },
  {
    type:'property',category:'Vertices',title:'Count the vertices.',
    shape:'cone',property:'vertices',answer:'1',options:['0','1','2']
  }
];

let state=null,muted=false,audioCtx=null,phase='checkin',readyLanes=new Set(),laneLocked=[false,false,false],laneSelections=[new Set(),new Set(),new Set()],winnerLane=null;
const app=document.getElementById('app');
const overlayRoot=document.getElementById('overlayRoot');
let overlayTimer=null;
const $=s=>document.querySelector(s);

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ensureAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function tone(freq=440,duration=.12,type='sine',volume=.08){if(muted)return;ensureAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);}
function correctSound(){tone(523,.11,'triangle',.09);setTimeout(()=>tone(659,.11,'triangle',.09),100);setTimeout(()=>tone(784,.16,'triangle',.10),200)}
function wrongSound(){tone(205,.17,'sawtooth',.055)}
function revealSound(){tone(660,.11,'triangle',.08);setTimeout(()=>tone(880,.18,'triangle',.09),130)}
function hexToRgba(hex,alpha=.5){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;}
function escapeHTML(value){return String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}

function makePlayerSchedule(){return EduPlayScheduler.createBalancedTenRound(groups,{shuffleRoundOrder:true});}
function freshState(){const scores={};groupOrder.forEach(g=>scores[g]=0);return{version:9,scores,rounds:makePlayerSchedule(),roundIndex:0,roundCompleted:false,answerRevealed:false,lastResult:null,finished:false};}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!s||s.version!==9||!Array.isArray(s.rounds))return null;return s;}catch(e){return null;}}

function toolbar(){return `<div class="toolbar"><button class="icon-btn" id="muteBtn" title="Mute or unmute">${muted?'🔇':'🔊'}</button><button class="icon-btn" id="fullBtn" title="Full screen">⛶</button><button class="icon-btn" id="homeBtn" title="Home">⌂</button></div>`;}
function gameToolbar(){return `<div class="game-toolbar"><button class="stage-btn waiting" id="stageBtn" disabled>WAITING 0/3</button><button class="icon-btn" id="muteBtn" title="Mute or unmute">${muted?'🔇':'🔊'}</button><button class="icon-btn" id="fullBtn" title="Full screen">⛶</button><button class="icon-btn" id="homeBtn" title="Home">⌂</button></div>`;}
function bindToolbar(){const m=$('#muteBtn');if(m)m.onclick=()=>{muted=!muted;m.textContent=muted?'🔇':'🔊';};const f=$('#fullBtn');if(f)f.onclick=()=>{ensureAudio();if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};const h=$('#homeBtn');if(h)h.onclick=renderIntro;}
function coverShapesHTML(){return `<div class="cover-animation" aria-hidden="true"><div class="float-shape shape-1">${solidSVG('cube',82)}</div><div class="float-shape shape-2">${solidSVG('sphere',72)}</div><div class="float-shape shape-3">${solidSVG('cylinder',84)}</div><div class="float-shape shape-4">${solidSVG('cone',76)}</div><div class="float-shape shape-5">${solidSVG('cuboid',80)}</div></div>`;}

function renderIntro(){
  if(overlayTimer){clearTimeout(overlayTimer);overlayTimer=null;}overlayRoot.innerHTML='';phase='checkin';
  setupConfig=loadSetup();
  const isSetupComplete=setupReady(setupConfig);
  const saved=loadState(),canResume=isSetupComplete&&saved&&!saved.finished&&saved.roundIndex<QUESTIONS.length;
  app.innerHTML=`<main class="screen">
    <div class="topbar"><div class="brand"><div class="brand-badge">🧊</div><div><h1>3D Shapes Battle Royale</h1></div></div><div></div><div class="toolbar"><button class="icon-btn" id="muteBtn">${muted?'🔇':'🔊'}</button><button class="icon-btn" id="fullBtn">⛶</button></div></div>
    <section class="intro-center">
      <div class="cover-card">
        <div class="cover-inner">
          <span class="cover-chip">10 Rounds · 30 Players</span>
          <h2 class="cover-title">3D Shapes<br><em>Battle Royale</em></h2>
          <p class="cover-subtitle">Fastest fingers. Sharpest minds.</p>
          <div class="cover-actions"><button class="secondary-btn" id="setupGameBtn">⚙ Setup Game</button><button class="primary-btn ${isSetupComplete?'':'start-disabled'}" id="newGameBtn" ${isSetupComplete?'':'disabled'}>⚡ Start Battle</button>${canResume?'<button class="secondary-btn" id="resumeBtn">▶ Resume Saved Battle</button>':''}</div>
          <div class="cover-mini-steps">
            <div class="cover-step">Tap <strong>Ready?</strong></div>
            <div class="cover-arrow">→</div>
            <div class="cover-step">Wait for <strong>GO!</strong></div>
            <div class="cover-arrow">→</div>
            <div class="cover-step">Answer fast</div>
          </div>
        </div>
        ${coverShapesHTML()}
      </div>
    </section></main>`;
  $('#muteBtn').onclick=()=>{muted=!muted;$('#muteBtn').textContent=muted?'🔇':'🔊';};
  $('#fullBtn').onclick=()=>{ensureAudio();if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
  $('#setupGameBtn').onclick=()=>renderSetup();
  if(isSetupComplete)$('#newGameBtn').onclick=()=>{ensureAudio();if(saved&&!saved.finished&&!confirm('Start a new battle? The saved scores will be replaced.'))return;applySetup(setupConfig);state=freshState();saveState();renderRound();};
  if(canResume)$('#resumeBtn').onclick=()=>{ensureAudio();applySetup(setupConfig);state=saved;renderRound();};
}



function scoreBoardHTML(){return `<div class="scoreboard">${groupOrder.map(g=>`<div class="score-card" data-group="${g}"><span class="gname" style="background:${groups[g].color}">${escapeHTML(groups[g].name)}</span><span class="score">${state.scores[g]}</span></div>`).join('')}</div>`;}
function typeLabel(q){return q.category;}

function renderRound(){
  if(!state)state=loadState()||freshState();
  if(state.roundIndex>=QUESTIONS.length||state.finished){renderEnd();return;}
  if(overlayTimer){clearTimeout(overlayTimer);overlayTimer=null;}overlayRoot.innerHTML='';document.querySelectorAll('.confetti').forEach(p=>p.remove());
  phase='checkin';readyLanes=new Set();laneLocked=[false,false,false];laneSelections=[new Set(),new Set(),new Set()];winnerLane=null;
  const roster=state.rounds[state.roundIndex],q=QUESTIONS[state.roundIndex];
  app.innerHTML=`<main class="screen">
    <div class="topbar game-topbar">
      <div class="brand"><div class="brand-badge">🧊</div><div><h1>3D Shapes Battle Royale</h1></div></div>
      ${gameToolbar()}
    </div>
    ${scoreBoardHTML()}
    <section class="game-main">
      <div class="round-line"><div class="round-label">Round ${state.roundIndex+1} of ${QUESTIONS.length}</div><div class="type-pill">${typeLabel(q)}</div></div>
      <div class="arena">
        <div class="challenge-panel"><div class="pre-question" id="preQuestion">Get ready for the next 3D-shape battle!</div><div class="live-challenge hidden" id="liveChallenge"></div></div>
        <div class="players">${roster.map((p,i)=>playerCard(p,i)).join('')}</div>
      </div>
    </section>
  </main>`;
  bindToolbar();$('#stageBtn').onclick=handleStageButton;
  document.querySelectorAll('.ready-btn').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();checkInPlayer(Number(btn.dataset.lane));},{passive:false}));
  if(state.roundCompleted&&state.lastResult)restoreCompletedRound();
}

function playerCard(p,i){return `<div class="player-card readying" data-lane="${i}" style="--group:${p.color};--glow:${hexToRgba(p.color,.50)}"><div class="player-head"><span class="player-name">${p.player}</span></div><button class="ready-btn" data-lane="${i}">Ready?</button><div class="choice-area hidden" id="choices-${i}"></div></div>`;}
function checkInPlayer(lane){
  if(phase!=='checkin'||readyLanes.has(lane))return;const card=document.querySelector(`.player-card[data-lane="${lane}"]`),btn=card?.querySelector('.ready-btn');if(!card||!btn)return;
  ensureAudio();readyLanes.add(lane);btn.disabled=true;btn.textContent='Ready!👍';card.classList.remove('readying');card.classList.add('checked');tone(560+lane*80,.16,'triangle',.08);
  const b=$('#stageBtn');
  if(readyLanes.size===3){b.disabled=false;b.className='stage-btn';b.textContent='📘 SHOW QUESTION';tone(660,.12,'triangle',.08);setTimeout(()=>tone(880,.18,'triangle',.09),130);}
  else{b.textContent=`WAITING ${readyLanes.size}/3`;}
}
function handleStageButton(){if(phase==='checkin'&&readyLanes.size===3)showQuestion();else if(phase==='preview')goLive();else if(phase==='answered')showCorrectAnswer();else if(phase==='revealed')finishRoundSequence();else if(phase==='postround')nextRound();}

function showQuestion(){
  phase='preview';const q=QUESTIONS[state.roundIndex];$('#preQuestion').classList.add('hidden');$('#liveChallenge').classList.remove('hidden');renderChallenge(q);renderChoices(q,true);
  document.querySelectorAll('.player-card').forEach(card=>{card.classList.remove('checked');card.classList.add('preview');card.querySelector('.ready-btn').classList.add('hidden');card.querySelector('.choice-area').classList.remove('hidden');});
  const b=$('#stageBtn');b.className='stage-btn go';b.textContent='🚀 GO!';b.disabled=false;
}
function goLive(){
  phase='live';laneLocked=[false,false,false];laneSelections=[new Set(),new Set(),new Set()];document.querySelectorAll('.player-card').forEach(card=>{card.classList.remove('preview');card.classList.add('live');});document.querySelectorAll('.answer-btn').forEach(btn=>{btn.disabled=false;btn.classList.remove('preview-choice');});
  const b=$('#stageBtn');b.className='stage-btn live';b.textContent='BUZZERS LIVE';b.disabled=true;
}

function joinActionWords(words){
  if(words.length<=1)return words[0]||'';
  if(words.length===2)return `${words[0]} and ${words[1]}`;
  return `${words.slice(0,-1).join(', ')} and ${words[words.length-1]}`;
}
function unitLabel(prop,answer){const one=String(answer)==='1';if(!one)return prop;return({faces:'face',edges:'edge',vertices:'vertex'})[prop]||prop;}
function patternKey(seq){return (seq||[]).join('|');}
function patternOptionHTML(seq){const size=seq.length===1?66:seq.length===2?50:38;return `<div class="pattern-choice seq-${seq.length}">${seq.map(shape=>solidSVG(shape,size)).join('')}</div>`;}
function patternLineHTML(q){let blank=0;return `<div class="pattern-line">${q.pattern.map(shape=>shape?`<div class="pattern-cell">${solidSVG(shape,84)}</div>`:`<div class="pattern-cell blank" id="patternBlank${blank++}">?</div>`).join('')}</div>`;}
function multiActionSentenceHTML(q){
  const blanks=q.answer.map((_,i)=>`<span class="inline-blank wide" id="sentenceBlank${i}">_____</span>`);
  let joined='';
  if(blanks.length===2)joined=`${blanks[0]}<span>and</span>${blanks[1]}`;
  else if(blanks.length===3)joined=`${blanks[0]}<span>,</span>${blanks[1]}<span>and</span>${blanks[2]}`;
  else joined=blanks.join('<span>,</span>');
  return `<div class="property-sentence multi-action-sentence"><span>A ${shapeNames[q.shape].toLowerCase()} can</span>${joined}<span>.</span></div>`;
}
function renderChallenge(q){
  const box=$('#liveChallenge');
  if(q.type==='complete'){
    box.innerHTML=`<div class="instruction">${q.title}</div><div class="complete-board"><div class="shape-group"><div class="group-heading">${q.label}</div><div class="solid-row">${q.shown.map(s=>solidTile(s,118)).join('')}<div class="blank-solid" id="answerBlank">?</div></div></div></div>`;
  }else if(q.type==='pattern'){
    box.innerHTML=`<div class="instruction">${q.title}</div><div class="pattern-board"><div class="pattern-shell">${patternLineHTML(q)}</div></div>`;
  }else{
    const sentence=q.type==='property'
      ?`<div class="property-sentence"><span>A ${shapeNames[q.shape].toLowerCase()} has</span><span class="inline-blank" id="sentenceBlank">_____</span><span>${unitLabel(q.property,q.answer)}.</span></div>`
      :multiActionSentenceHTML(q);
    box.innerHTML=`<div class="instruction">${q.title}</div><div class="property-board"><div class="hero-solid">${solidSVG(q.shape,136)}</div>${sentence}</div>`;
  }
}
function renderChoices(q,preview=false){
  for(let lane=0;lane<3;lane++){
    const zone=$(`#choices-${lane}`);zone.innerHTML='';
    shuffle(q.options).forEach(opt=>{
      const btn=document.createElement('button');
      const isShape=q.type==='complete',isPattern=q.type==='pattern';
      btn.className='answer-btn'+(isShape?' shape-answer':'')+(isPattern?' pattern-answer':'')+(preview?' preview-choice':'');
      btn.disabled=preview;
      const answerValue=isPattern?patternKey(opt):String(opt);btn.dataset.answer=answerValue;
      if(isShape)btn.innerHTML=`${solidSVG(opt,70)}<span class="answer-shape-name">${shapeNames[opt]}</span>`;
      else if(isPattern)btn.innerHTML=patternOptionHTML(opt);
      else btn.textContent=String(opt);
      btn.addEventListener('pointerdown',e=>{e.preventDefault();selectAnswer(lane,answerValue,btn);},{passive:false});zone.appendChild(btn);
    });
  }
}
function selectAnswer(lane,answer,btn){
  if(phase!=='live'||laneLocked[lane])return;const q=QUESTIONS[state.roundIndex];
  if(q.type==='multiAction'){selectMultiAction(lane,answer,btn);return;}
  const expected=q.type==='pattern'?patternKey(q.answer):String(q.answer);
  if(answer===expected){correctSound();finishRound(lane);}else{laneLocked[lane]=true;wrongSound();btn.classList.add('wrong-flash');const card=document.querySelector(`.player-card[data-lane="${lane}"]`);card?.classList.add('locked');card?.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);setTimeout(()=>btn.classList.remove('wrong-flash'),500);if(laneLocked.every(Boolean))setTimeout(()=>finishRound(null),480);}
}
function selectMultiAction(lane,answer,btn){
  const q=QUESTIONS[state.roundIndex];
  if(!Array.isArray(q.answer)||!q.answer.includes(answer)||laneSelections[lane].has(answer))return;
  laneSelections[lane].add(answer);btn.classList.add('selected-action');btn.disabled=true;tone(590+lane*70,.10,'triangle',.065);
  if(laneSelections[lane].size===q.answer.length){correctSound();finishRound(lane);}
}
function finishRound(lane){
  if(phase!=='live')return;phase='answered';winnerLane=lane;document.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);document.querySelectorAll('.player-card').forEach(c=>c.classList.remove('live'));
  const roster=state.rounds[state.roundIndex];let result;
  if(lane!==null){const winner=roster[lane];document.querySelector(`.player-card[data-lane="${lane}"]`)?.classList.add('round-winner');result={winnerLane:lane,winner,answer:QUESTIONS[state.roundIndex].answer,pointAwarded:false,finalized:false};}
  else{result={winnerLane:null,winner:null,answer:QUESTIONS[state.roundIndex].answer,pointAwarded:false,finalized:false};}
  state.roundCompleted=true;state.answerRevealed=false;state.lastResult=result;saveState();const b=$('#stageBtn');b.className='stage-btn answer';b.textContent='👁 SHOW CORRECT ANSWER';b.disabled=false;
}
function showCorrectAnswer(){
  if(phase!=='answered')return;phase='revealed';state.answerRevealed=true;saveState();revealCorrectAnswer();revealSound();const b=$('#stageBtn');b.className='stage-btn next';b.textContent='🏁 FINISH ROUND';b.disabled=false;
}
function finishRoundSequence(){
  if(phase!=='revealed')return;phase='postround';showWinnerOverlay();
}
function revealCorrectAnswer(){
  const q=QUESTIONS[state.roundIndex];
  if(q.type==='complete'){
    const blank=$('#answerBlank');if(blank){blank.className='solid-tile answer-filled';blank.innerHTML=`${solidSVG(q.answer,118)}<span class="solid-name">${shapeNames[q.answer]}</span>`;}
  }else if(q.type==='pattern'){
    q.answer.forEach((shape,i)=>{const blank=$(`#patternBlank${i}`);if(blank){blank.className='pattern-cell filled';blank.innerHTML=solidSVG(shape,84);}});
  }else if(q.type==='multiAction'){
    q.answer.forEach((word,i)=>{const blank=$(`#sentenceBlank${i}`);if(blank){blank.textContent=word;blank.classList.add('filled');}});
  }else{
    const blank=$('#sentenceBlank');if(blank){blank.textContent=q.answer;blank.classList.add('filled');}
  }
}
function awardPointIfNeeded(){
  const r=state.lastResult;if(!r?.winner||r.pointAwarded)return;
  state.scores[r.winner.groupId]++;r.pointAwarded=true;saveState();refreshScoreboard();
  const card=document.querySelector(`.score-card[data-group="${r.winner.groupId}"]`);if(card){card.classList.remove('score-bump');void card.offsetWidth;card.classList.add('score-bump');}
}
function showWinnerOverlay(){
  overlayTimer=null;const r=state.lastResult;if(!r)return;
  r.finalized=true;saveState();
  const b=$('#stageBtn');if(b){b.className='stage-btn waiting';b.disabled=true;b.textContent=r.winner?'ADDING POINT…':'ROUND COMPLETE';}
  if(r.winner){
    overlayRoot.innerHTML=`<div class="round-overlay"><div class="round-win-card"><div class="trophy-pop">🏆</div><h2>Round Winner!</h2><div class="winner-name">${escapeHTML(r.winner.player)}</div><div class="group-award" style="background:${r.winner.color}"><span>${escapeHTML(r.winner.groupName)}</span><span class="point-pop">+1 POINT</span></div></div></div>`;
    confetti(42);setTimeout(awardPointIfNeeded,430);
  }else{
    overlayRoot.innerHTML=`<div class="round-overlay"><div class="round-win-card"><div class="trophy-pop">💡</div><h2>Correct Answer Revealed</h2><div class="no-point">No winner this round · no point added.</div></div></div>`;
  }
  overlayTimer=setTimeout(()=>{overlayRoot.innerHTML='';overlayTimer=null;phase='postround';const btn=$('#stageBtn');if(btn){btn.className='stage-btn next';btn.textContent=state.roundIndex===QUESTIONS.length-1?'🏁 SEE FINAL SCORES':'NEXT QUESTION →';btn.disabled=false;}},2200);
}
function restoreCompletedRound(){
  const q=QUESTIONS[state.roundIndex],r=state.lastResult;$('#preQuestion').classList.add('hidden');$('#liveChallenge').classList.remove('hidden');renderChallenge(q);renderChoices(q,false);
  document.querySelectorAll('.player-card').forEach((card,i)=>{card.classList.remove('readying','checked','preview','live');card.querySelector('.ready-btn').classList.add('hidden');card.querySelector('.choice-area').classList.remove('hidden');card.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);if(r.winnerLane===i)card.classList.add('round-winner');});
  if(state.answerRevealed){
    revealCorrectAnswer();
    if(r.finalized){
      if(r.winner&&!r.pointAwarded)awardPointIfNeeded();
      phase='postround';
      const b=$('#stageBtn');b.className='stage-btn next';b.textContent=state.roundIndex===QUESTIONS.length-1?'🏁 SEE FINAL SCORES':'NEXT QUESTION →';b.disabled=false;
    }else{
      phase='revealed';
      const b=$('#stageBtn');b.className='stage-btn next';b.textContent='🏁 FINISH ROUND';b.disabled=false;
    }
  }
  else{phase='answered';const b=$('#stageBtn');b.className='stage-btn answer';b.textContent='👁 SHOW CORRECT ANSWER';b.disabled=false;}
}
function refreshScoreboard(){document.querySelectorAll('.score-card .score').forEach((el,i)=>el.textContent=state.scores[groupOrder[i]]);}
function nextRound(){if(overlayTimer){clearTimeout(overlayTimer);overlayTimer=null;}overlayRoot.innerHTML='';document.querySelectorAll('.confetti').forEach(p=>p.remove());state.roundIndex++;state.roundCompleted=false;state.answerRevealed=false;state.lastResult=null;if(state.roundIndex>=QUESTIONS.length){state.finished=true;saveState();renderEnd();}else{saveState();renderRound();}}

function solidTile(shape,size=58){return `<div class="solid-tile">${solidSVG(shape,size)}<span class="solid-name">${shapeNames[shape]}</span></div>`;}
function solidSVG(shape,canvas=64){
  const c=shapeColors[shape]||'#8aa';let inner='';
  if(shape==='cube')inner=`<polygon points="18,18 39,10 55,20 33,29" fill="${shade(c,1.18)}"/><polygon points="18,18 33,29 33,53 18,41" fill="${shade(c,.82)}"/><polygon points="33,29 55,20 55,43 33,53" fill="${c}"/><polyline points="18,18 39,10 55,20 55,43 33,53 18,41 18,18 33,29 55,20 M33,29 33,53" fill="none" stroke="rgba(12,26,38,.58)" stroke-width="2" stroke-linejoin="round"/>`;
  else if(shape==='cuboid')inner=`<polygon points="10,22 35,12 57,20 31,31" fill="${shade(c,1.18)}"/><polygon points="10,22 31,31 31,50 10,41" fill="${shade(c,.82)}"/><polygon points="31,31 57,20 57,39 31,50" fill="${c}"/><polyline points="10,22 35,12 57,20 57,39 31,50 10,41 10,22 31,31 57,20 M31,31 31,50" fill="none" stroke="rgba(12,26,38,.58)" stroke-width="2" stroke-linejoin="round"/>`;
  else if(shape==='cylinder')inner=`<path d="M17 16 L17 45 Q17 51 32 51 Q47 51 47 45 L47 16 Z" fill="${c}"/><ellipse cx="32" cy="16" rx="15" ry="6" fill="${shade(c,1.16)}" stroke="rgba(12,26,38,.5)" stroke-width="2"/><ellipse cx="32" cy="45" rx="15" ry="6" fill="${shade(c,.92)}" stroke="rgba(12,26,38,.55)" stroke-width="2"/><path d="M17 16 V45 M47 16 V45" fill="none" stroke="rgba(12,26,38,.55)" stroke-width="2"/>`;
  else if(shape==='cone')inner=`<path d="M32 8 L14 47 Q32 57 50 47 Z" fill="${c}"/><ellipse cx="32" cy="47" rx="18" ry="7" fill="${shade(c,.90)}" stroke="rgba(12,26,38,.55)" stroke-width="2"/><path d="M32 8 L14 47 M32 8 L50 47" fill="none" stroke="rgba(12,26,38,.55)" stroke-width="2"/>`;
  else inner=`<circle cx="32" cy="32" r="22" fill="${c}" stroke="rgba(12,26,38,.5)" stroke-width="2"/><ellipse cx="25" cy="23" rx="8" ry="5" fill="rgba(255,255,255,.34)" transform="rotate(-28 25 23)"/><path d="M15 40 Q32 50 50 38" fill="none" stroke="rgba(12,26,38,.18)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 64 64" width="${canvas}" height="${canvas}" aria-hidden="true">${inner}</svg>`;
}
function shade(hex,factor){const h=hex.replace('#',''),n=parseInt(h,16),r=Math.min(255,Math.max(0,Math.round(((n>>16)&255)*factor))),g=Math.min(255,Math.max(0,Math.round(((n>>8)&255)*factor))),b=Math.min(255,Math.max(0,Math.round((n&255)*factor)));return `#${[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}`;}

function renderEnd(){
  if(overlayTimer){clearTimeout(overlayTimer);overlayTimer=null;}overlayRoot.innerHTML='';
  if(!state)state=loadState()||freshState();const ranking=groupOrder.map(g=>({id:g,...groups[g],score:state.scores[g]||0})).sort((a,b)=>b.score-a.score),top=ranking[0].score,winners=ranking.filter(x=>x.score===top);const winnerText=winners.length===1?winners[0].name:winners.map(w=>w.name.replace(' Group','')).join(' & ')+' Groups',winnerColor=winners.length===1?winners[0].color:'linear-gradient(90deg,#ffd166,#a9c8e8,#cfa7f3)';
  app.innerHTML=`<main class="screen"><div class="topbar"><div class="brand"><div class="brand-badge">🏁</div><div><h1>Battle Complete!</h1><p>All 30 pupils have taken part.</p></div></div><div></div>${toolbar()}</div><section class="end-wrap"><div class="winner-panel"><div class="trophy">🏆</div><p>${winners.length===1?'Champion Group':'Joint Champions'}</p><div class="winner-chip" style="background:${winnerColor}">${escapeHTML(winnerText)}</div><h2>${top} point${top===1?'':'s'}</h2><p>Excellent 3D-shape thinking!</p><button class="primary-btn" id="againBtn">⚡ New Battle</button></div><div class="ranking-panel"><h3>Final Leaderboard</h3>${ranking.map((r,i)=>`<div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-group" style="background:${r.color}">${escapeHTML(r.name)}</div><div class="rank-score">${r.score}</div></div>`).join('')}</div></section></main>`;
  bindToolbar();confetti(90);$('#againBtn').onclick=()=>{if(confirm('Start a fresh battle with a new random player order?')){state=freshState();saveState();renderRound();}};
}
function confetti(count=45){const colors=['#ffd166','#55e6a5','#ff6b7a','#a9c8e8','#cfa7f3','#ffc58f'];for(let i=0;i<count;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=(2.2+Math.random()*2.1)+'s';p.style.animationDelay=(Math.random()*.45)+'s';p.style.setProperty('--drift',(-120+Math.random()*240)+'px');p.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000);}}

document.addEventListener('keydown',e=>{if(phase==='checkin'&&['1','2','3'].includes(e.key))checkInPlayer(Number(e.key)-1);if(e.key==='Enter'&&!$('#stageBtn')?.disabled)$('#stageBtn').click();});
renderIntro();
})();
</script>
