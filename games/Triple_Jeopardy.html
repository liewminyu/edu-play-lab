<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Triple Jeopardy — Community v9</title>
<style>
 :root{
  --bg1:#071426;--bg2:#102746;--panel:#152d50;--panel2:#1c3b68;
  --text:#f7fbff;--muted:#b9c9df;--gold:#ffd166;--good:#55e6a5;--bad:#ff6b7a;
  --blue:#123f9b;--tile:#144eb9;--shadow:0 12px 34px rgba(0,0,0,.34);
 }
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}
 button{font:inherit}
 body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 12% 14%,rgba(45,121,255,.20),transparent 28%),
  radial-gradient(circle at 86% 16%,rgba(255,209,102,.13),transparent 28%),
  linear-gradient(135deg,var(--bg1),var(--bg2));}
 #app{position:relative;width:100%;height:100%;z-index:1}
 .screen{width:100%;height:100%;padding:clamp(10px,1.15vw,20px);display:flex;flex-direction:column;gap:clamp(8px,.9vh,14px)}
 .hidden{display:none!important}
 .topbar{display:grid;grid-template-columns:minmax(300px,1fr) auto auto;align-items:center;gap:12px;min-height:48px}
 .brand{display:flex;align-items:center;gap:12px;min-width:0}
 .brand-badge{font-size:clamp(28px,3vw,46px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
 .brand h1{margin:0;font-size:clamp(23px,2.35vw,40px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .brand p{margin:5px 0 0;color:var(--muted);font-size:clamp(12px,1.05vw,17px)}
 .control-wrap{display:flex;justify-content:center}
 .toolbar{display:flex;gap:8px;justify-content:flex-end}
 .icon-btn,.primary-btn,.secondary-btn,.ready-btn,.category-btn,.answer-btn{border:0;border-radius:14px;cursor:pointer;font-weight:900;box-shadow:var(--shadow);transition:transform .12s ease,filter .12s ease,opacity .12s ease,border-color .12s ease,background .12s ease}
 .icon-btn:active,.primary-btn:active,.secondary-btn:active,.ready-btn:active,.category-btn:active,.answer-btn:active{transform:scale(.97)}
 .icon-btn{width:46px;height:46px;background:#223d68;color:#fff;font-size:21px}
 .primary-btn{padding:14px 24px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#1d2433;font-size:clamp(17px,1.45vw,24px)}
 .secondary-btn{padding:13px 20px;background:#2b4c7f;color:#fff;font-size:clamp(15px,1.2vw,20px)}
 .primary-btn.waiting{filter:grayscale(.78) brightness(.62);opacity:.64;cursor:not-allowed;box-shadow:none}
 .primary-btn.ready{animation:startGlow .78s ease-in-out infinite alternate}
 .primary-btn.live{background:linear-gradient(135deg,#55e6a5,#31bf7b);color:#173425}
 @keyframes startGlow{to{filter:brightness(1.16);box-shadow:0 0 24px rgba(255,209,102,.74),var(--shadow)}}


 .intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
 .cover-card{position:relative;width:min(1160px,100%);height:100%;background:linear-gradient(145deg,rgba(27,57,99,.97),rgba(14,35,64,.97));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,54px)}
 .cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 18%,rgba(88,166,255,.12),transparent 28%),radial-gradient(circle at 82% 18%,rgba(255,209,102,.11),transparent 24%),radial-gradient(circle at 50% 100%,rgba(85,230,165,.08),transparent 36%)}
 .cover-inner{position:relative;z-index:2;max-width:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
 .cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.45);color:var(--gold);font-weight:900;font-size:clamp(12px,1.02vw,17px);letter-spacing:.04em;text-transform:uppercase}
 .cover-title{font-size:clamp(44px,6vw,96px);line-height:.94;margin:20px 0 14px;max-width:920px;text-shadow:0 8px 25px rgba(0,0,0,.35)}
 .cover-title em{color:var(--gold);font-style:normal}
 .cover-subtitle{font-size:clamp(18px,1.62vw,28px);color:#dbe7fb;max-width:760px;line-height:1.3;margin:0}
 .cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
 .cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:min(340px,80vw)}
 .cover-mini-steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px;position:relative;z-index:2}
 .cover-step{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#e6eefb;font-size:clamp(14px,1.15vw,19px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.16)}
 .cover-step strong{color:var(--gold)}
 .cover-arrow{font-size:clamp(18px,1.4vw,24px);color:rgba(255,209,102,.92);font-weight:1000}
 .cover-animation{position:absolute;inset:auto 0 8px 0;height:150px;pointer-events:none;z-index:1}
 .floating-cash{position:absolute;display:grid;place-items:center;opacity:.95;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));animation:cashFloat 4s ease-in-out infinite alternate}
 .floating-cash.cash1{left:9%;bottom:0;font-size:clamp(44px,4.5vw,72px);animation-duration:4.2s}
 .floating-cash.cash2{left:24%;bottom:24px;font-size:clamp(46px,4.7vw,74px);animation-duration:3.4s;animation-delay:.3s}
 .floating-cash.cash3{left:40%;bottom:8px;font-size:clamp(34px,3.4vw,56px);animation-duration:4.6s;animation-delay:.2s}
 .floating-cash.cash4{left:56%;bottom:26px;font-size:clamp(46px,4.6vw,74px);animation-duration:3.8s;animation-delay:.6s}
 .floating-cash.cash5{left:72%;bottom:4px;font-size:clamp(34px,3.2vw,54px);animation-duration:4.4s;animation-delay:.15s}
 .floating-cash.cash6{left:84%;bottom:22px;font-size:clamp(50px,5vw,78px);animation-duration:3.7s;animation-delay:.5s}
 .cash-tag{display:inline-flex;align-items:center;justify-content:center;min-width:82px;padding:10px 14px;border-radius:16px;background:linear-gradient(135deg,#1d5ed2,#1748a3);border:2px solid rgba(255,255,255,.12);color:var(--gold);font-size:clamp(21px,1.9vw,31px);font-weight:1000;letter-spacing:.02em;box-shadow:0 8px 18px rgba(0,0,0,.25)}
 @keyframes cashFloat{0%{transform:translateY(0) rotate(-4deg) scale(1)}100%{transform:translateY(-14px) rotate(4deg) scale(1.04)}}
 .controls{display:none}
 .status{display:none}


 .moneyboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
 .money-card{min-width:0;background:rgba(21,45,80,.95);border:2px solid rgba(255,255,255,.10);border-radius:14px;padding:6px 9px;display:flex;align-items:center;justify-content:space-between;gap:7px;box-shadow:0 8px 18px rgba(0,0,0,.18)}
 .money-card .gname{font-weight:1000;color:#172033;padding:5px 7px;border-radius:8px;font-size:clamp(9px,.82vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
 .money-card .money{font-size:clamp(19px,1.7vw,29px);font-weight:1000;color:#fff}

 .game-main{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;min-height:0}
 .board-wrap{min-height:0;background:linear-gradient(145deg,rgba(24,52,91,.98),rgba(12,31,58,.98));border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:var(--shadow);padding:10px;overflow:hidden}
 .board-grid{height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:58px repeat(5,1fr);gap:6px}
 .category-head{background:#173a83;border:2px solid rgba(255,255,255,.16);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:clamp(12px,1.02vw,17px);font-weight:1000;line-height:1.05;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.25)}
 .board-tile{position:relative;background:linear-gradient(145deg,#1352c8,#0d3e9e);border:2px solid rgba(255,255,255,.14);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:clamp(21px,2vw,35px);font-weight:1000;text-shadow:0 3px 5px rgba(0,0,0,.32);overflow:hidden}
 .board-tile.inactive-row{filter:saturate(.45) brightness(.58);opacity:.65}
 .board-tile.current-row{box-shadow:inset 0 0 0 2px rgba(255,209,102,.25)}
 .board-tile.cleared{color:#172033;text-shadow:none;filter:none;opacity:1}
 .board-tile.selected{outline:4px solid rgba(255,209,102,.72);outline-offset:-4px}
 .tile-mark{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:clamp(12px,.9vw,15px);line-height:1;color:#172033;text-align:center;padding:4px}
 .tile-mark b{font-size:clamp(15px,1.1vw,20px)}
 .tile-mark small{font-weight:1000}

 .players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:clamp(155px,23vh,245px)}
 .player-card{border:0;border-radius:20px;padding:10px 12px;color:#172033;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:9px;position:relative;overflow:hidden;text-align:center;transition:filter .15s ease,transform .12s ease,opacity .18s ease,box-shadow .2s ease}
 .player-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16),transparent 65%);transform:translateX(-120%)}
 .player-card.readying::after,.player-card.answering::after{animation:sweep 1.15s infinite}
 @keyframes sweep{to{transform:translateX(120%)}}
 .player-head{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:2}
 .player-name{font-size:clamp(20px,1.9vw,34px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
 .player-value{min-width:56px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.55);font-size:clamp(13px,1vw,17px);font-weight:1000}
 .ready-btn{align-self:center;min-width:145px;border:2px solid rgba(23,32,51,.25);border-radius:13px;padding:10px 18px;background:rgba(255,255,255,.42);color:#172033;font-size:clamp(17px,1.45vw,24px);font-weight:1000;cursor:pointer;position:relative;z-index:2}
 .select-zone{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;position:relative;z-index:2}
 .category-btn{min-height:49px;border:2px solid rgba(23,32,51,.18);background:rgba(255,255,255,.46);color:#172033;padding:6px;font-size:clamp(11px,.9vw,15px);line-height:1.05}
 .category-btn.chosen{background:rgba(255,255,255,.78);box-shadow:0 0 0 3px rgba(255,209,102,.45)}
 .category-btn:disabled{opacity:.32;cursor:default;box-shadow:none}
 .selection-label{font-weight:1000;font-size:clamp(13px,1vw,16px);position:relative;z-index:2}

 .clue-stage{height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 .clue-card{min-width:0;background:linear-gradient(145deg,rgba(35,74,128,.98),rgba(17,43,78,.98));border:2px solid rgba(255,255,255,.13);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
 .clue-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:11px;color:#172033;font-weight:1000}
 .clue-player{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .clue-money{background:rgba(255,255,255,.55);border-radius:999px;padding:4px 9px}
 .clue-category{text-align:center;color:var(--gold);font-size:clamp(12px,.95vw,16px);font-weight:1000}
 .clue-question{text-align:center;font-size:clamp(15px,1.25vw,21px);font-weight:1000;line-height:1.16;min-height:48px;display:flex;align-items:center;justify-content:center}
 .visual{flex:1;min-height:78px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.10);border-radius:13px;padding:7px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;overflow:hidden}
 .visual.compact-line{flex-wrap:nowrap;gap:4px;padding:6px}
 .visual.compact-line .shape-box,.visual.compact-line .blank-box{width:42px;height:42px;border-radius:10px}
 .visual.compact-line .shape-num{width:16px;height:16px;font-size:10px;left:3px;top:2px}
 .visual.compact-line svg{width:30px;height:30px}
 .visual.sortgroups{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch;padding:10px}
 .sort-group-visual{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px}
 .sort-group-label{padding:8px;border-radius:11px;background:rgba(255,209,102,.18);border:2px dashed rgba(255,209,102,.45);font-size:clamp(12px,.95vw,16px);font-weight:1000;text-align:center;color:var(--gold)}
 .sort-group-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;justify-items:center}
 .visual.xray{display:flex;flex-direction:column;justify-content:flex-start;gap:8px;padding:10px}
 .xray-strip{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap}
 .xray-strip.compact .shape-box,.xray-strip.compact .xray-qmark{width:42px;height:42px;border-radius:10px}
 .xray-strip.compact .shape-num{width:16px;height:16px;font-size:10px;left:3px;top:2px}
 .xray-strip.compact .xray-qmark{font-size:24px}
 .xray-qmark{width:54px;height:54px;border-radius:13px;border:3px dashed rgba(255,209,102,.55);display:grid;place-items:center;color:var(--gold);font-size:30px;font-weight:1000;background:rgba(255,255,255,.04)}
 .shape-box{width:54px;height:54px;border-radius:13px;background:rgba(255,255,255,.08);display:grid;place-items:center;position:relative}
 .shape-num{position:absolute;left:4px;top:3px;width:19px;height:19px;border-radius:6px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:1000}
 .blank-box{width:54px;height:54px;border-radius:13px;border:3px dashed rgba(255,209,102,.55);display:grid;place-items:center;color:var(--gold);font-size:25px;font-weight:1000}
 .answer-zone{display:grid;gap:7px}
 .answer-zone.text-3{grid-template-columns:repeat(3,1fr)}
 .answer-zone.text-4{grid-template-columns:repeat(2,1fr)}
 .answer-zone.text-5{grid-template-columns:repeat(3,1fr)}
 .answer-zone.shapes{grid-template-columns:repeat(3,1fr)}
 .answer-zone.repeat-groups{grid-template-columns:1fr}
 .answer-zone.dimmed{opacity:.46;filter:saturate(.75)}
 .answer-btn{min-height:54px;border:2px solid rgba(255,255,255,.12);background:#234f89;color:#fff;padding:7px;font-size:clamp(12px,1vw,17px);line-height:1.08;overflow:hidden}
 .answer-btn.shape-answer{background:rgba(255,255,255,.12);display:grid;place-items:center}
 .answer-btn.group-answer{background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:nowrap;min-height:58px;padding:6px 10px}
 .repeat-answer{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:nowrap;width:100%}
 .answer-btn.correct{background:rgba(85,230,165,.75);color:#123928;border-color:rgba(85,230,165,.85)}
 .answer-btn.wrong{background:rgba(255,107,122,.78);border-color:rgba(255,107,122,.9)}
 .answer-btn.selected{box-shadow:0 0 0 3px rgba(255,209,102,.38);border-color:rgba(255,209,102,.75);background:#315f9f}
 .answer-btn.correct.selected,.answer-btn.selected.correct{background:rgba(85,230,165,.75);color:#123928;border-color:rgba(85,230,165,.85);box-shadow:0 0 0 3px rgba(85,230,165,.22)}
 .answer-btn.wrong.selected,.answer-btn.selected.wrong{background:rgba(255,107,122,.78);color:#fff;border-color:rgba(255,107,122,.9);box-shadow:0 0 0 3px rgba(255,107,122,.22)}
 .answer-btn:disabled{cursor:default;opacity:.68}
 .submitted-note{text-align:center;font-weight:1000;font-size:clamp(13px,1vw,16px);color:#dfe9f8}

 .controls{display:none}
 .status{display:none}
 .status strong{color:var(--gold)}

 .overlay{position:fixed;inset:0;z-index:50;background:rgba(4,8,16,.78);backdrop-filter:blur(5px);display:grid;place-items:center;padding:24px}
 .result-card{width:min(970px,94vw);background:linear-gradient(145deg,#244b80,#132f56);border:2px solid rgba(255,255,255,.15);border-radius:28px;padding:clamp(22px,2.7vw,40px);text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.55)}
 .result-icon{font-size:clamp(58px,6vw,96px)}
 .result-card h2{font-size:clamp(31px,3.5vw,56px);margin:3px 0 8px}
 .result-card p{font-size:clamp(16px,1.35vw,22px);line-height:1.35;margin:8px 0;color:#dbe7f8}
 .result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
 .result-item{padding:12px;border-radius:14px;color:#172033;font-weight:1000;font-size:clamp(14px,1.15vw,19px)}
 .result-item b{display:block;font-size:clamp(24px,2.2vw,38px)}
 .result-item small{display:block;margin-top:4px;line-height:1.15}
 .overlay-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}

 .end-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
 .winner-panel,.ranking-panel{background:linear-gradient(145deg,rgba(27,57,99,.97),rgba(14,35,64,.97));border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:var(--shadow);padding:clamp(21px,2.4vw,38px);min-height:0}
 .winner-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
 .trophy{font-size:clamp(82px,10vw,165px);filter:drop-shadow(0 12px 25px rgba(0,0,0,.35))}
 .winner-panel h2{font-size:clamp(34px,4.2vw,68px);line-height:1;margin:8px 0}
 .winner-panel p{font-size:clamp(16px,1.4vw,23px);color:#d6e2f4;margin:8px 0}
 .winner-chip{margin:13px 0;padding:13px 27px;border-radius:18px;color:#172033;font-size:clamp(25px,2.8vw,45px);font-weight:1000;box-shadow:var(--shadow)}
 .ranking-panel{overflow:auto}
 .ranking-panel h3{margin:0 0 14px;font-size:clamp(24px,2.2vw,37px)}
 .rank-row{display:grid;grid-template-columns:50px 1fr 110px;gap:11px;align-items:center;padding:9px;border-radius:14px;background:rgba(255,255,255,.06);margin:7px 0}
 .rank-num{font-size:clamp(22px,1.9vw,32px);font-weight:1000;color:var(--gold);text-align:center}
 .rank-group{padding:9px 11px;border-radius:10px;color:#172033;font-weight:1000;font-size:clamp(15px,1.25vw,21px)}
 .rank-money{font-size:clamp(21px,1.85vw,31px);font-weight:1000;text-align:right}
 .rank-money small{display:block;font-size:.43em;line-height:1.1;color:#cbd8eb}

 .confetti{position:fixed;top:-20px;width:12px;height:20px;z-index:70;pointer-events:none;animation:fall linear forwards}
 @keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(840deg);opacity:.8}}

 @media(max-aspect-ratio:4/3){.intro-center{grid-template-columns:1fr}.rules-card{display:none}.end-wrap{grid-template-columns:1fr}.ranking-panel{max-height:42vh}.players{min-height:190px}.topbar{grid-template-columns:1fr auto}.clue-stage{gap:6px}.clue-card{padding:7px}.shape-box,.blank-box{width:46px;height:46px}.board-grid{grid-template-rows:52px repeat(5,1fr)}}
 @media(max-width:980px){.brand p{display:none}.moneyboard{gap:4px}.money-card{padding:4px}.money-card .gname{font-size:9px}.money-card .money{font-size:17px}.players{gap:6px}.player-card{padding:8px 6px}.player-name{font-size:18px}.category-btn{font-size:10px}.clue-question{font-size:14px}.answer-btn{font-size:11px;min-height:48px}.topbar{grid-template-columns:1fr auto}.control-wrap{grid-column:1 / -1;order:3}.cover-card{padding:24px 16px}.cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:0;width:min(320px,100%)}.cover-animation{height:108px}.cover-mini-steps{gap:8px}.cover-step{padding:8px 12px}.cash-tag{min-width:64px;padding:8px 10px}}

 /* : enlarged shapes, but scaled conservatively to avoid overflow. */
 .clue-card{padding:11px;gap:8px}
 .clue-question{min-height:50px;font-size:clamp(15px,1.25vw,21px)}
 .visual{min-height:138px;padding:10px;gap:8px;align-content:center;justify-content:center}
 .shape-box,.blank-box{width:clamp(60px,4.4vw,74px);height:clamp(60px,4.4vw,74px);border-radius:16px;flex:0 0 auto}
 .blank-box{font-size:clamp(28px,2.25vw,39px);border-width:4px}
 .shape-num{left:4px;top:4px;width:20px;height:20px;font-size:11px;z-index:2}
 .shape-box svg{width:82%;height:82%;max-width:82%;max-height:82%}
 .answer-zone.repeat-groups{grid-template-columns:1fr;gap:8px}

<body>

<div id="overlayRoot"></div>
<script>
(() => {
 'use strict';

 const STORAGE_KEY='SgLDC_TripleJeopardy_Community_v9';
 const SETUP_KEY='SgLDC_Universal_GameSetup_v1';
const groupOrder=['red','yellow','green','orange','purple','blue'];
const DEFAULT_GROUP_COLORS=['#ff7f88','#ffe29a','#bfdda8','#ffc58f','#cfa7f3','#a9c8e8'];
let groups={};
let setupConfig=null;
let setupDraft=null;
let setupValidated=false;
let selectedPlayerId=null;
let setupCheckedOnce=false;
let setupDirty=false;
let setupSavedSignature=null;
let setupUndoStack=[];
let setupRedoStack=[];
let setupHistoryApplying=false;
let activePointerDrag=null;
let suppressTouchClickUntil=0;
 
 function setupErrorSound(){
  try{if(typeof wrongSound==='function'){wrongSound();return;}if(typeof badSound==='function'){badSound();return;}}catch(e){}
}
function blankSetupDraft(){return{
  schema:'sgldc-game-setup',version:1,
  players:Array.from({length:0},()=>null),
  groups:groupOrder.map((id,i)=>({id,name:`Group ${i+1}`,color:DEFAULT_GROUP_COLORS[i],memberIds:[]}))
};}
function normalizeSetup(raw){
  if(!raw||typeof raw!=='object')return null;
  let players=[];
  if(Array.isArray(raw.players))players=raw.players.map((p,i)=>typeof p==='string'?{id:`p${String(i+1).padStart(2,'0')}`,name:p}:{id:String(p?.id||`p${String(i+1).padStart(2,'0')}`),name:String(p?.name||'')});
  let gs=Array.isArray(raw.groups)?raw.groups:[];
  const normGroups=groupOrder.map((id,i)=>{
    const g=gs[i]||{};
    const memberIds=Array.isArray(g.memberIds)?g.memberIds.map(String):Array.isArray(g.players)?g.players.map(name=>players.find(p=>p.name===name)?.id).filter(Boolean):[];
    const name=String(g.name??'').trim()||`Group ${i+1}`;
    return{id,name,color:/^#[0-9a-f]{6}$/i.test(String(g.color||''))?String(g.color):DEFAULT_GROUP_COLORS[i],memberIds};
  });
  return{schema:'sgldc-game-setup',version:1,players,groups:normGroups};
}
function playerSetupErrors(cfg){
  const names=cfg.players.map(p=>p.name.trim()).filter(Boolean),errors=[];
  if(names.length!==30)errors.push(`30 player names required (${names.length} entered)`);
  if(names.some(n=>[...n].length>12))errors.push('Player names must be 12 characters or fewer');
  return errors;
}
function groupSetupErrors(cfg){
  const errors=[];
  if(cfg.groups.some((g,i)=>[...(g.name.trim()||`Group ${i+1}`)].length>12))errors.push('Group names must be 12 characters or fewer');
  return errors;
}
function baseSetupErrors(cfg){return [...playerSetupErrors(cfg),...groupSetupErrors(cfg)];}
function groupingComplete(cfg){const ids=new Set(cfg.players.map(p=>p.id));const assigned=cfg.groups.flatMap(g=>g.memberIds);return cfg.groups.every(g=>g.memberIds.length===5)&&assigned.length===30&&new Set(assigned).size===30&&assigned.every(id=>ids.has(id));}
function setupReady(cfg){return !!cfg&&baseSetupErrors(cfg).length===0&&groupingComplete(cfg);}
function applySetup(cfg){
  groups={};
  groupOrder.forEach((id,i)=>{const g=cfg.groups[i];groups[id]={name:g.name.trim()||`Group ${i+1}`,color:g.color,players:g.memberIds.map(pid=>cfg.players.find(p=>p.id===pid)?.name).filter(Boolean)};});
}
function loadSetup(){try{const cfg=normalizeSetup(JSON.parse(localStorage.getItem(SETUP_KEY)||'null'));if(setupReady(cfg)){applySetup(cfg);return cfg;}}catch(e){}return null;}
function persistSetup(cfg){try{localStorage.setItem(SETUP_KEY,JSON.stringify(cfg));}catch(e){}}
function setupSignature(cfg){
  const n=normalizeSetup(cfg);
  if(!n)return '';
  return JSON.stringify({players:n.players.map(p=>({id:p.id,name:p.name})),groups:n.groups.map(g=>({name:g.name,color:g.color,memberIds:[...g.memberIds]}))});
}
function rosterReady(cfg=setupDraft){
  if(!cfg)return false;
  const names=cfg.players.map(p=>p.name.trim()).filter(Boolean);
  return names.length===30&&!names.some(n=>[...n].length>12)&&groupSetupErrors(cfg).length===0;
}
function recomputeSetupValidation(){setupValidated=rosterReady(setupDraft);setupCheckedOnce=setupValidated;}
function refreshSetupButtons(){
  const randomize=$('#randomizeBtn'),add=$('#addToGameBtn'),download=$('#downloadSetupBtn');
  const rosterOK=rosterReady(setupDraft);
  if(randomize)randomize.disabled=!rosterOK;
  if(download)download.disabled=!rosterOK;
  if(add)add.disabled=!!setupSavedSignature&&!setupDirty;
}
function markSetupDirty(){
  setupDirty=true;recomputeSetupValidation();refreshSetupButtons();
}
function cloneSetup(cfg){return cfg?normalizeSetup(JSON.parse(JSON.stringify(cfg))):null;}
function setupHistoryEntry(){
  if(!setupDraft)return null;
  let cfg;
  try{cfg=currentDraftFromValidatedUI();}catch(e){cfg=setupDraft;}
  return{cfg:cloneSetup(cfg),validated:!!setupValidated,checked:!!setupCheckedOnce};
}
function refreshHistoryButtons(){const u=$('#undoSetupBtn'),r=$('#redoSetupBtn');if(u)u.disabled=!setupUndoStack.length;if(r)r.disabled=!setupRedoStack.length;}
function recordSetupHistory(){

function cleanSetupField(value){return String(value??'').replace(/[\t\r\n]+/g,' ').trim();}

function parseSetupText(text){

    else if(type==='GROUP'&&parts.length>=3){const id=parts.shift().trim(),name=parts.shift().trim(),color=parts.shift().trim();groupMap.set(id,{id,name,color,memberIds:[]});}
    else if(type==='ASSIGN'&&parts.length>=2){assignments.push({playerId:parts[0].trim(),groupId:parts[1].trim()});}

  if(!players.length)return null;
  const groupsOut=groupOrder.map((id,i)=>{const g=groupMap.get(id)||{id,name:'',color:DEFAULT_GROUP_COLORS[i],memberIds:[]};return{id,name:g.name,color:g.color,memberIds:[]};});

  return `<div class="clue-card" data-lane="${lane}"><div class="clue-head" style="background:${player.color}"><span class="clue-player">${escapeHTML(player.player)}</span><span class="clue-money">${fmtMoney(value)}</span></div><div class="clue-category">${cat.icon} ${cat.name}</div><div class="clue-question">${clue.question}</div><div class="visual ${density}" id="visual-${lane}">${visual}</div><div class="answer-zone dimmed ${answerGridClass(clue)}" id="answer-${lane}">${answersHTML}</div><div class="submitted-note hidden" id="submitted-${lane}"></div></div>`;
 }

 function renderVisual(clue,lane){
  if(clue.visualType==='sortgroups' && clue.groups){
   return `${clue.groups.map((group,i)=>`<div class="sort-group-visual"><div class="sort-group-label">${group.label||String.fromCharCode(65+i)}</div><div class="sort-group-grid">${group.shapes.map(shape=>`<div class="shape-box">${shapeSVG(shape,46)}</div>`).join('')}</div></div>`).join('')}`;
  }
  if(!clue.visual)return '';
  if(clue.type==='tapgroup'){
   return clue.visual.map((shape,i)=>`<button class="shape-box interactive-shape tapgroup-shape" data-lane="${lane}" data-index="${i}" disabled><span class="shape-num">${i+1}</span>${shapeSVG(shape,64)}</button>`).join('');
  }
  if(clue.type==='tapwrong'){
   return clue.visual.map((shape,i)=>`<button class="shape-box interactive-shape tapwrong-shape" data-lane="${lane}" data-index="${i}" disabled>${clue.numbered?`<span class="shape-num">${i+1}</span>`:''}${shapeSVG(shape,64)}</button>`).join('');
  }
  if(clue.type==='sequence'){
   let fillIndex=0;
   return clue.visual.map(shape=>{
    const currentShape = shape===null ? (sequenceSelections[lane][fillIndex++] || null) : shape;
    return currentShape===null ? '<div class="blank-box">?</div>' : `<div class="shape-box">${shapeSVG(currentShape,64)}</div>`;
   }).join('');
  }
  return clue.visual.map((shape,i)=>shape===null?'<div class="blank-box">?</div>':`<div class="shape-box">${clue.numbered?`<span class="shape-num">${i+1}</span>`:''}${shapeSVG(shape,64)}</div>`).join('');
 }

 function renderOptionContent(option){
  if(Array.isArray(option)) return `<div class="repeat-answer">${option.map(shape=>shapeSVG(shape,option.length>3?34:42)).join('')}</div>`;
  if(typeof option==='object') return shapeSVG(option,46);
  return option;
 }

 function sequenceStepChoices(clue,stepIndex){
  const correct=clue.answer[stepIndex],pool=[];
  (clue.options||[]).forEach(opt=>{if(Array.isArray(opt)&&opt[stepIndex])pool.push(opt[stepIndex]);});
  (clue.visual||[]).forEach(shape=>{if(shape)pool.push(shape);});
  (clue.answer||[]).forEach(shape=>pool.push(shape));
  const unique=[];
  pool.forEach(item=>{if(!unique.some(x=>answersEqual(x,item)))unique.push(item);});
  const distractors=[];
  unique.forEach(item=>{if(!answersEqual(item,correct)&&distractors.length<2)distractors.push(item);});
  const fallback=[S('circle','red'),S('square','blue'),S('triangle','green'),S('diamond','yellow'),S('rectangle','purple')];
  fallback.forEach(item=>{if(distractors.length<2&&!answersEqual(item,correct)&&!distractors.some(x=>answersEqual(x,item)))distractors.push(item);});
  return [correct,...distractors.slice(0,2)];
 }

 function renderAnswers(clue,lane,disabled){
  if(clue.type==='tapgroup')return `<div class="selection-hint">Tap one complete repeating group.</div><button class="answer-btn submit-group-btn" data-lane="${lane}" disabled>Submit Group</button>`;
  if(clue.type==='tapwrong')return `<div class="tap-hint">Tap the shape that is wrong.</div>`;
  if(clue.type==='sequence'){
   const options=shuffle(sequenceStepChoices(clue,sequenceProgress[lane]).map((o,i)=>({o,i})));
   return `<div class="selection-hint">Tap the next shape to continue the pattern.</div>`+options.map(item=>`<button class="answer-btn shape-answer sequence-btn" data-lane="${lane}" data-answer="${escapeAttr(encodeAnswer(item.o))}" ${disabled?'disabled':''}>${renderOptionContent(item.o)}</button>`).join('');
  }
  if(clue.type==='text'){
   const needed=clue.selectCount||1;
   const options=shuffle(clue.options.map((o,i)=>({o,i})));
   return `<div class="selection-hint">${needed===1?'Tap the correct option.':'Tap 2 options to complete your answer.'}</div>`+options.map(item=>`<button class="answer-btn text-choice-btn" data-lane="${lane}" data-answer="${escapeAttr(encodeAnswer(item.o))}" ${disabled?'disabled':''}>${renderOptionContent(item.o)}</button>`).join('');
  }
  const options=shuffle(clue.options.map((o,i)=>({o,i})));
  return options.map(item=>{
   const encoded=encodeAnswer(item.o),shape=typeof item.o==='object'&&!Array.isArray(item.o),group=Array.isArray(item.o);
   return `<button class="answer-btn ${shape?'shape-answer':''} ${group?'group-answer':''}" data-lane="${lane}" data-answer="${escapeAttr(encoded)}" ${disabled?'disabled':''}>${renderOptionContent(item.o)}</button>`;
  }).join('');
 }

 function answerGridClass(clue){
  if(clue.type==='tapgroup')return 'tap-submit';
  if(clue.type==='tapwrong')return 'tap-wrong';
  if(clue.type==='sequence')return 'shapes';
  if(clue.type==='text')return 'text-4';
  return Array.isArray(clue.options[0])?'repeat-groups':(typeof clue.options[0]==='object'?'shapes':`text-${clue.options.length}`);
 }

 function bindPointerOnce(el,handler){
  if(el.dataset.bound==='1')return;
  el.dataset.bound='1';
  el.addEventListener('pointerdown',handler,{passive:false});
 }

 function bindAnswerButtons(disabled){
  document.querySelectorAll('.answer-btn[data-answer]').forEach(btn=>{
   btn.disabled=disabled;
   bindPointerOnce(btn,e=>{
    e.preventDefault();
    const lane=Number(btn.dataset.lane),answer=decodeAnswer(btn.dataset.answer);
    if(btn.classList.contains('sequence-btn'))handleSequenceChoice(lane,answer,btn);
    else if(btn.classList.contains('text-choice-btn'))handleTextChoice(lane,answer,btn);
    else submitAnswer(lane,answer,btn);
   });
  });
  document.querySelectorAll('.submit-group-btn').forEach(btn=>bindPointerOnce(btn,e=>{e.preventDefault();submitTapGroup(Number(btn.dataset.lane),btn);}));
  document.querySelectorAll('.tapgroup-shape').forEach(btn=>bindPointerOnce(btn,e=>{e.preventDefault();toggleTapGroup(Number(btn.dataset.lane),Number(btn.dataset.index),btn);}));
  document.querySelectorAll('.tapwrong-shape').forEach(btn=>bindPointerOnce(btn,e=>{e.preventDefault();tapWrongShape(Number(btn.dataset.lane),Number(btn.dataset.index),btn);}));
 }

 function goLive(){
  phase='live';
  const btn=$('#stageBtn');btn.disabled=true;btn.classList.remove('ready');btn.classList.add('live');btn.textContent='Players answering...';
  document.querySelectorAll('.answer-zone').forEach(z=>z.classList.remove('dimmed'));
  document.querySelectorAll('.answer-btn[data-answer],.interactive-shape').forEach(b=>b.disabled=false);
  for(let lane=0;lane<3;lane++)updateTapSubmit(lane);
  setStatus('You may answer now.');
 }

 function toggleTapGroup(lane,index,btn){
  if(phase!=='live'||submitted[lane])return;
  const set=tapSelections[lane];
  if(set.has(index)){set.delete(index);btn.classList.remove('selected');}
  else{set.add(index);btn.classList.add('selected');}
  tone(470+lane*60,.07,'triangle',.045);updateTapSubmit(lane);
 }

 function updateTapSubmit(lane){
  const btn=document.querySelector(`.submit-group-btn[data-lane="${lane}"]`);
  if(btn)btn.disabled=phase!=='live'||submitted[lane]||tapSelections[lane].size===0;
 }

 function submitTapGroup(lane,btn){
  if(phase!=='live'||submitted[lane]||tapSelections[lane].size===0)return;
  submitAnswer(lane,[...tapSelections[lane]].sort((a,b)=>a-b),btn);
 }

 function tapWrongShape(lane,index,btn){
  if(phase!=='live'||submitted[lane])return;
  submitAnswer(lane,index,btn);
 }

 function refreshSequenceLane(lane){
  const cat=categories.find(c=>c.id===selections[lane]),clue=cat.clues[currentValue()];
  const visual=$(`#visual-${lane}`),zone=$(`#answer-${lane}`);
  if(visual)visual.innerHTML=renderVisual(clue,lane);
  if(zone){
   zone.className=`answer-zone ${answerGridClass(clue)}`;
   zone.innerHTML=renderAnswers(clue,lane,false);
   bindAnswerButtons(false);
  }
 }

 function finalizeSubmission(lane,correct,noteText){
  const note=$(`#submitted-${lane}`);
  note.classList.remove('hidden');
  note.textContent=noteText;
  correct?goodSound():badSound();
  setStatus(`<strong>${submitted.filter(Boolean).length} of 3</strong> answers submitted.`);
  if(submitted.every(Boolean)){processing=true;setTimeout(finishRound,650);}
 }

 function handleTextChoice(lane,answer,btn){
  if(phase!=='live'||submitted[lane])return;
  const cat=categories.find(c=>c.id===selections[lane]),clue=cat.clues[currentValue()],needed=clue.selectCount||1;
  const picked=textSelections[lane];
  const existing=picked.findIndex(x=>answersEqual(x,answer));
  if(existing>=0){
   picked.splice(existing,1);
   btn.classList.remove('selected');
   return;
  }
  if(picked.length>=needed)return;
  picked.push(answer);
  btn.classList.add('selected');
  tone(500+lane*60,.08,'triangle',.05);
  if(picked.length===needed){
   submitted[lane]=true;
   answers[lane]=needed===1?picked[0]:[...picked];
   const correct=isCorrectAnswer(answers[lane],clue);
   const zone=$(`#answer-${lane}`);
   zone.querySelectorAll('.text-choice-btn').forEach(choiceBtn=>{
    const opt=decodeAnswer(choiceBtn.dataset.answer);
    if(picked.some(x=>answersEqual(x,opt)))choiceBtn.classList.add(correct?'correct':'wrong');
    choiceBtn.disabled=true;
   });
   finalizeSubmission(lane,correct,correct?'Correct! Money secured.':'Answer submitted.');
  }
 }

 function handleSequenceChoice(lane,answer,btn){
  if(phase!=='live'||submitted[lane])return;
  const cat=categories.find(c=>c.id===selections[lane]),clue=cat.clues[currentValue()],step=sequenceProgress[lane],correctAnswer=clue.answer[step];
  if(answersEqual(answer,correctAnswer)){
   btn.classList.add('correct');
   sequenceSelections[lane].push(correctAnswer);
   sequenceProgress[lane]=step+1;
   tone(520+lane*60,.10,'triangle',.06);
   setTimeout(()=>{
    if(sequenceProgress[lane]===clue.answer.length){
     submitted[lane]=true;
     answers[lane]=clue.answer.slice();
     const visual=$(`#visual-${lane}`),zone=$(`#answer-${lane}`);
     if(visual)visual.innerHTML=renderVisual(clue,lane);
     if(zone){zone.className=`answer-zone ${answerGridClass(clue)}`;zone.innerHTML='<div class="selection-hint">Pattern completed.</div>';}
     finalizeSubmission(lane,true,'Correct! Money secured.');
    }else{
     refreshSequenceLane(lane);
    }
   },180);
  }else{
   btn.classList.add('wrong');
   submitted[lane]=true;
   answers[lane]={step,choice:answer};
   document.querySelectorAll(`#answer-${lane} .answer-btn`).forEach(b=>b.disabled=true);
   finalizeSubmission(lane,false,'Answer submitted.');
  }
 }

 function isCorrectAnswer(answer,clue){
  if(clue.type==='tapgroup'){
   const chosen=[...answer].sort((a,b)=>a-b);
   return clue.acceptedSelections.some(sel=>JSON.stringify(sel)===JSON.stringify(chosen));
  }
  if(clue.type==='tapwrong')return Number(answer)===Number(clue.answerIndex);
  if(clue.type==='text'&&Array.isArray(clue.answer)){
   return Array.isArray(answer)&&answer.length===clue.answer.length&&clue.answer.every(item=>answer.some(x=>String(x)===String(item)));
  }
  return answersEqual(answer,clue.answer);
 }

 function submitAnswer(lane,answer,btn){
  if(phase!=='live'||submitted[lane])return;
  submitted[lane]=true;answers[lane]=answer;
  const cat=categories.find(c=>c.id===selections[lane]),clue=cat.clues[currentValue()],correct=isCorrectAnswer(answer,clue);
  if(clue.type==='tapgroup'){
   btn.classList.add(correct?'correct':'wrong');
   document.querySelectorAll(`.tapgroup-shape[data-lane="${lane}"]`).forEach(b=>{b.disabled=true;if(b.classList.contains('selected'))b.classList.add(correct?'correct':'wrong');});
   btn.disabled=true;
  }else if(clue.type==='tapwrong'){
   btn.classList.add(correct?'correct':'wrong');
   document.querySelectorAll(`.tapwrong-shape[data-lane="${lane}"]`).forEach(b=>b.disabled=true);
  }else{
   btn.classList.add(correct?'correct':'wrong');
   btn.closest('.answer-zone').querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);
  }
  finalizeSubmission(lane,correct,correct?'Correct! Money secured.':'Answer submitted.');
 }

 function finishRound(){
  if(!processing)return;
  processing=false;phase='review';overlayRoot.innerHTML='';
  const roster=state.playerSchedule[state.roundIndex],value=currentValue(),results=[];
  roster.forEach((p,lane)=>{
   const cat=categories.find(c=>c.id===selections[lane]),clue=cat.clues[value],correct=isCorrectAnswer(answers[lane],clue),earned=correct?value:0;
   if(correct){state.money[p.groupId]+=value;state.correct[p.groupId]++;}
   state.tiles[tileKey(cat.id,value)]={groupId:p.groupId,groupName:p.groupName,color:p.color,player:p.player,correct,earned,category:cat.name,value};
   results.push({lane,player:p,cat,clue,correct,earned,sequenceChosen:clue.type==='sequence'?[...sequenceSelections[lane]]:null,sequenceWrong:clue.type==='sequence'&&!correct&&answers[lane]&&!Array.isArray(answers[lane])?{...answers[lane]}:null});
  });
  state.lastResult={value,results};saveState();showRoundSummary(state.lastResult);
 }

 function joinGroupNames(names){
  if(names.length===0)return '';
  if(names.length===1)return names[0];
  if(names.length===2)return `${names[0]} and ${names[1]}`;
  return `${names.slice(0,-1).join(', ')} and ${names[names.length-1]}`;
 }

 function showRoundSummary(r){
  const earned=r.results.reduce((s,x)=>s+x.earned,0),correctCount=r.results.filter(x=>x.correct).length;
  r.results.forEach(x=>{
   const note=$(`#submitted-${x.lane}`);
   note.classList.remove('hidden');
   note.innerHTML=`<strong>${x.correct?fmtMoney(x.earned):'$0'}</strong> won this round`;
  });
  const btn=$('#stageBtn');
  btn.disabled=false;btn.classList.remove('waiting','live');btn.classList.add('ready');btn.textContent='🔍 Show Correct Answers';
  const correctGroups=r.results.filter(x=>x.correct).map(x=>x.player.groupName.replace(' Group',''));
  if(correctGroups.length===0){
   setStatus('$0 earned this round.');
  }else{
   const groupLabel=`${joinGroupNames(correctGroups)} ${correctGroups.length===1?'Group':'Groups'}`;
   setStatus(`<strong>${fmtMoney(earned)} earned</strong> for ${groupLabel}!`);
  }
  if(earned>0)confetti(Math.min(65,25+correctCount*12));
 }

 function sequenceRevealHTML(clue){
  return `<div class="sequence-answer-reveal"><div class="reveal-label">Correct answer</div><div class="reveal-shapes">${clue.answer.map(shape=>`<div class="shape-box">${shapeSVG(shape,64)}</div>`).join('')}</div></div>`;
 }

 function renderSequenceAttemptVisual(clue,chosen=[],wrongAttempt=null){
  let fillIndex=0;
  return clue.visual.map(shape=>{
   if(shape!==null)return `<div class="shape-box">${shapeSVG(shape,64)}</div>`;
   const idx=fillIndex++;
   if(idx<chosen.length)return `<div class="shape-box">${shapeSVG(chosen[idx],64)}</div>`;
   if(wrongAttempt&&idx===wrongAttempt.step)return `<div class="shape-box sequence-wrong-reveal">${shapeSVG(wrongAttempt.choice,64)}</div>`;
   return '<div class="blank-box">?</div>';
  }).join('');
 }

 function showCorrectAnswers(){
  if(phase!=='review' || !state.lastResult)return;
  phase='revealed';
  state.lastResult.results.forEach(x=>{
   const zone=$(`#answer-${x.lane}`);
   if(x.clue.type==='tapgroup'){
    const chosen=Array.isArray(answers[x.lane])?[...answers[x.lane]].sort((a,b)=>a-b):[];
    const accepted=x.clue.acceptedSelections||[];
    let reveal=accepted[0]||[];
    if(chosen.length&&accepted.length){
     reveal=accepted.map(sel=>({sel,overlap:sel.filter(i=>chosen.includes(i)).length})).sort((a,b)=>b.overlap-a.overlap)[0].sel;
    }
    document.querySelectorAll(`.tapgroup-shape[data-lane="${x.lane}"]`).forEach(btn=>{
     const idx=Number(btn.dataset.index),inReveal=reveal.includes(idx),wasChosen=chosen.includes(idx);
     btn.classList.remove('selected','wrong','correct');
     if(inReveal)btn.classList.add('correct');
     else if(wasChosen)btn.classList.add('wrong');
     btn.disabled=true;
    });
    zone.querySelectorAll('.submit-group-btn').forEach(btn=>btn.disabled=true);
   }else if(x.clue.type==='tapwrong'){
    document.querySelectorAll(`.tapwrong-shape[data-lane="${x.lane}"]`).forEach(btn=>{
     if(Number(btn.dataset.index)===x.clue.answerIndex)btn.classList.add('correct');
     btn.disabled=true;
    });
   }else if(x.clue.type==='sequence'){
    const visual=$(`#visual-${x.lane}`);
    const chosen=x.sequenceChosen||[];
    const wrongAttempt=x.sequenceWrong||null;
    if(visual)visual.innerHTML=renderSequenceAttemptVisual(x.clue,chosen,wrongAttempt);
    zone.className=`answer-zone ${answerGridClass(x.clue)}`;
    zone.innerHTML=sequenceRevealHTML(x.clue);
   }else if(x.clue.type==='text'){
    const correctAnswers=Array.isArray(x.clue.answer)?x.clue.answer:[x.clue.answer];
    const playerAnswers=Array.isArray(answers[x.lane])?answers[x.lane]:[answers[x.lane]];
    zone.querySelectorAll('.text-choice-btn').forEach(btn=>{
     const opt=decodeAnswer(btn.dataset.answer);
     if(correctAnswers.some(ans=>answersEqual(ans,opt)))btn.classList.add('correct');
     if(playerAnswers.some(ans=>answersEqual(ans,opt))&&!correctAnswers.some(ans=>answersEqual(ans,opt)))btn.classList.add('wrong');
     btn.disabled=true;
    });
   }else{
    const correctEncoded=encodeAnswer(x.clue.answer);
    zone.querySelectorAll('.answer-btn').forEach(btn=>{
     if(btn.dataset.answer===correctEncoded)btn.classList.add('correct');
     btn.disabled=true;
    });
   }
   const note=$(`#submitted-${x.lane}`);
   note.classList.remove('hidden');
   note.innerHTML=`<strong>${x.correct?fmtMoney(x.earned):'$0'}</strong> won this round`;
  });
  const btn=$('#stageBtn');
  btn.textContent=state.roundIndex===9?'🏁 Final Scores':'Next Round →';
  btn.classList.remove('live');btn.classList.add('ready');btn.disabled=false;
  setStatus('Correct answers shown. Eyes on the screen!');
 }

 function nextRound(){overlayRoot.innerHTML='';state.roundIndex++;state.lastResult=null;if(state.roundIndex>=10){state.finished=true;saveState();renderEnd();}else{saveState();renderRound();}}

 function renderEnd(){
  overlayRoot.innerHTML='';if(!state)state=loadState()||freshState();
  const ranking=groupOrder.map(g=>({id:g,...groups[g],money:state.money[g],correct:state.correct[g]})).sort((a,b)=>b.money-a.money||b.correct-a.correct),top=ranking[0].money,moneyLeaders=ranking.filter(x=>x.money===top);let winners=moneyLeaders,tieNote='';
  if(moneyLeaders.length>1){const bestCorrect=Math.max(...moneyLeaders.map(x=>x.correct));const correctLeaders=moneyLeaders.filter(x=>x.correct===bestCorrect);winners=correctLeaders;tieNote=correctLeaders.length===1?`Tie-breaker: most correct answers (${bestCorrect}).`:`Still tied on ${bestCorrect} correct answers, so the championship is shared.`;}
  const winnerText=winners.length===1?winners[0].name:winners.map(w=>w.name.replace(' Group','')).join(' & ')+' Groups',winnerColor=winners.length===1?winners[0].color:'linear-gradient(90deg,#ffd166,#a9c8e8,#cfa7f3)';
  app.innerHTML=`<main class="screen"><div class="topbar"><div class="brand"><div class="brand-badge">🏆</div><div><h1>Triple Jeopardy Complete!</h1><p>All 30 players answered one question.</p></div></div><div class="control-wrap"></div>${toolbar()}</div><section class="end-wrap"><div class="winner-panel"><div class="trophy">🏆</div><p>${winners.length===1?'Champion Group':'Joint Champions'}</p><div class="winner-chip" style="background:${winnerColor}">${winnerText}</div><h2>${fmtMoney(top)}</h2><p>${tieNote||'Excellent teamwork and pattern thinking!'}</p><div class="overlay-actions"><button class="primary-btn" id="againBtn">💵 New Game</button></div></div><div class="ranking-panel"><h3>Final Money Board</h3>${ranking.map((r,i)=>`<div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-group" style="background:${r.color}">${r.name}</div><div class="rank-money">${fmtMoney(r.money)}<small>${r.correct} correct</small></div></div>`).join('')}</div></section></main>`;
  bindToolbar();confetti(90);$('#againBtn').onclick=()=>{if(confirm('Start a fresh Triple Jeopardy game?')){state=freshState();saveState();renderRound();}};
 }

 function encodeAnswer(a){return typeof a==='object'?'obj:'+btoa(unescape(encodeURIComponent(JSON.stringify(a)))):'txt:'+a;}
 function decodeAnswer(s){if(s.startsWith('obj:'))return JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));return s.slice(4);}
 function answersEqual(a,b){return typeof b==='object'?JSON.stringify(a)===JSON.stringify(b):String(a)===String(b);}
 function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
 function formatAnswer(a){if(Array.isArray(a)){if(a.length&&typeof a[0]==='string')return a.join(' and ');return a.map(x=>`${capitalize(x.color)} ${x.shape}`).join(', ');} return typeof a==='object'?`${capitalize(a.color)} ${a.shape}`:a;}
 function formatClueAnswer(clue){if(clue.type==='tapgroup'){const s=clue.acceptedSelections[0].map(i=>i+1);return `Shapes ${s.join(', ')}`;}if(clue.type==='tapwrong')return `Shape ${clue.answerIndex+1}`;return formatAnswer(clue.answer);}
 function capitalize(s){return String(s).charAt(0).toUpperCase()+String(s).slice(1);}

 function sizeScale(size){return size==='small'?.70:size==='large'?1.25:1;}
 function shapeSVG(shape,canvas=44){
  const c=shapeColors[shape.color]||shape.color||'#888',scale=sizeScale(shape.size||'medium'),rot=shape.orientation||0,cx=32,cy=32;let inner='';
  if(shape.shape==='circle')inner=`<circle cx="32" cy="32" r="24" fill="${c}"/>`;
  else if(shape.shape==='square')inner=`<rect x="8" y="8" width="48" height="48" rx="0" fill="${c}"/>`;
  else if(shape.shape==='rectangle')inner=`<rect x="5" y="15" width="54" height="34" rx="0" fill="${c}"/>`;
  else if(shape.shape==='triangle')inner=`<polygon points="32,4 59,58 5,58" fill="${c}"/>`;
  else if(shape.shape==='diamond')inner=`<polygon points="32,3 61,32 32,61 3,32" fill="${c}"/>`;
  else inner=`<circle cx="32" cy="32" r="24" fill="${c}"/>`;
  return `<svg viewBox="0 0 64 64" width="${canvas}" height="${canvas}" aria-hidden="true"><g transform="translate(${cx} ${cy}) scale(${scale}) rotate(${rot}) translate(${-cx} ${-cy})">${inner}</g></svg>`;
 }

 document.addEventListener('keydown',e=>{
  if(phase==='checkin'&&['1','2','3'].includes(e.key))checkInPlayer(Number(e.key)-1);
