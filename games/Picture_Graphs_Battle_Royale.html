<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Picture Graphs Battle Royale — Sugar Rush v11</title>
<style>
:root{
  --bg1:#071720;--bg2:#10352c;--panel:#182a47;--panel2:#243a5d;
  --text:#f7fbff;--muted:#bdc9dc;--gold:#ffd166;--good:#55e6a5;--bad:#ff6b7a;
  --shadow:0 12px 32px rgba(0,0,0,.30);
  --red:#ff7f88;--yellow:#ffe29a;--green:#bfdda8;--orange:#ffc58f;--purple:#cfa7f3;--blue:#a9c8e8
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}
button{font:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 12% 13%,rgba(75,199,132,.19),transparent 30%),
  radial-gradient(circle at 88% 17%,rgba(255,209,102,.12),transparent 29%),
  linear-gradient(135deg,var(--bg1),var(--bg2))}
#app{position:relative;width:100%;height:100%;z-index:1}.hidden{display:none!important}
.screen{width:100%;height:100%;padding:clamp(9px,1.15vw,19px);display:flex;flex-direction:column;gap:clamp(7px,.9vh,12px)}
.topbar{display:grid;grid-template-columns:minmax(330px,1fr) auto minmax(155px,1fr);align-items:center;gap:13px;min-height:58px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-badge{font-size:clamp(30px,3vw,48px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.34))}
.brand h1{margin:0;font-size:clamp(22px,2.35vw,40px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand p{margin:5px 0 0;color:var(--muted);font-size:clamp(11px,1vw,16px)}
.toolbar{display:flex;gap:8px;justify-content:flex-end}.icon-btn,.primary-btn,.secondary-btn,.stage-btn,.ready-btn,.answer-btn{border:0;cursor:pointer;font-weight:1000;transition:transform .11s ease,filter .13s ease,opacity .13s ease,background .15s ease}
.icon-btn:active,.primary-btn:active,.secondary-btn:active,.stage-btn:active,.ready-btn:active,.answer-btn:active{transform:scale(.97)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:#23385f;color:#fff;font-size:21px;box-shadow:var(--shadow)}
.primary-btn{padding:14px 24px;border-radius:15px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#182239;font-size:clamp(17px,1.45vw,24px);box-shadow:var(--shadow)}
.secondary-btn{padding:13px 20px;border-radius:15px;background:#2c4774;color:#fff;font-size:clamp(15px,1.2vw,20px);box-shadow:var(--shadow)}
.stage-btn{min-width:clamp(225px,20vw,330px);padding:13px 22px;border-radius:16px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033;font-size:clamp(16px,1.4vw,23px);box-shadow:0 0 20px rgba(255,209,102,.42),var(--shadow)}
.stage-btn.waiting{background:#33445f;color:#aebbd0;box-shadow:none;opacity:.62;cursor:not-allowed}.stage-btn.go{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825;animation:goGlow .72s ease-in-out infinite alternate}.stage-btn.live{background:#263a5e;color:#c6d1e2;box-shadow:none;opacity:.78;cursor:default}.stage-btn.answer{background:linear-gradient(135deg,#71c7ff,#5592f6);color:#10284b;animation:answerGlow .76s ease-in-out infinite alternate}.stage-btn.next{background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033}
@keyframes goGlow{to{filter:brightness(1.14);box-shadow:0 0 28px rgba(85,230,165,.74),var(--shadow)}}@keyframes answerGlow{to{filter:brightness(1.13);box-shadow:0 0 28px rgba(113,199,255,.70),var(--shadow)}}

/* Intro */
.intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.cover-card{position:relative;width:min(1160px,100%);height:100%;background:linear-gradient(145deg,rgba(31,48,80,.97),rgba(17,29,50,.97));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,52px)}
.cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 20%,rgba(88,166,255,.10),transparent 28%),radial-gradient(circle at 82% 22%,rgba(255,209,102,.08),transparent 24%),radial-gradient(circle at 50% 100%,rgba(85,230,165,.08),transparent 36%)}
.cover-inner{position:relative;z-index:2;max-width:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.45);color:var(--gold);font-weight:1000;font-size:clamp(12px,1.02vw,17px);letter-spacing:.04em;text-transform:uppercase}
.cover-title{font-size:clamp(48px,6vw,92px);line-height:.94;margin:20px 0 14px;max-width:900px;text-shadow:0 8px 25px rgba(0,0,0,.35)}
.cover-title em{color:var(--gold);font-style:normal}
.cover-subtitle{font-size:clamp(19px,1.7vw,29px);color:#dbe7fb;max-width:760px;line-height:1.3;margin:0}
.cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:min(360px,80vw)}
.cover-mini-steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-step{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#e6eefb;font-size:clamp(14px,1.15vw,19px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.cover-step strong{color:var(--gold)}
.cover-arrow{font-size:clamp(18px,1.4vw,24px);color:rgba(255,209,102,.92);font-weight:1000}
.cover-animation{position:absolute;left:0;right:0;bottom:10px;height:128px;pointer-events:none;z-index:1}
.float-shape{position:absolute;bottom:0;opacity:.9;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));animation:floatBob 3.8s ease-in-out infinite alternate}
.float-shape svg{display:block}
.float-shape.shape-1{left:8%;animation-duration:4.2s;transform:rotate(-8deg)}
.float-shape.shape-2{left:24%;bottom:18px;animation-duration:3.5s;animation-delay:.4s;transform:scale(.92)}
.float-shape.shape-3{left:44%;bottom:-4px;animation-duration:4.6s;animation-delay:.2s}
.float-shape.shape-4{left:64%;bottom:16px;animation-duration:3.9s;animation-delay:.7s;transform:scale(.94) rotate(7deg)}
.float-shape.shape-5{left:82%;bottom:2px;animation-duration:4.4s;animation-delay:.3s;transform:rotate(-6deg)}
@keyframes floatBob{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-14px) scale(1.04)}}

/* Universal Game Setup — streamlined v7 */
.setup-screen{gap:10px}
.setup-topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;min-height:58px}
.setup-title-wrap{min-width:0;display:flex;align-items:center}.setup-title-wrap h1{margin:0;font-size:clamp(36px,3.25vw,54px);line-height:1}
.setup-back{width:auto;min-width:50px;padding:0 14px;font-size:clamp(22px,1.8vw,28px)}
.setup-history{display:flex;align-items:center;gap:7px}.setup-history .icon-btn{font-size:25px}.setup-history .icon-btn:disabled{filter:grayscale(.85) brightness(.7);opacity:.42;cursor:not-allowed;box-shadow:none}
.setup-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(245px,1.16fr) repeat(3,minmax(185px,1fr));grid-template-rows:1fr 1fr;gap:10px}
.setup-panel{min-width:0;min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.player-bank{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;padding:12px;gap:9px}
.setup-panel-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(21px,1.85vw,29px);font-weight:1000;color:var(--gold)}
.setup-count{font-size:clamp(18px,1.45vw,23px);color:#d7e2f2;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:999px}
.player-entry{flex:0 0 auto;width:100%;height:52px;min-height:52px;resize:none;overflow:hidden;border:2px solid rgba(255,255,255,.13);outline:none;border-radius:12px;background:#101d33;color:#f7fbff;padding:10px 12px;font:800 clamp(18px,1.45vw,23px)/1.25 "Trebuchet MS",Arial,sans-serif}
.player-entry:focus{border-color:rgba(255,209,102,.72);box-shadow:0 0 0 3px rgba(255,209,102,.08)}
.player-entry::placeholder{color:#91a3bb;opacity:1}
.player-tags{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:2px 4px 4px}
.player-tag{width:100%;flex:0 0 auto;border:2px solid rgba(255,255,255,.18);border-radius:10px;background:#2b4775;color:#fff;padding:7px 10px;font-size:clamp(17px,1.35vw,22px);line-height:1.12;font-weight:1000;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.player-tag:active{cursor:grabbing}.player-tag.selected{outline:3px solid var(--gold);outline-offset:2px}.player-tag.assigned{color:#172033}
.touch-drag-ghost{position:fixed!important;z-index:99999!important;pointer-events:none!important;margin:0!important;opacity:.92;transform:translate(-50%,-50%) scale(1.04);box-shadow:0 16px 32px rgba(0,0,0,.38)!important}.player-bank.drag-over{outline:3px solid var(--gold);outline-offset:-3px;background:rgba(255,209,102,.06)}
.group-card{display:flex;flex-direction:column;padding:10px;gap:8px;transition:border-color .15s ease,background .15s ease}
.group-card.drag-over{border-color:var(--gold);background:rgba(255,209,102,.08)}
.group-header{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center}
.group-name-input{width:100%;min-width:0;border:0;outline:none;border-radius:11px;background:#2b4775;color:#fff;padding:10px 11px;font-weight:1000;font-size:clamp(19px,1.55vw,25px);line-height:1.15;text-align:center}
.group-name-input:focus{box-shadow:0 0 0 3px rgba(255,209,102,.20)}
.group-colour{width:48px;height:48px;border:2px solid rgba(255,255,255,.55);border-radius:9px;padding:0;background:transparent;cursor:pointer;overflow:hidden}
.group-colour::-webkit-color-swatch-wrapper{padding:0}.group-colour::-webkit-color-swatch{border:0;border-radius:6px}.group-colour::-moz-color-swatch{border:0;border-radius:6px}
.group-drop{flex:1;min-height:0;border:2px dashed rgba(255,255,255,.20);border-radius:13px;padding:7px;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));align-items:stretch;gap:5px;overflow:hidden}
.group-drop .player-tag{height:100%;min-height:0;display:flex;align-items:center;font-size:clamp(16px,1.2vw,20px);line-height:1.05;padding:4px 9px}
.group-entry{width:100%;height:100%;min-height:0;resize:none;overflow:hidden;border:2px solid rgba(255,255,255,.14);outline:none;border-radius:9px;background:rgba(255,255,255,.055);color:#fff;padding:5px 8px;font:800 clamp(14px,1.05vw,18px)/1.15 "Trebuchet MS",Arial,sans-serif}
.group-entry:focus{border-color:rgba(255,209,102,.62);background:rgba(255,255,255,.085)}
.group-entry::placeholder{color:#8fa1b9;opacity:1}
.group-player-count{flex:0 0 auto;text-align:center;color:#a9bad1;font-size:clamp(16px,1.25vw,20px);font-weight:1000;line-height:1;padding:3px 0 1px}
.group-card.full .group-drop{border-color:rgba(85,230,165,.55)}.group-card.full .group-player-count{color:#9ff0c8}
.setup-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.setup-action{border:0;border-radius:12px;min-height:44px;padding:7px 8px;background:#2c4774;color:#fff;font-weight:1000;font-size:clamp(16px,1.25vw,21px);cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.18);white-space:nowrap}
.setup-action:disabled{filter:grayscale(.8) brightness(.72);opacity:.5;cursor:not-allowed;box-shadow:none}.setup-action.valid{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825}.setup-action.primary{background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033}
.setup-toast{position:fixed;left:50%;bottom:72px;z-index:120;max-width:min(760px,calc(100vw - 36px));padding:12px 18px;border-radius:14px;background:rgba(25,39,66,.97);border:2px solid rgba(255,255,255,.16);box-shadow:0 16px 38px rgba(0,0,0,.38);color:#f4f8ff;font-size:clamp(17px,1.35vw,22px);line-height:1.25;font-weight:900;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,14px) scale(.98);transition:opacity .18s ease,transform .18s ease}
.setup-toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.setup-toast.good{background:rgba(23,72,58,.97);border-color:rgba(85,230,165,.58);color:#c5f7dd}
.setup-toast.bad{background:rgba(79,31,43,.98);border-color:rgba(255,114,128,.62);color:#ffd4d8}
.setup-toast strong{color:#fff}
.start-disabled{filter:grayscale(.88) brightness(.65);opacity:.52;cursor:not-allowed!important;box-shadow:none!important}
@media(max-width:1000px){.setup-grid{grid-template-columns:minmax(225px,1.08fr) repeat(3,minmax(155px,1fr));gap:7px}.setup-actions{gap:6px}.setup-action{min-height:42px;padding:7px 5px;font-size:clamp(16px,1.65vw,20px)}.group-card{padding:7px}.player-bank{padding:8px}.player-tag{font-size:clamp(16px,1.8vw,20px);padding:7px 9px}.group-drop .player-tag{font-size:clamp(14px,1.55vw,18px);padding:4px 7px}.group-name-input{font-size:clamp(17px,1.8vw,21px)}.group-player-count{font-size:clamp(14px,1.55vw,18px)}.setup-toast{bottom:64px;font-size:clamp(16px,1.7vw,20px)}}

/* Game */
.scoreboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.score-card{min-width:0;background:rgba(25,39,66,.93);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 9px;display:flex;align-items:center;justify-content:space-between;gap:7px;box-shadow:0 8px 18px rgba(0,0,0,.18)}.score-card .gname{font-weight:1000;color:#172033;padding:5px 7px;border-radius:8px;font-size:clamp(9px,.82vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}.score-card .score{font-size:clamp(20px,1.85vw,31px);font-weight:1000}
.game-main{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(6px,.75vh,10px);min-height:0}.round-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.round-label{font-size:clamp(16px,1.38vw,23px);font-weight:1000;color:var(--gold)}.type-pill{padding:7px 13px;border-radius:999px;background:#24395f;color:#dfeaff;font-weight:900;font-size:clamp(11px,.95vw,15px)}
.arena{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:9px}.challenge-panel{min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border-radius:22px;border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);padding:clamp(10px,1.25vw,19px);display:flex;flex-direction:column;gap:8px;overflow:hidden}.pre-question{display:grid;place-items:center;min-height:100%;font-size:clamp(29px,3vw,53px);font-weight:1000;color:var(--gold);text-align:center}.live-challenge{display:flex;flex-direction:column;gap:8px;min-height:0;height:100%;position:relative;padding-bottom:46px}.instruction{text-align:center;font-size:clamp(18px,1.5vw,25px);font-weight:1000;color:var(--gold)}.teacher-note{text-align:center;color:#d3dfef;font-size:clamp(12px,1vw,16px);font-weight:800}.correct-reveal{position:absolute;left:50%;bottom:0;z-index:4;min-height:30px;padding:6px 18px;border-radius:11px;background:rgba(18,50,57,.96);border:2px solid rgba(85,230,165,.58);color:#a7f4cc;font-size:clamp(13px,1.05vw,18px);font-weight:1000;text-align:center;white-space:nowrap;opacity:0;transform:translate(-50%,4px);transition:.2s ease;box-shadow:0 5px 14px rgba(0,0,0,.22)}.correct-reveal.shown{opacity:1;transform:translate(-50%,0)}

.complete-board{flex:1;display:grid;place-items:center;min-height:0}.shape-group{width:min(940px,95%);border:3px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(255,255,255,.055);padding:15px;display:flex;flex-direction:column;gap:12px}.group-heading{text-align:center;border-radius:12px;background:#2b4775;padding:9px 13px;font-size:clamp(16px,1.32vw,22px);font-weight:1000}.solid-row{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;min-height:158px}.solid-tile{width:132px;height:132px;border-radius:19px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.10);display:grid;place-items:center;position:relative}.solid-name{position:absolute;left:4px;right:4px;bottom:5px;text-align:center;font-size:clamp(10px,.84vw,13px);line-height:1;color:#eef8ee;font-weight:1000;text-shadow:0 1px 3px rgba(0,0,0,.85)}.blank-solid{width:132px;height:132px;border-radius:19px;border:4px dashed rgba(255,209,102,.60);display:grid;place-items:center;color:var(--gold);font-size:50px;font-weight:1000;background:rgba(255,255,255,.025)}
.sort-board{display:grid;grid-template-columns:1fr 1fr;gap:13px;min-height:0;flex:1}.sorted-group{border:3px solid rgba(255,255,255,.18);border-radius:18px;background:rgba(255,255,255,.055);padding:10px;display:flex;flex-direction:column}.sorted-label{text-align:center;border-radius:12px;background:#2b4775;padding:8px 12px;font-size:clamp(15px,1.2vw,20px);font-weight:1000}.sorted-shapes{flex:1;display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap;padding:10px}.sorted-shapes .solid-tile{width:112px;height:112px;border-radius:17px}.sorted-shapes .solid-name{font-size:clamp(10px,.8vw,13px)}.rule-question{text-align:center;font-size:clamp(15px,1.25vw,21px);font-weight:1000;color:#e7effb}
.property-board{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(25px,4vw,70px);min-height:0}.hero-solid{width:150px;height:150px;border-radius:28px;background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.12);display:grid;place-items:center;flex:none}.property-sentence{font-size:clamp(25px,2.4vw,43px);font-weight:1000;line-height:1.22;color:#fff}.multi-action-sentence{font-size:clamp(22px,2vw,36px);display:flex;align-items:baseline;justify-content:center;gap:8px;white-space:nowrap;flex-wrap:nowrap}.multi-action-sentence .blank-word{display:inline-block;min-width:104px;text-align:center}.blank-word{color:var(--gold);letter-spacing:.07em}

.players-area{display:flex;flex-direction:column;gap:7px}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:clamp(150px,20vh,210px)}.player-card{--group:#ddd;--glow:rgba(255,255,255,.5);border:4px solid rgba(255,255,255,.18);border-radius:20px;padding:9px 11px;color:#172033;background:var(--group);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:8px;position:relative;overflow:hidden;text-align:center;filter:brightness(.68) saturate(.72);transition:filter .18s ease,transform .13s ease,border-color .18s ease,box-shadow .18s ease}.player-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.14),transparent 65%);transform:translateX(-120%)}.player-card.readying::after,.player-card.live::after{animation:sweep 1.15s infinite}@keyframes sweep{to{transform:translateX(120%)}}.player-card.checked{filter:brightness(.91) saturate(.88);border-color:rgba(255,255,255,.72);box-shadow:0 0 16px var(--glow),0 0 28px var(--glow),var(--shadow)}.player-card.preview{filter:brightness(.78) saturate(.75)}.player-card.live{filter:none;border-color:rgba(255,255,255,.58)}.player-card.locked{filter:brightness(.62) saturate(.55);opacity:.72}.player-card.round-winner{border-color:var(--gold);filter:brightness(1.06);transform:translateY(-3px);box-shadow:0 0 24px rgba(255,209,102,.56),var(--shadow)}

.scoreboard{gap:8px!important}.score-card{background:rgba(255,255,255,.90)!important;border:2px solid #ead8ed!important;box-shadow:0 5px 0 #dcc8e1,0 8px 15px rgba(89,46,93,.10)!important;color:var(--candy-ink)!important}.score-card .gname{color:#513451!important;border:1px solid rgba(255,255,255,.7)}.score-card .score{color:#5b3a61!important}
.round-label{color:#d94785!important;background:#fff0f7;padding:6px 12px;border:2px solid #ffc0da;border-radius:999px;box-shadow:0 3px 0 #edbdd1}.type-pill{background:#f2e8ff!important;color:#694c72!important;border:2px solid #dbc6ed!important}
.arena{gap:10px!important;grid-template-rows:minmax(0,1fr) 205px!important}.tap-round .players{height:205px!important;min-height:205px!important;grid-auto-rows:205px!important}.tap-round .player-card{height:205px!important;min-height:205px!important}.open-round .arena{grid-template-rows:minmax(210px,.78fr) minmax(310px,1.22fr)!important}.open-round .players{height:auto!important;min-height:310px!important;grid-auto-rows:minmax(310px,1fr)!important}.open-round .player-card{height:auto!important;min-height:310px!important}
.challenge-panel{background:rgba(255,254,252,.94)!important;border:3px solid #fff!important;box-shadow:0 9px 0 rgba(207,166,211,.30),0 15px 30px rgba(89,46,93,.12)!important;border-radius:30px!important;color:var(--candy-ink)!important;padding:clamp(9px,1vw,16px)!important}
.pre-question{color:#e64f91!important;text-shadow:0 3px 0 #fff}
.live-challenge{padding-bottom:0!important;gap:7px!important}.instruction{color:var(--candy-ink)!important;font-size:clamp(20px,1.7vw,29px)!important}.teacher-note{color:#7b617f!important;font-size:clamp(12px,.95vw,16px)!important}
.challenge-visual{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;gap:14px}.visual-card{background:#fff8fb;border:3px solid #f0d7e8;border-radius:24px;padding:12px 18px;box-shadow:0 6px 0 #e4c9db;max-width:min(1000px,98%)}
.symbol-strip{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.symbol-strip svg{filter:drop-shadow(0 4px 0 rgba(87,48,89,.08))}
.key-line{margin-top:10px;text-align:center;font-size:clamp(17px,1.35vw,23px);font-weight:1000;color:#6b4b70}.key-line .key-symbol{display:inline-flex;vertical-align:middle;margin:0 5px}
.data-table{display:grid;grid-template-columns:minmax(145px,1.15fr) minmax(90px,.85fr);min-width:min(520px,80vw);border:3px solid #dfc8e7;border-radius:18px;overflow:hidden;background:#fff}.data-table>div{padding:8px 14px;font-size:clamp(17px,1.35vw,23px);font-weight:1000;border-bottom:2px solid #eee1f1}.data-table>div:nth-last-child(-n+2){border-bottom:0}.data-table .value{text-align:center;background:#fff8d7;color:#6e4e51}.data-table .label{background:#fff8fb;color:#654a6d}
.micrograph{min-width:min(700px,86vw);border:3px solid #ddc5e6;border-radius:19px;overflow:hidden;background:#fff}.graph-row{display:grid;grid-template-columns:150px 1fr;min-height:58px;border-bottom:2px solid #eee0f0}.graph-row:last-of-type{border-bottom:0}.graph-label{display:flex;align-items:center;justify-content:flex-end;padding:6px 14px;background:#f8edff;font-size:clamp(17px,1.3vw,22px);font-weight:1000}.graph-symbols{display:flex;align-items:center;gap:8px;padding:6px 14px;min-width:0}.micrograph .key-line{border-top:2px solid #eee0f0;background:#fff8d8;margin:0;padding:7px 12px}
.tally-card{display:flex;align-items:center;gap:24px;background:#fff;border:3px solid #dfc7e7;border-radius:18px;padding:14px 22px;box-shadow:0 5px 0 #e5d0e8}.tally-label{font-size:clamp(18px,1.5vw,25px);font-weight:1000}.tally-marks{display:flex;gap:12px;align-items:center}.tally-five{position:relative;width:60px;height:52px;display:inline-block}.tally-five i,.tally-one{display:inline-block;width:4px;height:44px;background:#6d4f75;border-radius:3px}.tally-five i{position:absolute;top:4px}.tally-five i:nth-child(1){left:5px}.tally-five i:nth-child(2){left:19px}.tally-five i:nth-child(3){left:33px}.tally-five i:nth-child(4){left:47px}.tally-five b{position:absolute;left:4px;top:24px;width:53px;height:4px;background:#6d4f75;border-radius:3px;transform:rotate(-38deg)}.tally-one{margin-right:8px}

.player-card{border:4px solid rgba(255,255,255,.88)!important;border-radius:24px!important;box-shadow:0 8px 0 rgba(92,56,93,.18),0 13px 22px rgba(91,48,94,.12)!important;color:#4b2b50!important;filter:brightness(.78) saturate(.8)!important;padding:8px 10px!important}.player-card.checked{filter:brightness(.98) saturate(.92)!important}.player-card.preview{filter:brightness(.90) saturate(.85)!important}.player-card.live{filter:none!important}.player-card.locked{filter:brightness(.72) saturate(.58)!important}.player-card.round-winner{border-color:#ffe36f!important;box-shadow:0 0 0 4px rgba(255,227,111,.35),0 10px 0 rgba(160,113,48,.18),0 18px 30px rgba(91,48,94,.14)!important}.player-name{font-size:clamp(21px,1.75vw,31px)!important;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.ready-btn{background:rgba(255,255,255,.78)!important;color:#5a3d61!important;border:3px solid rgba(97,55,102,.18)!important;box-shadow:0 5px 0 rgba(91,48,94,.13)!important}.ready-btn:disabled{background:#fff6bf!important;color:#725f35!important}
.choice-area,.response-zone{width:100%;min-height:0;flex:1}.choice-area{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:8px!important}.answer-btn{background:#fff!important;color:#593a60!important;border:3px solid rgba(255,255,255,.85)!important;box-shadow:0 5px 0 rgba(91,48,94,.17)!important;font-size:clamp(20px,1.7vw,30px)!important;border-radius:16px!important}.answer-btn:nth-child(3n+1){background:#fff4bf!important}.answer-btn:nth-child(3n+2){background:#dff8ff!important}.answer-btn:nth-child(3n+3){background:#ffe0ef!important}.answer-btn.correct-choice{outline:5px solid #54c997!important;outline-offset:-5px;box-shadow:0 0 0 4px rgba(84,201,151,.24),0 5px 0 #43aa7e!important}.answer-btn.wrong-flash{outline:5px solid #ff617e!important}

/* Handwriting / drawing pads */
.open-round .player-card{justify-content:flex-start!important;gap:6px!important;padding:14px 9px 8px!important}.open-round .player-head{min-height:40px!important;margin-top:4px}.response-zone{display:flex;flex-direction:column;gap:6px;min-height:0}.pad-shell{display:flex;flex-direction:column;gap:6px;min-height:0;flex:1}.pad-paper{position:relative;flex:1;min-height:165px;border:3px solid rgba(92,58,97,.18);border-radius:16px;overflow:hidden;background-color:#fffefb;background-image:linear-gradient(rgba(145,220,255,.17) 1px,transparent 1px),linear-gradient(90deg,rgba(201,169,255,.14) 1px,transparent 1px);background-size:24px 24px;box-shadow:inset 0 2px 7px rgba(91,48,94,.06),0 4px 0 rgba(91,48,94,.10)}
.pad-paper.single::after{content:"";position:absolute;left:5%;right:5%;top:58%;height:2px;background:rgba(123,97,127,.13);pointer-events:none}.canvas-layout{position:absolute;inset:0;display:flex}.row-labels{width:76px;flex:0 0 76px;display:grid;grid-template-rows:repeat(3,1fr);border-right:2px solid #e9d8eb;background:rgba(250,239,255,.72);z-index:1}.row-labels span{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:clamp(12px,.95vw,15px);font-weight:1000;color:#6f5175;border-bottom:2px solid #eee0ef}.row-labels span:last-child{border-bottom:0}.canvas-wrap{position:relative;flex:1;min-width:0}.canvas-wrap.rows::before,.canvas-wrap.rows::after{content:"";position:absolute;left:0;right:0;height:2px;background:#ead8ec;z-index:0}.canvas-wrap.rows::before{top:33.333%}.canvas-wrap.rows::after{top:66.666%}.answer-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2;cursor:crosshair}.pad-preview .answer-canvas{pointer-events:none;opacity:.62}.pad-locked .answer-canvas{pointer-events:none}.pad-tools{display:grid;grid-template-columns:repeat(3,1fr) 1.35fr;gap:5px}.pad-tool,.submit-btn,.judge-btn{border:0;border-radius:11px;min-height:36px;font-weight:1000;cursor:pointer}.pad-tool{background:rgba(255,255,255,.78);color:#63486a;border:2px solid rgba(90,55,96,.12)}.pad-tool:disabled{opacity:.38;cursor:not-allowed}.submit-btn{background:linear-gradient(180deg,#ffe986,#ffc758);color:#6c4c25;border:2px solid #e2ad44;box-shadow:0 4px 0 #ca9133}.submit-btn{touch-action:none;-webkit-user-select:none;user-select:none}.submit-btn:disabled{opacity:.58;box-shadow:none}.submit-btn.submitted{background:#dff7ed;color:#39705a;border-color:#82d2b0}.submit-badge{position:absolute;right:7px;top:7px;z-index:4;padding:5px 8px;border-radius:999px;background:#fff5ba;border:2px solid #e9c85f;color:#6e5427;font-size:12px;font-weight:1000;box-shadow:0 2px 0 rgba(91,48,94,.10)}
.judge-slot{min-height:0}.judge-btn{width:100%;background:#fff;color:#5d4265;border:2px dashed #cdb7d5;min-height:34px}.judge-btn.correct{background:#dff8ed;color:#2f6b50;border:2px solid #70cba3;box-shadow:0 4px 0 #4fac86}.player-card.teacher-correct{outline:5px solid rgba(83,200,149,.72);outline-offset:-5px}

.model-answer{display:none;flex:0 0 auto;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:7px 13px;border:3px solid #83d9b3;border-radius:17px;background:#eafff4;color:#2f654f;font-weight:1000;box-shadow:0 5px 0 #b7dfce}.model-answer.shown{display:flex}.model-label{font-size:clamp(13px,1vw,16px);text-transform:uppercase;letter-spacing:.05em}.model-main{font-size:clamp(21px,1.7vw,30px);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.model-sub{font-size:clamp(12px,.95vw,15px);color:#577365}.model-symbols{display:flex;align-items:center;gap:5px}.model-graph{display:grid;grid-template-columns:auto 1fr;gap:4px 9px;align-items:center;font-size:clamp(13px,1vw,16px)}.model-graph .model-row-symbols{display:flex;gap:3px;align-items:center}

/* v2 — clean two-column answer reveal */
.question-side{display:flex;flex-direction:column;gap:7px;min-width:0;min-height:0;flex:1}
.live-challenge.answer-reveal-layout{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px!important;align-items:stretch}
.answer-reveal-layout .question-side{padding-right:15px;border-right:2px solid #ecdbe8}
.answer-reveal-layout .question-side .teacher-note{display:none}
.answer-reveal-layout .challenge-visual{min-width:0;min-height:0;overflow:hidden}
.answer-reveal-layout .visual-card{max-width:100%;padding:9px 12px;border-radius:19px;box-shadow:0 4px 0 #e4c9db}
.answer-reveal-layout .symbol-strip{gap:9px}
.answer-reveal-layout .symbol-strip svg{max-width:52px;max-height:52px}
.answer-reveal-layout .key-line{margin-top:7px;font-size:clamp(14px,1.05vw,18px)}
.answer-reveal-layout .data-table,.answer-reveal-layout .micrograph{min-width:0;width:100%;max-width:100%}
.answer-reveal-layout .data-table>div{padding:6px 10px;font-size:clamp(14px,1vw,18px)}
.answer-reveal-layout .graph-row{grid-template-columns:105px 1fr;min-height:46px}
.answer-reveal-layout .graph-label{padding:5px 8px;font-size:clamp(13px,.95vw,17px)}
.answer-reveal-layout .graph-symbols{gap:5px;padding:4px 8px;overflow:hidden}
.answer-reveal-layout .tally-card{padding:9px 14px;gap:14px}
.answer-reveal-layout .model-answer.shown{display:flex;min-width:0;min-height:0;width:100%;height:100%;padding:14px 18px;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;border-radius:22px}
.answer-reveal-layout .model-label{font-size:clamp(13px,1.05vw,17px)}
.answer-reveal-layout .model-main{font-size:clamp(27px,2.3vw,42px);justify-content:center}
.answer-reveal-layout .model-sub{font-size:clamp(13px,1vw,17px);text-align:center}
.answer-reveal-layout .model-symbols{justify-content:center;flex-wrap:wrap}
.answer-reveal-layout .model-graph{font-size:clamp(13px,1vw,17px);gap:6px 10px}
@media(max-width:900px){
  .live-challenge.answer-reveal-layout{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:10px!important}
  .answer-reveal-layout .question-side{padding-right:9px}
}

/* overlays/end */
.round-overlay{background:rgba(91,47,91,.32)!important;backdrop-filter:blur(6px)!important}.round-win-card{background:linear-gradient(180deg,#fffdfb,#fff0f8)!important;border:5px solid #fff!important;box-shadow:0 12px 0 rgba(205,154,205,.42),0 30px 70px rgba(91,48,94,.25)!important;color:var(--candy-ink)!important}.round-win-card h2{color:#e64f91!important}.round-win-card .no-point{color:#6f5577!important}.group-award{color:#4d314f!important}.point-pop{color:#6b3f55!important}
.end-wrap{color:var(--candy-ink)!important}.winner-panel,.ranking-panel{background:rgba(255,254,252,.94)!important;border:3px solid #fff!important;box-shadow:0 9px 0 rgba(207,166,211,.30),0 16px 30px rgba(89,46,93,.12)!important}.winner-panel h2,.ranking-panel h3{color:#e64f91!important}.rank-row{background:#fff7fb!important;color:#5e4266!important;border-color:#ead8ed!important}

@media(max-height:820px){
  .open-round .arena{grid-template-rows:minmax(185px,.68fr) minmax(285px,1.32fr)!important}
  .open-round .players,.open-round .player-card{height:auto!important;min-height:285px!important;grid-auto-rows:auto!important}
  .pad-paper{min-height:140px}.pad-tools{gap:4px}.pad-tool,.submit-btn{min-height:32px;font-size:13px}.instruction{font-size:clamp(18px,1.55vw,25px)!important}
}


/* =========================================================
   Sugar Rush v3 refinements
   ========================================================= */

/* Larger question typography + no question-type tag */
.round-line{justify-content:flex-start!important}
.round-label{font-size:clamp(21px,1.7vw,30px)!important;padding:7px 14px!important}
.instruction{font-size:clamp(26px,2.2vw,39px)!important;line-height:1.08!important;letter-spacing:-.012em}
.live-challenge{gap:4px!important}
.question-side{gap:4px!important}
.key-line{font-size:clamp(20px,1.58vw,27px)!important;line-height:1.15}
.data-table>div{font-size:clamp(20px,1.52vw,27px)!important;padding:9px 16px!important}
.graph-label{font-size:clamp(20px,1.5vw,27px)!important}
.tally-label{font-size:clamp(21px,1.62vw,28px)!important}
.pre-question{font-size:clamp(34px,3.25vw,58px)!important}

/* Count-down overlay */
.countdown-overlay{
  position:fixed;inset:0;z-index:150;display:grid;place-items:center;
  background:rgba(255,244,251,.42);backdrop-filter:blur(5px);
}
.countdown-burst{
  width:min(250px,30vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:clamp(86px,10vw,156px);font-weight:1000;color:#fff;
  background:linear-gradient(145deg,#ff96c4,#c9a9ff 52%,#91dcff);
  border:8px solid rgba(255,255,255,.96);
  box-shadow:0 14px 0 rgba(179,127,185,.33),0 28px 70px rgba(104,55,110,.26);
  text-shadow:0 5px 0 rgba(99,50,105,.18);
  animation:countPop .52s cubic-bezier(.18,.85,.26,1.22) both;
}
.countdown-burst.go-word{
  width:min(330px,38vw);aspect-ratio:1.5;border-radius:999px;
  font-size:clamp(62px,7.5vw,116px);background:linear-gradient(145deg,#8fe6c7,#59d39f);
  color:#2d6551;
}
@keyframes countPop{0%{transform:scale(.25) rotate(-7deg);opacity:0}65%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}

/* Drawing tasks: show a graph row, not only a number-table line */
.draw-task-card,.complete-task-card,.tally-task,.symbols-needed-card{width:min(900px,96%)!important}
.data-table.single-row{min-width:min(520px,76vw);margin:0 auto}
.draw-scaffold{
  display:grid;grid-template-columns:minmax(145px,28%) 1fr;min-height:72px;margin-top:12px;
  border:3px solid #ddc5e6;border-radius:18px;overflow:hidden;background:#fff;
}
.draw-scaffold-label{
  display:flex;align-items:center;justify-content:flex-end;padding:10px 14px;
  background:#f8edff;font-size:clamp(19px,1.45vw,25px);font-weight:1000;
}
.draw-scaffold-target{
  display:grid;place-items:center;margin:8px;border:3px dashed #cba9d7;border-radius:12px;
  color:#a17cab;font-size:clamp(16px,1.25vw,22px);font-weight:1000;background:#fffbfe;
}
.complete-row{
  display:grid;grid-template-columns:minmax(145px,28%) 1fr;min-height:82px;margin-top:12px;
  border:3px solid #ddc5e6;border-radius:18px;overflow:hidden;background:#fff;
}
.complete-label{
  display:flex;align-items:center;justify-content:flex-end;padding:10px 14px;
  background:#f8edff;font-size:clamp(19px,1.45vw,25px);font-weight:1000;
}
.complete-symbols{display:flex;align-items:center;gap:10px;padding:8px 14px;min-width:0}
.complete-symbols .symbol-strip{justify-content:flex-start;flex-wrap:nowrap}
.missing-zone{
  width:78px;height:62px;flex:0 0 78px;display:grid;place-items:center;border:4px dashed #c79ed4;
  border-radius:14px;background:#fffafe;color:#b07aba;font-size:38px;font-weight:1000;
}
.symbols-needed-prompt{
  margin:12px auto 0;display:flex;align-items:center;justify-content:center;gap:12px;
  min-height:62px;border:3px dashed #d5b8df;border-radius:16px;background:#fffafe;
  color:#76537d;font-size:clamp(19px,1.45vw,25px);font-weight:1000;
}

/* Scale blanks + pictorial scale answer */
.scale-blank{
  display:inline-grid;place-items:center;min-width:92px;height:44px;margin-left:5px;padding:0 10px;
  border-bottom:4px solid #806184;color:#806184;font-weight:1000;
}
.scale-blank.filled{
  border:3px solid #62cfa3;border-radius:12px;background:#e8fff5;color:#2e6a52;
}
.scale-answer-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:9px}
.scale-answer-wrap .micrograph{min-width:0;width:min(520px,100%)}
.scale-answer-wrap .graph-row{grid-template-columns:105px 1fr;min-height:47px}
.scale-answer-wrap .graph-label{font-size:clamp(15px,1.05vw,19px)!important;padding:5px 8px}
.scale-answer-wrap .graph-symbols{gap:3px;padding:4px 8px}
.scale-answer-wrap .symbol-strip{gap:3px;justify-content:flex-start}
.scale-answer-wrap .symbol-strip svg{width:31px;height:31px}
.scale-answer-wrap .key-line{font-size:clamp(15px,1.08vw,19px)!important;padding:6px 9px}

/* Graph reveal highlighting */
.graph-row.correct-row{box-shadow:inset 0 0 0 4px #61cfa1}
.graph-row.correct-row .graph-label,.graph-row.correct-row .graph-symbols{background:#e8fff4!important}
.graph-question .challenge-visual{flex:0 0 auto!important;align-items:flex-start!important;margin-top:4px}
.graph-question .micrograph{margin-top:0}
.graph-question .question-side{justify-content:flex-start}
.graph-question .instruction{margin-bottom:0}

/* Compare reveal gets more room for the graph */
.live-challenge.answer-reveal-layout.compare-reveal{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr)!important}
.compare-reveal .model-answer.shown{padding:10px 12px!important}
.compare-reveal .model-main{font-size:clamp(25px,2vw,36px)!important}
.compare-reveal .question-side .micrograph{width:100%;min-width:0}

/* Teacher may mark multiple responses correct, but only winner gets green emphasis */
.judge-btn.correct{background:#f2eaff!important;color:#674a70!important;border:2px solid #bda1ca!important;box-shadow:0 3px 0 #a98eb8!important}
.player-card.teacher-correct{outline:4px solid rgba(135,104,153,.62)!important;outline-offset:-4px!important}
.player-card.winner-correct{outline:6px solid #58c99a!important;outline-offset:-6px!important}

/* Build graph: two columns before reveal; three conceptual columns after reveal */
.build-graph-visual{width:min(1120px,98%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.build-data-panel{max-width:none!important;display:flex;flex-direction:column;justify-content:center}
.build-blank-panel{min-width:0}
.blank-graph{height:100%;min-width:0!important}
.blank-graph .graph-symbols{padding:7px 10px}
.row-draw-hint{
  width:100%;height:36px;display:grid;place-items:center;border:3px dashed #d1b2dc;border-radius:10px;
  color:#a583ae;font-size:clamp(13px,.95vw,17px);font-weight:1000;background:#fffafe;
}
.live-challenge.answer-reveal-layout.build-graph-reveal{grid-template-columns:minmax(0,2fr) minmax(0,1fr)!important;gap:12px!important}
.build-graph-reveal .question-side{padding-right:12px!important}
.build-graph-reveal .build-graph-visual{width:100%;grid-template-columns:1fr 1fr;gap:10px}
.build-graph-reveal .model-answer.shown{padding:9px 10px!important}
.model-correct-graph{width:100%}
.model-correct-graph .micrograph{min-width:0!important;width:100%}
.model-correct-graph .graph-row{grid-template-columns:72px 1fr;min-height:43px!important}
.model-correct-graph .graph-label{font-size:clamp(13px,.9vw,16px)!important;padding:4px 6px}
.model-correct-graph .graph-symbols{gap:2px!important;padding:3px 5px!important}

<script>
(() => {

const STORAGE_KEY='EduPlayLab_PictureGraphs_BattleRoyale_SugarRush_v11';
const SETUP_KEY='SgLDC_Universal_GameSetup_v1';
const groupOrder=['red','yellow','green','orange','purple','blue'];
const DEFAULT_GROUP_COLORS=['#ff8fb6','#ffe27a','#9ee6c4','#ffb97a','#c8a5ff','#8fd8ff'];
let groups={};
let setupConfig=null;
let setupDraft=null;

let selectedPlayerId=null;
let setupCheckedOnce=false;
let setupDirty=false;
let setupSavedSignature=null;
let setupUndoStack=[];
let setupRedoStack=[];
let setupHistoryApplying=false;
let activePointerDrag=null;
let suppressTouchClickUntil=0;
const shapeNames={cube:'Cube',cuboid:'Cuboid',cone:'Cone',cylinder:'Cylinder',sphere:'Sphere'};
const shapeColors={cube:'#58a6ff',cuboid:'#ff9f43',cone:'#b58cff',cylinder:'#55c98b',sphere:'#ff6f7f'};

function setupErrorSound(){
  try{if(typeof wrongSound==='function'){wrongSound();return;}if(typeof badSound==='function'){badSound();return;}}catch(e){}
}
function blankSetupDraft(){return{
  schema:'sgldc-game-setup',version:1,
  players:Array.from({length:0},()=>null),
  groups:groupOrder.map((id,i)=>({id,name:`Group ${i+1}`,color:DEFAULT_GROUP_COLORS[i],memberIds:[]}))
};}
function normalizeSetup(raw){
  if(!raw||typeof raw!=='object')return null;
  let players=[];
  if(Array.isArray(raw.players))players=raw.players.map((p,i)=>typeof p==='string'?{id:`p${String(i+1).padStart(2,'0')}`,name:p}:{id:String(p?.id||`p${String(i+1).padStart(2,'0')}`),name:String(p?.name||'')});
  let gs=Array.isArray(raw.groups)?raw.groups:[];
  const normGroups=groupOrder.map((id,i)=>{
    const g=gs[i]||{};
    const memberIds=Array.isArray(g.memberIds)?g.memberIds.map(String):Array.isArray(g.players)?g.players.map(name=>players.find(p=>p.name===name)?.id).filter(Boolean):[];
    const name=String(g.name??'').trim()||`Group ${i+1}`;
    return{id,name,color:/^#[0-9a-f]{6}$/i.test(String(g.color||''))?String(g.color):DEFAULT_GROUP_COLORS[i],memberIds};
  });
  return{schema:'sgldc-game-setup',version:1,players,groups:normGroups};
}
function playerSetupErrors(cfg){
  const names=cfg.players.map(p=>p.name.trim()).filter(Boolean),errors=[];
  if(names.length!==30)errors.push(`30 player names required (${names.length} entered)`);
  if(names.some(n=>[...n].length>12))errors.push('Player names must be 12 characters or fewer');
  return errors;
}
function groupSetupErrors(cfg){
  const errors=[];
  if(cfg.groups.some((g,i)=>[...(g.name.trim()||`Group ${i+1}`)].length>12))errors.push('Group names must be 12 characters or fewer');
  return errors;
}
function baseSetupErrors(cfg){return [...playerSetupErrors(cfg),...groupSetupErrors(cfg)];}
function groupingComplete(cfg){const ids=new Set(cfg.players.map(p=>p.id));const assigned=cfg.groups.flatMap(g=>g.memberIds);return cfg.groups.every(g=>g.memberIds.length===5)&&assigned.length===30&&new Set(assigned).size===30&&assigned.every(id=>ids.has(id));}
function setupReady(cfg){return !!cfg&&baseSetupErrors(cfg).length===0&&groupingComplete(cfg);}
function applySetup(cfg){
  groups={};
  groupOrder.forEach((id,i)=>{const g=cfg.groups[i];groups[id]={name:g.name.trim()||`Group ${i+1}`,color:g.color,players:g.memberIds.map(pid=>cfg.players.find(p=>p.id===pid)?.name).filter(Boolean)};});
}
function loadSetup(){try{const cfg=normalizeSetup(JSON.parse(localStorage.getItem(SETUP_KEY)||'null'));if(setupReady(cfg)){applySetup(cfg);return cfg;}}catch(e){}return null;}
function persistSetup(cfg){try{localStorage.setItem(SETUP_KEY,JSON.stringify(cfg));}catch(e){}}
function setupSignature(cfg){
  const n=normalizeSetup(cfg);
  if(!n)return '';
  return JSON.stringify({players:n.players.map(p=>({id:p.id,name:p.name})),groups:n.groups.map(g=>({name:g.name,color:g.color,memberIds:[...g.memberIds]}))});
}
function rosterReady(cfg=setupDraft){
  if(!cfg)return false;
  const names=cfg.players.map(p=>p.name.trim()).filter(Boolean);
  return names.length===30&&!names.some(n=>[...n].length>12)&&groupSetupErrors(cfg).length===0;
}
function recomputeSetupValidation(){setupValidated=rosterReady(setupDraft);setupCheckedOnce=setupValidated;}
function refreshSetupButtons(){
  const randomize=$('#randomizeBtn'),add=$('#addToGameBtn'),download=$('#downloadSetupBtn');
  const rosterOK=rosterReady(setupDraft);
  if(randomize)randomize.disabled=!rosterOK;
  if(download)download.disabled=!rosterOK;
  if(add)add.disabled=!!setupSavedSignature&&!setupDirty;
}
function markSetupDirty(){
  setupDirty=true;recomputeSetupValidation();refreshSetupButtons();
}
function cloneSetup(cfg){return cfg?normalizeSetup(JSON.parse(JSON.stringify(cfg))):null;}
function setupHistoryEntry(){
  if(!setupDraft)return null;
  let cfg;
  try{cfg=currentDraftFromValidatedUI();}catch(e){cfg=setupDraft;}
  return{cfg:cloneSetup(cfg),validated:!!setupValidated,checked:!!setupCheckedOnce};
}
function refreshHistoryButtons(){const u=$('#undoSetupBtn'),r=$('#redoSetupBtn');if(u)u.disabled=!setupUndoStack.length;if(r)r.disabled=!setupRedoStack.length;}
function recordSetupHistory(){
  if(setupHistoryApplying)return;
  const entry=setupHistoryEntry();if(!entry?.cfg)return;
  const sig=setupSignature(entry.cfg)+'|'+entry.validated+'|'+entry.checked;
  const last=setupUndoStack[setupUndoStack.length-1];
  const lastSig=last?setupSignature(last.cfg)+'|'+last.validated+'|'+last.checked:'';
  if(sig!==lastSig)setupUndoStack.push(entry);
  if(setupUndoStack.length>60)setupUndoStack.shift();
  setupRedoStack=[];refreshHistoryButtons();
}
function applySetupHistoryEntry(entry,label){
  if(!entry?.cfg)return;
  setupHistoryApplying=true;setupDraft=cloneSetup(entry.cfg);selectedPlayerId=null;
  setupDraft.groups.forEach((g,i)=>{const n=$(`#groupName-${i}`),c=$(`#groupColor-${i}`);if(n)n.value=g.name;if(c)c.value=g.color;});
  recomputeSetupValidation();setupDirty=setupSavedSignature!==setupSignature(setupDraft);setupHistoryApplying=false;renderSetupTagsAndGroups();refreshSetupButtons();refreshHistoryButtons();setupStatus(`<strong>${label}.</strong> Review the setup, then add the player names to the game if needed.`,'good');
}
function undoSetup(){if(!setupUndoStack.length)return;const current=setupHistoryEntry();if(current)setupRedoStack.push(current);applySetupHistoryEntry(setupUndoStack.pop(),'Undo complete');}
function redoSetup(){if(!setupRedoStack.length)return;const current=setupHistoryEntry();if(current)setupUndoStack.push(current);applySetupHistoryEntry(setupRedoStack.pop(),'Redo complete');}
function armTextHistory(el){
  if(!el)return;let captured=false;
  el.addEventListener('focus',()=>{captured=false;});
  el.addEventListener('beforeinput',()=>{if(!captured){recordSetupHistory();captured=true;}});
  el.addEventListener('blur',()=>{captured=false;});
}
function clearPointerDragVisuals(){
  document.querySelectorAll('.group-card.drag-over,.player-bank.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(activePointerDrag?.ghost)activePointerDrag.ghost.remove();
  activePointerDrag=null;
}
function pointerTargetAt(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const drop=el.closest?.('.group-drop');if(drop)return{type:'group',index:Number(drop.dataset.groupIndex)};
  const bank=el.closest?.('.player-bank');if(bank)return{type:'bank'};
  return null;
}
function positionPointerGhost(x,y){if(activePointerDrag?.ghost){activePointerDrag.ghost.style.left=x+'px';activePointerDrag.ghost.style.top=y+'px';}}
function beginPointerDrag(e,tag,player){
  if(!setupDraft||e.pointerType==='mouse'||activePointerDrag)return;
  e.preventDefault();selectedPlayerId=null;document.querySelectorAll('.player-tag').forEach(t=>t.classList.remove('selected'));
  const ghost=tag.cloneNode(true);ghost.classList.add('touch-drag-ghost');ghost.classList.remove('selected');const r=tag.getBoundingClientRect();ghost.style.width=r.width+'px';document.body.appendChild(ghost);
  activePointerDrag={pointerId:e.pointerId,playerId:player.id,ghost,startX:e.clientX,startY:e.clientY,dragged:false};positionPointerGhost(e.clientX,e.clientY);try{tag.setPointerCapture(e.pointerId);}catch(err){}
}
function movePointerDrag(e){
  if(!activePointerDrag||activePointerDrag.pointerId!==e.pointerId)return;e.preventDefault();
  if(Math.hypot(e.clientX-activePointerDrag.startX,e.clientY-activePointerDrag.startY)>7)activePointerDrag.dragged=true;
  positionPointerGhost(e.clientX,e.clientY);document.querySelectorAll('.group-card.drag-over,.player-bank.drag-over').forEach(el=>el.classList.remove('drag-over'));
  const target=pointerTargetAt(e.clientX,e.clientY);if(target?.type==='group')$(`#groupCard-${target.index}`)?.classList.add('drag-over');else if(target?.type==='bank')$('#playerTags')?.closest('.player-bank')?.classList.add('drag-over');
}
function endPointerDrag(e,player){
  if(!activePointerDrag||activePointerDrag.pointerId!==e.pointerId)return;e.preventDefault();
  const drag=activePointerDrag,target=pointerTargetAt(e.clientX,e.clientY),wasDragged=drag.dragged;clearPointerDragVisuals();suppressTouchClickUntil=Date.now()+450;
  if(wasDragged&&target?.type==='group')movePlayerToGroup(drag.playerId,target.index);else if(wasDragged&&target?.type==='bank')movePlayerToBank(drag.playerId);else if(!wasDragged)togglePlayerSelection(player);
}
function togglePlayerSelection(player){
  if(selectedPlayerId===player.id){selectedPlayerId=null;document.querySelectorAll('.player-tag').forEach(t=>t.classList.remove('selected'));return;}
  selectedPlayerId=player.id;document.querySelectorAll('.player-tag').forEach(t=>t.classList.toggle('selected',t.dataset.playerId===player.id));setupStatus(`<strong>${escapeHTML(player.name)}</strong> selected. Tap a group box to move this player.`);
}

let state=null,muted=false,audioCtx=null,phase='checkin',readyLanes=new Set(),laneLocked=[false,false,false],laneSelections=[new Set(),new Set(),new Set()],winnerLane=null;

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ensureAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function tone(freq=440,duration=.12,type='sine',volume=.08){if(muted)return;ensureAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);}
function correctSound(){tone(523,.11,'triangle',.09);setTimeout(()=>tone(659,.11,'triangle',.09),100);setTimeout(()=>tone(784,.16,'triangle',.10),200)}
function wrongSound(){tone(205,.17,'sawtooth',.055)}
function revealSound(){tone(660,.11,'triangle',.08);setTimeout(()=>tone(880,.18,'triangle',.09),130)}
function hexToRgba(hex,alpha=.5){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;}
function escapeHTML(value){return String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}

function makePlayerSchedule(){
  const base=[[0,1,2],[3,4,5],[0,3,4],[1,2,5],[0,1,3],[2,4,5],[0,2,4],[1,3,5],[0,1,5],[2,3,4]];
  const perm=shuffle(groupOrder);
  const cycle1=shuffle(base.map(t=>t.map(i=>perm[i]))),cycle2=shuffle(base.map(t=>t.map(i=>perm[i]))),rounds=[...cycle1,...cycle2];
  const pools={},cursors={};
  groupOrder.forEach(g=>{pools[g]=[...shuffle(groups[g].players),...shuffle(groups[g].players)];cursors[g]=0;});
  return rounds.map((triple,ri)=>shuffle(triple.map(g=>({groupId:g,groupName:groups[g].name,color:groups[g].color,player:pools[g][cursors[g]++]}))).map((x,lane)=>({...x,lane,round:ri+1})));
}

let setupToastTimer=null;
function setupStatus(message,type=''){
  if(!type)return;
  const el=$('#setupToast');if(!el||!message)return;
  if(setupToastTimer)clearTimeout(setupToastTimer);
  el.className=`setup-toast ${type}`;
  el.innerHTML=message;
  requestAnimationFrame(()=>el.classList.add('show'));
  setupToastTimer=setTimeout(()=>{el.classList.remove('show');setupToastTimer=null;},type==='bad'?4200:2800);

  const end=e=>{if(ps.pointerId!==e.pointerId||!ps.active)return;e.preventDefault();const stroke=ps.active;ps.active=null;ps.pointerId=null;commitPadState(lane,[...cloneStrokes(ps.history[ps.index]),stroke]);redrawPad(lane);};
  canvas.addEventListener('pointerup',end,{passive:false});canvas.addEventListener('pointercancel',end,{passive:false});
  document.querySelectorAll(`.pad-tool[data-lane="${lane}"]`).forEach(btn=>btn.onclick=()=>padTool(lane,btn.dataset.act));const sub=$(`#submit-${lane}`);if(sub){const triggerSubmit=e=>{if(e?.cancelable)e.preventDefault();e?.stopPropagation?.();submitPad(lane);};sub.addEventListener('pointerdown',triggerSubmit,{passive:false});sub.addEventListener('touchstart',triggerSubmit,{passive:false});sub.addEventListener('click',triggerSubmit);}
  if(restoreOrder!=null){ps.enabled=false;const shell=$(`#padShell-${lane}`);shell?.classList.add('pad-locked');const badge=$(`#submitBadge-${lane}`);if(badge){badge.classList.remove('hidden');badge.textContent=`${ordinal(restoreOrder)} submitted`;}if(sub){sub.disabled=true;sub.classList.add('submitted');sub.textContent='Submitted ✓';}}
  updatePadButtons(lane);
}
function commitPadState(lane,newState){const ps=padStates[lane];if(!ps)return;ps.history=ps.history.slice(0,ps.index+1);ps.history.push(cloneStrokes(newState));ps.index++;updatePadButtons(lane);}
function redrawPad(lane){const ps=padStates[lane];if(!ps?.canvas)return;const c=ps.canvas,ctx=c.getContext('2d'),rect=c.getBoundingClientRect();ctx.clearRect(0,0,rect.width,rect.height);ctx.strokeStyle='#4b2b50';ctx.lineWidth=Math.max(4,Math.min(8,rect.width*.012));ctx.lineCap='round';ctx.lineJoin='round';const strokes=[...cloneStrokes(ps.history[ps.index]||[]),...(ps.active?[ps.active]:[])];strokes.forEach(s=>{if(!s.pts?.length)return;ctx.beginPath();s.pts.forEach((p,i)=>{const x=p.x*rect.width,y=p.y*rect.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});if(s.pts.length===1){const p=s.pts[0];ctx.lineTo(p.x*rect.width+.5,p.y*rect.height+.5);}ctx.stroke();});}
function padTool(lane,act){const ps=padStates[lane];if(!ps||!ps.enabled||ps.submitted)return;if(act==='undo'&&ps.index>0){ps.index--;redrawPad(lane);}else if(act==='redo'&&ps.index<ps.history.length-1){ps.index++;redrawPad(lane);}else if(act==='clear'&&(ps.history[ps.index]||[]).length){commitPadState(lane,[]);redrawPad(lane);}updatePadButtons(lane);}
function updatePadButtons(lane){const ps=padStates[lane];if(!ps)return;const buttons=document.querySelectorAll(`.pad-tool[data-lane="${lane}"]`);buttons.forEach(b=>{if(!ps.enabled||ps.submitted)b.disabled=true;else if(b.dataset.act==='undo')b.disabled=ps.index<=0;else if(b.dataset.act==='redo')b.disabled=ps.index>=ps.history.length-1;else b.disabled=false;});const sub=$(`#submit-${lane}`);if(sub&&!ps.submitted)sub.disabled=!ps.enabled;}
function setPadEnabled(lane,enabled){const ps=padStates[lane];if(!ps)return;ps.enabled=enabled&&!ps.submitted;const shell=$(`#padShell-${lane}`);shell?.classList.toggle('pad-preview',!ps.enabled&&!ps.submitted);updatePadButtons(lane);}
function submitPad(lane){
  if(phase!=='live')return;const ps=padStates[lane];if(!ps||!ps.enabled||ps.submitted)return;ps.submitted=true;ps.enabled=false;ps.submitOrder=++submitCounter;const shell=$(`#padShell-${lane}`);shell?.classList.add('pad-locked');const badge=$(`#submitBadge-${lane}`);if(badge){badge.classList.remove('hidden');badge.textContent=`${ordinal(ps.submitOrder)} submitted`;}const sub=$(`#submit-${lane}`);if(sub){sub.disabled=true;sub.classList.add('submitted');sub.textContent='Submitted ✓';}updatePadButtons(lane);tone(560+lane*70,.12,'triangle',.07);
  const submitted=padStates.filter(x=>x?.submitted).length,b=$('#stageBtn');b.textContent=`WAITING ${submitted}/3 SUBMITTED`;
  if(submitted===3){finishOpenResponses();}
}
function finishOpenResponses(){
  if(phase!=='live')return;phase='answered';document.querySelectorAll('.player-card').forEach(c=>c.classList.remove('live'));const drawings=padStates.map(ps=>cloneStrokes(ps?.history[ps.index]||[])),submitOrders=padStates.map(ps=>ps?.submitOrder||99);state.roundCompleted=true;state.answerRevealed=false;state.lastResult={winnerLane:null,winner:null,pointAwarded:false,finalized:false,open:true,drawings,submitOrders,correctLanes:[]};saveState();const b=$('#stageBtn');b.className='stage-btn answer';b.textContent='👁 SHOW CORRECT ANSWER';b.disabled=false;correctSound();
}
function showCorrectAnswer(){
  if(phase!=='answered')return;phase='revealed';state.answerRevealed=true;saveState();revealCorrectAnswer();revealSound();const q=QUESTIONS[state.roundIndex];if(isOpenQuestion(q))showJudgeControls();const b=$('#stageBtn');b.className='stage-btn next';b.textContent='🏁 FINISH ROUND';b.disabled=false;
}
function revealCorrectAnswer(){
  const q=QUESTIONS[state.roundIndex],live=$('#liveChallenge');
  if(live){
    live.className=`live-challenge ${questionLayoutClass(q)} ${revealLayoutClass(q)}`.trim();
    live.innerHTML=challengeMarkup(q,true);
  }
  document.querySelectorAll('.answer-btn').forEach(btn=>btn.classList.remove('correct-choice'));
  if(q.type==='tap'&&state.lastResult?.winnerLane!=null){
    const winnerCard=document.querySelector(`.player-card[data-lane="${state.lastResult.winnerLane}"]`);
    winnerCard?.querySelectorAll('.answer-btn').forEach(btn=>{if(btn.dataset.answer===String(q.answer))btn.classList.add('correct-choice');});
  }
}
function showJudgeControls(){openCorrectLanes=new Set(state.lastResult?.correctLanes||[]);for(let lane=0;lane<3;lane++){const slot=$(`#judge-${lane}`);if(!slot)continue;slot.classList.remove('hidden');slot.innerHTML=`<button class="judge-btn ${openCorrectLanes.has(lane)?'correct':''}" data-lane="${lane}">${openCorrectLanes.has(lane)?'✓ Correct':'Mark correct'}</button>`;slot.querySelector('button').onclick=()=>toggleCorrectLane(lane);document.querySelector(`.player-card[data-lane="${lane}"]`)?.classList.toggle('teacher-correct',openCorrectLanes.has(lane));}}
function toggleCorrectLane(lane){if(openCorrectLanes.has(lane))openCorrectLanes.delete(lane);else openCorrectLanes.add(lane);if(state.lastResult)state.lastResult.correctLanes=[...openCorrectLanes];saveState();showJudgeControls();}
function finishRoundSequence(){
  if(phase!=='revealed')return;const q=QUESTIONS[state.roundIndex];if(isOpenQuestion(q)){if(openCorrectLanes.size===0&&!confirm('No response is marked correct. Finish this round with no winner?'))return;const r=state.lastResult,roster=state.rounds[state.roundIndex];let lane=null;if(openCorrectLanes.size){lane=[...openCorrectLanes].sort((a,b)=>(r.submitOrders[a]||99)-(r.submitOrders[b]||99))[0];r.winnerLane=lane;r.winner=roster[lane];const winnerCard=document.querySelector(`.player-card[data-lane="${lane}"]`);winnerCard?.classList.add('round-winner','winner-correct');}else{r.winnerLane=null;r.winner=null;}r.correctLanes=[...openCorrectLanes];saveState();}
  phase='postround';showWinnerOverlay();
}
function awardPointIfNeeded(){const r=state.lastResult;if(!r?.winner||r.pointAwarded)return;state.scores[r.winner.groupId]++;r.pointAwarded=true;saveState();refreshScoreboard();const card=document.querySelector(`.score-card[data-group="${r.winner.groupId}"]`);if(card){card.classList.remove('score-bump');void card.offsetWidth;card.classList.add('score-bump');}}
function showWinnerOverlay(){
  overlayTimer=null;const r=state.lastResult;if(!r)return;r.finalized=true;saveState();const b=$('#stageBtn');if(b){b.className='stage-btn waiting';b.disabled=true;b.textContent=r.winner?'ADDING POINT…':'ROUND COMPLETE';}
  if(r.winner){overlayRoot.innerHTML=`<div class="round-overlay"><div class="round-win-card"><div class="trophy-pop">🍭</div><h2>Round Winner!</h2><div class="winner-name">${escapeHTML(r.winner.player)}</div><div class="group-award" style="background:${r.winner.color}"><span>${escapeHTML(r.winner.groupName)}</span><span class="point-pop">+1 POINT</span></div></div></div>`;confetti(46);setTimeout(awardPointIfNeeded,430);}else overlayRoot.innerHTML=`<div class="round-overlay"><div class="round-win-card"><div class="trophy-pop">🍬</div><h2>Correct Answer Revealed</h2><div class="no-point">No winner this round · no point added.</div></div></div>`;
  overlayTimer=setTimeout(()=>{overlayRoot.innerHTML='';overlayTimer=null;phase='postround';const btn=$('#stageBtn');if(btn){btn.className='stage-btn next';btn.textContent=state.roundIndex===QUESTIONS.length-1?'🏁 SEE FINAL SCORES':'NEXT QUESTION →';btn.disabled=false;}},2200);
}
function restoreCompletedRound(){
  const q=QUESTIONS[state.roundIndex],r=state.lastResult;$('#preQuestion').classList.add('hidden');$('#liveChallenge').classList.remove('hidden');renderChallenge(q);
  document.querySelectorAll('.player-card').forEach((card,lane)=>{card.classList.remove('readying','checked','preview','live');card.querySelector('.ready-btn').classList.add('hidden');const zone=card.querySelector('.response-zone');zone.classList.remove('hidden');if(isOpenQuestion(q)){zone.innerHTML=drawPadHTML(q,lane,false);initPad(lane,q,false,r.drawings?.[lane]||[],r.submitOrders?.[lane]||lane+1);}else renderTapChoices(q,lane,false);if(r.winnerLane===lane)card.classList.add('round-winner');});
  if(r.open){submitCounter=Math.max(...(r.submitOrders||[0]));openCorrectLanes=new Set(r.correctLanes||[]);}
  if(state.answerRevealed){revealCorrectAnswer();if(r.open)showJudgeControls();if(r.finalized){if(r.winner&&!r.pointAwarded)awardPointIfNeeded();phase='postround';const b=$('#stageBtn');b.className='stage-btn next';b.textContent=state.roundIndex===QUESTIONS.length-1?'🏁 SEE FINAL SCORES':'NEXT QUESTION →';b.disabled=false;}else{phase='revealed';const b=$('#stageBtn');b.className='stage-btn next';b.textContent='🏁 FINISH ROUND';b.disabled=false;}}
  else{phase='answered';const b=$('#stageBtn');b.className='stage-btn answer';b.textContent='👁 SHOW CORRECT ANSWER';b.disabled=false;}
}
function refreshScoreboard(){document.querySelectorAll('.score-card .score').forEach((el,i)=>el.textContent=state.scores[groupOrder[i]]);}
function nextRound(){if(overlayTimer){clearTimeout(overlayTimer);overlayTimer=null;}overlayRoot.innerHTML='';document.querySelectorAll('.confetti').forEach(p=>p.remove());padStates.forEach(ps=>ps?.observer?.disconnect?.());state.roundIndex++;state.roundCompleted=false;state.answerRevealed=false;state.lastResult=null;if(state.roundIndex>=QUESTIONS.length){state.finished=true;saveState();renderEnd();}else{saveState();renderRound();}}

function solidTile(shape,size=58){return `<div class="solid-tile">${solidSVG(shape,size)}<span class="solid-name">${shapeNames[shape]}</span></div>`;}
function solidSVG(shape,canvas=64){
  const c=shapeColors[shape]||'#8aa';let inner='';
  if(shape==='cube')inner=`<polygon points="18,18 39,10 55,20 33,29" fill="${shade(c,1.18)}"/><polygon points="18,18 33,29 33,53 18,41" fill="${shade(c,.82)}"/><polygon points="33,29 55,20 55,43 33,53" fill="${c}"/><polyline points="18,18 39,10 55,20 55,43 33,53 18,41 18,18 33,29 55,20 M33,29 33,53" fill="none" stroke="rgba(12,26,38,.58)" stroke-width="2" stroke-linejoin="round"/>`;
  else if(shape==='cuboid')inner=`<polygon points="10,22 35,12 57,20 31,31" fill="${shade(c,1.18)}"/><polygon points="10,22 31,31 31,50 10,41" fill="${shade(c,.82)}"/><polygon points="31,31 57,20 57,39 31,50" fill="${c}"/><polyline points="10,22 35,12 57,20 57,39 31,50 10,41 10,22 31,31 57,20 M31,31 31,50" fill="none" stroke="rgba(12,26,38,.58)" stroke-width="2" stroke-linejoin="round"/>`;
  else if(shape==='cylinder')inner=`<path d="M17 16 L17 45 Q17 51 32 51 Q47 51 47 45 L47 16 Z" fill="${c}"/><ellipse cx="32" cy="16" rx="15" ry="6" fill="${shade(c,1.16)}" stroke="rgba(12,26,38,.5)" stroke-width="2"/><ellipse cx="32" cy="45" rx="15" ry="6" fill="${shade(c,.92)}" stroke="rgba(12,26,38,.55)" stroke-width="2"/><path d="M17 16 V45 M47 16 V45" fill="none" stroke="rgba(12,26,38,.55)" stroke-width="2"/>`;
  else if(shape==='cone')inner=`<path d="M32 8 L14 47 Q32 57 50 47 Z" fill="${c}"/><ellipse cx="32" cy="47" rx="18" ry="7" fill="${shade(c,.90)}" stroke="rgba(12,26,38,.55)" stroke-width="2"/><path d="M32 8 L14 47 M32 8 L50 47" fill="none" stroke="rgba(12,26,38,.55)" stroke-width="2"/>`;
  else inner=`<circle cx="32" cy="32" r="22" fill="${c}" stroke="rgba(12,26,38,.5)" stroke-width="2"/><ellipse cx="25" cy="23" rx="8" ry="5" fill="rgba(255,255,255,.34)" transform="rotate(-28 25 23)"/><path d="M15 40 Q32 50 50 38" fill="none" stroke="rgba(12,26,38,.18)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 64 64" width="${canvas}" height="${canvas}" aria-hidden="true">${inner}</svg>`;
}
function shade(hex,factor){const h=hex.replace('#',''),n=parseInt(h,16),r=Math.min(255,Math.max(0,Math.round(((n>>16)&255)*factor))),g=Math.min(255,Math.max(0,Math.round(((n>>8)&255)*factor))),b=Math.min(255,Math.max(0,Math.round((n&255)*factor)));return `#${[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}`;}

function renderEnd(){
  if(overlayTimer){clearTimeout(overlayTimer);overlayTimer=null;}overlayRoot.innerHTML='';
  if(!state)state=loadState()||freshState();const ranking=groupOrder.map(g=>({id:g,...groups[g],score:state.scores[g]||0})).sort((a,b)=>b.score-a.score),top=ranking[0].score,winners=ranking.filter(x=>x.score===top);const winnerText=winners.length===1?winners[0].name:winners.map(w=>w.name.replace(' Group','')).join(' & ')+' Groups',winnerColor=winners.length===1?winners[0].color:'linear-gradient(90deg,#ff8fbd,#91dcff,#c9a9ff)';
  app.innerHTML=`<main class="screen"><div class="topbar"><div class="brand"><div class="brand-badge">🏁</div><div><h1>Candy Battle Complete!</h1><p>20 rounds finished · every player took part twice.</p></div></div><div></div>${toolbar()}</div><section class="end-wrap"><div class="winner-panel"><div class="trophy">🍭</div><p>${winners.length===1?'Champion Group':'Joint Champions'}</p><div class="winner-chip" style="background:${winnerColor}">${escapeHTML(winnerText)}</div><h2>${top} point${top===1?'':'s'}</h2><p>Sweet picture-graph thinking!</p><button class="primary-btn" id="againBtn">⚡ New Battle</button></div><div class="ranking-panel"><h3>Final Leaderboard</h3>${ranking.map((r,i)=>`<div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-group" style="background:${r.color}">${escapeHTML(r.name)}</div><div class="rank-score">${r.score}</div></div>`).join('')}</div></section></main>`;
  bindToolbar();confetti(100);$('#againBtn').onclick=()=>{if(confirm('Start a fresh 20-round battle with a new player order?')){state=freshState();saveState();renderRound();}};
}

function confetti(count=45){const colors=['#ff8fbd','#8fe6c7','#91dcff','#ffe47f','#c9a9ff','#ffbd88'];for(let i=0;i<count;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=(2.2+Math.random()*2.1)+'s';p.style.animationDelay=(Math.random()*.45)+'s';p.style.setProperty('--drift',(-120+Math.random()*240)+'px');p.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000);}}

document.addEventListener('keydown',e=>{if(phase==='checkin'&&['1','2','3'].includes(e.key))checkInPlayer(Number(e.key)-1);if(e.key==='Enter'&&!$('#stageBtn')?.disabled)$('#stageBtn').click();});
renderIntro();
})();
</script>
