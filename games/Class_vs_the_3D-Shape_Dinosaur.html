<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Class vs the 3D-Shape Dinosaur — Shared Setup</title>
<style>
  :root{
    --bg1:#09111f;--bg2:#111d34;--panel:#17233c;--panel2:#1d2c4a;
    --text:#f7fbff;--muted:#b9c6dc;--gold:#ffd166;--good:#55e6a5;--bad:#ff6b7a;
    --shadow:0 12px 34px rgba(0,0,0,.32);
    --red:#ff7f88;--yellow:#ffe29a;--green:#bfdda8;--orange:#ffc58f;--purple:#cfa7f3;--blue:#a9c8e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}
  button{font:inherit}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
      radial-gradient(circle at 14% 15%,rgba(66,153,225,.18),transparent 30%),
      radial-gradient(circle at 86% 18%,rgba(255,209,102,.13),transparent 30%),
      linear-gradient(135deg,var(--bg1),var(--bg2));}
  #app{position:relative;width:100%;height:100%;z-index:1}
  .screen{width:100%;height:100%;padding:clamp(10px,1.2vw,20px);display:flex;flex-direction:column;gap:clamp(8px,.9vh,14px)}
  .hidden{display:none!important}
  .topbar{display:grid;grid-template-columns:minmax(280px,1fr) auto auto;align-items:center;gap:12px;min-height:48px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-badge{font-size:clamp(28px,3vw,46px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
  .brand h1{margin:0;font-size:clamp(23px,2.35vw,40px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{margin:5px 0 0;color:var(--muted);font-size:clamp(12px,1.05vw,17px)}
  .control-wrap{display:flex;justify-content:center}
  .toolbar{display:flex;gap:8px;justify-content:flex-end}
  .icon-btn,.primary-btn,.secondary-btn,.option-btn,.shape-option,.small-chip{border:0;border-radius:14px;cursor:pointer;font-weight:900;box-shadow:var(--shadow);transition:transform .12s ease,filter .12s ease,opacity .12s ease,background .12s ease,border-color .12s ease}
  .icon-btn:active,.primary-btn:active,.secondary-btn:active,.option-btn:active,.shape-option:active,.ready-btn:active{transform:scale(.97)}
  .icon-btn{width:46px;height:46px;background:#223253;color:#fff;font-size:21px}
  .primary-btn{padding:14px 24px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#1d2433;font-size:clamp(17px,1.45vw,24px)}
  .secondary-btn{padding:13px 20px;background:#2b4169;color:#fff;font-size:clamp(15px,1.2vw,20px)}
  .primary-btn.waiting{filter:grayscale(.76) brightness(.62);opacity:.66;cursor:not-allowed;box-shadow:none}
  .primary-btn.ready-to-show,.primary-btn.ready-to-go{animation:startGlow .8s ease-in-out infinite alternate}
  .primary-btn.live{background:linear-gradient(135deg,#55e6a5,#31bf7b);color:#173425}
  @keyframes startGlow{to{filter:brightness(1.16);box-shadow:0 0 24px rgba(255,209,102,.75),var(--shadow)}}


  .intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .cover-card{position:relative;width:min(1160px,100%);height:100%;background:linear-gradient(145deg,rgba(31,47,79,.96),rgba(18,30,52,.96));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,54px)}
  .cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 20%,rgba(88,166,255,.10),transparent 28%),radial-gradient(circle at 82% 18%,rgba(255,209,102,.08),transparent 24%),radial-gradient(circle at 50% 100%,rgba(85,230,165,.08),transparent 36%)}
  .cover-inner{position:relative;z-index:2;max-width:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.45);color:var(--gold);font-weight:900;font-size:clamp(12px,1.02vw,17px);letter-spacing:.04em;text-transform:uppercase}
  .cover-title{font-size:clamp(42px,5.7vw,88px);line-height:.95;margin:20px 0 14px;max-width:920px;text-shadow:0 8px 25px rgba(0,0,0,.35)}
  .cover-title em{color:var(--gold);font-style:normal}
  .cover-subtitle{font-size:clamp(18px,1.62vw,28px);color:#dbe7fb;max-width:760px;line-height:1.3;margin:0}
  .cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
  .cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:min(340px,80vw)}
  .cover-mini-steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px;position:relative;z-index:2}
  .cover-step{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#e6eefb;font-size:clamp(14px,1.15vw,19px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.16)}
  .cover-step strong{color:var(--gold)}
  .cover-arrow{font-size:clamp(18px,1.4vw,24px);color:rgba(255,209,102,.92);font-weight:1000}
  .cover-note{margin-top:18px;color:#cdd9ec;font-size:clamp(14px,1.1vw,18px);font-weight:900}
  .cover-note strong{color:#ffb4be}
  .cover-animation{position:absolute;left:0;right:0;bottom:8px;height:136px;pointer-events:none;z-index:1}
  .float-shape{position:absolute;bottom:0;opacity:.95;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));animation:coverFloat 4s ease-in-out infinite alternate}
  .float-shape svg{display:block}
  .float-shape.shape-1{left:10%;animation-duration:4.2s;transform:rotate(-8deg)}
  .float-shape.shape-2{left:25%;bottom:20px;animation-duration:3.5s;animation-delay:.4s;transform:scale(.94)}
  .float-shape.shape-3{left:43%;bottom:-2px;animation-duration:4.6s;animation-delay:.2s}
  .float-shape.shape-4{left:62%;bottom:17px;animation-duration:3.9s;animation-delay:.7s;transform:scale(.96) rotate(7deg)}
  .float-shape.shape-5{left:78%;bottom:0;animation-duration:4.4s;animation-delay:.3s;transform:rotate(-6deg)}
  .cover-dino{position:absolute;right:4%;bottom:2px;font-size:clamp(62px,6.2vw,100px);opacity:.88;filter:drop-shadow(0 10px 14px rgba(0,0,0,.28));animation:dinoBob 3s ease-in-out infinite alternate}
  .cover-shield{position:absolute;left:4%;bottom:16px;font-size:clamp(40px,4vw,66px);opacity:.88;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));animation:shieldBob 3.4s ease-in-out infinite alternate}
  @keyframes coverFloat{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-14px) scale(1.04)}}
  @keyframes dinoBob{0%{transform:translateY(0) rotate(-2deg)}100%{transform:translateY(-10px) rotate(3deg)}}
  @keyframes shieldBob{0%{transform:translateY(0)}100%{transform:translateY(-12px)}}


</style>
<link rel="stylesheet" href="../shared/game-setup.css">
</head>
<body>
<div id="app"></div>
<div id="overlayRoot"></div>
<script src="../shared/player-scheduler.js"></script>
<script src="../shared/game-setup.js"></script>
<script>
(() => {
  'use strict';

  const STORAGE_KEY='SgLDC_3DShapeDinosaur_Community_v21';
  const groupOrder=EduPlayGameSetup.GROUP_IDS;
let groups={};
let setupConfig=null;
function applySetup(cfg){groups=EduPlayGameSetup.toGroups(cfg);}
function loadSetup(){const cfg=EduPlayGameSetup.load();if(cfg)applySetup(cfg);return cfg;}
function setupReady(cfg){return EduPlayGameSetup.isReady(cfg);}
function renderSetup(){
  phase='setup';
  EduPlayGameSetup.open({
    app,
    overlayRoot,
    toolbarHTML:()=>toolbar(),
    bindToolbar,
    onBack:renderIntro,
    onApply:cfg=>{setupConfig=cfg;applySetup(cfg);},
    gameStateKey:STORAGE_KEY,
    errorSound:()=>badSound(),
    successSound:()=>goodSound()
  });
}


const shapeNames={cube:'Cube',cuboid:'Cuboid',cone:'Cone',cylinder:'Cylinder',sphere:'Sphere'};
  const shapeColors={cube:'#58a6ff',cuboid:'#ff9f43',cone:'#b58cff',cylinder:'#55c98b',sphere:'#ff6f7f'};

  const rounds=[
    {
      type:'completeGroup',
      instruction:'Complete the empty 3D-shape group.',
      sub:'Choose the solid that belongs in each group.',
      questions:[
        {label:'Solids that can roll',shown:['cone','cylinder'],answer:'sphere',options:['sphere','cube','cuboid']},
        {label:'Solids that can stack',shown:['cube','cuboid'],answer:'cylinder',options:['cylinder','cone','sphere']},
        {label:'Solids with vertices',shown:['cube','cuboid'],answer:'cone',options:['cone','cylinder','sphere']}
      ]
    },
    {
      type:'both',
      instruction:'Look at these 2 shapes. Both of them ______.',
      sub:'Choose the sentence that is true for both shapes.',
      questions:[
        {shapes:['cone','sphere'],answer:'can roll',options:['can roll','can stack','have flat faces']},
        {shapes:['cube','cuboid'],answer:'can stack',options:['can stack','can roll','have curved faces']},
        {shapes:['cube','cone'],answer:'have vertices',options:['have vertices','do not have flat faces','can roll']}
      ]
    },
    {
      type:'property',
      instruction:'Count the faces, edges or vertices.',
      sub:'In this game, a face means a flat face.',
      questions:[
        {shape:'cube',property:'edges',answer:'12',options:['8','10','12']},
        {shape:'cuboid',property:'vertices',answer:'8',options:['6','8','12']},
        {shape:'cone',property:'faces',answer:'1',options:['0','1','2']}
      ]
    },
    {
      type:'action',
      instruction:'How can each 3D shape move?',
      sub:'Choose every action that is true as one complete answer.',
      questions:[
        {shape:'sphere',answer:'roll and slide',options:['roll and slide','slide and stack','roll only']},
        {shape:'cube',answer:'slide and stack',options:['roll only','slide and stack','roll, slide and stack']},
        {shape:'cone',answer:'roll and slide',options:['stack only','slide and stack','roll and slide']}
      ]
    },
    {
      type:'completeGroup',
      instruction:'Complete the empty 3D-shape group.',
      sub:'Choose the solid that belongs in each group.',
      questions:[
        {label:'Solids with no vertices',shown:['cylinder'],answer:'sphere',options:['sphere','cone','cube']},
        {label:'Solids with 6 flat faces',shown:['cube'],answer:'cuboid',options:['cuboid','cylinder','cone']},
        {label:'Solids with a curved edge',shown:['cone'],answer:'cylinder',options:['cylinder','sphere','cube']}
      ]
    },
    {
      type:'property',
      instruction:'Count the faces, edges or vertices.',
      sub:'In this game, a face means a flat face.',
      questions:[
        {shape:'cylinder',property:'edges',answer:'2',options:['0','1','2']},
        {shape:'sphere',property:'faces',answer:'0',options:['0','1','2']},
        {shape:'cone',property:'vertices',answer:'1',options:['0','1','2']}
      ]
    },
    {
      type:'both',
      instruction:'Look at these 2 shapes. Both of them ______.',
      sub:'Choose the sentence that is true for both shapes.',
      questions:[
        {shapes:['cube','cylinder'],answer:'can slide',options:['can slide','can roll','have vertices']},
        {shapes:['cube','cuboid'],answer:'have flat faces',options:['have flat faces','do not have flat faces','have curved faces']},
        {shapes:['cylinder','sphere'],answer:'do not have vertices',options:['do not have vertices','can stack','have flat faces']}
      ]
    },
    {
      type:'action',
      instruction:'How can each 3D shape move?',
      sub:'Choose every action that is true as one complete answer.',
      questions:[
        {shape:'cylinder',answer:'roll, slide and stack',options:['roll only','roll and slide','roll, slide and stack']},
        {shape:'cuboid',answer:'slide and stack',options:['roll and slide','slide and stack','roll, slide and stack']},
        {shape:'sphere',answer:'roll and slide',options:['roll and slide','slide only','slide and stack']}
      ]
    },
    {
      type:'completeGroup',
      instruction:'Complete the empty 3D-shape group.',
      sub:'Choose the solid that belongs in each group.',
      questions:[
        {label:'Solids with flat faces',shown:['cube','cuboid','cone'],answer:'cylinder',options:['cylinder','sphere','cube']},
        {label:'Solids with exactly 6 flat faces',shown:['cuboid'],answer:'cube',options:['cube','cone','cylinder']},
        {label:'Solids with exactly 2 edges',shown:[],answer:'cylinder',options:['cylinder','cone','sphere']}
      ]
    },
    {
      type:'property',
      instruction:'Count the faces, edges or vertices.',
      sub:'Final round! In this game, a face means a flat face.',
      questions:[
        {shape:'cube',property:'faces',answer:'6',options:['4','6','8']},
        {shape:'cylinder',property:'vertices',answer:'0',options:['0','1','2']},
        {shape:'sphere',property:'edges',answer:'0',options:['0','1','2']}
      ]
    }
  ];

  let state=null, muted=false, audioCtx=null;
  let phase='checkin', readyLanes=new Set(), playerSteps=[0,0,0], playerScores=[0,0,0], playerFinished=[false,false,false], laneProcessing=[false,false,false], roundCompleting=false, countTimer=null, currentStage=0, wrongPauseLane=null, playerTimeMs=[0,0,0], stageLiveStartedAt=0, stagePausedMs=0, pauseStartedAt=0;
  const app=document.getElementById('app');
  const overlayRoot=document.getElementById('overlayRoot');
  const $=s=>document.querySelector(s);


  function startStageClock(){stageLiveStartedAt=performance.now();stagePausedMs=0;pauseStartedAt=0;}
  function pauseStageClock(){if(!pauseStartedAt)pauseStartedAt=performance.now();}
  function resumeStageClock(){if(pauseStartedAt){stagePausedMs+=performance.now()-pauseStartedAt;pauseStartedAt=0;}}
  function recordLaneTime(lane){const now=pauseStartedAt||performance.now();if(stageLiveStartedAt)playerTimeMs[lane]+=Math.max(0,now-stageLiveStartedAt-stagePausedMs);}

  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function ensureAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
  function tone(freq=440,duration=.12,type='sine',volume=.08){if(muted)return;ensureAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);}
  function goodSound(){tone(523,.11,'triangle',.08);setTimeout(()=>tone(659,.11,'triangle',.08),100);setTimeout(()=>tone(784,.16,'triangle',.09),200);}
  function badSound(){tone(220,.16,'sawtooth',.05);}
  function confetti(count=45){const colors=['#ffe08a','#65e6a8','#ff7181','#a9c8e8','#cfa7f3','#ffc58f'];for(let i=0;i<count;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=(2.2+Math.random()*2.2)+'s';p.style.animationDelay=(Math.random()*.5)+'s';p.style.setProperty('--drift',(-120+Math.random()*240)+'px');p.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),5200);}}

  function showBattleOverlay(damage=10,dinoDefeated=false){
    clearOverlay();
    overlayRoot.innerHTML=`<div class="battle-overlay"><div class="battle-card"><h2>${dinoDefeated?'Final Blow!':'Direct Hit!'}</h2><div class="battle-arena"><div class="battle-knight"><div class="battle-emoji">🤺</div><div class="battle-label">Knight</div></div><div class="battle-impact">⚔️</div><div class="battle-damage">-${damage} HP</div><div class="battle-dino"><div class="battle-emoji">🦖</div><div class="battle-label">3D-Shape Dinosaur</div></div><div class="battle-ground"></div></div><div class="battle-footer">Great work, class!</div></div></div>`;
    countTimer=setTimeout(()=>{overlayRoot.innerHTML='';countTimer=null;},2200);
  }

  function makePlayerSchedule(){return EduPlayScheduler.createBalancedTenRound(groups,{shuffleRoundOrder:false});}

  function freshState(){return {version:20,hearts:10,dinosaurHP:100,roundIndex:0,finished:false,rounds,playerSchedule:makePlayerSchedule(),playerTotals:{},playerStats:{},lastResult:null};}
  function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
  function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!s||![20].includes(s.version)||!Array.isArray(s.rounds)||!Array.isArray(s.playerSchedule))return null;s.playerTotals=s.playerTotals||{};s.playerStats=s.playerStats||{};return s;}catch(e){return null;}}

  function toolbar(){return `<div class="toolbar"><button class="icon-btn" id="muteBtn">${muted?'🔇':'🔊'}</button><button class="icon-btn" id="fullBtn">⛶</button><button class="icon-btn" id="homeBtn">⌂</button></div>`;}
  function bindToolbar(){const m=$('#muteBtn');if(m)m.onclick=()=>{muted=!muted;m.textContent=muted?'🔇':'🔊';};const f=$('#fullBtn');if(f)f.onclick=()=>{ensureAudio();if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};const h=$('#homeBtn');if(h)h.onclick=renderIntro;}

  function coverAnimationHTML(){return `<div class="cover-animation" aria-hidden="true"><div class="cover-shield">🛡️</div><div class="float-shape shape-1">${solidSVG('cube',82)}</div><div class="float-shape shape-2">${solidSVG('sphere',72)}</div><div class="float-shape shape-3">${solidSVG('cylinder',84)}</div><div class="float-shape shape-4">${solidSVG('cone',76)}</div><div class="float-shape shape-5">${solidSVG('cuboid',80)}</div><div class="cover-dino">🦖</div></div>`;}

  function introControls(){
    clearOverlay();phase='checkin';
    setupConfig=loadSetup();
    const isSetupComplete=setupReady(setupConfig);
    const saved=loadState(), canResume=isSetupComplete&&saved&&!saved.finished&&saved.roundIndex<10;
    app.innerHTML=`<main class="screen">
      <div class="topbar">
        <div class="brand"><div class="brand-badge">🦖</div><div><h1>Class vs the 3D-Shape Dinosaur</h1><p>Co-operative class quest</p></div></div>
        <div class="control-wrap"></div>
        <div class="toolbar"><button class="icon-btn" id="muteBtn">${muted?'🔇':'🔊'}</button><button class="icon-btn" id="fullBtn">⛶</button></div>
      </div>
      <section class="intro-center">
        <div class="cover-card">
          <div class="cover-inner">
            <span class="cover-chip">Co-operative Class Quest</span>
            <h2 class="cover-title">Class vs the<br><em>3D-Shape Dinosaur</em></h2>
            <p class="cover-subtitle">Work together to defeat the dinosaur.</p>
            <div class="cover-actions"><button class="secondary-btn" id="setupGameBtn">⚙ Setup Game</button><button class="primary-btn ${isSetupComplete?'':'start-disabled'}" id="newGameBtn" ${isSetupComplete?'':'disabled'}>⚔️ Start New Quest</button>${canResume?'<button class="secondary-btn" id="resumeBtn">▶ Resume Quest</button>':''}</div>
            <div class="cover-mini-steps">
              <div class="cover-step">Work <strong>together</strong></div>
              <div class="cover-arrow">→</div>
              <div class="cover-step">Answer <strong>fast</strong></div>
              <div class="cover-arrow">→</div>
              <div class="cover-step">Damage the <strong>dinosaur</strong></div>
            </div>
            <div class="cover-note">Wrong answers cost <strong>1 heart</strong>.</div>
          </div>
          ${coverAnimationHTML()}
        </div>
      </section>
    </main>`;
    $('#muteBtn').onclick=()=>{muted=!muted;$('#muteBtn').textContent=muted?'🔇':'🔊';};
    $('#fullBtn').onclick=()=>{ensureAudio();if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
    $('#setupGameBtn').onclick=()=>renderSetup();
    if(isSetupComplete) $('#newGameBtn').onclick=()=>{ensureAudio();if(saved&&!saved.finished&&!confirm('Start a new quest? The saved quest will be replaced.'))return;applySetup(setupConfig);state=freshState();saveState();renderRound();};
    if(canResume) $('#resumeBtn').onclick=()=>{ensureAudio();applySetup(setupConfig);state=saved;renderRound();};
  }
  const renderIntro=introControls;

  

function renderHearts(){const out=[];for(let i=0;i<10;i++)out.push(`<span class="heart ${i>=state.hearts?'lost':''}">❤️</span>`);return out.join('');}
  function dinosaurBar(){const pct=Math.max(0,state.dinosaurHP);return `<div class="dragon-wrap"><div class="dragon-avatar">🦖</div><div class="dragon-meta"><div class="dragon-label">3D-Shape Dinosaur</div><div class="hp-bar"><div class="hp-fill" style="width:${pct}%"></div></div><div class="hp-text">${state.dinosaurHP} / 100 HP</div></div></div>`;}

  function roundLabel(type){return ({completeGroup:'Complete the group',both:'Find the feature',property:'Count properties',action:'How solids move'})[type]||'3D-shape challenge';}

  function renderRound(){
    if(!state)state=loadState()||freshState();
    if(state.finished||state.roundIndex>=10||state.hearts<=0||state.dinosaurHP<=0){renderEnd();return;}
    clearOverlay();
    phase='checkin';readyLanes=new Set();playerSteps=[0,0,0];playerScores=[0,0,0];playerFinished=[false,false,false];laneProcessing=[false,false,false];roundCompleting=false;currentStage=0;wrongPauseLane=null;playerTimeMs=[0,0,0];stageLiveStartedAt=0;stagePausedMs=0;pauseStartedAt=0;
    const round=state.rounds[state.roundIndex], roster=state.playerSchedule[state.roundIndex];
    app.innerHTML=`<main class="screen">
      <div class="topbar">
        <div class="brand"><div class="brand-badge">🦖</div><div><h1>Class vs the 3D-Shape Dinosaur</h1></div></div>
        <div class="control-wrap"><button class="primary-btn waiting" id="stageBtn" disabled>Waiting for players…</button></div>
        ${toolbar()}
      </div>
      <section class="status-row">
        <div class="status-card"><h3>Class Hearts</h3><div class="hearts">${renderHearts()}</div></div>
        <div class="status-card" id="enemyHealthCard"><h3>Dinosaur Health</h3>${dinosaurBar()}</div>
        <div class="status-card quest-card"><h3>Quest Progress</h3><div class="round-big">${state.roundIndex+1}<span style="font-size:.45em;font-weight:900"> / 10</span></div><div class="round-small">${roundLabel(round.type)}</div></div>
      </section>
      <section class="game-main">
        <div class="arena">
          <div class="challenge-panel">
            <div class="pre-question" id="preQuestion">Get ready for the next 3D-shape challenge!</div>

  function playerCard(p,i){return `<div class="player-card readying" data-lane="${i}" data-color="${p.color}" style="background:${p.color}"><div class="player-head"><span class="player-name">${p.player}</span></div><div class="sword-tracker" id="swords-${i}">${emojiTracker('sword',0)}</div><button class="ready-btn" data-lane="${i}">Ready?</button><div class="answer-zone dimmed hidden" id="zone-${i}"></div></div>`;}
  function clearOverlay(){overlayRoot.innerHTML='';if(countTimer){clearTimeout(countTimer);countTimer=null;}}

  function checkInPlayer(lane){
    if(phase!=='checkin'||readyLanes.has(lane))return;

    const card=document.querySelector(`.player-card[data-lane="${lane}"]`),btn=card.querySelector('.ready-btn');
    btn.disabled=true;btn.textContent='Ready!👍';card.classList.remove('readying');card.classList.add('checked');applyReadyGlow(card,card.dataset.color);tone(560+lane*80,.16,'triangle',.08);
    $('#statusText').innerHTML=`<strong>${readyLanes.size} of 3</strong> players ready.`;
    if(readyLanes.size===3){const stageBtn=$('#stageBtn');stageBtn.disabled=false;stageBtn.classList.remove('waiting');stageBtn.classList.add('ready-to-show');stageBtn.textContent='📘 Show Question';$('#statusText').innerHTML='<strong>All players are ready!</strong> Teacher, tap Show Question.';tone(660,.12,'triangle',.08);setTimeout(()=>tone(880,.18,'triangle',.09),130);}

  function applyReadyGlow(card,color){card.style.boxShadow=`0 0 18px ${hexToRgba(color,.50)}, 0 0 36px ${hexToRgba(color,.25)}, var(--shadow)`;card.style.filter='brightness(1.02)';card.style.border='0';}
  function advanceStage(){

  function renderCurrentQuestionStage(round){

  }

  function buildChallengeHidden(){
    const round=state.rounds[state.roundIndex],live=$('#challengeLive');
    live.innerHTML=renderCurrentQuestionStage(round);
    for(let lane=0;lane<3;lane++)renderAnswerZone(lane,true);
  }

  function rerenderCurrentQuestion(){
    const round=state.rounds[state.roundIndex],live=$('#challengeLive');
    if(live) live.innerHTML=renderCurrentQuestionStage(round);
  }

  function renderQuestionCard(q,index,type){
    const metrics=getQuestionScale(q,type);
    let content='';
    if(type==='completeGroup'){
      content=`<div class="group-box"><div class="group-label">${q.label}</div><div class="solid-row">${q.shown.map(s=>solidTile(s,metrics.svg,true,metrics.tile,metrics.label)).join('')}<div class="blank-solid" id="blank-${index}" style="width:${metrics.blank}px;height:${metrics.blank}px">?</div></div></div>`;
    }else if(type==='both'){
      content=`<div class="pair-wrap"><div class="pair-visual"><div class="pair-shape">${solidSVG(q.shapes[0],92)}</div><div class="pair-shape">${solidSVG(q.shapes[1],92)}</div></div></div>`;
    }else{
      const sentence=type==='property'?`A ${shapeNames[q.shape].toLowerCase()} has ${blankLine()} ${unitLabel(q.property,q.answer)}.`:`A ${shapeNames[q.shape].toLowerCase()} can ${blankLine()}.`;
      content=`<div class="property-visual">${solidSVG(q.shape,metrics.propertySvg)}<div class="property-sentence">${sentence}</div></div>`;
    }
    const prompt = '';
    return `<div class="question-card ${index===currentStage?'active':''}" id="question-${index}"><div class="q-title">Question ${index+1}</div>${prompt?`<div class="q-prompt">${prompt}</div>`:''}${content}<div class="shared-answer" id="shared-answer-${index}">✓ ${escapeHTML(formatAnswer(q,type))}</div><div class="shield-tracker" id="shields-${index}">${emojiTracker('shield',0)}</div></div>`;
  }

  function showQuestion(){phase='question';$('#preQuestion').classList.add('hidden');$('#challengeLive').classList.remove('hidden');document.querySelectorAll('.answer-zone').forEach(z=>{z.classList.remove('hidden');z.classList.add('dimmed');});document.querySelectorAll('.ready-btn').forEach(b=>b.classList.add('hidden'));const btn=$('#stageBtn');btn.classList.remove('ready-to-show');btn.classList.add('ready-to-go');btn.textContent='🚀 GO!';}
  function goLive(){phase='live';const btn=$('#stageBtn');btn.disabled=true;btn.classList.remove('ready-to-go');btn.classList.add('live');btn.textContent='✅ Buzzers Live';document.querySelectorAll('.answer-zone').forEach(z=>z.classList.remove('dimmed'));document.querySelectorAll('.player-card').forEach(card=>card.classList.add('live'));enableCurrentStep();}
  function revealCurrentStage(){phase='stageReview';document.querySelectorAll('.player-card').forEach(card=>card.classList.remove('live'));refreshSharedProgress();for(let lane=0;lane<3;lane++)renderAnswerZone(lane,true);const btn=$('#stageBtn');btn.disabled=false;btn.classList.remove('live','waiting','ready-to-show');btn.classList.add('ready-to-go');btn.textContent=currentStage<2?'➡ Next Part':'🏁 Finish Round';}
  function nextSubStage(){
    if(phase!=='stageReview')return;
    if(currentStage<2){
      currentStage++;

      rerenderCurrentQuestion();
      const btn=$('#stageBtn');

  }

  function renderAnswerZone(lane,disabled){
    const zone=$(`#zone-${lane}`);if(!zone)return;
    const round=state.rounds[state.roundIndex];zone.innerHTML='';
    if(playerFinished[lane]){zone.className='answer-zone';zone.innerHTML='<div class="finished-message">✅ Complete!<br>Wait for your teammates.</div>';const card=document.querySelector(`.player-card[data-lane="${lane}"]`);if(card){card.classList.remove('live');card.classList.add('finished');}return;}

      zone.className='answer-zone';

      return;
    }
    if(phase==='stageReview' || playerSteps[lane]>currentStage){zone.innerHTML=`<div class="waiting-message">${phase==='stageReview'?'✅ Answer shown!<br>Wait for the next part.':'✅ Correct!<br>Wait for your teammates.'}</div>`;return;}
    const step=currentStage,q=round.questions[step];
    if(round.type==='completeGroup'){
      const grid=document.createElement('div');grid.className='shape-grid';
      const optionMetrics=getQuestionScale(q,round.type);shuffle(q.options).forEach(shape=>{const btn=document.createElement('button');btn.className='shape-option';if(disabled)btn.disabled=true;btn.innerHTML=`${solidSVG(shape,optionMetrics.answerSvg)}<span class="shape-option-label">${shapeNames[shape]}</span>`;btn.addEventListener('pointerdown',e=>{e.preventDefault();if(disabled)return;handleChoice(lane,shape,btn);},{passive:false});grid.appendChild(btn);});
      zone.appendChild(grid);return;
    }
    const grid=document.createElement('div');

    shuffle(q.options).forEach(answer=>{const btn=document.createElement('button');btn.className='option-btn';btn.textContent=(round.type==='both'||round.type==='action')?String(answer):capitalizeAnswer(answer);if(disabled)btn.disabled=true;btn.addEventListener('pointerdown',e=>{e.preventDefault();if(disabled)return;handleChoice(lane,answer,btn);},{passive:false});grid.appendChild(btn);});
    zone.appendChild(grid);
  }

  function enableCurrentStep(){for(let lane=0;lane<3;lane++)renderAnswerZone(lane,false);refreshSharedProgress();}
  function handleChoice(lane,selected,btn){
    if(phase!=='live'||laneProcessing[lane]||playerFinished[lane]||roundCompleting)return;
    const step=currentStage,q=state.rounds[state.roundIndex].questions[step];
    if(selected===q.answer){laneProcessing[lane]=true;playerScores[lane]++;playerSteps[lane]=Math.max(playerSteps[lane],currentStage+1);updateScores();refreshSharedProgress();flashCard(lane,'good');btn.classList.add('correct-flash');goodSound();setTimeout(()=>{laneProcessing[lane]=false;if(playerSteps.every(s=>s>currentStage))revealCurrentStage();else renderAnswerZone(lane,false);},360);}else loseHeart(lane,btn);
  }

  function loseHeart(lane,btn){
    if(phase!=='live'||laneProcessing[lane]||playerFinished[lane]||roundCompleting)return;
    laneProcessing[lane]=true;wrongPauseLane=lane;badSound();if(btn)btn.classList.add('wrong-flash');flashCard(lane,'bad');state.hearts=Math.max(0,state.hearts-1);saveState();updateHeartDisplay();
    if(state.hearts<=0){roundCompleting=true;phase='complete';setTimeout(()=>completeRound(false,true),420);return;}
    pauseStageClock();
    phase='heartPause';
    for(let i=0;i<3;i++)renderAnswerZone(i,true);
    setTimeout(()=>{for(let i=0;i<3;i++)laneProcessing[i]=false;if(btn)btn.classList.remove('wrong-flash');wrongPauseLane=null;if(!roundCompleting){resumeStageClock();phase='live';enableCurrentStep();}},5000);
  }

  function progressStatus(includeStrong=true){return '';}
  function checkAllPlayersFinished(){return;}

  function refreshSharedProgress(){
    const round=state.rounds[state.roundIndex];
    const i=currentStage;
    const completedCount=(phase==='stageReview')?3:playerSteps.filter(step=>step>i).length;
    updateShieldTracker(i,completedCount);
    const card=$(`#question-${i}`);
    if(card){
      card.classList.remove('active','done');
      if(phase==='stageReview') card.classList.add('done');
      else card.classList.add('active');
    }
    const answer=$(`#shared-answer-${i}`);
    if(answer){
      if(phase==='stageReview') answer.classList.add('revealed');

    }
    if(round.type==='completeGroup'){
      const blank=$(`#blank-${i}`);
      if(blank){
        const metrics=getQuestionScale(round.questions[i],round.type);
        if(phase==='stageReview'){
          blank.className='solid-tile';
          blank.style.width=`${metrics.tile}px`;blank.style.height=`${metrics.tile}px`;
          blank.style.setProperty('--solid-name-size',`${metrics.label}px`);
          blank.innerHTML=`${solidSVG(round.questions[i].answer,metrics.svg)}<span class="solid-name">${shapeNames[round.questions[i].answer]}</span>`;
        }else{
          blank.className='blank-solid';blank.style.width=`${metrics.blank}px`;blank.style.height=`${metrics.blank}px`;blank.textContent='?';
        }
      }

  }

    }else if(type==='both'){
      content=`<div class="pair-wrap"><div class="pair-visual"><div class="pair-shape">${solidSVG(q.shapes[0],92)}</div><div class="pair-shape">${solidSVG(q.shapes[1],92)}</div></div></div>`;
    }else{
      const sentence=type==='property'?`A ${shapeNames[q.shape].toLowerCase()} has ${blankLine()} ${unitLabel(q.property,q.answer)}.`:`A ${shapeNames[q.shape].toLowerCase()} can ${blankLine()}.`;

  function renderReviewSummary(round){

  }

  function completeRound(success,zeroHearts=false){
    phase='review';
    document.querySelectorAll('.answer-zone button').forEach(b=>b.disabled=true);document.querySelectorAll('.player-card').forEach(card=>card.classList.remove('live'));
    const roster=state.playerSchedule[state.roundIndex];roster.forEach((p,i)=>{state.playerTotals[p.player]=(state.playerTotals[p.player]||0)+playerScores[i];const stat=state.playerStats[p.player]||{correct:0,time:0};stat.correct+=playerScores[i];stat.time+=playerTimeMs[i];state.playerStats[p.player]=stat;});
    let damage=0;if(success){state.dinosaurHP=Math.max(0,state.dinosaurHP-10);damage=10;confetti(32);showBattleOverlay(damage,state.dinosaurHP<=0);}const health=$('#enemyHealthCard');if(health)health.innerHTML=`<h3>Dinosaur Health</h3>${dinosaurBar()}`;state.lastResult={success,damage,zeroHearts,playerScores:[...playerScores]};saveState();

  function showCorrectAnswers(){
    if(phase!=='review')return;
    phase='revealed';
    const round=state.rounds[state.roundIndex];
    const live=$('#challengeLive');
    live.innerHTML=renderReviewSummary(round);
    const btn=$('#stageBtn');btn.classList.remove('live','ready-to-show');btn.classList.add('ready-to-go');btn.disabled=false;
    btn.textContent=(state.dinosaurHP<=0||state.hearts<=0||state.roundIndex===9)?'🏁 See Final Result':'Next Round →';

  }

  function nextRound(){overlayRoot.innerHTML='';state.roundIndex++;if(state.dinosaurHP<=0||state.hearts<=0||state.roundIndex>=10){state.finished=true;saveState();renderEnd();}else{saveState();renderRound();}}

  function renderEnd(){
    clearOverlay();if(!state)state=loadState()||freshState();
    const saved=state,victory=saved.dinosaurHP<=0;
    const heroes=Object.entries(saved.playerStats||{}).filter(([,row])=>row&&row.correct>0).map(([name,row])=>({name,correct:row.correct,time:row.time||0,avg:(row.time||0)/row.correct})).sort((a,b)=>a.avg-b.avg||b.correct-a.correct||a.time-b.time||a.name.localeCompare(b.name));
    const outcomeTitle=victory?'The 3D-Shape Dinosaur is Defeated!':'The Dinosaur Escaped!';
    const outcomeText=victory?'The class worked together and saved the shape museum.':(saved.hearts<=0?'The class ran out of hearts.':'The quest ended before the dinosaur could be defeated.');
    const outcomeChip=victory?{text:'Victory!',bg:'linear-gradient(135deg,#65e6a8,#31bf7b)'}:{text:'Try Again',bg:'linear-gradient(135deg,#ff8a9a,#ff6b7a)'};
    app.innerHTML=`<main class="screen"><div class="topbar"><div class="brand"><div class="brand-badge">${victory?'🏆':'🦖'}</div><div><h1>${outcomeTitle}</h1><p>${outcomeText}</p></div></div><div class="control-wrap"></div>${toolbar()}</div><section class="status-row"><div class="status-card"><h3>Hearts Remaining</h3><div class="hearts">${renderHearts()}</div></div><div class="status-card"><h3>Dinosaur Health</h3>${dinosaurBar()}</div><div class="status-card quest-card"><h3>Quest Finished</h3><div class="round-big">${Math.min(saved.roundIndex,10)}<span style="font-size:.45em;font-weight:900"> / 10</span></div><div class="round-small">Rounds completed</div></div></section><section class="end-wrap"><div class="winner-panel"><div class="trophy">${victory?'🏆':'🦕'}</div><p>${victory?'Class Result':'Quest Result'}</p><div class="winner-chip" style="background:${outcomeChip.bg}">${outcomeChip.text}</div><h2>${100-saved.dinosaurHP} damage</h2><p>${outcomeText}</p><div class="overlay-actions"><button class="primary-btn" id="againBtn">⚔️ New Quest</button></div></div><div class="summary-panel"><h3>3D-Shape Heroes</h3><p style="margin:0 0 12px;color:var(--muted);font-weight:800">Fastest average correct answer time</p>${heroes.length?heroes.slice(0,12).map((row,i)=>`<div class="summary-row"><div class="summary-num">${i+1}</div><div class="summary-name" style="background:${i%2?'#cfe4ff':'#ffe6a8'}">${row.name}</div><div class="summary-score">${(row.avg/1000).toFixed(1)}s</div></div>`).join(''):'<p>No correct answers recorded yet.</p>'}</div></section></main>`;
    bindToolbar();if(victory)confetti(90);$('#againBtn').onclick=()=>{if(confirm('Start a fresh quest?')){state=freshState();saveState();renderRound();}};
  }

  function emojiTracker(type,count){const icon=type==='sword'?'⚔️':'🛡️';return [0,1,2].map(i=>`<span class="${type} ${i<count?'lit':''}">${icon}</span>`).join('');}
  function updateScores(){playerScores.forEach((n,i)=>{const el=$(`#swords-${i}`);if(el)el.innerHTML=emojiTracker('sword',n);});}
  function updateShieldTracker(index,count){const el=$(`#shields-${index}`);if(el)el.innerHTML=emojiTracker('shield',count);}
  function updateHeartDisplay(){const box=document.querySelector('.hearts');if(box)box.innerHTML=renderHearts();}
  function flashCard(lane,kind){const card=document.querySelector(`.player-card[data-lane="${lane}"]`);if(!card)return;const cls=kind==='good'?'correct-hero':'wrong-hit';card.classList.add(cls);setTimeout(()=>card.classList.remove(cls),kind==='good'?420:620);}

  function capitalizeAnswer(s){return String(s).charAt(0).toUpperCase()+String(s).slice(1);}
  function formatAnswer(q,type){if(type==='completeGroup')return shapeNames[q.answer];if(type==='property')return `${q.answer} ${unitLabel(q.property,q.answer)}`;if(type==='action')return q.answer;if(type==='both')return q.answer;return capitalizeAnswer(q.answer);}
  function escapeHTML(value){return String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
  function hexToRgba(hex,alpha){const h=hex.replace('#',''),val=h.length===3?h.split('').map(c=>c+c).join(''):h,num=parseInt(val,16),r=(num>>16)&255,g=(num>>8)&255,b=num&255;return `rgba(${r},${g},${b},${alpha})`;}

  function blankLine(cls=''){return `<span class="blank-line ${cls}"></span>`;}
  function unitLabel(prop,answer){
    const one=String(answer)==='1';

  }
  function renderInstructionText(text){return escapeHTML(String(text)).replace(/_{4,}/g,'<span class="blank-line lg"></span>');}
  function getShapeScale(count=1){
    if(count>=8)return {tile:48,svg:34,label:8.2,answerSvg:58,blank:48,propertySvg:74};

  }

  function getQuestionScale(q,type){if(type==='completeGroup')return getShapeScale((q.shown?.length||0)+1);if(type==='both')return getShapeScale(q.shapes?.length||2);return getShapeScale(1);}
  function solidTile(shape,size=33,showName=true,tileSize=48,labelSize=7){return `<div class="solid-tile" style="width:${tileSize}px;height:${tileSize}px;--solid-name-size:${labelSize}px">${solidSVG(shape,size)}${showName?`<span class="solid-name">${shapeNames[shape]}</span>`:''}</div>`;}

  function solidSVG(shape,canvas=58){
    const c=shapeColors[shape]||'#8aa';
    let inner='';
    if(shape==='cube'){
      inner=`<polygon points="18,18 39,10 55,20 33,29" fill="${shade(c,1.18)}"/><polygon points="18,18 33,29 33,53 18,41" fill="${shade(c,.82)}"/><polygon points="33,29 55,20 55,43 33,53" fill="${c}"/><polyline points="18,18 39,10 55,20 55,43 33,53 18,41 18,18 33,29 55,20 M33,29 33,53" fill="none" stroke="rgba(12,26,38,.58)" stroke-width="2" stroke-linejoin="round"/>`;
    }else if(shape==='cuboid'){
      inner=`<polygon points="10,22 35,12 57,20 31,31" fill="${shade(c,1.18)}"/><polygon points="10,22 31,31 31,50 10,41" fill="${shade(c,.82)}"/><polygon points="31,31 57,20 57,39 31,50" fill="${c}"/><polyline points="10,22 35,12 57,20 57,39 31,50 10,41 10,22 31,31 57,20 M31,31 31,50" fill="none" stroke="rgba(12,26,38,.58)" stroke-width="2" stroke-linejoin="round"/>`;
    }else if(shape==='cylinder'){
      inner=`<path d="M17 16 L17 45 Q17 51 32 51 Q47 51 47 45 L47 16 Z" fill="${c}"/><ellipse cx="32" cy="16" rx="15" ry="6" fill="${shade(c,1.16)}" stroke="rgba(12,26,38,.5)" stroke-width="2"/><ellipse cx="32" cy="45" rx="15" ry="6" fill="${shade(c,.92)}" stroke="rgba(12,26,38,.55)" stroke-width="2"/><path d="M17 16 V45 M47 16 V45" fill="none" stroke="rgba(12,26,38,.55)" stroke-width="2"/>`;
    }else if(shape==='cone'){
      inner=`<path d="M32 8 L14 47 Q32 57 50 47 Z" fill="${c}"/><ellipse cx="32" cy="47" rx="18" ry="7" fill="${shade(c,.90)}" stroke="rgba(12,26,38,.55)" stroke-width="2"/><path d="M32 8 L14 47 M32 8 L50 47" fill="none" stroke="rgba(12,26,38,.55)" stroke-width="2"/>`;
    }else{
      inner=`<circle cx="32" cy="32" r="22" fill="${c}" stroke="rgba(12,26,38,.5)" stroke-width="2"/><ellipse cx="25" cy="23" rx="8" ry="5" fill="rgba(255,255,255,.34)" transform="rotate(-28 25 23)"/><path d="M15 40 Q32 50 50 38" fill="none" stroke="rgba(12,26,38,.18)" stroke-width="2"/>`;

    return `<svg viewBox="0 0 64 64" width="${canvas}" height="${canvas}" aria-hidden="true">${inner}</svg>`;
  }

  function shade(hex,factor){const h=hex.replace('#',''),n=parseInt(h,16),r=Math.min(255,Math.max(0,Math.round(((n>>16)&255)*factor))),g=Math.min(255,Math.max(0,Math.round(((n>>8)&255)*factor))),b=Math.min(255,Math.max(0,Math.round((n&255)*factor)));return `#${[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}`;}


  let actionSelections=[[],[],[]];
  const ACTION_OPTIONS=['roll','slide','stack'];
  function parseActionAnswer(answer){return String(answer).toLowerCase().split(/\s*(?:,|\band\b)\s*/).map(s=>s.trim()).filter(Boolean);}
  function normalizeActions(arr){return [...new Set((arr||[]).map(s=>String(s).toLowerCase().trim()).filter(Boolean))].sort();}
  function sameActions(a,b){const aa=normalizeActions(a),bb=normalizeActions(b);return aa.length===bb.length && aa.every((v,i)=>v===bb[i]);}
  function joinActions(arr){const a=normalizeActions(arr);if(a.length<=1)return a[0]||'';if(a.length===2)return `${a[0]} and ${a[1]}`;return `${a[0]}, ${a[1]} and ${a[2]}`;}
  function fillAnswer(text){return `<span class="filled-answer">${escapeHTML(String(text))}</span>`;}
  function sentenceForQuestion(q,type,filled=false){
    if(type==='both') return `Both of them ${filled?fillAnswer(q.answer):blankLine('lg')}.`;
    if(type==='property') return `A ${shapeNames[q.shape].toLowerCase()} has ${filled?fillAnswer(q.answer):blankLine()} ${unitLabel(q.property,q.answer)}.`;
    if(type==='action') return `A ${shapeNames[q.shape].toLowerCase()} can ${filled?fillAnswer(joinActions(parseActionAnswer(q.answer))):blankLine('lg')}.`;
    return '';
  }
  function successForLane(lane,btn){laneProcessing[lane]=true;recordLaneTime(lane);playerScores[lane]++;playerSteps[lane]=Math.max(playerSteps[lane],currentStage+1);updateScores();refreshSharedProgress();flashCard(lane,'good');if(btn)btn.classList.add('correct-flash');goodSound();setTimeout(()=>{laneProcessing[lane]=false;if(playerSteps.every(s=>s>currentStage))revealCurrentStage();else renderAnswerZone(lane,false);},360);}

  const _renderRound = renderRound;
  renderRound = function(){actionSelections=[[],[],[]]; return _renderRound();}

  revealCurrentStage = function(){phase='stageReview';document.querySelectorAll('.player-card').forEach(card=>card.classList.remove('live'));rerenderCurrentQuestion();refreshSharedProgress();for(let lane=0;lane<3;lane++)renderAnswerZone(lane,true);const btn=$('#stageBtn');btn.disabled=false;btn.classList.remove('live','waiting','ready-to-show');btn.classList.add('ready-to-go');btn.textContent=currentStage<2?'➡ Next Part':'🏁 Finish Round';};

  goLive = function(){phase='live';actionSelections=[[],[],[]];startStageClock();const btn=$('#stageBtn');btn.disabled=true;btn.classList.remove('ready-to-go');btn.classList.add('live');btn.textContent='✅ Buzzers Live';document.querySelectorAll('.answer-zone').forEach(z=>z.classList.remove('dimmed'));document.querySelectorAll('.player-card').forEach(card=>card.classList.add('live'));enableCurrentStep();};

  nextSubStage = function(){
    if(phase!=='stageReview')return;
    if(currentStage<2){currentStage++;phase='live';actionSelections=[[],[],[]];rerenderCurrentQuestion();startStageClock();const btn=$('#stageBtn');btn.disabled=true;btn.classList.remove('ready-to-go');btn.classList.add('live');btn.textContent='✅ Buzzers Live';document.querySelectorAll('.player-card').forEach(card=>card.classList.add('live'));enableCurrentStep();}
    else{playerFinished=[true,true,true];roundCompleting=true;completeRound(true);} };

  renderQuestionCard = function(q,index,type){
    const metrics=getQuestionScale(q,type); let content=''; const filled=(phase==='stageReview');
    if(type==='completeGroup'){
      content=`<div class="group-box"><div class="group-label">${q.label}</div><div class="solid-row">${q.shown.map(s=>solidTile(s,metrics.svg,true,metrics.tile,metrics.label)).join('')}<div class="blank-solid" id="blank-${index}" style="width:${metrics.blank}px;height:${metrics.blank}px">?</div></div></div>`;
    }else if(type==='both'){
      content=`<div class="pair-wrap"><div class="pair-visual"><div class="pair-shape">${solidSVG(q.shapes[0],92)}</div><div class="pair-shape">${solidSVG(q.shapes[1],92)}</div></div><div class="pair-sentence">${sentenceForQuestion(q,type,filled)}</div></div>`;
    }else{
      content=`<div class="property-visual">${solidSVG(q.shape,metrics.propertySvg)}<div class="property-sentence">${sentenceForQuestion(q,type,filled)}</div></div>`;
    }
    return `<div class="question-card ${index===currentStage?'active':''}" id="question-${index}"><div class="q-title">Question ${index+1}</div>${content}<div class="shared-answer hidden-answer" id="shared-answer-${index}"></div><div class="shield-tracker" id="shields-${index}">${emojiTracker('shield',0)}</div></div>`;
  };

  renderReviewCard = function(q,index,type){
    const metrics=getQuestionScale(q,type); let content='';
    if(type==='completeGroup'){
      content=`<div class="group-box"><div class="group-label">${q.label}</div><div class="solid-row">${q.shown.map(s=>solidTile(s,metrics.svg,true,metrics.tile,metrics.label)).join('')}<div class="solid-tile correct-tile" style="width:${metrics.tile}px;height:${metrics.tile}px;--solid-name-size:${metrics.label}px">${solidSVG(q.answer,metrics.svg)}<span class="solid-name">${shapeNames[q.answer]}</span></div></div></div>`;
    }else if(type==='both'){
      content=`<div class="pair-wrap"><div class="pair-visual"><div class="pair-shape">${solidSVG(q.shapes[0],92)}</div><div class="pair-shape">${solidSVG(q.shapes[1],92)}</div></div><div class="pair-sentence">${sentenceForQuestion(q,type,true)}</div></div>`;
    }else{
      content=`<div class="property-visual">${solidSVG(q.shape,metrics.propertySvg)}<div class="property-sentence">${sentenceForQuestion(q,type,true)}</div></div>`;
    }
    return `<div class="question-card reviewed done"><div class="q-title">Question ${index+1}</div>${content}<div class="shared-answer hidden-answer"></div><div class="shield-tracker">${emojiTracker('shield',3)}</div></div>`;
  };

  renderAnswerZone = function(lane,disabled){
    const zone=$(`#zone-${lane}`); if(!zone) return; const round=state.rounds[state.roundIndex]; zone.innerHTML='';
    if(playerFinished[lane]){zone.className='answer-zone';zone.innerHTML='<div class="finished-message">✅ Complete!<br>Wait for your teammates.</div>';const card=document.querySelector(`.player-card[data-lane="${lane}"]`);if(card){card.classList.remove('live');card.classList.add('finished');}return;}
    zone.className=`answer-zone ${disabled?'dimmed':''}`;
    if(phase==='heartPause'){zone.className='answer-zone'; if(lane===wrongPauseLane){zone.innerHTML='<div class="heart-loss-message">Your wrong answer has caused the class to lose a heart.<br>Discuss with your teammates.</div>';} else {zone.innerHTML='<div class="waiting-message">⏸ Pause.<br>Discuss with your teammates.</div>';} return;}
    if(phase==='stageReview' || playerSteps[lane]>currentStage){zone.innerHTML=`<div class="waiting-message">${phase==='stageReview'?'✅ Answer shown!<br>Wait for the next part.':'✅ Correct!<br>Wait for your teammates.'}</div>`;return;}
    const step=currentStage,q=round.questions[step];
    if(round.type==='completeGroup'){
      const grid=document.createElement('div'); grid.className='shape-grid'; const optionMetrics=getQuestionScale(q,round.type);
      shuffle(q.options).forEach(shape=>{const btn=document.createElement('button');btn.className='shape-option'; if(disabled)btn.disabled=true; btn.innerHTML=`${solidSVG(shape,optionMetrics.answerSvg)}<span class="shape-option-label">${shapeNames[shape]}</span>`; btn.addEventListener('pointerdown',e=>{e.preventDefault();if(disabled)return;handleChoice(lane,shape,btn);},{passive:false}); grid.appendChild(btn);}); zone.appendChild(grid); return;
    }
    if(round.type==='action'){
      const grid=document.createElement('div'); grid.className='action-grid'; const selected=actionSelections[lane]||[];
      ACTION_OPTIONS.forEach(action=>{const btn=document.createElement('button'); btn.className=`option-btn action-choice ${selected.includes(action)?'selected':''}`.trim(); btn.textContent=action; if(disabled)btn.disabled=true; btn.addEventListener('pointerdown',e=>{e.preventDefault(); if(disabled)return; const curr=new Set(actionSelections[lane]||[]); curr.has(action)?curr.delete(action):curr.add(action); actionSelections[lane]=[...curr]; renderAnswerZone(lane,false); },{passive:false}); grid.appendChild(btn);});
      const submit=document.createElement('button'); submit.className='option-btn action-submit'; submit.textContent='submit'; submit.disabled=disabled || !(selected.length); submit.addEventListener('pointerdown',e=>{e.preventDefault(); if(submit.disabled)return; const expected=parseActionAnswer(q.answer); if(sameActions(actionSelections[lane],expected)){successForLane(lane,submit);} else {loseHeart(lane,submit);} },{passive:false});
      grid.appendChild(submit); zone.appendChild(grid); return;
    }
    const grid=document.createElement('div'); grid.className=`option-grid ${round.type==='property'?'numeric':round.type==='both'?'both-options':'long'}`;
    shuffle(q.options).forEach(answer=>{const btn=document.createElement('button');btn.className='option-btn';btn.textContent=(round.type==='both')?String(answer):capitalizeAnswer(answer); if(disabled)btn.disabled=true; btn.addEventListener('pointerdown',e=>{e.preventDefault();if(disabled)return;handleChoice(lane,answer,btn);},{passive:false});grid.appendChild(btn);}); zone.appendChild(grid);
  };

  handleChoice = function(lane,selected,btn){ if(phase!=='live'||laneProcessing[lane]||playerFinished[lane]||roundCompleting)return; const q=state.rounds[state.roundIndex].questions[currentStage]; if(selected===q.answer){successForLane(lane,btn);} else loseHeart(lane,btn); };

  refreshSharedProgress = function(){
    const round=state.rounds[state.roundIndex], i=currentStage; const completedCount=(phase==='stageReview')?3:playerSteps.filter(step=>step>i).length; updateShieldTracker(i,completedCount);
    const card=$(`#question-${i}`); if(card){card.classList.remove('active','done'); if(phase==='stageReview') card.classList.add('done'); else card.classList.add('active');}
    const answer=$(`#shared-answer-${i}`); if(answer){answer.classList.remove('revealed');}
    if(round.type==='completeGroup'){
      const blank=$(`#blank-${i}`); if(blank){ const metrics=getQuestionScale(round.questions[i],round.type); if(phase==='stageReview'){ blank.className='solid-tile correct-tile'; blank.style.width=`${metrics.tile}px`; blank.style.height=`${metrics.tile}px`; blank.style.setProperty('--solid-name-size',`${metrics.label}px`); blank.innerHTML=`${solidSVG(round.questions[i].answer,metrics.svg)}<span class="solid-name">${shapeNames[round.questions[i].answer]}</span>`; } else { blank.className='blank-solid'; blank.style.width=`${metrics.blank}px`; blank.style.height=`${metrics.blank}px`; blank.textContent='?'; } }
    }
  };

  formatAnswer = function(q,type){if(type==='completeGroup')return shapeNames[q.answer]; if(type==='property')return `${q.answer} ${unitLabel(q.property,q.answer)}`; if(type==='action')return joinActions(parseActionAnswer(q.answer)); if(type==='both')return q.answer; return capitalizeAnswer(q.answer);};


  /* v11 behavior cleanup */
  buildChallengeHidden = function(){
    const round=state.rounds[state.roundIndex], live=$('#challengeLive');
    live.innerHTML=renderCurrentQuestionStage(round);
    for(let lane=0;lane<3;lane++){
      const zone=$(`#zone-${lane}`);
      if(zone){zone.innerHTML='';zone.className='answer-zone hidden';}
    }
  };

  showQuestion = function(){
    phase='question';
    $('#preQuestion').classList.add('hidden');
    $('#challengeLive').classList.remove('hidden');
    document.querySelectorAll('.ready-btn').forEach(b=>b.classList.add('hidden'));
    for(let lane=0;lane<3;lane++) renderAnswerZone(lane,true);
    const btn=$('#stageBtn');
    btn.classList.remove('ready-to-show');btn.classList.add('ready-to-go');btn.textContent='🚀 GO!';
  };

  sentenceForQuestion = function(q,type,filled=false){
    if(type==='both') return `Both of them ${filled?fillAnswer(q.answer):blankLine('lg')}.`;
    if(type==='property') return `A ${shapeNames[q.shape].toLowerCase()} has ${filled?fillAnswer(q.answer):blankLine()} ${unitLabel(q.property,q.answer)}.`;
    if(type==='action') return `A ${shapeNames[q.shape].toLowerCase()} can ${filled?fillAnswer(q.answer):blankLine('lg')}.`;
    return '';
  };

  renderQuestionCard = function(q,index,type){
    const metrics=getQuestionScale(q,type); let content=''; const filled=(phase==='stageReview');
    if(type==='completeGroup'){
      content=`<div class="group-box"><div class="group-label">${q.label}</div><div class="solid-row">${q.shown.map(s=>solidTile(s,metrics.svg,true,metrics.tile,metrics.label)).join('')}<div class="blank-solid" id="blank-${index}" style="width:${metrics.blank}px;height:${metrics.blank}px">?</div></div></div>`;
    }else if(type==='both'){
      content=`<div class="pair-wrap"><div class="pair-visual"><div class="pair-shape">${solidSVG(q.shapes[0],92)}</div><div class="pair-shape">${solidSVG(q.shapes[1],92)}</div></div><div class="pair-sentence">${sentenceForQuestion(q,type,filled)}</div></div>`;
    }else{
      content=`<div class="property-visual">${solidSVG(q.shape,metrics.propertySvg)}<div class="property-sentence">${sentenceForQuestion(q,type,filled)}</div></div>`;
    }
    return `<div class="question-card ${index===currentStage?'active':''}" id="question-${index}"><div class="q-title">Question ${index+1}</div>${content}<div class="shield-tracker" id="shields-${index}">${emojiTracker('shield',0)}</div></div>`;
  };

  renderReviewCard = function(q,index,type){
    const metrics=getQuestionScale(q,type); let content='';
    if(type==='completeGroup'){
      content=`<div class="group-box"><div class="group-label">${q.label}</div><div class="solid-row">${q.shown.map(s=>solidTile(s,metrics.svg,true,metrics.tile,metrics.label)).join('')}<div class="solid-tile correct-tile" style="width:${metrics.tile}px;height:${metrics.tile}px;--solid-name-size:${metrics.label}px">${solidSVG(q.answer,metrics.svg)}<span class="solid-name">${shapeNames[q.answer]}</span></div></div></div>`;
    }else if(type==='both'){
      content=`<div class="pair-wrap"><div class="pair-visual"><div class="pair-shape">${solidSVG(q.shapes[0],92)}</div><div class="pair-shape">${solidSVG(q.shapes[1],92)}</div></div><div class="pair-sentence">${sentenceForQuestion(q,type,true)}</div></div>`;
    }else{
      content=`<div class="property-visual">${solidSVG(q.shape,metrics.propertySvg)}<div class="property-sentence">${sentenceForQuestion(q,type,true)}</div></div>`;
    }
    const cardClass=(type==='completeGroup' && ((q.shown?.length||0)+1)>=4)?'question-card reviewed done compact-group':'question-card reviewed done';
    return `<div class="${cardClass}"><div class="q-title">Question ${index+1}</div>${content}<div class="shield-tracker">${emojiTracker('shield',3)}</div></div>`;
  };

  document.addEventListener('keydown',e=>{if(phase==='checkin'&&['1','2','3'].includes(e.key))checkInPlayer(Number(e.key)-1);if(e.key.toLowerCase()==='g'&&phase==='question')goLive();if(e.key.toLowerCase()==='s'&&phase==='checkin'&&readyLanes.size===3)showQuestion();if(e.key.toLowerCase()==='r'&&phase==='review')showCorrectAnswers();if(e.key.toLowerCase()==='n'&&(phase==='stageReview'||phase==='revealed'))advanceStage();});
  renderIntro();
})();
</script>
