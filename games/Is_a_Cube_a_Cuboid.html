<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f3f5fb" />
  <title>Is a Cube a Cuboid?</title>
  <style>
    :root {
      --bg: #eef2f8;
      --panel: #ffffff;
      --navy: #23375f;
      --ink: #344865;
      --muted: #6d7d96;
      --line: #d9e1ed;
      --lilac: #ece7ff;
      --lilac-strong: #7c62d6;
      --cube: #ee8a36;
      --cuboid: #4d86d6;
      --selected: #ffe16b;
      --selected-deep: #f0b918;
      --shadow: 0 10px 26px rgba(35, 55, 95, 0.11);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        linear-gradient(90deg, rgba(68, 91, 130, .045) 1px, transparent 1px) 0 0 / 34px 34px,
        linear-gradient(rgba(68, 91, 130, .045) 1px, transparent 1px) 0 0 / 34px 34px,
        var(--bg);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Avenir, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    button { font: inherit; touch-action: manipulation; }

    .app {
      width: 100%;
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto minmax(420px, 1fr) auto;
      gap: 12px;
    }

    .header {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "title controls"
        "prompt controls"
        "tabs tabs";
      gap: 8px 16px;
      align-items: center;
    }

    .title-wrap { grid-area: title; min-width: 0; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--lilac);
      color: var(--lilac-strong);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(27px, 3vw, 42px);
      line-height: 1.04;
    }

    .prompt {
      grid-area: prompt;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--ink);
      font-size: clamp(15px, 1.6vw, 20px);
      font-weight: 750;
    }

    .prompt-number {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--lilac-strong);
      color: white;
      font-weight: 950;
    }

    .controls {
      grid-area: controls;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-btn {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: var(--navy);
      padding: 0 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .control-btn.primary {
      background: var(--navy);
      border-color: transparent;
      color: white;
    }

    .control-btn:disabled { opacity: .45; cursor: default; }

    .tabs {
      grid-area: tabs;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 4px;
    }

    .tab {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f9fbff;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
    }

    .tab.active {
      background: var(--lilac);
      border-color: transparent;
      color: var(--lilac-strong);
      box-shadow: inset 0 0 0 2px rgba(124, 98, 214, .14);
    }

    .main-area {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .solid-panel {
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .solid-heading {
      padding: 13px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .solid-name {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--navy);
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 950;
    }

    .solid-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--solid-color);
    }

    .live-count {
      min-width: 90px;
      padding: 8px 12px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--solid-color), white 84%);
      color: var(--navy);
      text-align: center;
      font-size: 14px;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .solid-stage {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      perspective: 900px;
      overflow: hidden;
      touch-action: none;
      background:
        radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--solid-color), white 88%), transparent 38%),
        linear-gradient(180deg, #ffffff 0%, #f8faff 100%);
    }

    .solid-stage::after {
      content: "Drag to rotate • Tap the highlighted feature";
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      pointer-events: none;
    }

    .floor-shadow {
      position: absolute;
      left: 50%;
      top: 66%;
      width: min(42%, 230px);
      height: 36px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(35,55,95,.19), rgba(35,55,95,0) 70%);
      filter: blur(5px);
      pointer-events: none;
    }

    .float-wrap {
      position: relative;
      width: min(68%, 330px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      animation: float 3.2s ease-in-out infinite;
      transform-style: preserve-3d;
    }

    @keyframes float {
      0%, 100% { transform: translateY(-5px); }
      50% { transform: translateY(8px); }
    }

    .solid-object {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .feature {
      position: absolute;
      left: 50%;
      top: 50%;
      margin: 0;
      padding: 0;
      border: 0;
      outline-offset: 4px;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .face {
      display: grid;
      place-items: center;
      border: 3px solid rgba(35,55,95,.52);
      background:
        linear-gradient(145deg, rgba(255,255,255,.52), rgba(255,255,255,.04) 48%),
        color-mix(in srgb, var(--solid-color), white 14%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
      backface-visibility: hidden;
      opacity: .94;
    }

    .face::after {
      content: "";
      width: 42%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
    }

    .edge {
      border-radius: 999px;
      background: rgba(35,55,95,.73);
      box-shadow: 0 0 0 2px rgba(255,255,255,.28);
    }

    .vertex {
      border-radius: 50%;
      background: rgba(35,55,95,.86);
      box-shadow: 0 0 0 3px rgba(255,255,255,.62), 0 3px 8px rgba(35,55,95,.25);
    }

    .feature:not(.active-feature) {
      pointer-events: none;
    }

    .face:not(.active-feature) { opacity: .62; }
    .edge:not(.active-feature) { opacity: .35; }
    .vertex:not(.active-feature) { opacity: .30; }

    .feature.selected {
      background: var(--selected) !important;
      border-color: var(--selected-deep) !important;
      box-shadow: 0 0 0 3px rgba(255,255,255,.82), 0 0 18px rgba(240,185,24,.72) !important;
    }

    .face.selected { opacity: .98; }

    .counters-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .counter {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f9fbff;
      padding: 10px 8px;
      text-align: center;
      transition: .18s ease;
    }

    .counter.active {
      background: color-mix(in srgb, var(--counter-color), white 85%);
      border-color: color-mix(in srgb, var(--counter-color), white 45%);
      transform: translateY(-2px);
    }

    .counter-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .counter-value {
      display: block;
      margin-top: 4px;
      color: var(--navy);
      font-size: clamp(20px, 2.3vw, 32px);
      line-height: 1;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .comparison-message {
      grid-column: 1 / -1;
      display: none;
      margin-top: 2px;
      border-radius: 15px;
      background: var(--lilac);
      color: var(--navy);
      padding: 10px 12px;
      text-align: center;
      font-weight: 900;
    }

    .comparison-message.show { display: block; }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 20;
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      animation: confetti-fall 1.4s ease-in forwards;
    }

    @keyframes confetti-fall {
      to { transform: translate3d(var(--drift), 110vh, 0) rotate(720deg); opacity: .2; }
    }

    @media (max-width: 900px) {
      .app { grid-template-rows: auto minmax(350px, 1fr) auto; }
      .header {
        grid-template-columns: 1fr;
        grid-template-areas:
          "title"
          "prompt"
          "controls"
          "tabs";
      }
      .controls { justify-content: flex-start; }
      .counter-label { font-size: 11px; }
    }

    @media (orientation: portrait) {
      .app { grid-template-rows: auto auto auto; }
      .main-area { grid-template-columns: 1fr; }
      .solid-panel { min-height: 400px; }
      .counters-wrap { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .app { padding-left: 10px; padding-right: 10px; }
      .header, .solid-panel, .counters-wrap { border-radius: 18px; }
      .tabs { gap: 5px; }
      .tab { padding: 0 6px; }
      .controls { display: grid; grid-template-columns: repeat(3, 1fr); }
      .control-btn { padding: 0 8px; }
      .solid-panel { min-height: 340px; }
      .solid-stage::after { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title-wrap">
        <div class="eyebrow">The Great Shapes Carnival</div>
        <h1>Is a cube a cuboid?</h1>
      </div>

      <div id="prompt" class="prompt" aria-live="polite">
        <span id="promptNumber" class="prompt-number">1</span>
        <span id="promptText">Tap all 6 faces. Drag either solid to rotate it.</span>
      </div>

      <div class="controls">
        <button id="pauseBtn" class="control-btn" type="button">Pause rotation</button>
        <button id="resetPageBtn" class="control-btn" type="button">Reset page</button>
        <button id="nextBtn" class="control-btn primary" type="button">Next: Edges</button>
      </div>

      <nav class="tabs" aria-label="Feature pages">
        <button class="tab active" data-page="0" type="button">1. Faces</button>
        <button class="tab" data-page="1" type="button">2. Edges</button>
        <button class="tab" data-page="2" type="button">3. Vertices</button>
      </nav>
    </header>

    <main class="main-area">
      <section class="solid-panel" style="--solid-color: var(--cube);">
        <div class="solid-heading">
          <div class="solid-name"><span class="solid-dot"></span>Cube</div>
          <div id="cubeLiveCount" class="live-count">Faces: 0 / 6</div>
        </div>
        <div class="solid-stage" data-solid="cube">
          <div class="floor-shadow"></div>
          <div class="float-wrap">
            <div id="cubeObject" class="solid-object" aria-label="Rotating cube"></div>
          </div>
        </div>
      </section>

      <section class="solid-panel" style="--solid-color: var(--cuboid);">
        <div class="solid-heading">
          <div class="solid-name"><span class="solid-dot"></span>Cuboid</div>
          <div id="cuboidLiveCount" class="live-count">Faces: 0 / 6</div>
        </div>
        <div class="solid-stage" data-solid="cuboid">
          <div class="floor-shadow"></div>
          <div class="float-wrap">
            <div id="cuboidObject" class="solid-object" aria-label="Rotating cuboid"></div>
          </div>
        </div>
      </section>
    </main>

    <section id="counters" class="counters-wrap" aria-label="Cube and cuboid counters">
      <div class="counter active" data-solid="cube" data-feature="faces" style="--counter-color: var(--cube);">
        <span class="counter-label">Cube faces</span>
        <span class="counter-value">0 / 6</span>
      </div>
      <div class="counter" data-solid="cube" data-feature="edges" style="--counter-color: var(--cube);">
        <span class="counter-label">Cube edges</span>
        <span class="counter-value">0 / 12</span>
      </div>
      <div class="counter" data-solid="cube" data-feature="vertices" style="--counter-color: var(--cube);">
        <span class="counter-label">Cube vertices</span>
        <span class="counter-value">0 / 8</span>
      </div>
      <div class="counter active" data-solid="cuboid" data-feature="faces" style="--counter-color: var(--cuboid);">
        <span class="counter-label">Cuboid faces</span>
        <span class="counter-value">0 / 6</span>
      </div>
      <div class="counter" data-solid="cuboid" data-feature="edges" style="--counter-color: var(--cuboid);">
        <span class="counter-label">Cuboid edges</span>
        <span class="counter-value">0 / 12</span>
      </div>
      <div class="counter" data-solid="cuboid" data-feature="vertices" style="--counter-color: var(--cuboid);">
        <span class="counter-label">Cuboid vertices</span>
        <span class="counter-value">0 / 8</span>
      </div>
      <div id="comparisonMessage" class="comparison-message" aria-live="polite"></div>
    </section>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script>
    (() => {
      'use strict';

      const pageData = [
        { key: 'faces', label: 'Faces', singular: 'face', total: 6, next: 'Edges' },
        { key: 'edges', label: 'Edges', singular: 'edge', total: 12, next: 'Vertices' },
        { key: 'vertices', label: 'Vertices', singular: 'vertex', total: 8, next: null }
      ];

      const dimensions = {
        cube: { w: 190, h: 190, d: 190 },
        cuboid: { w: 250, h: 155, d: 135 }
      };

      const selected = {
        cube: { faces: new Set(), edges: new Set(), vertices: new Set() },
        cuboid: { faces: new Set(), edges: new Set(), vertices: new Set() }
      };

      const rotations = {
        cube: { x: -18, y: 28, dragging: false, lastX: 0, lastY: 0, moved: false },
        cuboid: { x: -16, y: -24, dragging: false, lastX: 0, lastY: 0, moved: false }
      };

      let currentPage = 0;
      let autoRotate = true;
      let lastFrame = performance.now();

      const promptNumber = document.getElementById('promptNumber');
      const promptText = document.getElementById('promptText');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetPageBtn = document.getElementById('resetPageBtn');
      const nextBtn = document.getElementById('nextBtn');
      const comparisonMessage = document.getElementById('comparisonMessage');
      const confetti = document.getElementById('confetti');

      function px(n) { return `${n}px`; }

      function addFeature(el, solid, type, index) {
        el.classList.add('feature', type.slice(0, -1));
        el.dataset.solid = solid;
        el.dataset.feature = type;
        el.dataset.index = index;
        el.type = 'button';
        el.setAttribute('aria-label', `${solid} ${type.slice(0, -1)} ${index + 1}`);
        el.addEventListener('click', event => {
          event.stopPropagation();
          if (rotations[solid].moved || type !== pageData[currentPage].key) return;
          selectFeature(el);
        });
      }

      function createSolid(solid, container) {
        const { w, h, d } = dimensions[solid];
        const t = 13;
        const v = 18;

        const faces = [
          { width: w, height: h, transform: `translate(-50%, -50%) translateZ(${d / 2}px)` },
          { width: w, height: h, transform: `translate(-50%, -50%) rotateY(180deg) translateZ(${d / 2}px)` },
          { width: d, height: h, transform: `translate(-50%, -50%) rotateY(90deg) translateZ(${w / 2}px)` },
          { width: d, height: h, transform: `translate(-50%, -50%) rotateY(-90deg) translateZ(${w / 2}px)` },
          { width: w, height: d, transform: `translate(-50%, -50%) rotateX(90deg) translateZ(${h / 2}px)` },
          { width: w, height: d, transform: `translate(-50%, -50%) rotateX(-90deg) translateZ(${h / 2}px)` }
        ];

        faces.forEach((cfg, index) => {
          const el = document.createElement('button');
          addFeature(el, solid, 'faces', index);
          el.style.width = px(cfg.width);
          el.style.height = px(cfg.height);
          el.style.transform = cfg.transform;
          container.appendChild(el);
        });

        const edgeDefs = [];
        [-1, 1].forEach(ySign => {
          [-1, 1].forEach(zSign => {
            edgeDefs.push({ len: w, axis: 'x', x: 0, y: ySign * h / 2, z: zSign * d / 2 });
          });
        });
        [-1, 1].forEach(xSign => {
          [-1, 1].forEach(zSign => {
            edgeDefs.push({ len: h, axis: 'y', x: xSign * w / 2, y: 0, z: zSign * d / 2 });
          });
        });
        [-1, 1].forEach(xSign => {
          [-1, 1].forEach(ySign => {
            edgeDefs.push({ len: d, axis: 'z', x: xSign * w / 2, y: ySign * h / 2, z: 0 });
          });
        });

        edgeDefs.forEach((cfg, index) => {
          const el = document.createElement('button');
          addFeature(el, solid, 'edges', index);
          if (cfg.axis === 'x') {
            el.style.width = px(cfg.len);
            el.style.height = px(t);
            el.style.transform = `translate(-50%, -50%) translate3d(${cfg.x}px, ${cfg.y}px, ${cfg.z}px)`;
          } else if (cfg.axis === 'y') {
            el.style.width = px(t);
            el.style.height = px(cfg.len);
            el.style.transform = `translate(-50%, -50%) translate3d(${cfg.x}px, ${cfg.y}px, ${cfg.z}px)`;
          } else {
            el.style.width = px(cfg.len);
            el.style.height = px(t);
            el.style.transform = `translate(-50%, -50%) translate3d(${cfg.x}px, ${cfg.y}px, ${cfg.z}px) rotateY(90deg)`;
          }
          container.appendChild(el);
        });

        let vertexIndex = 0;
        [-1, 1].forEach(xSign => {
          [-1, 1].forEach(ySign => {
            [-1, 1].forEach(zSign => {
              const el = document.createElement('button');
              addFeature(el, solid, 'vertices', vertexIndex++);
              el.style.width = px(v);
              el.style.height = px(v);
              el.style.transform = `translate(-50%, -50%) translate3d(${xSign * w / 2}px, ${ySign * h / 2}px, ${zSign * d / 2}px)`;
              container.appendChild(el);
            });
          });
        });
      }

      createSolid('cube', document.getElementById('cubeObject'));
      createSolid('cuboid', document.getElementById('cuboidObject'));

      function selectFeature(el) {
        const solid = el.dataset.solid;
        const type = el.dataset.feature;
        const index = Number(el.dataset.index);
        if (selected[solid][type].has(index)) return;
        selected[solid][type].add(index);
        el.classList.add('selected');
        if (el.animate) {
          el.animate(
            [{ transform: `${el.style.transform} scale(1)` }, { transform: `${el.style.transform} scale(1.18)` }, { transform: `${el.style.transform} scale(1)` }],
            { duration: 250, easing: 'ease-out' }
          );
        }
        updateUI();
      }

      function bindDrag(stage) {
        const solid = stage.dataset.solid;
        const state = rotations[solid];

        stage.addEventListener('pointerdown', event => {
          state.dragging = true;
          state.moved = false;
          state.lastX = event.clientX;
          state.lastY = event.clientY;
          stage.setPointerCapture?.(event.pointerId);
        });

        stage.addEventListener('pointermove', event => {
          if (!state.dragging) return;
          const dx = event.clientX - state.lastX;
          const dy = event.clientY - state.lastY;
          if (Math.abs(dx) + Math.abs(dy) > 2) state.moved = true;
          state.y += dx * .45;
          state.x -= dy * .35;
          state.x = Math.max(-75, Math.min(75, state.x));
          state.lastX = event.clientX;
          state.lastY = event.clientY;
        });

        const endDrag = event => {
          state.dragging = false;
          try { stage.releasePointerCapture?.(event.pointerId); } catch (_) { }
          setTimeout(() => { state.moved = false; }, 0);
        };

        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);
      }

      document.querySelectorAll('.solid-stage').forEach(bindDrag);

      function animate(now) {
        const dt = Math.min(40, now - lastFrame);
        lastFrame = now;
        ['cube', 'cuboid'].forEach(solid => {
          const state = rotations[solid];
          if (autoRotate && !state.dragging) state.y += dt * .012;
          const object = document.getElementById(`${solid}Object`);
          object.style.transform = `rotateX(${state.x}deg) rotateY(${state.y}deg)`;
        });
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      function updateFeatureVisibility() {
        const activeKey = pageData[currentPage].key;
        document.querySelectorAll('.feature').forEach(el => {
          el.classList.toggle('active-feature', el.dataset.feature === activeKey);
        });
      }

      function updateUI() {
        const page = pageData[currentPage];
        promptNumber.textContent = currentPage + 1;
        promptText.textContent = `Tap all ${page.total} ${page.label.toLowerCase()}. Drag either solid to rotate it.`;

        document.querySelectorAll('.tab').forEach((tab, index) => {
          tab.classList.toggle('active', index === currentPage);
        });

        ['cube', 'cuboid'].forEach(solid => {
          const count = selected[solid][page.key].size;
          document.getElementById(`${solid}LiveCount`).textContent = `${page.label}: ${count} / ${page.total}`;
        });

        document.querySelectorAll('.counter').forEach(counter => {
          const solid = counter.dataset.solid;
          const feature = counter.dataset.feature;
          const total = pageData.find(item => item.key === feature).total;
          counter.querySelector('.counter-value').textContent = `${selected[solid][feature].size} / ${total}`;
          counter.classList.toggle('active', feature === page.key);
        });

        nextBtn.textContent = page.next ? `Next: ${page.next}` : 'Back to Faces';
        updateFeatureVisibility();
        updateCompletionMessage();
      }

      function updateCompletionMessage() {
        const page = pageData[currentPage];
        const cubeDone = selected.cube[page.key].size === page.total;
        const cuboidDone = selected.cuboid[page.key].size === page.total;

        if (cubeDone && cuboidDone) {
          const verb = page.key === 'vertices' ? 'have' : 'have';
          comparisonMessage.textContent = `Both shapes ${verb} ${page.total} ${page.label.toLowerCase()}. What do you notice?`;
          comparisonMessage.classList.add('show');
          if (!comparisonMessage.dataset.celebrated || comparisonMessage.dataset.celebrated !== page.key) {
            comparisonMessage.dataset.celebrated = page.key;
            celebrate();
          }
        } else {
          comparisonMessage.classList.remove('show');
        }
      }

      function setPage(index) {
        currentPage = Math.max(0, Math.min(2, index));
        updateUI();
      }

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => setPage(Number(tab.dataset.page)));
      });

      nextBtn.addEventListener('click', () => {
        setPage(currentPage === 2 ? 0 : currentPage + 1);
      });

      pauseBtn.addEventListener('click', () => {
        autoRotate = !autoRotate;
        pauseBtn.textContent = autoRotate ? 'Pause rotation' : 'Resume rotation';
      });

      resetPageBtn.addEventListener('click', () => {
        const page = pageData[currentPage];
        ['cube', 'cuboid'].forEach(solid => {
          selected[solid][page.key].clear();
          document.querySelectorAll(`.feature[data-solid="${solid}"][data-feature="${page.key}"]`).forEach(el => el.classList.remove('selected'));
        });
        comparisonMessage.dataset.celebrated = '';
        updateUI();
      });

      function celebrate() {
        confetti.innerHTML = '';
        const colors = ['#ee8a36', '#4d86d6', '#8a61cc', '#4da56b', '#e1b637'];
        for (let i = 0; i < 28; i++) {
          const piece = document.createElement('span');
          piece.className = 'confetti-piece';
          piece.style.left = `${Math.random() * 100}%`;
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty('--drift', `${(Math.random() - .5) * 180}px`);
          piece.style.animationDelay = `${Math.random() * .18}s`;
          confetti.appendChild(piece);
        }
        setTimeout(() => { confetti.innerHTML = ''; }, 1800);
      }

      updateUI();
    })();
  </script>
</body>
</html>
