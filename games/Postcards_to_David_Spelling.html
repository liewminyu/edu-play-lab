<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Postcards to David Spelling</title>
<style>

:root{
  --navy:#082f57;--navy2:#17496f;--muted:#5c7186;--line:#dce8ee;
  --blue:#5aa8ed;--green:#8acb62;--orange:#ff9c34;--teal:#39bdc3;--purple:#a96fc5;
  --good:#66bc5b;--bad:#ef6f6c;--paper:#fff;--shadow:0 14px 34px rgba(41,75,105,.15);
  --pink:#ff8fb6;--yellow:#ffe27a;--class:#62c38d;--bot:#a96fc5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef9ff;color:var(--navy);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif}
button,input,textarea{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,#ffe3ef 0%,#f6e5ff 38%,#e9f5ff 70%,#e5f8ff 100%)}
#app{position:relative;z-index:1;width:100%;height:100%}.screen{width:100%;height:100%;padding:clamp(8px,.9vw,15px);display:flex;flex-direction:column;gap:8px}
.topbar{display:grid;grid-template-columns:minmax(330px,1fr) auto minmax(330px,1fr);align-items:center;gap:12px;min-height:60px}
.brand{min-width:0}.brand h1{margin:0;font-size:clamp(27px,2.35vw,40px);line-height:1;letter-spacing:-.02em}.brand p{margin:4px 0 0;color:var(--muted);font-weight:800;font-size:13px}
.toolbar,.game-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px}.icon-btn,.stage-btn,.primary-btn,.secondary-btn,.answer-btn,.move-btn,.setup-btn,.mark-top-btn{border:0;cursor:pointer;font-weight:900}
.icon-btn{width:50px;height:50px;border-radius:15px;background:#fff;color:var(--navy);box-shadow:0 6px 16px rgba(54,84,105,.12);font-size:21px}
.teacher-slot{display:flex;align-items:center;justify-content:center;min-width:330px}.stage-btn{width:330px;min-width:330px;height:54px;border-radius:16px;background:linear-gradient(135deg,#5aa8ed,#438fda);color:#fff;font-size:clamp(16px,1.35vw,21px);box-shadow:0 7px 18px rgba(62,123,181,.22)}
.stage-btn.waiting{background:#dfe7ee;color:#76899a;box-shadow:none;cursor:not-allowed}.stage-btn.go{background:linear-gradient(135deg,#7ed799,#5bbd78)}.stage-btn.next{background:linear-gradient(135deg,#bc8de0,#9a68c4)}
.teacher-mark-top{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:330px}.mark-top-btn{height:54px;border-radius:15px;font-size:17px;box-shadow:0 6px 14px rgba(54,84,105,.12)}.mark-top-btn.good{background:#e7f7e2;color:#2e6a2c;border:2px solid #72bd61}.mark-top-btn.bad{background:#fff0ee;color:#9b3c39;border:2px solid #ef7b78}.mark-top-btn:disabled{opacity:.45;cursor:not-allowed}
.round-pill{height:50px;display:flex;align-items:center;justify-content:center;padding:0 18px;border-radius:999px;background:linear-gradient(90deg,#ffd6e9,#ead7ff,#d9f1ff);border:3px solid #fff;box-shadow:0 5px 14px rgba(54,84,105,.10);font-size:16px;font-weight:900;white-space:nowrap}

/* cover */
.intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.cover-card{position:relative;width:min(1180px,100%);height:100%;max-height:730px;background:rgba(255,255,255,.94);border:3px solid #fff;border-radius:36px;box-shadow:0 18px 44px rgba(48,77,105,.14);overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr}
.cover-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 16% 20%,rgba(255,143,182,.14),transparent 25%),radial-gradient(circle at 83% 18%,rgba(169,111,197,.16),transparent 24%),radial-gradient(circle at 52% 100%,rgba(90,168,237,.12),transparent 34%);pointer-events:none}.cover-copy{position:relative;z-index:2;padding:40px 44px;display:flex;flex-direction:column;justify-content:center}.cover-chip{align-self:flex-start;display:inline-flex;padding:9px 16px;border-radius:999px;background:#f7efff;color:#8259a8;border:1px solid #e4d4f1;font-weight:900;font-size:15px}.cover-title{font-size:clamp(48px,5vw,76px);line-height:.96;margin:17px 0 12px;letter-spacing:-.035em}.cover-title em{font-style:normal;color:#9a68c4}.cover-subtitle{margin:0;color:var(--muted);font-size:clamp(17px,1.4vw,23px);font-weight:800;line-height:1.28}.cover-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}.rule{padding:9px 11px;border-radius:12px;background:#fff;border:1px solid #dce8ee;color:#45627b;font-weight:900;font-size:13px}.cover-actions{display:flex;justify-content:flex-start;gap:10px;flex-wrap:wrap;margin-top:18px}.primary-btn,.secondary-btn{padding:12px 20px;border-radius:14px;font-size:18px}.primary-btn{background:linear-gradient(135deg,#5aa8ed,#438fda);color:#fff;box-shadow:0 7px 17px rgba(62,123,181,.20)}.secondary-btn{background:#f1f7fa;color:var(--navy);border:2px solid #d8e7ee}.primary-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.cover-art{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff1f7,#f5efff 46%,#eaf7ff)}.cover-board{position:absolute;display:grid;gap:3px;padding:9px;border-radius:17px;background:#102f4a;box-shadow:0 18px 34px rgba(52,61,100,.20)}.cover-board.class{left:36px;bottom:52px;grid-template-columns:repeat(10,19px);grid-template-rows:repeat(10,19px);transform:rotate(-3deg)}.cover-board.bot{right:36px;top:58px;grid-template-columns:repeat(6,19px);grid-template-rows:repeat(9,19px);transform:rotate(4deg)}.cover-board i{display:block;border-radius:3px;background:#1f4969}.cover-board i.f1{background:#00c9d8}.cover-board i.f2{background:#f4d03f}.cover-board i.f3{background:#a765d1}.cover-board i.f4{background:#45b96b}.vs-badge{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) rotate(-7deg);width:105px;height:105px;border-radius:50%;background:#fff;color:#203f5d;display:grid;place-items:center;font-size:36px;font-weight:1000;box-shadow:0 13px 28px rgba(80,55,100,.18);border:7px solid #ffb5d4}.bot-face{position:absolute;right:48px;bottom:66px;font-size:70px}.class-face{position:absolute;left:44px;top:54px;font-size:64px}

/* setup */
.setup-wrap{flex:1;min-height:0;display:grid;grid-template-columns:.72fr 1.28fr;gap:12px}.setup-panel{min-height:0;background:rgba(255,255,255,.95);border:2px solid #fff;border-radius:22px;box-shadow:0 8px 18px rgba(54,84,105,.09);padding:13px;display:flex;flex-direction:column;gap:9px}.setup-title{font-size:clamp(21px,1.8vw,28px);font-weight:1000}.setup-help{font-size:13px;line-height:1.35;font-weight:800;color:var(--muted)}.name-box{flex:1;min-height:0;width:100%;resize:none;border:2px solid #d9e6ed;outline:none;border-radius:12px;background:#fff;color:var(--navy);padding:10px 12px;font:800 18px/1.25 "Trebuchet MS",Arial,sans-serif}.name-box:focus{border-color:#83b8df;box-shadow:0 0 0 3px rgba(90,168,237,.10)}.setup-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.setup-mini{font-size:12px;font-weight:900;color:var(--muted)}.difficulty{display:flex;gap:7px}.difficulty button{border:2px solid #d7e4ec;background:#fff;color:#56758a;border-radius:11px;padding:8px 12px;font-weight:950;cursor:pointer}.difficulty button.active{border-color:#b995d7;background:#f7efff;color:#8259a8}.pair-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-content:start}.pair-chip{min-height:54px;background:#fff;border:2px solid #e1ebf0;border-radius:13px;padding:7px 9px;display:grid;grid-template-columns:29px minmax(0,1fr);gap:7px;align-items:center}.pair-no{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,#ff96c4,#b88ae0);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:12px}.pair-names{font-size:12px;font-weight:950;line-height:1.22;color:#365b74;overflow:hidden}.pair-names div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.setup-actions{display:flex;justify-content:flex-end;gap:8px}

/* score strip */
.score-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:58px}.score-card{min-width:0;background:rgba(255,255,255,.94);border:2px solid #fff;border-radius:16px;padding:6px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;box-shadow:0 5px 13px rgba(54,84,105,.09)}.score-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px}.score-card.class .score-icon{background:#e8f8f0}.score-card.bot .score-icon{background:#fff0f6}.score-label{display:none}.score-big{font-size:18px;line-height:1;font-weight:1000;color:#23465f}.score-number{font-size:30px;font-weight:1000;color:#254961}.score-number span{font-size:13px;color:#718697}

/* gameplay */
.game-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(250px,.78fr) minmax(420px,1.35fr) minmax(250px,.78fr) minmax(210px,.62fr);gap:9px}.panel{min-width:0;min-height:0;background:rgba(255,255,255,.96);border:3px solid #fff;border-radius:22px;box-shadow:0 10px 24px rgba(54,84,105,.11);overflow:hidden}.panel-head{height:46px;padding:7px 11px;border-bottom:1px solid #e2ebf0;display:flex;align-items:center;justify-content:space-between;gap:7px}.panel-title{font-weight:1000;color:#244a64;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-tag{padding:5px 8px;border-radius:999px;background:#f2eaff;color:#8259a8;font-size:10px;font-weight:1000;white-space:nowrap}
.player-station{display:grid;grid-template-rows:46px minmax(0,1fr) 58px}.player-head{height:46px;border-bottom:1px solid #e2ebf0;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;gap:7px}.player-name{font-size:clamp(19px,1.4vw,25px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-index{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:1000}.player-station.p1 .player-index{background:#ffe3ef;color:#a85179}.player-station.p2 .player-index{background:#efe6ff;color:#7b55a3}
.station-question{min-height:0;padding:7px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;overflow:hidden}.q-kicker{font-size:11px;font-weight:1000;color:#8560ae;letter-spacing:.02em}.q-title{width:100%;min-height:39px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(18px,1.28vw,23px);line-height:1.06;font-weight:1000;color:var(--navy)}.q-visual{flex:1;min-height:68px;width:100%;display:grid;place-items:center;overflow:visible}.q-visual svg{max-width:94%;max-height:108px;width:auto;height:auto}.q-visual .fraction-model{width:auto;height:auto}.q-visual .fraction-model.bar{width:100%;height:auto}.q-visual .equation{gap:8px;font-size:25px}.q-visual .equation .stack-frac{font-size:25px;min-width:50px}.q-visual .stack-frac.big{font-size:38px;min-width:70px}
.answer-grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:auto}.answer-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.answer-btn{min-width:0;min-height:43px;border:2px solid #dce7ed;border-radius:11px;background:#f7fafc;color:var(--navy);font-size:clamp(16px,1.02vw,19px);font-weight:1000;line-height:1.05;padding:5px 6px;box-shadow:0 3px 8px rgba(54,84,105,.06)}.answer-btn .stack-frac{font-size:19px;min-width:40px}.answer-btn:disabled{cursor:default;opacity:.62}.answer-btn.correct-picked{background:#e5f7e5;border-color:#58be73;color:#286f3c;opacity:1}.answer-btn.wrong-picked{background:#fff0ee;border-color:#ef7b78;color:#9b3c39;opacity:1}.teacher-note{width:100%;margin-top:auto;background:#f6f0fb;border:1px solid #e4d7ef;border-radius:11px;padding:7px 8px;text-align:center;font-size:12px;line-height:1.25;font-weight:900;color:#74578e}.review-answer{width:100%;margin-top:auto;border:2px solid #72bd61;background:#e8f8e8;color:#286f3c;border-radius:12px;padding:8px;text-align:center;font-weight:1000}.review-answer.bad{border-color:#ef7b78;background:#fff0ee;color:#9b3c39}.review-answer .stack-frac{font-size:24px}.station-ready{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}.station-ready .emoji{font-size:42px}.station-ready .big{font-size:21px;font-weight:1000;color:#2f86c9}.station-ready .small{font-size:12px;font-weight:900;color:var(--muted)}
.player-controls{height:58px;display:flex;align-items:center;justify-content:center;padding:3px 7px 5px;border-top:1px solid #e5edf2}.move-grid{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.move-btn{height:46px;border:2px solid rgba(8,47,87,.11);border-radius:11px;background:#fff;color:var(--navy);font-size:20px;box-shadow:0 3px 8px rgba(54,84,105,.08)}.move-btn.rotate{font-size:13px}.move-btn:disabled{opacity:.34;cursor:default}.player-station.p1 .move-btn:not(:disabled){box-shadow:inset 0 0 0 2px rgba(255,143,182,.16),0 3px 8px rgba(54,84,105,.08)}.player-station.p2 .move-btn:not(:disabled){box-shadow:inset 0 0 0 2px rgba(169,111,197,.18),0 3px 8px rgba(54,84,105,.08)}
.shared-panel{display:grid;grid-template-rows:46px minmax(0,1fr)}.shared-board-area{min-height:0;display:flex;align-items:center;justify-content:center;padding:7px 10px;position:relative}.board{display:grid;background:#f8fbfd;border:4px solid rgba(8,47,87,.55);border-radius:13px;overflow:hidden;box-shadow:inset 0 2px 8px rgba(41,75,105,.10);touch-action:manipulation}.class-board{--cols:14;--rows:16;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(16,1fr);aspect-ratio:14/16;height:100%;max-height:100%;width:auto;max-width:100%}.bot-board{--cols:10;--rows:16;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(16,1fr);aspect-ratio:10/16;height:100%;max-height:100%;width:auto;max-width:96%}.cell{border:1px solid #dbe6ec;background:rgba(255,255,255,.72);position:relative}.cell.filled{background:var(--cell,#5aa8ed);border-color:rgba(8,47,87,.18);box-shadow:inset 2px 2px 0 rgba(255,255,255,.28),inset -2px -2px 0 rgba(8,47,87,.10)}.cell.active{background:var(--active,#5aa8ed);box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(8,47,87,.13);border-color:rgba(8,47,87,.22)}.cell.active.p1{outline:2px solid #ff6fac;outline-offset:-2px}.cell.active.p2{outline:2px solid #9d63cf;outline-offset:-2px}.shared-legend{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);display:flex;gap:7px;background:rgba(255,255,255,.92);border:1px solid #dce8ee;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:1000;white-space:nowrap}.legend-dot{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}.legend-dot.p1{background:#ff8fb6}.legend-dot.p2{background:#a96fc5}
.bot-panel{display:grid;grid-template-rows:46px minmax(0,1fr) 34px}.bot-board-area{min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}.bot-status{height:34px;border-top:1px solid #e2ebf0;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:1000;color:#6a5b86;background:#faf7fd}

/* fractions */
.stack-frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;line-height:.72;min-width:.9em;margin:0 .08em;font-weight:1000}.stack-frac .num{border-bottom:.09em solid currentColor;padding:0 .11em .09em}.stack-frac .den{padding:.09em .11em 0}.stack-frac.big{font-size:46px;color:var(--navy)}.equation{display:flex;align-items:center;justify-content:center;gap:12px;font-size:34px;font-weight:1000;color:#385b72}.equation .stack-frac{font-size:31px;min-width:62px}.fraction-model{width:min(210px,78%);height:140px}.fraction-model.bar{width:min(290px,96%);height:115px}

/* overlays */
.overlay-root{position:fixed;inset:0;pointer-events:none;z-index:150}.countdown-overlay,.flash{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,244,251,.42);backdrop-filter:blur(5px)}.countdown-burst{width:min(250px,30vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(86px,10vw,156px);font-weight:1000;color:#fff;background:linear-gradient(145deg,#ff96c4,#c9a9ff 52%,#91dcff);border:8px solid rgba(255,255,255,.96);box-shadow:0 14px 0 rgba(179,127,185,.33),0 28px 70px rgba(104,55,110,.26);text-shadow:0 5px 0 rgba(99,50,105,.18);animation:countPop .52s cubic-bezier(.18,.85,.26,1.22) both}.countdown-burst.go-word{width:min(330px,38vw);aspect-ratio:1.5;border-radius:999px;font-size:clamp(62px,7.5vw,116px);background:linear-gradient(145deg,#8fe6c7,#59d39f);color:#2d6551}.flash-card{width:min(650px,90vw);background:#fff;border:3px solid #fff;border-radius:28px;box-shadow:0 28px 80px rgba(24,52,79,.28);padding:24px 30px;text-align:center;pointer-events:auto}.flash-card h2{margin:0 0 7px;font-size:38px}.flash-card p{font-size:16px;font-weight:850;color:#657e90;line-height:1.4}.flash-emoji{font-size:70px}.confetti{position:fixed;top:-20px;width:11px;height:17px;border-radius:3px;z-index:190;animation:fall linear forwards;pointer-events:none}@keyframes countPop{0%{transform:scale(.25) rotate(-7deg);opacity:0}65%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}

@media(max-height:780px){
 .screen{padding:6px 9px;gap:6px}.topbar{min-height:52px}.brand h1{font-size:27px}.brand p{display:none}.icon-btn{width:44px;height:44px}.teacher-slot{min-width:290px}.stage-btn,.teacher-mark-top{width:290px;min-width:290px}.stage-btn,.mark-top-btn{height:46px}.round-pill{height:43px;font-size:14px}.score-strip{height:55px}.score-card{padding:4px 9px}.score-icon{width:36px;height:36px}.score-big{font-size:16px}.score-number{font-size:25px}.game-main{grid-template-columns:minmax(225px,.76fr) minmax(390px,1.32fr) minmax(225px,.76fr) minmax(190px,.60fr);gap:7px}.player-station{grid-template-rows:40px minmax(0,1fr) 50px}.player-head,.panel-head{height:40px;padding:5px 8px}.player-name{font-size:19px}.station-question{padding:5px 6px;gap:3px}.q-title{font-size:18px;min-height:32px}.q-visual{min-height:54px}.q-visual svg{max-height:82px}.q-visual .equation{font-size:22px}.q-visual .equation .stack-frac{font-size:22px}.answer-btn{min-height:36px;font-size:15px}.answer-btn .stack-frac{font-size:16px}.player-controls{height:50px}.move-btn{height:40px;font-size:18px}.move-btn.rotate{font-size:11px}.shared-panel{grid-template-rows:40px minmax(0,1fr)}.bot-panel{grid-template-rows:40px minmax(0,1fr) 28px}.bot-status{height:28px}.shared-legend{bottom:5px}.cover-copy{padding:28px 36px}.cover-title{font-size:52px}.cover-subtitle{font-size:16px}.cover-rules{margin-top:12px}.cover-actions{margin-top:12px}.setup-panel{padding:9px}.pair-chip{min-height:46px}
}
@media(max-width:1120px){.topbar{grid-template-columns:minmax(270px,1fr) auto minmax(270px,1fr)}.teacher-slot{min-width:260px}.stage-btn,.teacher-mark-top{width:260px;min-width:260px}.game-main{grid-template-columns:minmax(210px,.75fr) minmax(350px,1.25fr) minmax(210px,.75fr) minmax(175px,.58fr)}.answer-btn{font-size:15px}.move-btn{font-size:17px}.move-btn.rotate{font-size:10px}.q-title{font-size:18px}}


/* ===== v3 clean three-column question / connected co-op play ===== */
.game-main{flex:1;min-height:0;gap:11px!important}
.game-main.question-mode{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important}
.game-main.play-mode{display:grid!important;grid-template-columns:minmax(0,2fr) minmax(300px,1fr)!important}

/* The question stage mirrors Tetris Battle / Triple Jeopardy: one complete lane per player. */
.question-lane{min-width:0;min-height:0;background:rgba(255,255,255,.97);border:2px solid #dce8ee;border-radius:23px;box-shadow:0 10px 24px rgba(54,84,105,.11);padding:8px;display:grid;grid-template-rows:44px minmax(0,1fr);gap:6px;overflow:hidden}
.question-lane-head{height:44px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.question-lane.p1 .question-lane-head{background:#ffdce9}.question-lane.p2 .question-lane-head{background:#eadcff}.question-lane.bot .question-lane-head{background:#e2effb}
.question-player-name{font-size:clamp(24px,1.85vw,32px);line-height:1;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.question-role{font-size:clamp(11px,.82vw,14px);font-weight:1000;background:rgba(255,255,255,.62);padding:6px 9px;border-radius:999px;white-space:nowrap}

.gacha-col-head strong{display:block;font-size:21px;line-height:1;color:#173e5d}.gacha-col-head span{display:block;margin-top:4px;font-size:11px;font-weight:1000;color:#758b9b}
.gacha-small-badge{flex:0 0 auto;padding:7px 11px;border-radius:999px;background:#fff;border:2px solid #dce8ee;color:#5e7890;font-size:11px;font-weight:1000;white-space:nowrap}
.gacha-machine-stage{position:relative;min-height:0;height:100%;border-radius:22px;background:linear-gradient(180deg,#fbfdff 0%,#f6fbff 100%);border:2px solid #e1ebf0;overflow:hidden;display:grid;place-items:center;isolation:isolate}
.gacha-machine-stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(228,234,255,.88),rgba(255,255,255,0) 38%),radial-gradient(circle at 50% 82%,rgba(255,225,238,.55),rgba(255,255,255,0) 30%);z-index:0}
.gacha-stage-title{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,#d8f5f3,#eadcff,#ffe1cf);border:3px solid #fff;color:#183f5a;font-size:14px;font-weight:1000;white-space:nowrap}
.gacha-machine-wrap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:1;width:min(86%,350px);aspect-ratio:1122/1402;display:block}
.gacha-machine-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 28px rgba(93,116,139,.20));transition:transform .28s ease}
.gacha-machine-stage.spinning .gacha-machine-wrap{animation:gachaMachineWiggle .95s ease}@keyframes gachaMachineWiggle{0%{transform:translateX(-50%) rotate(0)}20%{transform:translateX(-50%) rotate(-2deg)}40%{transform:translateX(-50%) rotate(2.5deg)}65%{transform:translateX(-50%) rotate(-1.4deg)}100%{transform:translateX(-50%) rotate(0)}}
.gacha-knob-overlay{position:absolute;left:50%;top:69.3%;transform:translate(-50%,-50%);width:23.2%;aspect-ratio:1/1;z-index:3;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(70,90,120,.12))}
.gacha-knob-overlay img{display:block;width:100%;height:100%;object-fit:contain}
.gacha-machine-stage.spinning .gacha-knob-overlay{animation:gachaKnobSpin .96s cubic-bezier(.22,.71,.28,1)}
@keyframes gachaKnobSpin{0%{transform:translate(-50%,-50%) rotate(0)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
.gacha-capsule-overlay{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;background:radial-gradient(circle at center,rgba(255,255,255,.52),rgba(255,255,255,0) 60%)}
.gacha-capsule-overlay.show{opacity:1}
.gacha-capsule-full{position:absolute;left:50%;top:56%;width:min(50%,210px);max-width:210px;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(88,96,129,.22));opacity:0;transform:translate(-50%,24px) scale(.45)}
.gacha-capsule-overlay.show .gacha-capsule-full{animation:gachaCapsulePop .60s cubic-bezier(.2,.86,.28,1.15) forwards}
@keyframes gachaCapsulePop{0%{opacity:0;transform:translate(-50%,34px) scale(.35)}72%{opacity:1;transform:translate(-50%,-8px) scale(1.04)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.gacha-capsule-prize,.gacha-prize-name{position:absolute;opacity:0}
.gacha-capsule-overlay.open .gacha-capsule-full{opacity:0;transform:translate(-50%,-14px) scale(.82);transition:all .26s ease}
.gacha-capsule-prize{left:50%;top:50%;width:min(34%,128px);max-width:128px;max-height:128px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(52,72,96,.24));z-index:8;transform:translate(-50%,18px) scale(.80)}
.gacha-capsule-overlay.open .gacha-capsule-prize{opacity:1;transform:translate(-50%,0) scale(1);transition:all .38s ease .06s}
.gacha-prize-name{left:50%;top:76%;transform:translate(-50%,10px) scale(.88);padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.94);border:2px solid #e3edf2;box-shadow:0 6px 12px rgba(77,96,122,.12);font-size:15px;font-weight:1000;color:#214560;z-index:8;white-space:nowrap}
.gacha-capsule-overlay.open .gacha-prize-name{opacity:1;transform:translate(-50%,0) scale(1);transition:all .38s ease .12s}
.gacha-col-foot{height:62px;display:grid;align-items:stretch}.gacha-status-box{height:62px;border-radius:16px;background:#f7fbfd;border:2px solid #e4edf2;padding:7px 10px;display:grid;place-items:center;text-align:center;color:#628198;font-weight:900;font-size:12px}.gacha-status-box strong{display:block;color:#173e5d;font-size:15px;margin-bottom:2px}
.gacha-turn-btn{width:100%;height:62px;border-radius:17px;border:2px solid #8b73cd;background:linear-gradient(135deg,#b18bdf,#8b6ecb);color:#fff;font-size:15px;font-weight:1000;cursor:pointer;box-shadow:0 8px 15px rgba(116,91,179,.18)}.gacha-turn-btn:disabled{opacity:.38;cursor:default}
.gacha-prize-chip{display:none}
.gacha-empty-note{font-size:13px;font-weight:1000;color:#7d90a1}.gacha-prize-grid,.gacha-prize-strip,.gacha-prize-sample{display:none!important}

/* final screen */

.spelling-final-stats{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.spelling-final-stat{padding:9px 14px;border-radius:999px;background:#f7fafc;border:1px solid #dce8ee;color:#45627b;font-weight:1000}

@media(max-height:820px){
  .spelling-area{grid-template-rows:minmax(70px,.31fr) minmax(220px,1.69fr)!important;gap:6px!important;padding:8px 10px!important}

  .spelling-pad-shell{grid-template-rows:minmax(165px,1fr) 50px;gap:6px}

  align-items:stretch!important;

  gap:10px!important;
  overflow:hidden!important;
}

  grid-row:1!important;
  min-height:0!important;
  height:100%!important;
  align-self:stretch!important;
}
.claw-controls{
  grid-row:2!important;
  height:104px!important;
  min-height:104px!important;
}
.claw-control-name{
  display:flex!important;

}

  }

    height:92px!important;
    min-height:92px!important;
  }

.machine-shell{
  border:5px solid #b7cfdf!important;
  overflow:hidden!important;
}
.machine-rail-img{display:none!important}
.claw-zone{
  overflow:hidden!important;
}

  position:absolute!important;

  position:absolute;
  inset:auto 0 0 0;
  width:100%!important;
  height:auto!important;

  display:block!important;
}
.claw-rig.dropping{top:30%!important}
.claw-rig.has-prize img{filter:drop-shadow(0 8px 14px rgba(255,216,111,.35))!important}
.toy-target{
  width:116px!important;
  height:116px!important;
  transform:translateX(-50%) scale(1)!important;
  z-index:5!important;
}
.toy-target img{
  max-width:100%!important;
  max-height:100%!important;
  object-fit:contain!important;
}
.toy-target.caught{
  left:50%!important;
  bottom:7%!important;
  transform:translateX(-50%) scale(.82)!important;
  z-index:8!important;
}
.prize-hole-img{
  width:min(164px,40%)!important;
  bottom:2.2%!important;
}

}

}

function buildPrizeDeck(){
  const cycles=[];
  for(let cycle=0;cycle<3;cycle++){
    const batch=Array.from({length:TOY_IMAGES.length},(_,i)=>i);
    for(let i=batch.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [batch[i],batch[j]]=[batch[j],batch[i]];
    }
    if(cycles.length && batch[0]===cycles[cycles.length-1]){
      const swapAt=batch.length>1?1:0;
      [batch[0],batch[swapAt]]=[batch[swapAt],batch[0]];
    }
    cycles.push(...batch);
  }
  return cycles;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ordinal(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':String(n)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(f=440,d=.09,type='sine',v=.06){if(muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function good(){tone(523,.09,'triangle');setTimeout(()=>tone(659,.1,'triangle'),80);setTimeout(()=>tone(784,.13,'triangle'),160)}

function confetti(n=80){const cs=['#ffd166','#55e6a5','#ff6b9f','#a9c8e8','#cfa7f3','#ffc58f'];for(let i=0;i<n;i++){const p=document.createElement('i');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=cs[Math.floor(Math.random()*cs.length)];p.style.animationDuration=(2.2+Math.random()*2.4)+'s';p.style.animationDelay=(Math.random()*.4)+'s';p.style.setProperty('--dx',(-160+Math.random()*320)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),5200)}}

function bindToolbar(){

function stageHTML(){
  if(phase==='ready'){
    const n=readyPlayers.size;
    return `<button class="stage-btn ${n===3?'go':'waiting'}" id="stageBtn" ${n===3?'':'disabled'}>${n===3?'PLAY WORD 🔊':`WAITING ${n}/3`}</button>`;
  }
  if(phase==='heard') return `<button class="stage-btn go" id="stageBtn">GO!</button>`;
  if(phase==='writing') return `<button class="stage-btn waiting" id="stageBtn" disabled>WAITING ${submitted.filter(Boolean).length}/3 SUBMITTED</button>`;
  if(phase==='submitted') return `<button class="stage-btn answer" id="stageBtn">SHOW CORRECT ANSWER</button>`;
  if(phase==='marking'){
    const n=marks.filter(v=>v!==null).length;
    return `<button class="stage-btn ${n===3?'go':'waiting'}" id="stageBtn" ${n===3?'':'disabled'}>${n===3?'START GACHAPON →':`MARKING ${n}/3`}</button>`;
  }
  if(phase==='gacha'){
    const eligible=marks.filter(Boolean).length,done=gachaState.filter((s,i)=>marks[i]&&s?.done).length;
    return `<button class="stage-btn waiting" id="stageBtn" disabled>${eligible?`GACHAPON ${done}/${eligible}`:'NO GACHAPON TURNS'}</button>`;
  }
  if(phase==='gachaDone') return `<button class="stage-btn next" id="stageBtn">${round===TOTAL_ROUNDS-1?'FINISH GAME':'NEXT TRIO →'}</button>`;
  return '';
}

function universalRoster(){
  try{
    const r=JSON.parse(localStorage.getItem(UNIVERSAL_SETUP_KEY)||'null');
    if(!r||!Array.isArray(r.players))return[];
    const groupMap=new Map();
    if(Array.isArray(r.groups))r.groups.forEach((g,gi)=>(g.memberIds||[]).forEach(id=>groupMap.set(String(id),{group:gi,groupName:g.name||`Group ${gi+1}`,color:g.color||'#9db4c4'})));
    return r.players.map((p,i)=>({id:String(p.id||`p${i+1}`),name:String(p.name||'').trim(),...(groupMap.get(String(p.id))||{})})).filter(p=>p.name).slice(0,30)
  }catch(e){return[]}
}

function normHex(c){
  if(!c||typeof c!=='string')return null;
  const v=c.trim();
  const m=v.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(!m)return null;
  let h=m[1];
  if(h.length===3)h=h.split('').map(ch=>ch+ch).join('');
  return '#'+h.toLowerCase();
}

function makeTrios(list){
  let best=null,bestPenalty=999;
  for(let attempt=0;attempt<350;attempt++){
    const pool=shuffle(list),groups=[];let penalty=0;
    while(pool.length){
      const trio=[pool.shift()];
      while(trio.length<3 && pool.length){
        let ix=pool.findIndex(p=>trio.every(t=>t.group===undefined||p.group===undefined||t.group!==p.group));
        if(ix<0)ix=0;
        const p=pool.splice(ix,1)[0];
        if(trio.some(t=>t.group!==undefined&&p.group!==undefined&&t.group===p.group))penalty++;
        trio.push(p);

      groups.push(trio);
    }
    if(penalty<bestPenalty){best=groups;bestPenalty=penalty;if(penalty===0)break}
  }
  return best||[];
}

function scheduleCountdownSounds(){
  if(muted)return;
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    const schedule=()=>{
      const now=audioCtx.currentTime+.04;
      const ping=(when,freq,dur=.18,vol=.11,type='sine')=>{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=type;o.frequency.setValueAtTime(freq,when);
        g.gain.setValueAtTime(.001,when);
        g.gain.exponentialRampToValueAtTime(vol,when+.015);
        g.gain.exponentialRampToValueAtTime(.001,when+dur);
        o.connect(g);g.connect(audioCtx.destination);o.start(when);o.stop(when+dur+.03);
      };
      ping(now,520,.18,.12,'triangle');             // 3
      ping(now+.62,520,.18,.12,'triangle');        // 2
      ping(now+1.24,520,.18,.12,'triangle');       // 1
      ping(now+1.86,700,.32,.13,'triangle');       // GO!
      ping(now+1.86,930,.32,.09,'sine');
    };
    if(audioCtx.state==='suspended')audioCtx.resume().then(schedule).catch(()=>{});
    else schedule();
  }catch(e){}
}

}
function setupCanvas(canvas,i){
  const rect=canvas.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);
  canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#173b68';ctx.lineWidth=5;
  const st={canvas,ctx,strokes:handwritingData[i]||[],active:null,pointerId:null};handwritingData[i]=st.strokes;pads[i]=st;
  const point=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
  const redraw=()=>{
    const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);
    const draw=s=>{if(!s?.pts?.length)return;ctx.beginPath();s.pts.forEach((p,j)=>{const x=p.x*r.width,y=p.y*r.height;j?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(s.pts.length===1){const p=s.pts[0];ctx.lineTo(p.x*r.width+.5,p.y*r.height+.5)}ctx.stroke()};

    if(st.pointerId===null)return;
    if(e&&e.pointerId!==undefined&&e.pointerId!==st.pointerId)return;
    if(st.active?.pts?.length){st.strokes.push(st.active);handwritingData[i]=st.strokes}
    st.active=null;

    st.pointerId=null;
    try{canvas.releasePointerCapture(pid)}catch(err){}

  window.addEventListener('pointerup',finish,{passive:false});

}

function updatePadButtons(i){
  const st=pads[i];if(!st)return;

function bindPads(){

  $$('[data-pad]').forEach(c=>setupCanvas(c,Number(c.dataset.pad)));
  if(phase==='writing'){
    $$('[data-pad-action]').forEach(b=>{
      const run=e=>{

      };

function submitPad(i){

      <div class="gacha-stage-title">Gachapon Prize Time!</div>
      <div class="gacha-machine-wrap">
        <img class="gacha-machine-img" src="${GACHA_MACHINE_IMG}" alt="Gachapon machine">
        <div class="gacha-knob-overlay"><img src="${GACHA_KNOB_IMG}" alt=""></div>
      </div>
      <div class="gacha-capsule-overlay ${overlayActive?'show':''} ${overlayOpen?'open':''}" data-gacha-overlay="${i}">
        <img class="gacha-capsule-full" src="${GACHA_CAPSULE_IMG}" alt="Capsule">
        ${prizeImg}
        ${prizeName}
      </div>
    </div>
    <div class="gacha-col-foot" data-gacha-foot="${i}">${foot}</div>
  </section>`;
}
function prizeStripHTML(){return ``}
function renderGacha(){
  const group=trios[round];
  app.innerHTML=`<main class="screen">${topbar()}${scoreStrip()}<section class="gacha-main">${group.map((p,i)=>gachaPlayerHTML(group,i)).join('')}</section></main>`;
  bindToolbar();bindStage();bindGacha();
}
function bindGacha(){if(phase!=='gacha')return;$$('[data-gacha-turn]').forEach(b=>b.onclick=()=>takeGachaTurn(Number(b.dataset.gachaTurn)))}
function takeGachaTurn(i){
  if(phase!=='gacha'||marks[i]!==true||gachaState[i].done||isGachaBusy(i))return;
  const s=gachaState[i];
  const toyIndex=prizeDeck[prizeDrawIndex++ % prizeDeck.length];
  s.toyIndex=toyIndex;s.animating=true;s.showCapsule=false;s.capsuleOpen=false;

  const col=$(`[data-gacha-col="${i}"]`),stage=$(`[data-gacha-stage="${i}"]`),overlayEl=$(`[data-gacha-overlay="${i}"]`),foot=$(`[data-gacha-foot="${i}"]`),badge=$(`[data-gacha-badge="${i}"]`),btn=$(`[data-gacha-turn="${i}"]`);
  if(btn)btn.disabled=true;
  if(stage)stage.classList.add('spinning');
  if(badge)badge.textContent='Opening...';
  if(foot)foot.innerHTML='<div class="gacha-status-box"><strong>Turning the knob...</strong></div>';

  tone(380,.08,'triangle',.03);setTimeout(()=>tone(460,.07,'triangle',.025),160);setTimeout(()=>tone(560,.08,'triangle',.025),330);

  setTimeout(()=>{
    s.animating=false;s.showCapsule=true;
    if(stage)stage.classList.remove('spinning');
    if(overlayEl){
      overlayEl.innerHTML=`<img class="gacha-capsule-full" src="${GACHA_CAPSULE_IMG}" alt="Capsule"><img class="gacha-capsule-prize" src="${TOY_IMAGES[toyIndex]}" alt="${esc(TOY_NAMES[toyIndex])}"><div class="gacha-prize-name">${esc(TOY_NAMES[toyIndex])}</div>`;
      overlayEl.classList.add('show');overlayEl.classList.remove('open');
    }
    if(foot)foot.innerHTML='<div class="gacha-status-box"><strong>Capsule appears!</strong></div>';
  },760);

  setTimeout(()=>{
    s.capsuleOpen=true;
    if(overlayEl)overlayEl.classList.add('open');
    if(foot)foot.innerHTML='<div class="gacha-status-box"><strong>Prize revealed!</strong></div>';
    good();
  },1300);

  setTimeout(()=>{
    prizeCount=Math.min(30,prizeCount+1);caughtHistory.push(toyIndex);refreshPrizeScoreUI();
  },1360);

  setTimeout(()=>{
    s.done=true;s.animating=false;s.showCapsule=false;s.capsuleOpen=false;
    if(badge)badge.textContent='Won prize';
    if(foot)foot.innerHTML='<div class="gacha-status-box"><strong>Prize won!</strong></div>';
    // Leave the prize and its name visible in the middle. Do not redraw this column.
    checkGachaDone();
  },2200);
}
function checkGachaDone(){
  const eligible=[0,1,2].filter(i=>marks[i]===true);
  if(eligible.every(i=>gachaState[i].done))phase='gachaDone';
  updateStageOnly();
}
function nextRound(){
  roundsCompleted++;
  if(round>=TOTAL_ROUNDS-1){finishGame();return}
  round++;renderRoundReady();
}
function finishGame(){
  roundsCompleted=10;phase='end';confetti(90);good();
  overlay.innerHTML=`<div class="flash"><div class="flash-card"><div class="flash-emoji">🏆</div><h2>Postcards to David Spelling complete!</h2><p>All 10 trios have played.</p><div class="spelling-final-stats"><span class="spelling-final-stat">${correctCount}/30 correct spellings</span><span class="spelling-final-stat">${prizeCount} prizes caught</span></div><button class="primary-btn" id="finishHome" style="margin-top:18px">Back to Cover</button></div></div>`;
  $('#finishHome').onclick=()=>{overlay.innerHTML='';renderCover()};
}


renderCover();
})();

</script>
</body>
</html>
