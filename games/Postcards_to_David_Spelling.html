<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Postcards to David Spelling</title>
<style>

:root{
  --navy:#082f57;--navy2:#17496f;--muted:#5c7186;--line:#dce8ee;
  --blue:#5aa8ed;--green:#8acb62;--orange:#ff9c34;--teal:#39bdc3;--purple:#a96fc5;
  --good:#66bc5b;--bad:#ef6f6c;--paper:#fff;--shadow:0 14px 34px rgba(41,75,105,.15);
  --pink:#ff8fb6;--yellow:#ffe27a;--class:#62c38d;--bot:#a96fc5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef9ff;color:var(--navy);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif}
button,input,textarea{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,#ffe3ef 0%,#f6e5ff 38%,#e9f5ff 70%,#e5f8ff 100%)}
#app{position:relative;z-index:1;width:100%;height:100%}.screen{width:100%;height:100%;padding:clamp(8px,.9vw,15px);display:flex;flex-direction:column;gap:8px}
.topbar{display:grid;grid-template-columns:minmax(330px,1fr) auto minmax(330px,1fr);align-items:center;gap:12px;min-height:60px}
.brand{min-width:0}.brand h1{margin:0;font-size:clamp(27px,2.35vw,40px);line-height:1;letter-spacing:-.02em}.brand p{margin:4px 0 0;color:var(--muted);font-weight:800;font-size:13px}
.toolbar,.game-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px}.icon-btn,.stage-btn,.primary-btn,.secondary-btn,.answer-btn,.move-btn,.setup-btn,.mark-top-btn{border:0;cursor:pointer;font-weight:900}
.icon-btn{width:50px;height:50px;border-radius:15px;background:#fff;color:var(--navy);box-shadow:0 6px 16px rgba(54,84,105,.12);font-size:21px}
.teacher-slot{display:flex;align-items:center;justify-content:center;min-width:330px}.stage-btn{width:330px;min-width:330px;height:54px;border-radius:16px;background:linear-gradient(135deg,#5aa8ed,#438fda);color:#fff;font-size:clamp(16px,1.35vw,21px);box-shadow:0 7px 18px rgba(62,123,181,.22)}
.stage-btn.waiting{background:#dfe7ee;color:#76899a;box-shadow:none;cursor:not-allowed}.stage-btn.go{background:linear-gradient(135deg,#7ed799,#5bbd78)}.stage-btn.next{background:linear-gradient(135deg,#bc8de0,#9a68c4)}
.teacher-mark-top{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:330px}.mark-top-btn{height:54px;border-radius:15px;font-size:17px;box-shadow:0 6px 14px rgba(54,84,105,.12)}.mark-top-btn.good{background:#e7f7e2;color:#2e6a2c;border:2px solid #72bd61}.mark-top-btn.bad{background:#fff0ee;color:#9b3c39;border:2px solid #ef7b78}.mark-top-btn:disabled{opacity:.45;cursor:not-allowed}
.round-pill{height:50px;display:flex;align-items:center;justify-content:center;padding:0 18px;border-radius:999px;background:linear-gradient(90deg,#ffd6e9,#ead7ff,#d9f1ff);border:3px solid #fff;box-shadow:0 5px 14px rgba(54,84,105,.10);font-size:16px;font-weight:900;white-space:nowrap}

/* cover */
.intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.cover-card{position:relative;width:min(1180px,100%);height:100%;max-height:730px;background:rgba(255,255,255,.94);border:3px solid #fff;border-radius:36px;box-shadow:0 18px 44px rgba(48,77,105,.14);overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr}
.cover-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 16% 20%,rgba(255,143,182,.14),transparent 25%),radial-gradient(circle at 83% 18%,rgba(169,111,197,.16),transparent 24%),radial-gradient(circle at 52% 100%,rgba(90,168,237,.12),transparent 34%);pointer-events:none}.cover-copy{position:relative;z-index:2;padding:40px 44px;display:flex;flex-direction:column;justify-content:center}.cover-chip{align-self:flex-start;display:inline-flex;padding:9px 16px;border-radius:999px;background:#f7efff;color:#8259a8;border:1px solid #e4d4f1;font-weight:900;font-size:15px}.cover-title{font-size:clamp(48px,5vw,76px);line-height:.96;margin:17px 0 12px;letter-spacing:-.035em}.cover-title em{font-style:normal;color:#9a68c4}.cover-subtitle{margin:0;color:var(--muted);font-size:clamp(17px,1.4vw,23px);font-weight:800;line-height:1.28}.cover-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}.rule{padding:9px 11px;border-radius:12px;background:#fff;border:1px solid #dce8ee;color:#45627b;font-weight:900;font-size:13px}.cover-actions{display:flex;justify-content:flex-start;gap:10px;flex-wrap:wrap;margin-top:18px}.primary-btn,.secondary-btn{padding:12px 20px;border-radius:14px;font-size:18px}.primary-btn{background:linear-gradient(135deg,#5aa8ed,#438fda);color:#fff;box-shadow:0 7px 17px rgba(62,123,181,.20)}.secondary-btn{background:#f1f7fa;color:var(--navy);border:2px solid #d8e7ee}.primary-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.cover-art{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff1f7,#f5efff 46%,#eaf7ff)}.cover-board{position:absolute;display:grid;gap:3px;padding:9px;border-radius:17px;background:#102f4a;box-shadow:0 18px 34px rgba(52,61,100,.20)}.cover-board.class{left:36px;bottom:52px;grid-template-columns:repeat(10,19px);grid-template-rows:repeat(10,19px);transform:rotate(-3deg)}.cover-board.bot{right:36px;top:58px;grid-template-columns:repeat(6,19px);grid-template-rows:repeat(9,19px);transform:rotate(4deg)}.cover-board i{display:block;border-radius:3px;background:#1f4969}.cover-board i.f1{background:#00c9d8}.cover-board i.f2{background:#f4d03f}.cover-board i.f3{background:#a765d1}.cover-board i.f4{background:#45b96b}.vs-badge{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) rotate(-7deg);width:105px;height:105px;border-radius:50%;background:#fff;color:#203f5d;display:grid;place-items:center;font-size:36px;font-weight:1000;box-shadow:0 13px 28px rgba(80,55,100,.18);border:7px solid #ffb5d4}.bot-face{position:absolute;right:48px;bottom:66px;font-size:70px}.class-face{position:absolute;left:44px;top:54px;font-size:64px}
