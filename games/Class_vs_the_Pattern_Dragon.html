  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  function coverAnimationHTML(){return `<div class="cover-animation" aria-hidden="true"><div class="cover-shield">🛡️</div><div class="float-shape shape-1">${shapeSVG({shape:'circle',color:'red',size:'medium',orientation:0},82)}</div><div class="float-shape shape-2">${shapeSVG({shape:'square',color:'blue',size:'medium',orientation:0},72)}</div><div class="float-shape shape-3">${shapeSVG({shape:'triangle',color:'yellow',size:'medium',orientation:0},84)}</div><div class="float-shape shape-4">${shapeSVG({shape:'diamond',color:'green',size:'medium',orientation:0},76)}</div><div class="float-shape shape-5">${shapeSVG({shape:'rectangle',color:'purple',size:'medium',orientation:0},80)}</div><div class="cover-dragon">🐉</div></div>`;}

  function introControls(){
    clearOverlay();phase='checkin';
    setupConfig=loadSetup();
    const isSetupComplete=setupReady(setupConfig);
    const saved=loadState(), canResume=isSetupComplete&&saved&&!saved.finished&&saved.roundIndex<10;
    app.innerHTML=`<main class="screen">
      <div class="topbar">
        <div class="brand"><div class="brand-badge">🐉</div><div><h1>Class vs the Pattern Dragon</h1><p>Co-operative class quest</p></div></div>
        <div class="control-wrap"></div>
        <div class="toolbar"><button class="icon-btn" id="muteBtn">${muted?'🔇':'🔊'}</button><button class="icon-btn" id="fullBtn">⛶</button></div>
      </div>
      <section class="intro-center">
        <div class="cover-card">
          <div class="cover-inner">
            <span class="cover-chip">Co-operative Class Quest</span>
            <h2 class="cover-title">Class vs the<br><em>Pattern Dragon</em></h2>
            <p class="cover-subtitle">Work together to defeat the dragon.</p>
            <div class="cover-actions"><button class="secondary-btn" id="setupGameBtn">⚙ Setup Game</button><button class="primary-btn ${isSetupComplete?'':'start-disabled'}" id="newGameBtn" ${isSetupComplete?'':'disabled'}>⚔️ Start New Quest</button>${canResume?'<button class="secondary-btn" id="resumeBtn">▶ Resume Quest</button>':''}</div>
            <div class="cover-mini-steps">
              <div class="cover-step">Work <strong>together</strong></div>
              <div class="cover-arrow">→</div>
              <div class="cover-step">Spot the <strong>pattern</strong></div>
              <div class="cover-arrow">→</div>
              <div class="cover-step">Damage the <strong>dragon</strong></div>
            </div>
            <div class="cover-note">Wrong answers cost <strong>1 heart</strong>.</div>
          </div>
          ${coverAnimationHTML()}
        </div>
      </section>
    </main>`;
    $('#muteBtn').onclick=()=>{muted=!muted;$('#muteBtn').textContent=muted?'🔇':'🔊';};
    $('#fullBtn').onclick=()=>{ensureAudio();if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
    $('#setupGameBtn').onclick=()=>renderSetup();
    if(isSetupComplete) $('#newGameBtn').onclick=()=>{ensureAudio();if(saved&&!saved.finished&&!confirm('Start a new quest? The saved quest will be replaced.'))return;applySetup(setupConfig);state=freshState();saveState();renderRound();};
    if(canResume) $('#resumeBtn').onclick=()=>{ensureAudio();applySetup(setupConfig);state=saved;renderRound();};
  }
  const renderIntro=introControls;

  

function renderHearts(){
    const out=[]; for(let i=0;i<10;i++) out.push(`<span class="heart ${i>=state.hearts?'lost':''}">❤️</span>`); return out.join('');
  }
  function dragonBar(){const pct=Math.max(0,state.dragonHP); return `<div class="dragon-wrap"><div class="dragon-avatar">🐉</div><div class="dragon-meta"><div class="dragon-label">Pattern Dragon</div><div class="hp-bar"><div class="hp-fill" style="width:${pct}%"></div></div><div class="hp-text">${state.dragonHP} / 100 HP</div></div></div>`;}

  function renderRound(){
    if(!state) state=loadState() || freshState();
    if(state.finished || state.roundIndex>=10 || state.hearts<=0 || state.dragonHP<=0){ renderEnd(); return; }
    clearOverlay();
    phase='checkin'; readyLanes=new Set(); playerSteps=[0,0,0]; playerScores=[0,0,0]; playerTimeMs=[0,0,0]; playerFinished=[false,false,false]; laneProcessing=[false,false,false]; roundCompleting=false; currentStage=0; wrongPauseLane=null; currentStageStart=0; stageElapsedBase=0;
    const round=state.rounds[state.roundIndex], roster=state.playerSchedule[state.roundIndex];
    app.innerHTML=`<main class="screen">
      <div class="topbar">
        <div class="brand"><div class="brand-badge">🐉</div><div><h1>Class vs the Pattern Dragon</h1></div></div>
        <div class="control-wrap"><button class="primary-btn waiting" id="stageBtn" disabled>Waiting for players…</button></div>
        ${toolbar()}
      </div>
      <section class="status-row">
        <div class="status-card"><h3>Class Hearts</h3><div class="hearts">${renderHearts()}</div></div>
        <div class="status-card" id="enemyHealthCard"><h3>Dragon Health</h3>${dragonBar()}</div>
        <div class="status-card quest-card"><h3>Quest Progress</h3><div class="round-big">${state.roundIndex+1}<span style="font-size:.45em;font-weight:900"> / 10</span></div><div class="round-small">${round.type==='complete'?'Complete the pattern':'Identify the change'}</div></div>
      </section>
      <section class="game-main">
        <div class="arena">
          <div class="challenge-panel">
            <div class="pre-question" id="preQuestion">Get ready for the next challenge!</div>
            <div class="challenge-live hidden" id="challengeLive"></div>
          </div>
          <div class="players">${roster.map((p,i)=>playerCard(p,i)).join('')}</div>
        </div>
        <div class="controls"><div class="status" id="statusText"><strong>Ready?</strong> Wait for all three players to check in.</div></div>
      </section>
    </main>`;
    bindToolbar();
    $('#stageBtn').onclick=advanceStage;
    document.querySelectorAll('.ready-btn').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();checkInPlayer(Number(btn.dataset.lane));},{passive:false}));
    buildChallengeHidden();
  }

  function playerCard(p,i){
    return `<div class="player-card readying" data-lane="${i}" data-color="${p.color}" style="background:${p.color}">
      <div class="player-head"><span class="player-name">${escapeHTML(p.player)}</span></div>
      <div class="sword-tracker" id="swords-${i}">${emojiTracker('sword',0)}</div>
      <button class="ready-btn" data-lane="${i}">Ready?</button>
      <div class="answer-zone dimmed hidden" id="zone-${i}"></div>
    </div>`;
  }

  function clearOverlay(){overlayRoot.innerHTML=''; if(countTimer){clearTimeout(countTimer);countTimer=null;}}

  function checkInPlayer(lane){
    if(phase!=='checkin' || readyLanes.has(lane)) return;
    ensureAudio();
    readyLanes.add(lane);
    const card=document.querySelector(`.player-card[data-lane="${lane}"]`); const btn=card.querySelector('.ready-btn');
    btn.disabled=true; btn.textContent='Ready!👍';
    card.classList.remove('readying'); card.classList.add('checked');
    applyReadyGlow(card, card.dataset.color);
    tone(560+lane*80,.16,'triangle',.08);
    $('#statusText').innerHTML=`<strong>${readyLanes.size} of 3</strong> players ready.`;
    if(readyLanes.size===3){
      const stageBtn=$('#stageBtn');
      stageBtn.disabled=false; stageBtn.classList.remove('waiting'); stageBtn.classList.add('ready-to-show'); stageBtn.textContent='📘 Show Question';
      $('#statusText').innerHTML='<strong>All players are ready!</strong> Teacher, tap Show Question.';
      tone(660,.12,'triangle',.08); setTimeout(()=>tone(880,.18,'triangle',.09),130);
    }
  }

  function applyReadyGlow(card, color){
    card.style.boxShadow=`0 0 18px ${hexToRgba(color,.50)}, 0 0 36px ${hexToRgba(color,.25)}, var(--shadow)`;
    card.style.filter='brightness(1.02)';
    card.style.border='0';
  }

  function advanceStage(){
    if(phase==='checkin' && readyLanes.size===3) showQuestion();
    else if(phase==='question') goLive();
    else if(phase==='stageReview') nextSubStage();
    else if(phase==='review') showCorrectAnswers();
    else if(phase==='revealed') nextRound();
  }

  function buildChallengeHidden(){
    const round=state.rounds[state.roundIndex];
    const live=$('#challengeLive');
    live.innerHTML=renderChallengeHTML(round);
    for(let lane=0; lane<3; lane++) renderAnswerZone(lane, true);
  }

  function renderChallengeHTML(round){
    if(round.type==='complete'){
      const shown=[...round.lead];
      const leadCells=shown.map(s=>`<div class="pattern-blank-wrap pattern-lead-wrap">${shapeBox(s)}<div class="shield-tracker tracker-spacer" aria-hidden="true">${emojiTracker('shield',0)}</div></div>`).join('');
      const blanks=round.steps.map((_,i)=>`<div class="pattern-blank-wrap"><div class="pattern-slot blank" id="blank-${i}">?</div><div class="shield-tracker" id="shields-${i}">${emojiTracker('shield',0)}</div></div>`).join('');
      return `<div class="instruction">${round.instruction}</div><div class="question-sub">${round.sub}</div><div class="pattern-line">${leadCells}${blanks}</div>`;
    }
    const p=round.patterns[0];
    return `<div class="instruction">${round.instruction}</div><div class="identify-board"><div class="single-pattern-card" id="singlePatternCard"><div class="mini-title">Pattern 1 of 3</div><div class="mini-shapes">${p.seq.map(shapeBox).join('')}</div><div class="shield-tracker" id="identifyShields">${emojiTracker('shield',0)}</div></div></div>`;
  }

  function currentSharedStep(){
    return currentStage;
  }

  function renderIdentifyStage(){
    const round=state.rounds[state.roundIndex];
    if(round.type!=='identify') return;
    const index=Math.min(currentStage,2), p=round.patterns[index], card=$('#singlePatternCard');
    if(!card) return;
    const correctCount=(phase==='stageReview') ? 3 : playerSteps.filter(step=>step>currentStage).length;
    const reveal=phase==='stageReview';
    card.innerHTML=`<div class="mini-title">Pattern ${index+1} of 3</div><div class="mini-shapes">${p.seq.map(shapeBox).join('')}</div>${reveal?`<div class="answer-reveal">✓ Change in ${p.answer}</div>`:''}<div class="shield-tracker" id="identifyShields">${emojiTracker('shield',correctCount)}</div>`;
  }

  function showQuestion(){
    phase='question';
    $('#preQuestion').classList.add('hidden');
    $('#challengeLive').classList.remove('hidden');
    document.querySelectorAll('.answer-zone').forEach(z=>{z.classList.remove('hidden'); z.classList.add('dimmed');});
    document.querySelectorAll('.ready-btn').forEach(b=>b.classList.add('hidden'));
    const btn=$('#stageBtn'); btn.classList.remove('ready-to-show'); btn.classList.add('ready-to-go'); btn.textContent='🚀 GO!';
  }

  function goLive(){
    phase='live';
    startStageClock();
    const btn=$('#stageBtn'); btn.disabled=true; btn.classList.remove('ready-to-go'); btn.classList.add('live'); btn.textContent='✅ Buzzers Live';
    document.querySelectorAll('.answer-zone').forEach(z=>z.classList.remove('dimmed'));
    document.querySelectorAll('.player-card').forEach(card=>card.classList.add('live'));
    enableCurrentStep();
  }

  function revealCurrentStage(){
    phase='stageReview';
    document.querySelectorAll('.player-card').forEach(card=>card.classList.remove('live'));
    refreshSharedProgress();
    for(let lane=0; lane<3; lane++) renderAnswerZone(lane,true);
    renderIdentifyStage();
    const btn=$('#stageBtn');
    btn.disabled=false; btn.classList.remove('live','waiting','ready-to-show'); btn.classList.add('ready-to-go');
    btn.textContent=currentStage<2 ? '➡ Next Part' : '🏁 Finish Round';
  }

  function nextSubStage(){
    if(phase!=='stageReview') return;
    if(currentStage<2){
      currentStage++;
      phase='live';
      startStageClock();
      const btn=$('#stageBtn');
      btn.disabled=true; btn.classList.remove('ready-to-go'); btn.classList.add('live'); btn.textContent='✅ Buzzers Live';
      document.querySelectorAll('.player-card').forEach(card=>card.classList.add('live'));
      enableCurrentStep();
    }else{
      playerFinished=[true,true,true];
      roundCompleting=true;
      const round=state.rounds[state.roundIndex];
      if(round.type==='complete') completeRoundAlreadyRevealed(true);
      else completeRound(true);
    }
  }

  function renderAnswerZone(lane, disabled){
    const zone=$(`#zone-${lane}`); if(!zone) return;
    const round=state.rounds[state.roundIndex];
    zone.innerHTML='';

    if(playerFinished[lane]){
      zone.className='answer-zone';
      zone.innerHTML='<div class="finished-message">✅ Complete!<br>Wait for your teammates.</div>';
      const card=document.querySelector(`.player-card[data-lane="${lane}"]`);
      if(card){card.classList.remove('live');card.classList.add('finished');}
      return;
    }

    zone.className=`answer-zone ${disabled?'dimmed':''}`;

    if(phase==='heartPause'){
      zone.className='answer-zone';
      if(lane===wrongPauseLane){
        zone.innerHTML='<div class="heart-loss-message">Your wrong answer has caused the class to lose a heart.<br>Discuss with your teammates.</div>';
      }else{
        zone.innerHTML='<div class="waiting-message">⏸ Pause.<br>Discuss with your teammates.</div>';
      }
      return;
    }

    if(phase==='stageReview' || playerSteps[lane]>currentStage){
      const waiting=(phase==='stageReview') ? '✅ Answer shown!<br>Wait for the next part.' : '✅ Correct!<br>Wait for your teammates.';
      zone.innerHTML=`<div class="waiting-message">${waiting}</div>`;
      return;
    }

    if(round.type==='identify'){
      const grid=document.createElement('div'); grid.className='option-grid';
      shuffle(['size','shape','colour','orientation']).forEach(label=>{
        const btn=document.createElement('button'); btn.className='option-btn'; btn.textContent=label; if(disabled) btn.disabled=true;
        btn.addEventListener('pointerdown',e=>{e.preventDefault(); if(disabled) return; handleIdentifyChoice(lane,label,btn);},{passive:false});
        grid.appendChild(btn);
      });
      zone.appendChild(grid); return;
    }

    const step=currentStage;
    const grid=document.createElement('div'); grid.className='shape-grid';
    const options=shuffle(round.steps[step].options.map((opt,idx)=>({id:idx,shape:opt})));
    options.forEach(item=>{
      const btn=document.createElement('button'); btn.className='shape-option'; if(disabled) btn.disabled=true;
      btn.innerHTML=shapeSVG(item.shape,58);
      btn.addEventListener('pointerdown',e=>{e.preventDefault(); if(disabled) return; handleCompleteChoice(lane,item.shape,btn);},{passive:false});
      grid.appendChild(btn);
    });
    zone.appendChild(grid);
  }

  function enableCurrentStep(){
    for(let lane=0; lane<3; lane++) renderAnswerZone(lane,false);
    refreshSharedProgress();
  }

  function handleCompleteChoice(lane, selected, btn){
    if(phase!=='live' || laneProcessing[lane] || playerFinished[lane] || roundCompleting) return;
    const step=currentStage;
    const correct=state.rounds[state.roundIndex].steps[step].answer;
    if(shapeEquals(selected,correct)){
      laneProcessing[lane]=true;
      playerScores[lane]++;
      playerTimeMs[lane]+=stageElapsedMs();
      playerSteps[lane]=Math.max(playerSteps[lane], currentStage+1);
      updateScores(); flashCard(lane,'good'); btn.classList.add('correct-flash'); goodSound();
      setTimeout(()=>{
        laneProcessing[lane]=false;
        if(playerSteps.every(s=>s>currentStage)) revealCurrentStage();
        else renderAnswerZone(lane,false);
      },360);
    } else {
      loseHeart(lane,btn);
    }
  }

  function handleIdentifyChoice(lane, selected, btn){
    if(phase!=='live' || laneProcessing[lane] || playerFinished[lane] || roundCompleting) return;
    const step=currentStage;
    const correct=state.rounds[state.roundIndex].patterns[step].answer;
    if(selected===correct){
      laneProcessing[lane]=true;
      playerScores[lane]++;
      playerTimeMs[lane]+=stageElapsedMs();
      playerSteps[lane]=Math.max(playerSteps[lane], currentStage+1);
      updateScores(); flashCard(lane,'good'); btn.classList.add('correct-flash'); goodSound();
      setTimeout(()=>{
        laneProcessing[lane]=false;
        if(playerSteps.every(s=>s>currentStage)) revealCurrentStage();
        else { renderAnswerZone(lane,false); renderIdentifyStage(); }
      },360);
    }else loseHeart(lane,btn);
  }

  function loseHeart(lane, btn){
    if(phase!=='live' || laneProcessing[lane] || playerFinished[lane] || roundCompleting) return;
    laneProcessing[lane]=true;
    wrongPauseLane=lane;
    badSound(); if(btn) btn.classList.add('wrong-flash'); flashCard(lane,'bad');
    state.hearts=Math.max(0, state.hearts-1); saveState(); updateHeartDisplay();
    if(state.hearts<=0){
      roundCompleting=true; phase='complete';
      setTimeout(()=>{ completeRound(false, true); }, 420);
      return;
    }
    phase='heartPause';
    pauseStageClock();
    for(let i=0;i<3;i++) renderAnswerZone(i,true);
    setTimeout(()=>{
      for(let i=0;i<3;i++) laneProcessing[i]=false;
      if(btn) btn.classList.remove('wrong-flash');
      wrongPauseLane=null;
      if(!roundCompleting){
        phase='live';
        resumeStageClock();
        enableCurrentStep();
      }
    },5000);
  }

  function progressStatus(includeStrong=true){
    return '';
  }

  function checkAllPlayersFinished(){
    return;
  }

  function refreshSharedProgress(){
    const round=state.rounds[state.roundIndex];
    if(round.type==='complete'){
      for(let i=0;i<3;i++){
        const completedCount=(phase==='stageReview' && i===currentStage) ? 3 : playerSteps.filter(step=>step>i).length;
        updateShieldTracker(i,completedCount);
        const blank=$(`#blank-${i}`);
        if(blank){
          if(i<currentStage || (phase==='stageReview' && i===currentStage)){
            blank.classList.remove('blank'); blank.classList.add('filled'); blank.innerHTML=shapeSVG(round.steps[i].answer,66);
          }else{
            blank.classList.remove('filled'); blank.classList.add('blank'); blank.textContent='?';
          }
        }
      }
      return;
    }
    renderIdentifyStage();
  }

  function completeRoundAlreadyRevealed(success, zeroHearts=false){
    phase='revealed';
    document.querySelectorAll('.answer-zone button').forEach(b=>b.disabled=true);
    document.querySelectorAll('.player-card').forEach(card=>card.classList.remove('live'));
    const roster=state.playerSchedule[state.roundIndex];
    roster.forEach((p,i)=>{ state.playerTotals[p.player]=(state.playerTotals[p.player]||0)+playerScores[i]; const stat=state.playerStats[p.player]||{correct:0,time:0}; stat.correct+=playerScores[i]; stat.time+=playerTimeMs[i]; state.playerStats[p.player]=stat; });
    let damage=0;
    if(success){ state.dragonHP=Math.max(0,state.dragonHP-10); damage=10; confetti(32); showBattleOverlay(damage, state.dragonHP<=0); }
    const health=$('#enemyHealthCard');
    if(health) health.innerHTML=`<h3>Dragon Health</h3>${dragonBar()}`;
    state.lastResult={success, damage, zeroHearts, playerScores:[...playerScores]};
    saveState();
    const btn=$('#stageBtn');
    btn.disabled=false;
    btn.classList.remove('waiting','live','ready-to-show');
    btn.classList.add('ready-to-go');
    btn.textContent=(state.dragonHP<=0 || state.hearts<=0 || state.roundIndex===9)?'🏁 See Final Result':'Next Round →';
  }

  function completeRound(success, zeroHearts=false){
    phase='review';
    document.querySelectorAll('.answer-zone button').forEach(b=>b.disabled=true);
    document.querySelectorAll('.player-card').forEach(card=>card.classList.remove('live'));
    const roster=state.playerSchedule[state.roundIndex];
    roster.forEach((p,i)=>{ state.playerTotals[p.player]=(state.playerTotals[p.player]||0)+playerScores[i]; const stat=state.playerStats[p.player]||{correct:0,time:0}; stat.correct+=playerScores[i]; stat.time+=playerTimeMs[i]; state.playerStats[p.player]=stat; });
    let damage=0;
    if(success){ state.dragonHP=Math.max(0,state.dragonHP-10); damage=10; confetti(32); showBattleOverlay(damage, state.dragonHP<=0); }
    const health=$('#enemyHealthCard'); if(health) health.innerHTML=`<h3>Dragon Health</h3>${dragonBar()}`;
    state.lastResult={success, damage, zeroHearts, playerScores:[...playerScores]};
    saveState();
    const btn=$('#stageBtn');
    btn.disabled=false; btn.classList.remove('waiting','live','ready-to-go'); btn.classList.add('ready-to-show'); btn.textContent='🔍 Show Correct Answers';
    const result=success?`<strong>Round complete!</strong> The class dealt ${damage} damage.`:`<strong>Round stopped.</strong> The class is out of hearts.`;
    $('#statusText').innerHTML=`${result} Teacher, tap Show Correct Answers.`;
  }

  function showCorrectAnswers(){
    if(phase!=='review') return;
    phase='revealed';
    const round=state.rounds[state.roundIndex];
    if(round.type==='complete'){
      round.steps.forEach((step,i)=>{
        const blank=$(`#blank-${i}`);
        if(blank){blank.classList.remove('blank');blank.classList.add('filled');blank.innerHTML=shapeSVG(step.answer,42);}
        updateShieldTracker(i,3);
      });
    }else{
      const live=$('#challengeLive');
      live.innerHTML=`<div class="instruction">Correct answers</div><div class="question-sub">Review each pattern and name the one feature that changes.</div><div class="identify-review-grid">${round.patterns.map((p,i)=>`<div class="identify-review-card"><div class="mini-title">Pattern ${i+1}</div><div class="mini-shapes">${p.seq.map(shapeBox).join('')}</div><div class="answer-reveal">✓ Change in ${p.answer}</div></div>`).join('')}</div>`;
    }
    const btn=$('#stageBtn');
    btn.classList.remove('live','ready-to-show'); btn.classList.add('ready-to-go'); btn.disabled=false;
    btn.textContent=(state.dragonHP<=0 || state.hearts<=0 || state.roundIndex===9)?'🏁 See Final Result':'Next Round →';
    $('#statusText').innerHTML='<strong>Correct answers shown.</strong> Review them with the class, then continue.';
  }

  function nextRound(){
    overlayRoot.innerHTML='';
    state.roundIndex++;
    if(state.dragonHP<=0 || state.hearts<=0 || state.roundIndex>=10){ state.finished=true; saveState(); renderEnd(); }
    else { saveState(); renderRound(); }
  }

  function renderEnd(){
    clearOverlay(); if(!state) state=loadState() || freshState();
    const saved=state;
    const heroes=Object.entries(saved.playerStats||{}).filter(([,row])=>row&&row.correct>0).map(([name,row])=>({name,correct:row.correct,time:row.time||0,avg:(row.time||0)/row.correct})).sort((a,b)=>a.avg-b.avg||b.correct-a.correct||a.time-b.time||a.name.localeCompare(b.name));
    const victory=saved.dragonHP<=0;
    const outcomeTitle = victory ? 'The Pattern Dragon is Defeated!' : 'The Dragon Escaped!';
    const outcomeText = victory ? 'The class worked together and saved the day.' : (saved.hearts<=0 ? 'The class ran out of hearts.' : 'The quest ended before the dragon could be defeated.');
    const outcomeChip = victory ? {text:'Victory!', bg:'linear-gradient(135deg,#55e6a5,#31bf7b)'} : {text:'Try Again', bg:'linear-gradient(135deg,#ff8a9a,#ff6b7a)'};
    app.innerHTML=`<main class="screen">
      <div class="topbar">
        <div class="brand"><div class="brand-badge">${victory?'🏆':'🐉'}</div><div><h1>${outcomeTitle}</h1><p>${outcomeText}</p></div></div>
        <div class="control-wrap"></div>
        ${toolbar()}
      </div>
      <section class="status-row">
        <div class="status-card"><h3>Hearts Remaining</h3><div class="hearts">${renderHearts()}</div></div>
        <div class="status-card"><h3>Dragon Health</h3>${dragonBar()}</div>
        <div class="status-card quest-card"><h3>Quest Finished</h3><div class="round-big">${Math.min(saved.roundIndex,10)}<span style="font-size:.45em;font-weight:900"> / 10</span></div><div class="round-small">Rounds completed</div></div>
      </section>
      <section class="end-wrap">
        <div class="winner-panel"><div class="trophy">${victory?'🏆':'🐲'}</div><p>${victory?'Class Result':'Quest Result'}</p><div class="winner-chip" style="background:${outcomeChip.bg}">${outcomeChip.text}</div><h2>${100-saved.dragonHP} damage</h2><p>${outcomeText}</p><div class="overlay-actions"><button class="primary-btn" id="againBtn">⚔️ New Quest</button></div></div>
        <div class="summary-panel"><h3>Top Dragon Tamers</h3><p style="margin:0 0 12px;color:var(--muted);font-weight:800">Fastest average correct answer time</p>${heroes.length?heroes.slice(0,12).map((row,i)=>`<div class="summary-row"><div class="summary-num">${i+1}</div><div class="summary-name" style="background:${i%2? '#cfe4ff':'#ffe6a8'}">${row.name}</div><div class="summary-score">${(row.avg/1000).toFixed(1)}s</div></div>`).join(''):'<p>No correct answers recorded yet.</p>'}</div>
      </section>
    </main>`;
    bindToolbar(); if(victory) confetti(90);
    $('#againBtn').onclick=()=>{ if(confirm('Start a fresh quest?')){ state=freshState(); saveState(); renderRound(); } };
  }

  function emojiTracker(type,count){
    const icon=type==='sword'?'⚔️':'🛡️';
    return [0,1,2].map(i=>`<span class="${type} ${i<count?'lit':''}">${icon}</span>`).join('');
  }
  function updateScores(){ playerScores.forEach((n,i)=>{ const el=$(`#swords-${i}`); if(el) el.innerHTML=emojiTracker('sword',n); }); }
  function updateShieldTracker(index,count){ const el=$(`#shields-${index}`); if(el) el.innerHTML=emojiTracker('shield',count); }
  function updateHeartDisplay(){ const box=document.querySelector('.hearts'); if(box) box.innerHTML=renderHearts(); }
  function flashCard(lane, kind){ const card=document.querySelector(`.player-card[data-lane="${lane}"]`); if(!card) return; const cls=kind==='good'?'correct-hero':'wrong-hit'; card.classList.add(cls); setTimeout(()=>card.classList.remove(cls), kind==='good'?420:620); }

  function shapeEquals(a,b){ return a.shape===b.shape && a.color===b.color && a.size===b.size && (a.orientation||0)===(b.orientation||0); }
  function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function hexToRgba(hex,alpha){
    const h=hex.replace('#',''); const val=h.length===3? h.split('').map(c=>c+c).join('') : h;
    const num=parseInt(val,16); const r=(num>>16)&255, g=(num>>8)&255, b=num&255;
    return `rgba(${r},${g},${b},${alpha})`;
  }
  function sizeScale(size){ return size==='small'?0.62 : size==='large'?1.24 : 1.02; }
  function shapeSVG(shape, canvas=48){
    const c = colors[shape.color] || shape.color || '#888';
    const scale=sizeScale(shape.size||'medium');
    const rot=shape.orientation||0;
    const cx=32, cy=32;
    let inner='';
    if(shape.shape==='circle') inner=`<circle cx="32" cy="32" r="18" fill="${c}" />`;
    else if(shape.shape==='square') inner=`<rect x="14" y="14" width="36" height="36" rx="0" fill="${c}" />`;
    else if(shape.shape==='rectangle') inner=`<rect x="11" y="18" width="42" height="28" rx="0" fill="${c}" />`;
    else if(shape.shape==='triangle') inner=`<polygon points="32,10 52,50 12,50" fill="${c}" />`;
    else if(shape.shape==='diamond') inner=`<polygon points="32,8 54,32 32,56 10,32" fill="${c}" />`;
    else inner=`<circle cx="32" cy="32" r="18" fill="${c}" />`;
    return `<svg viewBox="0 0 64 64" width="${canvas}" height="${canvas}" aria-hidden="true"><g transform="translate(${cx} ${cy}) scale(${scale}) rotate(${rot}) translate(${-cx} ${-cy})">${inner}</g></svg>`;
  }
  function shapeBox(shape){ return `<div class="pattern-shape">${shapeSVG(shape,80)}</div>`; }

  document.addEventListener('keydown',e=>{
    if(phase==='checkin' && ['1','2','3'].includes(e.key)) checkInPlayer(Number(e.key)-1);
    if(e.key.toLowerCase()==='g' && phase==='question') goLive();
    if(e.key.toLowerCase()==='s' && phase==='checkin' && readyLanes.size===3) showQuestion();
    if(e.key.toLowerCase()==='r' && phase==='review') showCorrectAnswers();
    if(e.key.toLowerCase()==='n' && (phase==='stageReview' || phase==='revealed')) advanceStage();
  });

  renderIntro();
})();
</script>
</body>
</html>
