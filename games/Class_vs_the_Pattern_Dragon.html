<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Class vs the Pattern Dragon — Community v17</title>
<style>
  :root{
    --bg1:#09111f;--bg2:#111d34;--panel:#17233c;--panel2:#1d2c4a;
    --text:#f7fbff;--muted:#b9c6dc;--gold:#ffd166;--good:#55e6a5;--bad:#ff6b7a;
    --shadow:0 12px 34px rgba(0,0,0,.32);
    --red:#ff7f88;--yellow:#ffe29a;--green:#bfdda8;--orange:#ffc58f;--purple:#cfa7f3;--blue:#a9c8e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}
  button{font:inherit}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
      radial-gradient(circle at 14% 15%,rgba(66,153,225,.18),transparent 30%),
      radial-gradient(circle at 86% 18%,rgba(255,209,102,.13),transparent 30%),
      linear-gradient(135deg,var(--bg1),var(--bg2));}
  #app{position:relative;width:100%;height:100%;z-index:1}
  .screen{width:100%;height:100%;padding:clamp(10px,1.2vw,20px);display:flex;flex-direction:column;gap:clamp(8px,.9vh,14px)}
  .hidden{display:none!important}
  .topbar{display:grid;grid-template-columns:minmax(280px,1fr) auto auto;align-items:center;gap:12px;min-height:48px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-badge{font-size:clamp(28px,3vw,46px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
  .brand h1{margin:0;font-size:clamp(23px,2.35vw,40px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{margin:5px 0 0;color:var(--muted);font-size:clamp(12px,1.05vw,17px)}
  .control-wrap{display:flex;justify-content:center}
  .toolbar{display:flex;gap:8px;justify-content:flex-end}
  .icon-btn,.primary-btn,.secondary-btn,.option-btn,.shape-option,.small-chip{border:0;border-radius:14px;cursor:pointer;font-weight:900;box-shadow:var(--shadow);transition:transform .12s ease,filter .12s ease,opacity .12s ease,background .12s ease,border-color .12s ease}
  .icon-btn:active,.primary-btn:active,.secondary-btn:active,.option-btn:active,.shape-option:active,.ready-btn:active{transform:scale(.97)}
  .icon-btn{width:46px;height:46px;background:#223253;color:#fff;font-size:21px}
  .primary-btn{padding:14px 24px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#1d2433;font-size:clamp(17px,1.45vw,24px)}
  .secondary-btn{padding:13px 20px;background:#2b4169;color:#fff;font-size:clamp(15px,1.2vw,20px)}
  .primary-btn.waiting{filter:grayscale(.76) brightness(.62);opacity:.66;cursor:not-allowed;box-shadow:none}
  .primary-btn.ready-to-show,.primary-btn.ready-to-go{animation:startGlow .8s ease-in-out infinite alternate}
  .primary-btn.live{background:linear-gradient(135deg,#55e6a5,#31bf7b);color:#173425}
  @keyframes startGlow{to{filter:brightness(1.16);box-shadow:0 0 24px rgba(255,209,102,.75),var(--shadow)}}


  .intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .cover-card{position:relative;width:min(1160px,100%);height:100%;background:linear-gradient(145deg,rgba(31,47,79,.96),rgba(18,30,52,.96));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,54px)}
  .cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 20%,rgba(88,166,255,.10),transparent 28%),radial-gradient(circle at 82% 18%,rgba(255,209,102,.08),transparent 24%),radial-gradient(circle at 50% 100%,rgba(85,230,165,.08),transparent 36%)}
  .cover-inner{position:relative;z-index:2;max-width:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.45);color:var(--gold);font-weight:900;font-size:clamp(12px,1.02vw,17px);letter-spacing:.04em;text-transform:uppercase}
  .cover-title{font-size:clamp(42px,5.7vw,88px);line-height:.95;margin:20px 0 14px;max-width:920px;text-shadow:0 8px 25px rgba(0,0,0,.35)}
  .cover-title em{color:var(--gold);font-style:normal}
  .cover-subtitle{font-size:clamp(18px,1.62vw,28px);color:#dbe7fb;max-width:760px;line-height:1.3;margin:0}
  .cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
  .cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:min(340px,80vw)}
  .cover-mini-steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px;position:relative;z-index:2}
  .cover-step{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#e6eefb;font-size:clamp(14px,1.15vw,19px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.16)}
  .cover-step strong{color:var(--gold)}
  .cover-arrow{font-size:clamp(18px,1.4vw,24px);color:rgba(255,209,102,.92);font-weight:1000}
  .cover-note{margin-top:18px;color:#cdd9ec;font-size:clamp(14px,1.1vw,18px);font-weight:900}
  .cover-note strong{color:#ffb4be}
  .cover-animation{position:absolute;left:0;right:0;bottom:8px;height:136px;pointer-events:none;z-index:1}
  .float-shape{position:absolute;bottom:0;opacity:.95;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));animation:coverFloat 4s ease-in-out infinite alternate}
  .float-shape svg{display:block}
  .float-shape.shape-1{left:8%;animation-duration:4.2s;transform:rotate(-8deg)}
  .float-shape.shape-2{left:23%;bottom:18px;animation-duration:3.5s;animation-delay:.4s;transform:scale(.94)}
  .float-shape.shape-3{left:40%;bottom:-2px;animation-duration:4.6s;animation-delay:.2s}
  .float-shape.shape-4{left:58%;bottom:17px;animation-duration:3.9s;animation-delay:.7s;transform:scale(.96) rotate(7deg)}
  .float-shape.shape-5{left:74%;bottom:0;animation-duration:4.4s;animation-delay:.3s;transform:rotate(-6deg)}
  .cover-dragon{position:absolute;right:4%;bottom:2px;font-size:clamp(62px,6.2vw,100px);opacity:.88;filter:drop-shadow(0 10px 14px rgba(0,0,0,.28));animation:dragonBob 3s ease-in-out infinite alternate}
  .cover-shield{position:absolute;left:3%;bottom:16px;font-size:clamp(40px,4vw,66px);opacity:.88;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));animation:shieldBob 3.4s ease-in-out infinite alternate}
  @keyframes coverFloat{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-14px) scale(1.04)}}
  @keyframes dragonBob{0%{transform:translateY(0) rotate(-2deg)}100%{transform:translateY(-10px) rotate(3deg)}}
  @keyframes shieldBob{0%{transform:translateY(0)}100%{transform:translateY(-12px)}}


/* Universal Game Setup — streamlined v6 */
.setup-screen{gap:10px}
.setup-topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;min-height:58px}
.setup-title-wrap{min-width:0;display:flex;align-items:center}.setup-title-wrap h1{margin:0;font-size:clamp(36px,3.25vw,54px);line-height:1}
.setup-back{width:auto;min-width:50px;padding:0 14px;font-size:clamp(22px,1.8vw,28px)}
.setup-history{display:flex;align-items:center;gap:7px}.setup-history .icon-btn{font-size:25px}.setup-history .icon-btn:disabled{filter:grayscale(.85) brightness(.7);opacity:.42;cursor:not-allowed;box-shadow:none}
.setup-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(245px,1.16fr) repeat(3,minmax(185px,1fr));grid-template-rows:1fr 1fr;gap:10px}
.setup-panel{min-width:0;min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.player-bank{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;padding:12px;gap:9px}
.setup-panel-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(21px,1.85vw,29px);font-weight:1000;color:var(--gold)}
.setup-count{font-size:clamp(18px,1.45vw,23px);color:#d7e2f2;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:999px}
.player-entry{flex:0 0 auto;width:100%;height:52px;min-height:52px;resize:none;overflow:hidden;border:2px solid rgba(255,255,255,.13);outline:none;border-radius:12px;background:#101d33;color:#f7fbff;padding:10px 12px;font:800 clamp(18px,1.45vw,23px)/1.25 "Trebuchet MS",Arial,sans-serif}
.player-entry:focus{border-color:rgba(255,209,102,.72);box-shadow:0 0 0 3px rgba(255,209,102,.08)}
.player-entry::placeholder{color:#91a3bb;opacity:1}
.player-tags{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:2px 4px 4px}
.player-tag{width:100%;flex:0 0 auto;border:2px solid rgba(255,255,255,.18);border-radius:10px;background:#2b4775;color:#fff;padding:7px 10px;font-size:clamp(17px,1.35vw,22px);line-height:1.12;font-weight:1000;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.player-tag:active{cursor:grabbing}.player-tag.selected{outline:3px solid var(--gold);outline-offset:2px}.player-tag.assigned{color:#172033}
.touch-drag-ghost{position:fixed!important;z-index:99999!important;pointer-events:none!important;margin:0!important;opacity:.92;transform:translate(-50%,-50%) scale(1.04);box-shadow:0 16px 32px rgba(0,0,0,.38)!important}.player-bank.drag-over{outline:3px solid var(--gold);outline-offset:-3px;background:rgba(255,209,102,.06)}
.group-card{display:flex;flex-direction:column;padding:10px;gap:8px;transition:border-color .15s ease,background .15s ease}
.group-card.drag-over{border-color:var(--gold);background:rgba(255,209,102,.08)}
.group-header{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center}
.group-name-input{width:100%;min-width:0;border:0;outline:none;border-radius:11px;background:#2b4775;color:#fff;padding:10px 11px;font-weight:1000;font-size:clamp(19px,1.55vw,25px);line-height:1.15;text-align:center}
.group-name-input:focus{box-shadow:0 0 0 3px rgba(255,209,102,.20)}
.group-colour{width:48px;height:48px;border:2px solid rgba(255,255,255,.55);border-radius:9px;padding:0;background:transparent;cursor:pointer;overflow:hidden}
.group-colour::-webkit-color-swatch-wrapper{padding:0}.group-colour::-webkit-color-swatch{border:0;border-radius:6px}.group-colour::-moz-color-swatch{border:0;border-radius:6px}
.group-drop{flex:1;min-height:0;border:2px dashed rgba(255,255,255,.20);border-radius:13px;padding:7px;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));align-items:stretch;gap:5px;overflow:hidden}
.group-drop .player-tag{height:100%;min-height:0;display:flex;align-items:center;font-size:clamp(16px,1.2vw,20px);line-height:1.05;padding:4px 9px}
.group-entry{width:100%;height:100%;min-height:0;resize:none;overflow:hidden;border:2px solid rgba(255,255,255,.14);outline:none;border-radius:9px;background:rgba(255,255,255,.055);color:#fff;padding:5px 8px;font:800 clamp(14px,1.05vw,18px)/1.15 "Trebuchet MS",Arial,sans-serif}
.group-entry:focus{border-color:rgba(255,209,102,.62);background:rgba(255,255,255,.085)}
.group-entry::placeholder{color:#8fa1b9;opacity:1}
.group-player-count{flex:0 0 auto;text-align:center;color:#a9bad1;font-size:clamp(16px,1.25vw,20px);font-weight:1000;line-height:1;padding:3px 0 1px}
.group-card.full .group-drop{border-color:rgba(85,230,165,.55)}.group-card.full .group-player-count{color:#9ff0c8}
.setup-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.setup-action{border:0;border-radius:12px;min-height:44px;padding:7px 8px;background:#2c4774;color:#fff;font-weight:1000;font-size:clamp(16px,1.25vw,21px);cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.18);white-space:nowrap}
.setup-action:disabled{filter:grayscale(.8) brightness(.72);opacity:.5;cursor:not-allowed;box-shadow:none}.setup-action.valid{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825}.setup-action.primary{background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033}
.setup-toast{position:fixed;left:50%;bottom:72px;z-index:120;max-width:min(760px,calc(100vw - 36px));padding:12px 18px;border-radius:14px;background:rgba(25,39,66,.97);border:2px solid rgba(255,255,255,.16);box-shadow:0 16px 38px rgba(0,0,0,.38);color:#f4f8ff;font-size:clamp(17px,1.35vw,22px);line-height:1.25;font-weight:900;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,14px) scale(.98);transition:opacity .18s ease,transform .18s ease}
.setup-toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.setup-toast.good{background:rgba(23,72,58,.97);border-color:rgba(85,230,165,.58);color:#c5f7dd}
.setup-toast.bad{background:rgba(79,31,43,.98);border-color:rgba(255,114,128,.62);color:#ffd4d8}
.setup-toast strong{color:#fff}
.start-disabled{filter:grayscale(.88) brightness(.65);opacity:.52;cursor:not-allowed!important;box-shadow:none!important}
@media(max-width:1000px){.setup-grid{grid-template-columns:minmax(225px,1.08fr) repeat(3,minmax(155px,1fr));gap:7px}.setup-actions{gap:6px}.setup-action{min-height:42px;padding:7px 5px;font-size:clamp(16px,1.65vw,20px)}.group-card{padding:7px}.player-bank{padding:8px}.player-tag{font-size:clamp(16px,1.8vw,20px);padding:7px 9px}.group-drop .player-tag{font-size:clamp(14px,1.55vw,18px);padding:4px 7px}.group-name-input{font-size:clamp(17px,1.8vw,21px)}.group-player-count{font-size:clamp(14px,1.55vw,18px)}.setup-toast{bottom:64px;font-size:clamp(16px,1.7vw,20px)}}

.status-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(190px,.4fr);gap:10px}
  .status-card{background:linear-gradient(145deg,rgba(31,47,79,.96),rgba(18,30,52,.96));border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:9px 14px;box-shadow:var(--shadow);min-height:72px;display:flex;flex-direction:column;justify-content:center}
  .status-card.quest-card{padding:8px 12px}
  .status-card h3{margin:0 0 5px;font-size:clamp(13px,.92vw,16px);color:var(--gold);letter-spacing:.03em;text-transform:uppercase}
  .hearts{display:flex;gap:3px;flex-wrap:nowrap;align-items:center;font-size:clamp(20px,1.55vw,28px);white-space:nowrap}
  .heart{filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));transition:opacity .15s ease,transform .15s ease}
  .heart.lost{opacity:.2;filter:grayscale(.9)}
  .dragon-wrap{display:flex;align-items:center;gap:12px}
  .dragon-avatar{font-size:clamp(40px,4vw,72px);filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
  .dragon-meta{flex:1;min-width:0}
  .dragon-label{font-size:clamp(18px,1.4vw,24px);font-weight:1000}
  .hp-bar{height:18px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
  .hp-fill{height:100%;background:linear-gradient(90deg,#ff6b7a,#ff9d5c);transition:width .35s ease}
  .hp-text{margin-top:5px;font-weight:900;color:#d6e2f4;font-size:clamp(13px,1vw,16px)}
  .round-big{font-size:clamp(27px,2.2vw,42px);font-weight:1000;line-height:1}
  .round-small{color:#d6e2f4;font-size:clamp(11px,.86vw,14px);font-weight:900;white-space:nowrap}

  .game-main{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-height:0}
  .arena{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}
  .challenge-panel{min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border-radius:22px;border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);padding:clamp(12px,1.55vw,24px);display:flex;flex-direction:column;gap:10px;overflow:hidden}
  .pre-question{display:grid;place-items:center;min-height:100%;font-size:clamp(28px,2.9vw,52px);font-weight:1000;color:var(--gold);text-align:center}
  .challenge-live{display:flex;flex-direction:column;gap:10px;min-height:0;height:100%}
  .instruction{text-align:center;font-size:clamp(18px,1.45vw,25px);font-weight:1000;color:var(--gold)}
  .question-sub{text-align:center;color:#d6e2f4;font-size:clamp(14px,1.08vw,17px);font-weight:900}
  .pattern-line{display:flex;justify-content:center;align-items:flex-start;gap:8px;flex-wrap:wrap;padding:8px 0;min-height:104px}
  .pattern-blank-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
  .pattern-slot,.pattern-shape{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
  .pattern-slot.blank{border:3px dashed rgba(255,209,102,.45);background:rgba(255,255,255,.03)}
  .pattern-slot.filled{border-color:rgba(85,230,165,.55);background:rgba(85,230,165,.08)}
  .shield-tracker,.sword-tracker{display:flex;justify-content:center;align-items:center;gap:5px;position:relative;z-index:2}
  .shield,.sword{display:inline-block;font-size:clamp(18px,1.45vw,25px);opacity:.18;filter:grayscale(1);transform:scale(.92);transition:opacity .2s ease,filter .2s ease,transform .2s ease,text-shadow .2s ease}
  .shield.lit{opacity:1;filter:none;transform:scale(1.06);text-shadow:0 0 10px rgba(85,230,165,.75)}
  .sword.lit{opacity:1;filter:none;transform:scale(1.08);text-shadow:0 0 10px rgba(255,209,102,.8)}
  .identify-board{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
  .mini-patterns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:0}
  .mini-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
  .mini-card.active{border-color:rgba(255,209,102,.55);box-shadow:0 0 0 2px rgba(255,209,102,.08), inset 0 0 0 1px rgba(255,209,102,.12)}
  .mini-card.done{border-color:rgba(85,230,165,.55);background:rgba(85,230,165,.08)}
  .mini-title{text-align:center;font-size:clamp(12px,1vw,15px);font-weight:1000;color:#dce6f6}
  .mini-shapes{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;min-height:78px}

  .players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:clamp(150px,22vh,240px)}
  .player-card{border:0;border-radius:20px;padding:10px 12px;color:#172033;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:9px;position:relative;overflow:hidden;text-align:center;transition:filter .15s ease,transform .12s ease,opacity .18s ease,box-shadow .2s ease}
  .player-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16),transparent 65%);transform:translateX(-120%)}
  .player-card.readying{filter:brightness(1.03)}
  .player-card.readying::after,.player-card.live::after{animation:sweep 1.15s infinite}
  @keyframes sweep{to{transform:translateX(120%)}}
  .player-card.checked{border:0}
  .player-card.correct-hero{box-shadow:0 0 20px rgba(85,230,165,.48),0 0 36px rgba(85,230,165,.22),var(--shadow)}
  .player-card.finished{filter:brightness(1.04);box-shadow:0 0 18px rgba(85,230,165,.4),0 0 32px rgba(85,230,165,.18),var(--shadow)}
  .finished-message{min-height:76px;border:2px solid rgba(23,32,51,.18);border-radius:14px;background:rgba(255,255,255,.48);display:grid;place-items:center;padding:10px;color:#173425;font-size:clamp(15px,1.25vw,21px);font-weight:1000}
  .player-card.wrong-hit{box-shadow:0 0 18px rgba(255,107,122,.55),0 0 32px rgba(255,107,122,.2),var(--shadow);animation:shake .28s ease}
  @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  .player-head{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:2;width:100%}

  function emojiTracker(type,count){

  function updateScores(){ playerScores.forEach((n,i)=>{ const el=$(`#swords-${i}`); if(el) el.innerHTML=emojiTracker('sword',n); }); }
  function updateShieldTracker(index,count){ const el=$(`#shields-${index}`); if(el) el.innerHTML=emojiTracker('shield',count); }

  function flashCard(lane, kind){ const card=document.querySelector(`.player-card[data-lane="${lane}"]`); if(!card) return; const cls=kind==='good'?'correct-hero':'wrong-hit'; card.classList.add(cls); setTimeout(()=>card.classList.remove(cls), kind==='good'?420:620); }

  function shapeEquals(a,b){ return a.shape===b.shape && a.color===b.color && a.size===b.size && (a.orientation||0)===(b.orientation||0); }
  function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function hexToRgba(hex,alpha){
    const h=hex.replace('#',''); const val=h.length===3? h.split('').map(c=>c+c).join('') : h;
    const num=parseInt(val,16); const r=(num>>16)&255, g=(num>>8)&255, b=num&255;
    return `rgba(${r},${g},${b},${alpha})`;
  }
  function sizeScale(size){ return size==='small'?0.62 : size==='large'?1.24 : 1.02; }
  function shapeSVG(shape, canvas=48){
    const c = colors[shape.color] || shape.color || '#888';
    const scale=sizeScale(shape.size||'medium');
    const rot=shape.orientation||0;
    const cx=32, cy=32;
    let inner='';
    if(shape.shape==='circle') inner=`<circle cx="32" cy="32" r="18" fill="${c}" />`;
    else if(shape.shape==='square') inner=`<rect x="14" y="14" width="36" height="36" rx="0" fill="${c}" />`;
    else if(shape.shape==='rectangle') inner=`<rect x="11" y="18" width="42" height="28" rx="0" fill="${c}" />`;
    else if(shape.shape==='triangle') inner=`<polygon points="32,10 52,50 12,50" fill="${c}" />`;
    else if(shape.shape==='diamond') inner=`<polygon points="32,8 54,32 32,56 10,32" fill="${c}" />`;
    else inner=`<circle cx="32" cy="32" r="18" fill="${c}" />`;
    return `<svg viewBox="0 0 64 64" width="${canvas}" height="${canvas}" aria-hidden="true"><g transform="translate(${cx} ${cy}) scale(${scale}) rotate(${rot}) translate(${-cx} ${-cy})">${inner}</g></svg>`;
  }
  function shapeBox(shape){ return `<div class="pattern-shape">${shapeSVG(shape,80)}</div>`; }

  document.addEventListener('keydown',e=>{
    if(phase==='checkin' && ['1','2','3'].includes(e.key)) checkInPlayer(Number(e.key)-1);
    if(e.key.toLowerCase()==='g' && phase==='question') goLive();
    if(e.key.toLowerCase()==='s' && phase==='checkin' && readyLanes.size===3) showQuestion();
    if(e.key.toLowerCase()==='r' && phase==='review') showCorrectAnswers();
    if(e.key.toLowerCase()==='n' && (phase==='stageReview' || phase==='revealed')) advanceStage();
  });

  renderIntro();
})();
</script>
</body>
</html>
