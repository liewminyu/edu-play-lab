<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Future Verb Letter Race — Community v6</title>
<style>
:root{
  --bg1:#071827;--bg2:#123c4c;--panel:#172944;--panel2:#213a5c;
  --text:#f8fbff;--muted:#c5d3e6;--gold:#ffd166;--good:#5ce0a1;--bad:#ff7280;
  --cyan:#65d9ff;--ink:#172033;--shadow:0 12px 32px rgba(0,0,0,.30);
  --red:#ff7f88;--yellow:#ffe29a;--green:#bfdda8;--orange:#ffc58f;--purple:#cfa7f3;--blue:#a9c8e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}
button{font:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 10% 10%,rgba(101,217,255,.18),transparent 30%),
  radial-gradient(circle at 90% 16%,rgba(255,209,102,.14),transparent 28%),
  linear-gradient(135deg,var(--bg1),var(--bg2))}
#app{position:relative;width:100%;height:100%;z-index:1}.hidden{display:none!important}
.screen{width:100%;height:100%;padding:clamp(9px,1.05vw,18px);display:flex;flex-direction:column;gap:clamp(7px,.8vh,11px)}
.topbar{display:grid;grid-template-columns:minmax(360px,1fr) auto minmax(155px,1fr);align-items:center;gap:13px;min-height:58px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-badge{font-size:clamp(30px,3vw,48px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.34))}
.brand h1{margin:0;font-size:clamp(22px,2.2vw,38px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand p{margin:5px 0 0;color:var(--muted);font-size:clamp(11px,1vw,16px)}
.toolbar{display:flex;gap:8px;justify-content:flex-end}.icon-btn,.primary-btn,.secondary-btn,.stage-btn,.ready-btn,.letter-btn{border:0;cursor:pointer;font-weight:1000;transition:transform .11s ease,filter .13s ease,opacity .13s ease,background .15s ease}
.icon-btn:active,.primary-btn:active,.secondary-btn:active,.stage-btn:active,.ready-btn:active,.letter-btn:active{transform:scale(.97)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:#23385f;color:#fff;font-size:21px;box-shadow:var(--shadow)}
.primary-btn{padding:14px 24px;border-radius:15px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#182239;font-size:clamp(17px,1.45vw,24px);box-shadow:var(--shadow)}
.secondary-btn{padding:13px 20px;border-radius:15px;background:#2c4774;color:#fff;font-size:clamp(15px,1.2vw,20px);box-shadow:var(--shadow)}
.stage-btn{min-width:clamp(230px,21vw,345px);padding:13px 22px;border-radius:16px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033;font-size:clamp(16px,1.35vw,22px);box-shadow:0 0 20px rgba(255,209,102,.42),var(--shadow)}
.stage-btn.waiting{background:#33445f;color:#aebbd0;box-shadow:none;opacity:.62;cursor:not-allowed}.stage-btn.go{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825;animation:goGlow .72s ease-in-out infinite alternate}.stage-btn.live{background:#263a5e;color:#c6d1e2;box-shadow:none;opacity:.78;cursor:default}.stage-btn.answer{background:linear-gradient(135deg,#71c7ff,#5592f6);color:#10284b;animation:answerGlow .76s ease-in-out infinite alternate}.stage-btn.next{background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033}
@keyframes goGlow{to{filter:brightness(1.14);box-shadow:0 0 28px rgba(85,230,165,.74),var(--shadow)}}@keyframes answerGlow{to{filter:brightness(1.13);box-shadow:0 0 28px rgba(113,199,255,.70),var(--shadow)}}

/* Intro */
.intro-center{flex:1;display:grid;grid-template-columns:minmax(0,1.13fr) minmax(340px,.87fr);gap:clamp(14px,2vw,28px);min-height:0}
.hero,.rules-card{background:linear-gradient(145deg,rgba(31,48,80,.97),rgba(17,29,50,.97));border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:var(--shadow)}
.hero{padding:clamp(22px,3vw,48px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.hero::after{content:"W I L L";position:absolute;right:3%;bottom:1%;font-size:clamp(55px,8vw,130px);font-weight:1000;letter-spacing:.06em;opacity:.04;transform:rotate(-6deg)}
.eyebrow{display:inline-flex;align-self:flex-start;padding:8px 14px;border-radius:999px;background:rgba(101,217,255,.13);border:1px solid rgba(101,217,255,.45);color:#9ce9ff;font-weight:1000;font-size:clamp(12px,1.05vw,17px);letter-spacing:.04em;text-transform:uppercase;position:relative;z-index:2}
.hero h2{font-size:clamp(42px,5.2vw,82px);line-height:.94;margin:18px 0 16px;max-width:760px;text-shadow:0 8px 25px rgba(0,0,0,.35);position:relative;z-index:2}.hero h2 em{color:var(--gold);font-style:normal}.hero .subtitle{font-size:clamp(17px,1.5vw,26px);color:#dbe7fb;max-width:720px;line-height:1.35;margin:0 0 18px;position:relative;z-index:2}
.walt{border-left:6px solid var(--gold);padding:12px 16px;background:rgba(255,255,255,.06);border-radius:0 14px 14px 0;font-size:clamp(15px,1.25vw,21px);max-width:740px;position:relative;z-index:2}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;position:relative;z-index:2}
.rules-card{padding:clamp(20px,2.2vw,34px);display:flex;flex-direction:column;justify-content:center}.rules-card h3{margin:0 0 14px;font-size:clamp(24px,2.1vw,37px)}.rule{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.09);font-size:clamp(13px,1.06vw,18px);line-height:1.24}.rule:last-of-type{border-bottom:0}.rule-num{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#2b4169;color:var(--gold);font-weight:1000;font-size:20px}
.group-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:16px}.group-chip{border-radius:12px;padding:9px 4px;color:#172033;text-align:center;font-weight:1000;font-size:clamp(9px,.78vw,13px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}

/* Game */
.scoreboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.score-card{min-width:0;background:rgba(25,39,66,.93);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 9px;display:flex;align-items:center;justify-content:space-between;gap:7px;box-shadow:0 8px 18px rgba(0,0,0,.18)}.score-card .gname{font-weight:1000;color:#172033;padding:5px 7px;border-radius:8px;font-size:clamp(9px,.82vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}.score-card .score{font-size:clamp(20px,1.75vw,29px);font-weight:1000}
.game-main{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(6px,.72vh,9px);min-height:0}.round-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.round-label{font-size:clamp(16px,1.32vw,22px);font-weight:1000;color:var(--gold)}.type-pill{padding:7px 13px;border-radius:999px;background:#24395f;color:#dfeaff;font-weight:900;font-size:clamp(11px,.92vw,15px)}
.arena{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px}.challenge-panel{min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border-radius:22px;border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);padding:clamp(10px,1.05vw,17px);display:flex;flex-direction:column;gap:7px;overflow:hidden}.pre-question{display:grid;place-items:center;min-height:100%;font-size:clamp(28px,2.8vw,50px);font-weight:1000;color:var(--gold);text-align:center}.live-challenge{display:flex;flex-direction:column;gap:7px;min-height:0;height:100%;position:relative;padding-bottom:0}
.instruction{text-align:center;font-size:clamp(17px,1.32vw,23px);font-weight:1000;color:var(--gold)}
.reference-card{align-self:center;width:min(1120px,96%);background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.10);border-radius:15px;padding:9px 16px;text-align:center;font-size:clamp(18px,1.62vw,29px);font-weight:900;line-height:1.25}.reference-verb{display:inline-block;color:var(--text);font-weight:1000}
.answer-sentence{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(7px,.7vw,12px);flex-wrap:wrap;text-align:center;font-size:clamp(25px,2.25vw,43px);font-weight:1000;line-height:1.25;padding:4px 12px}.answer-words{display:inline-flex;align-items:flex-end;gap:clamp(11px,1vw,18px);margin:0 3px}.word-slots{display:inline-flex;gap:clamp(3px,.28vw,6px);align-items:flex-end}.center-slot{width:clamp(22px,1.85vw,34px);height:clamp(34px,2.65vw,49px);border-bottom:4px solid var(--gold);display:grid;place-items:center;color:#fff;font-size:.78em}.center-slot.filled{border-bottom-color:var(--good);color:#b8f7d8}.correct-reveal{position:absolute;left:50%;bottom:0;z-index:4;min-height:28px;padding:5px 17px;border-radius:11px;background:rgba(18,50,57,.96);border:2px solid rgba(85,230,165,.58);color:#a7f4cc;font-size:clamp(13px,1.02vw,17px);font-weight:1000;text-align:center;white-space:nowrap;opacity:0;transform:translate(-50%,4px);transition:.2s ease;box-shadow:0 5px 14px rgba(0,0,0,.22)}.correct-reveal.shown{opacity:1;transform:translate(-50%,0)}
.players-area{display:flex;flex-direction:column;gap:6px}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:clamp(220px,28vh,300px)}.player-card{--group:#ddd;--glow:rgba(255,255,255,.5);border:4px solid rgba(255,255,255,.18);border-radius:20px;padding:8px 10px;color:#172033;background:var(--group);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:6px;position:relative;overflow:hidden;text-align:center;filter:brightness(.68) saturate(.72);transition:filter .18s ease,transform .13s ease,border-color .18s ease,box-shadow .18s ease}.player-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.14),transparent 65%);transform:translateX(-120%)}.player-card.readying::after,.player-card.live::after{animation:sweep 1.15s infinite}@keyframes sweep{to{transform:translateX(120%)}}.player-card.checked{filter:brightness(.94) saturate(.90);border-color:rgba(255,255,255,.78);box-shadow:0 0 16px var(--glow),0 0 28px var(--glow),var(--shadow)}.player-card.preview{filter:brightness(.80) saturate(.76)}.player-card.live{filter:none;border-color:rgba(255,255,255,.64)}.player-card.penalty{filter:brightness(.58) saturate(.45);transform:scale(.985)}.player-card.round-winner{border-color:#fff6bd;filter:brightness(1.07);transform:translateY(-3px);box-shadow:0 0 24px rgba(255,209,102,.72),var(--shadow)}
.player-head{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;position:relative;z-index:2}.player-name{font-size:clamp(19px,1.7vw,31px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ready-btn{align-self:center;min-width:145px;border:2px solid rgba(23,32,51,.25);border-radius:13px;padding:10px 18px;background:rgba(255,255,255,.50);color:#172033;font-size:clamp(17px,1.36vw,23px);font-weight:1000;position:relative;z-index:2}
.player-progress{min-height:34px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:2}.mini-word{display:inline-flex;gap:3px}.mini-slot{width:clamp(15px,1.12vw,22px);height:clamp(25px,1.72vw,34px);display:grid;place-items:center;border-bottom:3px solid rgba(23,32,51,.56);font-size:clamp(14px,1.05vw,19px);font-weight:1000;text-transform:lowercase}.mini-slot.filled{border-bottom-color:#177a55;color:#0b4f35;background:rgba(255,255,255,.22);border-radius:4px 4px 0 0}.letter-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;position:relative;z-index:2}.letter-btn{min-width:0;min-height:clamp(37px,4.4vh,48px);border:2px solid rgba(23,32,51,.22);border-radius:10px;padding:3px 2px;background:#f9fcff;color:#172033;font-size:clamp(18px,1.3vw,24px);font-weight:1000;text-transform:lowercase;box-shadow:0 4px 0 rgba(23,32,51,.22)}.letter-btn.preview-letter{opacity:.43;cursor:not-allowed;box-shadow:none}.letter-btn.used{opacity:.18;box-shadow:none}.letter-btn.correct-tap{background:#d9f6e8;border-color:#29966a;box-shadow:0 0 12px rgba(85,230,165,.42)}.letter-btn.wrong-flash{background:var(--bad);color:#fff;animation:shake .28s ease}.letter-btn:disabled{cursor:default}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.round-result{min-height:43px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.10);display:grid;place-items:center;text-align:center;padding:6px 14px;color:#d6e2f4;font-size:clamp(13px,1.10vw,19px);font-weight:1000}.round-result.winner{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.46);color:#fff0b5}

/* End */
.end-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}.winner-panel,.ranking-panel{background:linear-gradient(145deg,rgba(31,48,80,.97),rgba(18,30,52,.97));border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:var(--shadow);padding:clamp(21px,2.4vw,38px);min-height:0}.winner-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.trophy{font-size:clamp(82px,10vw,165px)}.winner-panel h2{font-size:clamp(34px,4.2vw,68px);line-height:1;margin:8px 0}.winner-panel p{font-size:clamp(16px,1.4vw,23px);color:#d6e2f4;margin:8px 0}.winner-chip{margin:13px 0;padding:13px 27px;border-radius:18px;color:#172033;font-size:clamp(25px,2.8vw,45px);font-weight:1000;box-shadow:var(--shadow)}.ranking-panel{overflow:auto}.ranking-panel h3{margin:0 0 14px;font-size:clamp(24px,2.2vw,37px)}.rank-row{display:grid;grid-template-columns:50px 1fr 92px;gap:11px;align-items:center;padding:9px;border-radius:14px;background:rgba(255,255,255,.06);margin:7px 0}.rank-num{font-size:clamp(22px,1.9vw,32px);font-weight:1000;color:var(--gold);text-align:center}.rank-group{padding:9px 11px;border-radius:10px;color:#172033;font-weight:1000;font-size:clamp(15px,1.25vw,21px)}.rank-score{font-size:clamp(24px,2.1vw,36px);font-weight:1000;text-align:center}.confetti{position:fixed;top:-20px;width:12px;height:20px;z-index:70;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(840deg);opacity:.8}}
@media(max-aspect-ratio:4/3){.intro-center{grid-template-columns:1fr}.rules-card{display:none}.end-wrap{grid-template-columns:1fr}.ranking-panel{max-height:42vh}.players{min-height:240px}.letter-grid{grid-template-columns:repeat(6,1fr)}.topbar{grid-template-columns:1fr auto auto}}
@media(max-width:1100px){.brand p{display:none}.score-card{padding:4px}.score-card .gname{font-size:9px}.players{gap:6px}.player-card{padding:7px 6px}.letter-grid{gap:3px}.letter-btn{font-size:16px;min-height:34px}.player-name{font-size:18px}.stage-btn{min-width:185px;padding:10px 14px}.mini-slot{width:14px;font-size:13px}.reference-card{font-size:17px}.answer-sentence{font-size:25px}}

/* v2 readability update */
.icon-btn{width:52px;height:52px;font-size:24px}
.brand-badge{font-size:clamp(34px,3.4vw,54px)}
.brand h1{font-size:clamp(26px,2.7vw,44px)}
.brand p{font-size:clamp(14px,1.2vw,19px)}
.primary-btn{font-size:clamp(20px,1.75vw,28px);padding:16px 28px}
.secondary-btn{font-size:clamp(18px,1.55vw,25px);padding:15px 24px}
.stage-btn{font-size:clamp(19px,1.65vw,27px);padding:15px 24px;min-width:clamp(250px,23vw,380px)}
.eyebrow{font-size:clamp(14px,1.22vw,19px);padding:9px 16px}

.hero .subtitle{font-size:clamp(21px,1.85vw,31px);max-width:900px}
.walt{font-size:clamp(19px,1.55vw,25px);max-width:860px;padding:14px 18px}
.rules-card h3{font-size:clamp(30px,2.45vw,42px)}

.score-card .score{font-size:clamp(24px,2.05vw,34px)}
.round-label{font-size:clamp(20px,1.62vw,27px)}
.type-pill{font-size:clamp(14px,1.12vw,18px);padding:8px 14px}

.instruction{font-size:clamp(23px,1.85vw,31px)}

/* v4: more playable area + final tie-breaker */
.players{min-height:clamp(275px,33vh,365px)}
.rank-score small{display:block;margin-top:2px;font-size:.43em;line-height:1.05;color:#cbd8eb;white-space:nowrap}
.rank-key{text-align:right;color:#cbd8eb;font-size:clamp(14px,1.08vw,18px);font-weight:900;margin:-4px 4px 8px}
.tie-break-note{margin:2px 0 8px!important;padding:8px 14px;border-radius:12px;background:rgba(101,217,255,.10);border:1px solid rgba(101,217,255,.30);color:#dff6ff!important}
@media(max-height:820px){.players{min-height:clamp(250px,31vh,330px)}}


/* v5 cleanup — community-ready visual flow */
.intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.cover-card{position:relative;width:min(1160px,100%);height:100%;background:linear-gradient(145deg,rgba(31,48,80,.97),rgba(17,29,50,.97));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,52px)}
.cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 20%,rgba(101,217,255,.11),transparent 28%),radial-gradient(circle at 82% 22%,rgba(255,209,102,.09),transparent 24%),radial-gradient(circle at 50% 100%,rgba(85,230,165,.08),transparent 36%)}
.cover-inner{position:relative;z-index:2;max-width:880px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.45);color:var(--gold);font-weight:1000;font-size:clamp(13px,1.08vw,18px);letter-spacing:.04em;text-transform:uppercase}
.cover-title{font-size:clamp(50px,6vw,94px);line-height:.94;margin:20px 0 14px;max-width:940px;text-shadow:0 8px 25px rgba(0,0,0,.35)}
.cover-title em{color:var(--gold);font-style:normal}
.cover-subtitle{font-size:clamp(22px,1.85vw,31px);color:#dbe7fb;max-width:760px;line-height:1.3;margin:0;font-weight:900}
.cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px;position:relative;z-index:2}
.cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:min(360px,80vw)}
.cover-mini-steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-step{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#e6eefb;font-size:clamp(15px,1.18vw,20px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.cover-step strong{color:var(--gold)}
.cover-arrow{font-size:clamp(18px,1.4vw,24px);color:rgba(255,209,102,.92);font-weight:1000}
.cover-animation{position:absolute;left:0;right:0;bottom:12px;height:124px;pointer-events:none;z-index:1}
.float-word{position:absolute;bottom:0;padding:11px 17px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);box-shadow:0 10px 20px rgba(0,0,0,.22);font-size:clamp(19px,1.55vw,27px);font-weight:1000;color:#f8fbff;opacity:.86;animation:wordBob 3.8s ease-in-out infinite alternate}
.float-word strong{color:var(--gold)}
.float-word.word-1{left:7%;animation-duration:4.2s;transform:rotate(-6deg)}
.float-word.word-2{left:25%;bottom:20px;animation-duration:3.5s;animation-delay:.4s}
.float-word.word-3{left:46%;bottom:0;animation-duration:4.6s;animation-delay:.2s;transform:rotate(4deg)}
.float-word.word-4{left:66%;bottom:18px;animation-duration:3.9s;animation-delay:.7s;transform:rotate(-4deg)}
.float-word.word-5{left:84%;bottom:3px;animation-duration:4.4s;animation-delay:.3s;transform:translateX(-50%)}
@keyframes wordBob{0%{margin-bottom:0}100%{margin-bottom:14px}}

.game-topbar{grid-template-columns:minmax(360px,1fr) auto!important}
.game-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.game-toolbar .stage-btn{margin-right:2px}
.reference-card{width:auto;min-width:min(420px,88%);padding:14px 28px}
.reference-card .reference-verb{font-size:clamp(30px,2.5vw,48px)}
/* v2 prompt spacing: keep instruction, reference verb and stem as one compact visual group */
.live-challenge{justify-content:center!important;gap:clamp(18px,2.2vh,28px)!important}
.answer-sentence{flex:0 0 auto!important;padding:0 12px!important}
.score-card.score-bump{animation:scoreBump .65s ease}
@keyframes scoreBump{0%{transform:scale(1)}45%{transform:scale(1.09);box-shadow:0 0 28px rgba(255,209,102,.7)}100%{transform:scale(1)}}

#overlayRoot{position:relative;z-index:90}
.round-overlay{position:fixed;inset:0;z-index:90;background:rgba(4,9,18,.66);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px}
.round-win-card{width:min(720px,92vw);background:linear-gradient(145deg,#243f6d,#132847);border:2px solid rgba(255,255,255,.16);border-radius:30px;box-shadow:0 28px 80px rgba(0,0,0,.58);padding:28px 34px;text-align:center;overflow:hidden}
.round-win-card .trophy-pop{font-size:clamp(70px,6vw,102px);line-height:1;animation:trophyPop .55s cubic-bezier(.2,.9,.2,1.25)}
.round-win-card h2{margin:8px 0 6px;font-size:clamp(34px,3vw,50px);color:#ffd166}
.round-win-card .winner-name{font-size:clamp(38px,3.25vw,58px);font-weight:1000;line-height:1.04;margin:8px 0 14px}
.round-win-card .group-award{display:inline-flex;align-items:center;gap:14px;padding:11px 18px;border-radius:17px;color:#172033;font-size:clamp(19px,1.45vw,26px);font-weight:1000}
.round-win-card .point-pop{display:inline-block;padding:7px 13px;border-radius:999px;background:#fff;color:#173425;font-size:clamp(22px,1.7vw,30px);font-weight:1000;animation:pointPop .75s .32s both cubic-bezier(.2,.9,.2,1.3)}
@keyframes trophyPop{0%{transform:scale(.35);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pointPop{0%{transform:translateY(18px) scale(.25);opacity:0}60%{transform:translateY(-4px) scale(1.18);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}

@media(max-width:900px){.cover-card{padding:24px 16px}.cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:0;width:min(320px,100%)}.cover-animation{height:96px}.float-word{font-size:16px;padding:8px 11px}.cover-mini-steps{gap:8px}.cover-step{padding:8px 12px}.game-topbar{grid-template-columns:1fr auto!important}.stage-btn{min-width:175px}}


/* Universal Game Setup — streamlined v6 */
.setup-screen{gap:10px}
.setup-topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;min-height:58px}
.setup-title-wrap{min-width:0;display:flex;align-items:center}.setup-title-wrap h1{margin:0;font-size:clamp(36px,3.25vw,54px);line-height:1}
.setup-back{width:auto;min-width:50px;padding:0 14px;font-size:clamp(22px,1.8vw,28px)}
.setup-history{display:flex;align-items:center;gap:7px}.setup-history .icon-btn{font-size:25px}.setup-history .icon-btn:disabled{filter:grayscale(.85) brightness(.7);opacity:.42;cursor:not-allowed;box-shadow:none}
.setup-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(245px,1.16fr) repeat(3,minmax(185px,1fr));grid-template-rows:1fr 1fr;gap:10px}
.setup-panel{min-width:0;min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.player-bank{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;padding:12px;gap:9px}
.setup-panel-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(21px,1.85vw,29px);font-weight:1000;color:var(--gold)}
.setup-count{font-size:clamp(18px,1.45vw,23px);color:#d7e2f2;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:999px}
.player-entry{flex:0 0 auto;width:100%;height:52px;min-height:52px;resize:none;overflow:hidden;border:2px solid rgba(255,255,255,.13);outline:none;border-radius:12px;background:#101d33;color:#f7fbff;padding:10px 12px;font:800 clamp(18px,1.45vw,23px)/1.25 "Trebuchet MS",Arial,sans-serif}
.player-entry:focus{border-color:rgba(255,209,102,.72);box-shadow:0 0 0 3px rgba(255,209,102,.08)}
.player-entry::placeholder{color:#91a3bb;opacity:1}
.player-tags{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:2px 4px 4px}
.player-tag{width:100%;flex:0 0 auto;border:2px solid rgba(255,255,255,.18);border-radius:10px;background:#2b4775;color:#fff;padding:7px 10px;font-size:clamp(17px,1.35vw,22px);line-height:1.12;font-weight:1000;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.player-tag:active{cursor:grabbing}.player-tag.selected{outline:3px solid var(--gold);outline-offset:2px}.player-tag.assigned{color:#172033}
.touch-drag-ghost{position:fixed!important;z-index:99999!important;pointer-events:none!important;margin:0!important;opacity:.92;transform:translate(-50%,-50%) scale(1.04);box-shadow:0 16px 32px rgba(0,0,0,.38)!important}.player-bank.drag-over{outline:3px solid var(--gold);outline-offset:-3px;background:rgba(255,209,102,.06)}
.group-card{display:flex;flex-direction:column;padding:10px;gap:8px;transition:border-color .15s ease,background .15s ease}
.group-card.drag-over{border-color:var(--gold);background:rgba(255,209,102,.08)}
.group-header{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center}
.group-name-input{width:100%;min-width:0;border:0;outline:none;border-radius:11px;background:#2b4775;color:#fff;padding:10px 11px;font-weight:1000;font-size:clamp(19px,1.55vw,25px);line-height:1.15;text-align:center}
.group-name-input:focus{box-shadow:0 0 0 3px rgba(255,209,102,.20)}
.group-colour{width:48px;height:48px;border:2px solid rgba(255,255,255,.55);border-radius:9px;padding:0;background:transparent;cursor:pointer;overflow:hidden}
.group-colour::-webkit-color-swatch-wrapper{padding:0}.group-colour::-webkit-color-swatch{border:0;border-radius:6px}.group-colour::-moz-color-swatch{border:0;border-radius:6px}
.group-drop{flex:1;min-height:0;border:2px dashed rgba(255,255,255,.20);border-radius:13px;padding:7px;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));align-items:stretch;gap:5px;overflow:hidden}
.group-drop .player-tag{height:100%;min-height:0;display:flex;align-items:center;font-size:clamp(16px,1.2vw,20px);line-height:1.05;padding:4px 9px}
.group-entry{width:100%;height:100%;min-height:0;resize:none;overflow:hidden;border:2px solid rgba(255,255,255,.14);outline:none;border-radius:9px;background:rgba(255,255,255,.055);color:#fff;padding:5px 8px;font:800 clamp(14px,1.05vw,18px)/1.15 "Trebuchet MS",Arial,sans-serif}
.group-entry:focus{border-color:rgba(255,209,102,.62);background:rgba(255,255,255,.085)}
.group-entry::placeholder{color:#8fa1b9;opacity:1}
.group-player-count{flex:0 0 auto;text-align:center;color:#a9bad1;font-size:clamp(16px,1.25vw,20px);font-weight:1000;line-height:1;padding:3px 0 1px}
.group-card.full .group-drop{border-color:rgba(85,230,165,.55)}.group-card.full .group-player-count{color:#9ff0c8}
.setup-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.setup-action{border:0;border-radius:12px;min-height:44px;padding:7px 8px;background:#2c4774;color:#fff;font-weight:1000;font-size:clamp(16px,1.25vw,21px);cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.18);white-space:nowrap}
.setup-action:disabled{filter:grayscale(.8) brightness(.72);opacity:.5;cursor:not-allowed;box-shadow:none}.setup-action.valid{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825}.setup-action.primary{background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033}
.setup-toast{position:fixed;left:50%;bottom:72px;z-index:120;max-width:min(760px,calc(100vw - 36px));padding:12px 18px;border-radius:14px;background:rgba(25,39,66,.97);border:2px solid rgba(255,255,255,.16);box-shadow:0 16px 38px rgba(0,0,0,.38);color:#f4f8ff;font-size:clamp(17px,1.35vw,22px);line-height:1.25;font-weight:900;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,14px) scale(.98);transition:opacity .18s ease,transform .18s ease}
.setup-toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.setup-toast.good{background:rgba(23,72,58,.97);border-color:rgba(85,230,165,.58);color:#c5f7dd}
.setup-toast.bad{background:rgba(79,31,43,.98);border-color:rgba(255,114,128,.62);color:#ffd4d8}
.setup-toast strong{color:#fff}
.start-disabled{filter:grayscale(.88) brightness(.65);opacity:.52;cursor:not-allowed!important;box-shadow:none!important}
@media(max-width:1000px){.setup-grid{grid-template-columns:minmax(225px,1.08fr) repeat(3,minmax(155px,1fr));gap:7px}.setup-actions{gap:6px}.setup-action{min-height:42px;padding:7px 5px;font-size:clamp(16px,1.65vw,20px)}.group-card{padding:7px}.player-bank{padding:8px}.player-tag{font-size:clamp(16px,1.8vw,20px);padding:7px 9px}.group-drop .player-tag{font-size:clamp(14px,1.55vw,18px);padding:4px 7px}.group-name-input{font-size:clamp(17px,1.8vw,21px)}.group-player-count{font-size:clamp(14px,1.55vw,18px)}.setup-toast{bottom:64px;font-size:clamp(16px,1.7vw,20px)}}

const STORAGE_KEY='SgLDC_FutureVerbLetterRace_Community_v6';
const SETUP_KEY='SgLDC_Universal_GameSetup_v1';
const groupOrder=['red','yellow','green','orange','purple','blue'];
const DEFAULT_GROUP_COLORS=['#ff7f88','#ffe29a','#bfdda8','#ffc58f','#cfa7f3','#a9c8e8'];
let groups={};
let setupConfig=null;
let setupDraft=null;
let setupValidated=false;
let selectedPlayerId=null;
let setupCheckedOnce=false;
let setupDirty=false;
let setupSavedSignature=null;
let setupUndoStack=[];
let setupRedoStack=[];
let setupHistoryApplying=false;
let activePointerDrag=null;
let suppressTouchClickUntil=0;

function blankSetupDraft(){return{
  schema:'sgldc-game-setup',version:1,
  players:Array.from({length:0},()=>null),
  groups:groupOrder.map((id,i)=>({id,name:`Group ${i+1}`,color:DEFAULT_GROUP_COLORS[i],memberIds:[]}))
};}
function normalizeSetup(raw){
  if(!raw||typeof raw!=='object')return null;
  let players=[];
  if(Array.isArray(raw.players))players=raw.players.map((p,i)=>typeof p==='string'?{id:`p${String(i+1).padStart(2,'0')}`,name:p}:{id:String(p?.id||`p${String(i+1).padStart(2,'0')}`),name:String(p?.name||'')});
  let gs=Array.isArray(raw.groups)?raw.groups:[];
  const normGroups=groupOrder.map((id,i)=>{
    const g=gs[i]||{};
    const memberIds=Array.isArray(g.memberIds)?g.memberIds.map(String):Array.isArray(g.players)?g.players.map(name=>players.find(p=>p.name===name)?.id).filter(Boolean):[];
    const name=String(g.name??'').trim()||`Group ${i+1}`;
    return{id,name,color:/^#[0-9a-f]{6}$/i.test(String(g.color||''))?String(g.color):DEFAULT_GROUP_COLORS[i],memberIds};
  });
  return{schema:'sgldc-game-setup',version:1,players,groups:normGroups};
}
function playerSetupErrors(cfg){
  const names=cfg.players.map(p=>p.name.trim()).filter(Boolean),errors=[];
  if(names.length!==30)errors.push(`30 player names required (${names.length} entered)`);
  if(names.some(n=>[...n].length>12))errors.push('Player names must be 12 characters or fewer');
  return errors;
}
function groupSetupErrors(cfg){
  const errors=[];
  if(cfg.groups.some((g,i)=>[...(g.name.trim()||`Group ${i+1}`)].length>12))errors.push('Group names must be 12 characters or fewer');
  return errors;
}
function baseSetupErrors(cfg){return [...playerSetupErrors(cfg),...groupSetupErrors(cfg)];}
function groupingComplete(cfg){const ids=new Set(cfg.players.map(p=>p.id));const assigned=cfg.groups.flatMap(g=>g.memberIds);return cfg.groups.every(g=>g.memberIds.length===5)&&assigned.length===30&&new Set(assigned).size===30&&assigned.every(id=>ids.has(id));}
function setupReady(cfg){return !!cfg&&baseSetupErrors(cfg).length===0&&groupingComplete(cfg);}
function applySetup(cfg){
  groups={};
  groupOrder.forEach((id,i)=>{const g=cfg.groups[i];groups[id]={name:g.name.trim()||`Group ${i+1}`,color:g.color,players:g.memberIds.map(pid=>cfg.players.find(p=>p.id===pid)?.name).filter(Boolean)};});
}
function loadSetup(){try{const cfg=normalizeSetup(JSON.parse(localStorage.getItem(SETUP_KEY)||'null'));if(setupReady(cfg)){applySetup(cfg);return cfg;}}catch(e){}return null;}
function persistSetup(cfg){try{localStorage.setItem(SETUP_KEY,JSON.stringify(cfg));}catch(e){}}
function setupSignature(cfg){
  const n=normalizeSetup(cfg);
  if(!n)return '';
  return JSON.stringify({players:n.players.map(p=>({id:p.id,name:p.name})),groups:n.groups.map(g=>({name:g.name,color:g.color,memberIds:[...g.memberIds]}))});
}
function rosterReady(cfg=setupDraft){
  if(!cfg)return false;
  const names=cfg.players.map(p=>p.name.trim()).filter(Boolean);
  return names.length===30&&!names.some(n=>[...n].length>12)&&groupSetupErrors(cfg).length===0;
}
function recomputeSetupValidation(){setupValidated=rosterReady(setupDraft);setupCheckedOnce=setupValidated;}
function refreshSetupButtons(){
  const randomize=$('#randomizeBtn'),add=$('#addToGameBtn'),download=$('#downloadSetupBtn');
  const rosterOK=rosterReady(setupDraft);
  if(randomize)randomize.disabled=!rosterOK;
  if(download)download.disabled=!rosterOK;
  if(add)add.disabled=!!setupSavedSignature&&!setupDirty;
}
function markSetupDirty(){
  setupDirty=true;recomputeSetupValidation();refreshSetupButtons();
}
function cloneSetup(cfg){return cfg?normalizeSetup(JSON.parse(JSON.stringify(cfg))):null;}
function setupHistoryEntry(){
  if(!setupDraft)return null;
  let cfg;
  try{cfg=currentDraftFromValidatedUI();}catch(e){cfg=setupDraft;}
  return{cfg:cloneSetup(cfg),validated:!!setupValidated,checked:!!setupCheckedOnce};
}
function refreshHistoryButtons(){const u=$('#undoSetupBtn'),r=$('#redoSetupBtn');if(u)u.disabled=!setupUndoStack.length;if(r)r.disabled=!setupRedoStack.length;}
function recordSetupHistory(){
  if(setupHistoryApplying)return;
  const entry=setupHistoryEntry();if(!entry?.cfg)return;
  const sig=setupSignature(entry.cfg)+'|'+entry.validated+'|'+entry.checked;
  const last=setupUndoStack[setupUndoStack.length-1];
  const lastSig=last?setupSignature(last.cfg)+'|'+last.validated+'|'+last.checked:'';
  if(sig!==lastSig)setupUndoStack.push(entry);
  if(setupUndoStack.length>60)setupUndoStack.shift();
  setupRedoStack=[];refreshHistoryButtons();
}
function applySetupHistoryEntry(entry,label){
  if(!entry?.cfg)return;
  setupHistoryApplying=true;setupDraft=cloneSetup(entry.cfg);selectedPlayerId=null;
  setupDraft.groups.forEach((g,i)=>{const n=$(`#groupName-${i}`),c=$(`#groupColor-${i}`);if(n)n.value=g.name;if(c)c.value=g.color;});
  recomputeSetupValidation();setupDirty=setupSavedSignature!==setupSignature(setupDraft);setupHistoryApplying=false;renderSetupTagsAndGroups();refreshSetupButtons();refreshHistoryButtons();setupStatus(`<strong>${label}.</strong> Review the setup, then add the player names to the game if needed.`,'good');
}
function undoSetup(){if(!setupUndoStack.length)return;const current=setupHistoryEntry();if(current)setupRedoStack.push(current);applySetupHistoryEntry(setupUndoStack.pop(),'Undo complete');}
function redoSetup(){if(!setupRedoStack.length)return;const current=setupHistoryEntry();if(current)setupUndoStack.push(current);applySetupHistoryEntry(setupRedoStack.pop(),'Redo complete');}
function armTextHistory(el){
  if(!el)return;let captured=false;
  el.addEventListener('focus',()=>{captured=false;});
  el.addEventListener('beforeinput',()=>{if(!captured){recordSetupHistory();captured=true;}});
  el.addEventListener('blur',()=>{captured=false;});
}
function clearPointerDragVisuals(){
  document.querySelectorAll('.group-card.drag-over,.player-bank.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(activePointerDrag?.ghost)activePointerDrag.ghost.remove();

  return setupDraft;
}
function cleanSetupField(value){return String(value??'').replace(/[\t\r\n]+/g,' ').trim();}
function serializeSetupText(cfg){
  const lines=['SGLDC_GAME_SETUP\t2','# Portable classroom game setup','# PLAYER = player id + name','# GROUP = group id + group name + colour','# ASSIGN = player id + group id'];
  cfg.players.forEach(p=>lines.push(`PLAYER\t${cleanSetupField(p.id)}\t${cleanSetupField(p.name)}`));
  cfg.groups.forEach((g,i)=>lines.push(`GROUP\t${groupOrder[i]}\t${cleanSetupField(g.name)}\t${cleanSetupField(g.color)}`));
  cfg.groups.forEach((g,i)=>g.memberIds.forEach(pid=>lines.push(`ASSIGN\t${cleanSetupField(pid)}\t${groupOrder[i]}`)));
  return lines.join('\n')+'\n';
}
function parseSetupText(text){
  const lines=String(text||'').split(/\r?\n/).map(line=>line.trim()).filter(line=>line&&!line.startsWith('#'));
  if(!lines.length||!/^SGLDC_GAME_SETUP(?:\t|\s)+2$/i.test(lines[0]))return null;
  const players=[],groupMap=new Map(),assignments=[];
  for(const line of lines.slice(1)){
    const parts=line.split('\t');const type=(parts.shift()||'').toUpperCase();
    if(type==='PLAYER'&&parts.length>=2){const id=parts.shift().trim(),name=parts.join('\t').trim();if(id)players.push({id,name});}
    else if(type==='GROUP'&&parts.length>=3){const id=parts.shift().trim(),name=parts.shift().trim(),color=parts.shift().trim();groupMap.set(id,{id,name,color,memberIds:[]});}
    else if(type==='ASSIGN'&&parts.length>=2){assignments.push({playerId:parts[0].trim(),groupId:parts[1].trim()});}
  }
  if(!players.length)return null;
  const groupsOut=groupOrder.map((id,i)=>{const g=groupMap.get(id)||{id,name:'',color:DEFAULT_GROUP_COLORS[i],memberIds:[]};return{id,name:g.name,color:g.color,memberIds:[]};});
  assignments.forEach(a=>{const gi=groupOrder.indexOf(a.groupId);if(gi>=0&&players.some(p=>p.id===a.playerId)&&!groupsOut[gi].memberIds.includes(a.playerId))groupsOut[gi].memberIds.push(a.playerId);});
  return normalizeSetup({schema:'sgldc-game-setup',version:2,players,groups:groupsOut});
}
function parseCompatibleSetupFile(text){
  const portable=parseSetupText(text);if(portable)return portable;
  try{return normalizeSetup(JSON.parse(text));}catch(err){}
  const start=text.indexOf('{'),end=text.lastIndexOf('}');
  if(start>=0&&end>start){try{return normalizeSetup(JSON.parse(text.slice(start,end+1)));}catch(err){}}
  return null;
}
function downloadSetup(){
  const bankEntry=$('#playerNamesInput');if(bankEntry?.value.trim()){const names=splitNameBatch(bankEntry.value);bankEntry.value='';if(names.length)addNamesToBank(names);}
  const cfg=currentDraftFromValidatedUI(),errors=[...playerSetupErrors(cfg),...groupSetupErrors(cfg)];if(errors.length){setupStatus(`<strong>Cannot download:</strong> ${errors.join(' · ')}`,'bad');wrongSound();return;}const blob=new Blob([serializeSetupText(cfg)],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Game_Setup.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);setupStatus('<strong>Game_Setup.txt downloaded.</strong> Player names, group names, colours and assignments are included.','good');
}
async function handleSetupUpload(e){
  const file=e.target.files?.[0];if(!file)return;
  try{
    const text=await file.text(),cfg=parseCompatibleSetupFile(text);if(!cfg)throw new Error('Invalid setup file');recordSetupHistory();setupDraft=cfg;selectedPlayerId=null;
    setupDraft.groups.forEach((g,i)=>{$(`#groupName-${i}`).value=g.name||`Group ${i+1}`;$(`#groupColor-${i}`).value=g.color;});
    recomputeSetupValidation();setupDirty=setupSavedSignature!==setupSignature(cfg);renderSetupTagsAndGroups();
    const assigned=cfg.groups.reduce((n,g)=>n+g.memberIds.length,0),nameErrors=cfg.players.some(p=>[...p.name.trim()].length>12),groupErrors=groupSetupErrors(cfg);
    if(nameErrors||groupErrors.length){setupStatus(`<strong>Uploaded setup needs attention:</strong> ${nameErrors?'Player names must be 12 characters or fewer':groupErrors.join(' · ')}`,'bad');}
    else setupStatus(`<strong>Game_Setup.txt loaded.</strong> ${cfg.players.length}/30 player names · ${assigned}/30 assigned a group.`,'good');
    refreshSetupButtons();refreshHistoryButtons();
  }catch(err){setupStatus('<strong>Upload failed:</strong> this is not a compatible SgLDC game setup file.','bad');}
  finally{e.target.value='';}
}

function scoreBoardHTML(){return `<div class="scoreboard">${groupOrder.map(g=>`<div class="score-card" data-group="${g}"><span class="gname" style="background:${groups[g].color}">${escapeHTML(groups[g].name)}</span><span class="score">${state.scores[g]}</span></div>`).join('')}</div>`;}
function renderRound(){
  if(!state)state=loadState()||freshState();if(state.roundIndex>=QUESTIONS.length||state.finished){renderEnd();return;}
  phase='checkin';readyLanes=new Set();laneProgress=[0,0,0];lanePenalty=[false,false,false];winnerLane=null;
  const roster=state.rounds[state.roundIndex];
  app.innerHTML=`<main class="screen">
    <div class="topbar game-topbar"><div class="brand"><div class="brand-badge">⏩</div><div><h1>Race to the Future!</h1></div></div>${gameToolbar()}</div>
    ${scoreBoardHTML()}
    <section class="game-main">
      <div class="round-line"><div class="round-label">Round ${state.roundIndex+1} of ${QUESTIONS.length}</div><div class="type-pill">Future action · will + base verb</div></div>
      <div class="arena"><div class="challenge-panel"><div class="pre-question" id="preQuestion">Get ready to race into the future!</div><div class="live-challenge hidden" id="liveChallenge"></div></div>
        <div class="players-area"><div class="players">${roster.map((p,i)=>playerCard(p,i)).join('')}</div></div></div>
    </section></main>`;
  bindToolbar();$('#stageBtn').onclick=handleStageButton;
  document.querySelectorAll('.ready-btn').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();checkInPlayer(Number(btn.dataset.lane));},{passive:false}));
  if(state.roundCompleted&&state.lastResult)restoreCompletedRound();
}
function playerCard(p,i){return `<div class="player-card readying" data-lane="${i}" style="--group:${p.color};--glow:${hexToRgba(p.color,.50)}"><div class="player-head"><span class="player-name">${escapeHTML(p.player)}</span></div><button class="ready-btn" data-lane="${i}">Ready?</button><div class="player-progress hidden" id="progress-${i}"></div><div class="letter-grid hidden" id="letters-${i}"></div></div>`;}
function checkInPlayer(lane){
  if(phase!=='checkin'||readyLanes.has(lane))return;const card=document.querySelector(`.player-card[data-lane="${lane}"]`),btn=card?.querySelector('.ready-btn');if(!card||!btn)return;
  ensureAudio();readyLanes.add(lane);btn.disabled=true;btn.textContent='Ready! 👍';card.classList.remove('readying');card.classList.add('checked');tone(560+lane*80,.16,'triangle',.08);
  if(readyLanes.size===3){const b=$('#stageBtn');b.disabled=false;b.className='stage-btn';b.textContent='SHOW INSTRUCTIONS';tone(660,.12,'triangle',.08);setTimeout(()=>tone(880,.18,'triangle',.09),130);}
}
function handleStageButton(){if(phase==='checkin'&&readyLanes.size===3)showQuestion();else if(phase==='preview')goLive();else if(phase==='answered')showCorrectAnswer();else if(phase==='revealed')finishRoundSequence();else if(phase==='postround')nextRound();}

function answerChars(q){return q.answer.replace(/\s/g,'').toLowerCase().split('');}
function wordSlotHTML(answer,mini=false,filledChars=null){let globalIndex=0;return answer.toLowerCase().split(' ').map(word=>`<span class="${mini?'mini-word':'word-slots'}">${[...word].map(()=>{const char=filledChars&&filledChars[globalIndex]?filledChars[globalIndex]:'';globalIndex++;return `<span class="${mini?'mini-slot':'center-slot'}${char?' filled':''}">${char}</span>`;}).join('')}</span>`).join(mini?'':'');}
function buildLetterBank(q){
  const needed=answerChars(q);const alphabet='abcdefghijklmnopqrstuvwxyz';const distractors=[];
  while(needed.length+distractors.length<16){const ch=alphabet[Math.floor(Math.random()*alphabet.length)];if(!needed.includes(ch)&&!distractors.includes(ch))distractors.push(ch);}
  return shuffle([...needed,...distractors]);
}
function renderChallenge(q){
  const box=$('#liveChallenge');
  box.innerHTML=`<div class="instruction">Rewrite the verb to show the action happening in the future.</div>
    <div class="reference-card"><span class="reference-verb">${escapeHTML(q.verb)}</span></div>
    <div class="answer-sentence"><span>${escapeHTML(q.before)}</span><span class="answer-words" id="centerAnswer">${wordSlotHTML(q.answer,false)}</span><span>${escapeHTML(q.after)}</span></div>`;
}
function renderPlayerLetters(q,preview=false){
  for(let lane=0;lane<3;lane++){
    const progress=$(`#progress-${lane}`),grid=$(`#letters-${lane}`);progress.classList.remove('hidden');grid.classList.remove('hidden');progress.innerHTML=wordSlotHTML(q.answer,true);
    grid.innerHTML='';buildLetterBank(q).forEach((ch,idx)=>{const btn=document.createElement('button');btn.className='letter-btn'+(preview?' preview-letter':'');btn.disabled=preview;btn.dataset.letter=ch;btn.dataset.tile=String(idx);btn.textContent=ch;btn.addEventListener('pointerdown',e=>{e.preventDefault();tapLetter(lane,ch,btn);},{passive:false});grid.appendChild(btn);});
  }
}
function showQuestion(){
  phase='preview';const q=QUESTIONS[state.roundIndex];$('#preQuestion').classList.add('hidden');$('#liveChallenge').classList.remove('hidden');renderChallenge(q);renderPlayerLetters(q,true);
  document.querySelectorAll('.player-card').forEach(card=>{card.classList.remove('checked');card.classList.add('preview');card.querySelector('.ready-btn').classList.add('hidden');});
  const b=$('#stageBtn');b.className='stage-btn go';b.textContent='🚀 GO!';b.disabled=false;
}
function goLive(){
  phase='live';laneProgress=[0,0,0];lanePenalty=[false,false,false];document.querySelectorAll('.player-card').forEach(card=>{card.classList.remove('preview');card.classList.add('live');});document.querySelectorAll('.letter-btn').forEach(btn=>{btn.disabled=false;btn.classList.remove('preview-letter');});
  const b=$('#stageBtn');b.className='stage-btn live';b.textContent='LETTERS LIVE';b.disabled=true;
}
function tapLetter(lane,ch,btn){
  if(phase!=='live'||lanePenalty[lane])return;const q=QUESTIONS[state.roundIndex],chars=answerChars(q),expected=chars[laneProgress[lane]];if(!expected)return;
  if(ch===expected){
    laneProgress[lane]++;btn.disabled=true;btn.classList.add('used','correct-tap');updatePlayerProgress(lane,q);tone(510+lane*55,.07,'triangle',.045);
    const groupId=state.rounds[state.roundIndex][lane].groupId;state.correctLetters[groupId]=(state.correctLetters[groupId]||0)+1;saveState();
    if(laneProgress[lane]===chars.length){correctSound();finishRound(lane);}
  }else{
    wrongSound();btn.classList.add('wrong-flash');lanePenalty[lane]=true;const card=document.querySelector(`.player-card[data-lane="${lane}"]`);card?.classList.add('penalty');card?.querySelectorAll('.letter-btn').forEach(b=>b.disabled=true);
    setTimeout(()=>{btn.classList.remove('wrong-flash');card?.classList.remove('penalty');if(phase==='live'){card?.querySelectorAll('.letter-btn').forEach(b=>{if(!b.classList.contains('used'))b.disabled=false;});lanePenalty[lane]=false;}},1000);
  }
}
function updatePlayerProgress(lane,q){const chars=answerChars(q),filled=Array(chars.length).fill('');for(let i=0;i<laneProgress[lane];i++)filled[i]=chars[i];$(`#progress-${lane}`).innerHTML=wordSlotHTML(q.answer,true,filled);}
function finishRound(lane){
  if(phase!=='live')return;phase='answered';winnerLane=lane;document.querySelectorAll('.letter-btn').forEach(b=>b.disabled=true);document.querySelectorAll('.player-card').forEach(c=>c.classList.remove('live','penalty'));
  const roster=state.rounds[state.roundIndex],winner=roster[lane];document.querySelector(`.player-card[data-lane="${lane}"]`)?.classList.add('round-winner');const result={winnerLane:lane,winner,answer:QUESTIONS[state.roundIndex].answer,pointAwarded:false,finalized:false};
  state.roundCompleted=true;state.answerRevealed=false;state.lastResult=result;saveState();const b=$('#stageBtn');b.className='stage-btn answer';b.textContent='👁 SHOW CORRECT ANSWER';b.disabled=false;
}
function showCorrectAnswer(){if(phase!=='answered')return;phase='revealed';state.answerRevealed=true;saveState();revealCorrectAnswer();revealSound();const b=$('#stageBtn');b.className='stage-btn next';b.textContent='🏁 FINISH ROUND';b.disabled=false;}
function finishRoundSequence(){if(phase!=='revealed')return;phase='postround';showWinnerOverlay();}
function awardPointIfNeeded(){
  const r=state.lastResult;if(!r?.winner||r.pointAwarded)return;
  state.scores[r.winner.groupId]++;r.pointAwarded=true;saveState();refreshScoreboard();
  const card=document.querySelector(`.score-card[data-group="${r.winner.groupId}"]`);if(card){card.classList.remove('score-bump');void card.offsetWidth;card.classList.add('score-bump');}
}
function showWinnerOverlay(){
  const r=state.lastResult;if(!r)return;r.finalized=true;saveState();
  const b=$('#stageBtn');if(b){b.className='stage-btn waiting';b.disabled=true;b.textContent='ADDING POINT…';}
  const overlayRoot=$('#overlayRoot');if(overlayRoot){overlayRoot.innerHTML=`<div class="round-overlay"><div class="round-win-card"><div class="trophy-pop">🏆</div><h2>Round Winner!</h2><div class="winner-name">${escapeHTML(r.winner.player)}</div><div class="group-award" style="background:${r.winner.color}"><span>${escapeHTML(r.winner.groupName)}</span><span class="point-pop">+1 POINT</span></div></div></div>`;}
  confetti(42);setTimeout(awardPointIfNeeded,430);
  setTimeout(()=>{if(overlayRoot)overlayRoot.innerHTML='';phase='postround';const btn=$('#stageBtn');if(btn){btn.className='stage-btn next';btn.textContent=state.roundIndex===QUESTIONS.length-1?'🏁 SEE FINAL SCORES':'NEXT QUESTION →';btn.disabled=false;}},2200);
}
function revealCorrectAnswer(){
  const q=QUESTIONS[state.roundIndex],chars=answerChars(q),center=$('#centerAnswer');if(center)center.innerHTML=wordSlotHTML(q.answer,false,chars);
  for(let lane=0;lane<3;lane++){$(`#progress-${lane}`).innerHTML=wordSlotHTML(q.answer,true,chars);}
}
function restoreCompletedRound(){
  const q=QUESTIONS[state.roundIndex],r=state.lastResult;$('#preQuestion').classList.add('hidden');$('#liveChallenge').classList.remove('hidden');renderChallenge(q);renderPlayerLetters(q,false);
  document.querySelectorAll('.player-card').forEach((card,i)=>{card.classList.remove('readying','checked','preview','live','penalty');card.querySelector('.ready-btn').classList.add('hidden');card.querySelectorAll('.letter-btn').forEach(b=>b.disabled=true);if(r.winnerLane===i)card.classList.add('round-winner');});
  if(state.answerRevealed){
    revealCorrectAnswer();
    if(r.finalized){if(!r.pointAwarded)awardPointIfNeeded();phase='postround';const b=$('#stageBtn');b.className='stage-btn next';b.textContent=state.roundIndex===QUESTIONS.length-1?'🏁 SEE FINAL SCORES':'NEXT QUESTION →';b.disabled=false;}
    else{phase='revealed';const b=$('#stageBtn');b.className='stage-btn next';b.textContent='🏁 FINISH ROUND';b.disabled=false;}
  }else{phase='answered';const b=$('#stageBtn');b.className='stage-btn answer';b.textContent='👁 SHOW CORRECT ANSWER';b.disabled=false;}
}
function refreshScoreboard(){document.querySelectorAll('.score-card .score').forEach((el,i)=>el.textContent=state.scores[groupOrder[i]]);}
function nextRound(){const overlayRoot=$('#overlayRoot');if(overlayRoot)overlayRoot.innerHTML='';document.querySelectorAll('.confetti').forEach(p=>p.remove());state.roundIndex++;state.roundCompleted=false;state.answerRevealed=false;state.lastResult=null;if(state.roundIndex>=QUESTIONS.length){state.finished=true;saveState();renderEnd();}else{saveState();renderRound();}}

function renderEnd(){
  if(!state)state=loadState()||freshState();
  if(!state.correctLetters){state.correctLetters={};groupOrder.forEach(g=>state.correctLetters[g]=0);}
  const ranking=groupOrder.map(g=>({id:g,...groups[g],score:state.scores[g]||0,letters:state.correctLetters[g]||0})).sort((a,b)=>b.score-a.score||b.letters-a.letters);
  const topScore=ranking[0].score,pointLeaders=ranking.filter(x=>x.score===topScore),topLetters=Math.max(...pointLeaders.map(x=>x.letters)),winners=pointLeaders.filter(x=>x.letters===topLetters);
  const tieBroken=pointLeaders.length>1&&winners.length===1;
  const winnerText=winners.length===1?winners[0].name:winners.map(w=>w.name.replace(' Group','')).join(' & ')+' Groups';
  const winnerColor=winners.length===1?winners[0].color:'linear-gradient(90deg,#ffd166,#a9c8e8,#cfa7f3)';
  const championLabel=winners.length===1?'Champion Group':'Joint Champions';
  const tieNote=tieBroken?`<p class="tie-break-note">Tie-breaker: <strong>${topLetters} correct letters</strong></p>`:(pointLeaders.length>1?`<p class="tie-break-note">Still tied: <strong>${topLetters} correct letters each</strong></p>`:'');
  app.innerHTML=`<main class="screen"><div class="topbar"><div class="brand"><div class="brand-badge">🏁</div><div><h1>Future Race Complete!</h1><p>All 30 pupils have taken part.</p></div></div><div></div>${toolbar()}</div><section class="end-wrap"><div class="winner-panel"><div class="trophy">🏆</div><p>${championLabel}</p><div class="winner-chip" style="background:${winnerColor}">${escapeHTML(winnerText)}</div><h2>${topScore} point${topScore===1?'':'s'}</h2>${tieNote}<p>Excellent future-action thinking!</p><button class="primary-btn" id="againBtn">⚡ New Race</button></div><div class="ranking-panel"><h3>Final Leaderboard</h3><div class="rank-key">Points · correct letters</div>${ranking.map((r,i)=>`<div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-group" style="background:${r.color}">${escapeHTML(r.name)}</div><div class="rank-score">${r.score}<small>${r.letters} letters</small></div></div>`).join('')}</div></section></main>`;
  bindToolbar();confetti(90);$('#againBtn').onclick=()=>{if(confirm('Start a fresh race with a new random player order?')){state=freshState();saveState();renderRound();}};
}
function confetti(count=45){const colors=['#ffd166','#55e6a5','#ff6b7a','#a9c8e8','#cfa7f3','#ffc58f'];for(let i=0;i<count;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=(2.2+Math.random()*2.1)+'s';p.style.animationDelay=(Math.random()*.45)+'s';p.style.setProperty('--drift',(-120+Math.random()*240)+'px');p.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000);}}

document.addEventListener('keydown',e=>{if(phase==='checkin'&&['1','2','3'].includes(e.key))checkInPlayer(Number(e.key)-1);if(e.key==='Enter'&&!$('#stageBtn')?.disabled)$('#stageBtn').click();});
renderIntro();
})();
</script>
