<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Word Order Race — Shared Setup</title>
<style>
:root{
  --bg1:#09111f;--bg2:#111d34;--panel:#17233c;--panel2:#1d2c4a;
  --text:#f7fbff;--muted:#b9c6dc;--gold:#ffd166;--good:#55e6a5;--bad:#ff6b7a;
  --shadow:0 12px 34px rgba(0,0,0,.32)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}
button{font:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(66,153,225,.18),transparent 30%),radial-gradient(circle at 85% 18%,rgba(255,209,102,.13),transparent 28%),linear-gradient(135deg,var(--bg1),var(--bg2))}
#app{position:relative;width:100%;height:100%;z-index:1}
#overlayRoot{position:relative;z-index:90}
.screen{width:100%;height:100%;padding:clamp(10px,1.3vw,22px);display:flex;flex-direction:column;gap:clamp(8px,1vh,14px)}
.hidden{display:none!important}
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;min-height:48px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-badge{font-size:clamp(27px,3vw,46px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
.brand h1{margin:0;font-size:clamp(23px,2.45vw,42px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:5px 0 0;color:var(--muted);font-size:clamp(12px,1.05vw,17px)}
.toolbar,.game-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.icon-btn,.primary-btn,.secondary-btn,.stage-btn,.ready-btn,.word-btn,.label-btn{border:0;cursor:pointer;font-weight:900;box-shadow:var(--shadow);transition:transform .12s ease,filter .12s ease,opacity .12s ease,background .15s ease}
.icon-btn:active,.primary-btn:active,.secondary-btn:active,.stage-btn:active,.ready-btn:active,.word-btn:active,.label-btn:active{transform:scale(.97)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:#223253;color:#fff;font-size:21px}
.primary-btn{padding:14px 24px;border-radius:14px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#1d2433;font-size:clamp(17px,1.45vw,24px)}
.secondary-btn{padding:13px 20px;border-radius:14px;background:#2b4169;color:#fff;font-size:clamp(15px,1.2vw,20px)}
.stage-btn{min-width:clamp(230px,20vw,340px);padding:13px 22px;border-radius:16px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033;font-size:clamp(16px,1.35vw,22px)}
.stage-btn.waiting{background:#33445f;color:#aebbd0;box-shadow:none;opacity:.62;cursor:not-allowed}
.stage-btn.go{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825;animation:goGlow .72s ease-in-out infinite alternate}
.stage-btn.live{background:#263a5e;color:#c6d1e2;box-shadow:none;opacity:.78;cursor:default}
.stage-btn.answer{background:linear-gradient(135deg,#71c7ff,#5592f6);color:#10284b;animation:answerGlow .76s ease-in-out infinite alternate}
.stage-btn.next{background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033}
@keyframes goGlow{to{filter:brightness(1.14);box-shadow:0 0 28px rgba(85,230,165,.74),var(--shadow)}}
@keyframes answerGlow{to{filter:brightness(1.13);box-shadow:0 0 28px rgba(113,199,255,.70),var(--shadow)}}

/* Cover */
.intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.cover-card{position:relative;width:min(1160px,100%);height:100%;background:linear-gradient(145deg,rgba(31,47,79,.96),rgba(18,30,52,.96));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,52px)}
.cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 20%,rgba(88,166,255,.10),transparent 28%),radial-gradient(circle at 82% 22%,rgba(255,209,102,.08),transparent 24%),radial-gradient(circle at 50% 100%,rgba(85,230,165,.08),transparent 36%)}
.cover-inner{position:relative;z-index:2;max-width:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.45);color:var(--gold);font-weight:1000;font-size:clamp(12px,1.02vw,17px);letter-spacing:.04em;text-transform:uppercase}
.cover-title{font-size:clamp(48px,6vw,92px);line-height:.94;margin:20px 0 14px;max-width:900px;text-shadow:0 8px 25px rgba(0,0,0,.35)}
.cover-title em{color:var(--gold);font-style:normal}
.cover-subtitle{font-size:clamp(19px,1.7vw,29px);color:#dbe7fb;max-width:760px;line-height:1.3;margin:0}
.cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:min(360px,80vw)}
.cover-mini-steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-step{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#e6eefb;font-size:clamp(14px,1.15vw,19px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.cover-step strong{color:var(--gold)}
.cover-arrow{font-size:clamp(18px,1.4vw,24px);color:rgba(255,209,102,.92);font-weight:1000}
.cover-animation{position:absolute;left:0;right:0;bottom:10px;height:128px;pointer-events:none;z-index:1}
.float-chip{position:absolute;bottom:0;padding:11px 16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);font-size:clamp(14px,1.05vw,19px);font-weight:1000;color:#e6eefb;animation:floatBob 3.8s ease-in-out infinite alternate}
.float-chip strong{color:var(--gold)}
.float-chip.ch1{left:8%;animation-duration:4.1s}.float-chip.ch2{left:27%;bottom:20px;animation-duration:3.5s}.float-chip.ch3{left:48%;animation-duration:4.6s}.float-chip.ch4{left:67%;bottom:18px;animation-duration:3.9s}.float-chip.ch5{right:7%;animation-duration:4.4s}
@keyframes floatBob{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-14px) scale(1.04)}}

/* Scoreboard */
.scoreboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.score-card{min-width:0;background:rgba(25,39,66,.92);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 9px;display:flex;align-items:center;justify-content:space-between;gap:7px;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.score-card .gname{font-weight:1000;color:#172033;padding:5px 7px;border-radius:8px;font-size:clamp(9px,.82vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}
.score-card .score{font-size:clamp(20px,1.85vw,31px);font-weight:1000}
.score-card.score-bump{animation:scoreBump .65s ease}
@keyframes scoreBump{0%{transform:scale(1)}45%{transform:scale(1.09);box-shadow:0 0 28px rgba(255,209,102,.7)}100%{transform:scale(1)}}

/* Game — aligned to Conjunction 'and' Battle Royale */
.game-main{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(7px,.9vh,12px);min-height:0}
.round-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.round-label{font-size:clamp(16px,1.38vw,23px);font-weight:1000;color:var(--gold)}
.type-pill{padding:7px 13px;border-radius:999px;background:#24395f;color:#dfeaff;font-weight:900;font-size:clamp(11px,.95vw,15px)}
.arena{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}
.challenge-panel{min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border-radius:22px;border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);padding:clamp(12px,1.55vw,24px);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pre-question{display:grid;place-items:center;min-height:100%;font-size:clamp(29px,3vw,53px);font-weight:1000;color:var(--gold);text-align:center}
.live-challenge{display:flex;flex-direction:column;gap:9px;min-height:0;height:100%}
.instruction{text-align:center;font-size:clamp(24px,2.15vw,36px);font-weight:1000;color:var(--gold);line-height:1.2}
.prompt-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.prompt-icon{width:68px;height:68px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.13);display:grid;place-items:center;font-size:40px}
.helper-chip{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.13);border-radius:14px;padding:12px 18px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(20px,1.7vw,29px);font-weight:900;line-height:1.2;min-height:62px}
.build-label{text-align:center;color:#cbd8eb;font-size:clamp(12px,1vw,16px);font-weight:900}
.built-sentence{flex:1;min-height:88px;background:rgba(255,255,255,.06);border:3px dashed rgba(255,209,102,.45);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px 8px;overflow:auto;transition:background .2s ease,border-color .2s ease,box-shadow .2s ease}
.built-word{padding:8px 12px;border-radius:10px;background:rgba(255,209,102,.17);border:1px solid rgba(255,209,102,.4);color:#fff;font-size:clamp(21px,1.9vw,31px);font-weight:1000;animation:wordPop .22s ease}
.word-slot{width:clamp(38px,3.8vw,64px);height:clamp(34px,3.1vw,50px);border-bottom:3px solid rgba(255,255,255,.35)}
@keyframes wordPop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
.word-progress{text-align:center;font-size:clamp(15px,1.2vw,20px);font-weight:900;color:#cbd8eb}
.answer-type{align-self:center;padding:10px 18px;border-radius:12px;background:rgba(85,230,165,.13);border:1px solid rgba(85,230,165,.42);color:#b8f7d8;font-size:clamp(18px,1.35vw,24px);font-weight:1000}

.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:clamp(150px,21vh,225px)}
.player-card{--group:#ddd;--glow:rgba(255,255,255,.5);border:4px solid rgba(255,255,255,.18);border-radius:20px;padding:10px 12px;color:#172033;background:var(--group);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:9px;position:relative;overflow:hidden;text-align:center;filter:brightness(.68) saturate(.72);transition:filter .18s ease,transform .13s ease,border-color .18s ease,box-shadow .18s ease}
.player-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.14),transparent 65%);transform:translateX(-120%)}
.player-card.readying::after,.player-card.battling::after{animation:sweep 1.15s infinite}
@keyframes sweep{to{transform:translateX(120%)}}
.player-card.checked{filter:brightness(.94) saturate(.90);border-color:rgba(255,255,255,.78);box-shadow:0 0 16px var(--glow),0 0 28px var(--glow),var(--shadow)}
.player-card.preview{filter:brightness(.80) saturate(.76)}
.player-card.battling{filter:none;border-color:rgba(255,255,255,.64)}
.player-card.round-winner{border-color:#fff6bd;filter:brightness(1.07);transform:translateY(-3px);box-shadow:0 0 24px rgba(255,209,102,.72),var(--shadow)}
.player-head{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;position:relative;z-index:2}
.player-name{font-size:clamp(20px,1.9vw,34px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word-score{min-width:38px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.55);font-size:clamp(14px,1.05vw,18px);font-weight:1000}
.ready-btn{align-self:center;min-width:145px;border:2px solid rgba(23,32,51,.25);border-radius:13px;padding:10px 18px;background:rgba(255,255,255,.42);color:#172033;font-size:clamp(17px,1.45vw,24px);font-weight:1000;position:relative;z-index:2;box-shadow:none}
.word-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;position:relative;z-index:2}
.word-options.label-options{grid-template-columns:repeat(2,1fr);max-width:86%;width:100%;align-self:center}
.word-btn,.label-btn{min-width:0;min-height:68px;border:2px solid rgba(23,32,51,.22);border-radius:12px;padding:10px 7px;background:rgba(255,255,255,.55);color:#172033;font-size:clamp(18px,1.6vw,28px);font-weight:1000;overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:normal;word-break:normal;line-height:1.06;box-shadow:0 4px 0 rgba(23,32,51,.22);transition:transform .1s ease,background .15s ease,filter .15s ease}
.word-btn.long-option{font-size:clamp(16px,1.35vw,23px);padding-left:4px;padding-right:4px}
.word-btn:hover,.label-btn:hover{filter:brightness(1.08)}
.word-btn.correct-flash,.label-btn.correct-flash{background:var(--good);color:#0b3d2a}
.word-btn.wrong-flash,.label-btn.wrong-flash{background:var(--bad);color:white;animation:shake .28s ease}
.word-btn:disabled,.label-btn:disabled{cursor:default;opacity:.58}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.built-word.answer-correct{background:rgba(85,230,165,.28);border-color:rgba(85,230,165,.82);color:#eafff4;box-shadow:0 0 14px rgba(85,230,165,.18)}
.countdown-overlay{position:fixed;inset:0;z-index:95;background:rgba(4,8,16,.76);backdrop-filter:blur(5px);display:grid;place-items:center;padding:24px}
.countdown{font-size:clamp(120px,22vw,330px);font-weight:1000;color:var(--gold);text-shadow:0 12px 40px rgba(0,0,0,.55);animation:pop .45s ease}
.countdown.go-word{color:#55e6a5}
@keyframes pop{0%{transform:scale(.55);opacity:.15}75%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* Round result — matches Quick Shape Sort */
.round-overlay{position:fixed;inset:0;z-index:90;background:rgba(4,9,18,.66);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px}
.round-win-card{width:min(720px,92vw);background:linear-gradient(145deg,#243f6d,#132847);border:2px solid rgba(255,255,255,.16);border-radius:30px;box-shadow:0 28px 80px rgba(0,0,0,.58);padding:28px 34px;text-align:center;overflow:hidden}
.round-win-card .trophy-pop{font-size:clamp(70px,6vw,102px);line-height:1;animation:trophyPop .55s cubic-bezier(.2,.9,.2,1.25)}
.round-win-card h2{margin:8px 0 6px;font-size:clamp(34px,3vw,50px);color:#ffd166}
.round-win-card .winner-name{font-size:clamp(38px,3.25vw,58px);font-weight:1000;line-height:1.04;margin:8px 0 14px}
.round-win-card .group-awards{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
.round-win-card .group-award{display:inline-flex;align-items:center;gap:14px;padding:11px 18px;border-radius:17px;color:#172033;font-size:clamp(19px,1.45vw,26px);font-weight:1000}
.round-win-card .point-pop{display:inline-block;padding:7px 13px;border-radius:999px;background:#fff;color:#173425;font-size:clamp(22px,1.7vw,30px);font-weight:1000;animation:pointPop .75s .32s both cubic-bezier(.2,.9,.2,1.3)}
@keyframes trophyPop{0%{transform:scale(.62) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes pointPop{0%{transform:translateY(10px) scale(.8);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

/* End */
.end-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
.winner-panel,.ranking-panel{background:linear-gradient(145deg,rgba(31,48,80,.97),rgba(18,30,52,.97));border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:var(--shadow);padding:clamp(21px,2.4vw,38px);min-height:0}
.winner-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.trophy{font-size:clamp(82px,10vw,165px)}
.winner-panel h2{font-size:clamp(34px,4.2vw,68px);line-height:1;margin:8px 0}
.winner-panel p{font-size:clamp(16px,1.4vw,23px);color:#d6e2f4;margin:8px 0}
.winner-chip{margin:13px 0;padding:13px 27px;border-radius:18px;color:#172033;font-size:clamp(25px,2.8vw,45px);font-weight:1000;box-shadow:var(--shadow)}
.ranking-panel{overflow:auto}.ranking-panel h3{margin:0 0 14px;font-size:clamp(24px,2.2vw,37px)}
.rank-row{display:grid;grid-template-columns:50px 1fr 92px;gap:11px;align-items:center;padding:9px;border-radius:14px;background:rgba(255,255,255,.06);margin:7px 0}
.rank-num{font-size:clamp(22px,1.9vw,32px);font-weight:1000;color:var(--gold);text-align:center}
.rank-group{padding:9px 11px;border-radius:10px;color:#172033;font-weight:1000;font-size:clamp(15px,1.25vw,21px)}
.rank-score{font-size:clamp(24px,2.1vw,36px);font-weight:1000;text-align:center}.rank-score small{display:block;margin-top:2px;font-size:.43em;line-height:1.05;color:#cbd8eb;white-space:nowrap}
.rank-key{text-align:right;color:#cbd8eb;font-size:clamp(14px,1.08vw,18px);font-weight:900;margin:-4px 4px 8px}
.tie-break-note{margin:2px 0 8px!important;padding:8px 14px;border-radius:12px;background:rgba(101,217,255,.10);border:1px solid rgba(101,217,255,.30);color:#dff6ff!important}
.confetti{position:fixed;top:-20px;width:12px;height:20px;z-index:70;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(840deg);opacity:.8}}

@media(max-aspect-ratio:4/3){.end-wrap{grid-template-columns:1fr}.ranking-panel{max-height:42vh}.players{min-height:190px}.word-btn,.label-btn{font-size:14px}}
@media(max-width:900px){.brand p{display:none}.score-card{padding:4px}.score-card .gname{font-size:9px}.players{gap:6px}.player-card{padding:8px 6px}.word-options{gap:4px}.word-btn,.label-btn{padding:7px 3px;font-size:12px}.player-name{font-size:18px}.word-score{font-size:12px}.stage-btn{min-width:170px;padding:10px 12px}}

</style>

<body>
<div id="app"></div>
<div id="overlayRoot"></div>
<script src="../shared/player-scheduler.js"></script>
<script src="../shared/game-setup.js"></script>
<script>
(() => {
'use strict';

const STORAGE_KEY='SgLDC_WordOrderRace_Community_v7';
const groupOrder=EduPlayGameSetup.GROUP_IDS;
let groups={};
let setupConfig=null;
function applySetup(cfg){groups=EduPlayGameSetup.toGroups(cfg);}
function loadSetup(){const cfg=EduPlayGameSetup.load();if(cfg)applySetup(cfg);return cfg;}
function setupReady(cfg){return EduPlayGameSetup.isReady(cfg);}
function renderSetup(){
  phase='setup';
  EduPlayGameSetup.open({
    app,
    overlayRoot,
    toolbarHTML:()=>toolbar(),
    bindToolbar,
    onBack:renderIntro,
    onApply:cfg=>{setupConfig=cfg;applySetup(cfg);},
    gameStateKey:STORAGE_KEY,
    errorSound:()=>wrongSound(),
    successSound:()=>correctSound()
  });
}


const QUESTIONS=[
  {kind:'sentence',icon:'🎆',helper:['a fireworks display','National Day'],instruction:'Build the sentence.',words:['There','will','be','a','fireworks','display','on','National','Day.'],points:1,pill:'Sentence building'},
  {kind:'sentence',icon:'🍔',helper:['food and drinks','guests'],instruction:'Build the sentence.',words:['There','will','be','food','and','drinks','for','the','guests.'],points:1,pill:'Sentence building'},
  {kind:'sentence',icon:'🎄',helper:['decorations','Christmas tree'],instruction:'Build the sentence.',words:['There','will','be','decorations','on','the','Christmas','tree.'],points:1,pill:'Sentence building'},
  {kind:'sentence',icon:'🎉',helper:['games','party'],instruction:'Build the sentence.',words:['There','will','be','games','at','the','party.'],points:1,pill:'Sentence building'},
  {kind:'commandlabel',icon:'🚴',helper:['helmet','cycling'],instruction:'Build the sentence. Then label it.',words:['Wear','a','helmet','when','you','go','cycling.'],label:'Command',points:2,pill:'Command or statement'},
  {kind:'commandlabel',icon:'🧼',helper:['wash','hands'],instruction:'Build the sentence. Then label it.',words:['Wash','your','hands','before','you','eat.'],label:'Command',points:2,pill:'Command or statement'},
  {kind:'commandlabel',icon:'🧹',helper:['classroom','clean'],instruction:'Build the sentence. Then label it.',words:['Clean','the','classroom.'],label:'Command',points:2,pill:'Command or statement'},
  {kind:'commandlabel',icon:'🚴',helper:['helmet','cycling'],instruction:'Build the sentence. Then label it.',words:['Mike','wore','his','helmet','when','he','went','cycling.'],label:'Statement',points:2,pill:'Command or statement'},
  {kind:'commandlabel',icon:'🧼',helper:['wash','hands'],instruction:'Build the sentence. Then label it.',words:['I','washed','my','hands','before','eating.'],label:'Statement',points:2,pill:'Command or statement'},

function makeOptions(correct,position=wordIndex){

  const topScore=ranking[0].score,pointLeaders=ranking.filter(x=>x.score===topScore),topSteps=Math.max(...pointLeaders.map(x=>x.steps)),winners=pointLeaders.filter(x=>x.steps===topSteps),tieBroken=pointLeaders.length>1&&winners.length===1;
  const winnerText=winners.length===1?winners[0].name:winners.map(w=>w.name.replace(' Group','')).join(' & ')+' Groups',winnerColor=winners.length===1?winners[0].color:'linear-gradient(90deg,#ffd166,#a9c8e8,#cfa7f3)',championLabel=winners.length===1?'Champion Group':'Joint Champions';
  const tieNote=tieBroken?`<p class="tie-break-note">Tie-breaker: <strong>${topSteps} correct steps</strong></p>`:(pointLeaders.length>1?`<p class="tie-break-note">Still tied: <strong>${topSteps} correct steps each</strong></p>`:'');
  app.innerHTML=`<main class="screen"><div class="topbar"><div class="brand"><div class="brand-badge">🏁</div><div><h1>Word Order Race Complete!</h1><p>All 30 pupils have taken part.</p></div></div>${toolbar()}</div><section class="end-wrap"><div class="winner-panel"><div class="trophy">🏆</div><p>${championLabel}</p><div class="winner-chip" style="background:${winnerColor}">${winnerText}</div><h2>${topScore} point${topScore===1?'':'s'}</h2>${tieNote}<p>Excellent sentence building!</p><button class="primary-btn" id="againBtn">⚡ New Race</button></div><div class="ranking-panel"><h3>Final Leaderboard</h3><div class="rank-key">Points · correct steps</div>${ranking.map((r,i)=>`<div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-group" style="background:${r.color}">${r.name}</div><div class="rank-score">${r.score}<small>${r.steps} steps</small></div></div>`).join('')}</div></section></main>`;
  bindToolbar();confetti(90);$('#againBtn').onclick=()=>{if(confirm('Start a fresh race with a new random player order?')){state=freshState();saveState();renderRound();}};
}
function confetti(count=45){const colors=['#ffd166','#55e6a5','#ff6b7a','#a9c8e8','#cfa7f3','#ffc58f'];for(let i=0;i<count;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=(2.2+Math.random()*2.1)+'s';p.style.animationDelay=(Math.random()*.45)+'s';p.style.setProperty('--drift',(-120+Math.random()*240)+'px');p.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000);}}

document.addEventListener('keydown',e=>{if(phase==='checkin'&&['1','2','3'].includes(e.key))checkInPlayer(Number(e.key)-1);if(e.key==='Enter'&&!$('#stageBtn')?.disabled)$('#stageBtn').click();});
renderIntro();
})();
</script>
