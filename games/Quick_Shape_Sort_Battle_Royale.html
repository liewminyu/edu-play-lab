<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quick Shape Sort Battle Royale — Community v11</title>
<style>
:root{
  --bg1:#081323;--bg2:#12213a;--panel:#182844;--panel2:#223657;
  --text:#f7fbff;--muted:#bdc9dc;--gold:#ffd166;--good:#55e6a5;--bad:#ff6b7a;
  --shadow:0 12px 32px rgba(0,0,0,.30)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}
button{font:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 14% 15%,rgba(45,143,219,.18),transparent 31%),radial-gradient(circle at 86% 17%,rgba(255,209,102,.12),transparent 28%),linear-gradient(135deg,var(--bg1),var(--bg2))}
#app{position:relative;width:100%;height:100%;z-index:1}
.hidden{display:none!important}
.screen{width:100%;height:100%;padding:clamp(10px,1.25vw,21px);display:flex;flex-direction:column;gap:clamp(8px,1vh,14px)}
.topbar{display:grid;grid-template-columns:minmax(300px,1fr) auto;align-items:center;gap:14px;min-height:58px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-badge{font-size:clamp(29px,3vw,48px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.34))}
.brand h1{margin:0;font-size:clamp(22px,2.35vw,40px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:5px 0 0;color:var(--muted);font-size:clamp(11px,1vw,16px)}
.toolbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.icon-btn,.primary-btn,.secondary-btn,.stage-btn,.ready-btn,.answer-btn{border:0;cursor:pointer;font-weight:1000;transition:transform .11s ease,filter .13s ease,opacity .13s ease}
.icon-btn:active,.primary-btn:active,.secondary-btn:active,.stage-btn:active,.ready-btn:active,.answer-btn:active{transform:scale(.97)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:#23385f;color:#fff;font-size:21px;box-shadow:var(--shadow)}
.primary-btn{padding:14px 24px;border-radius:15px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#182239;font-size:clamp(17px,1.45vw,24px);box-shadow:var(--shadow)}
.secondary-btn{padding:13px 20px;border-radius:15px;background:#2c4774;color:#fff;font-size:clamp(15px,1.2vw,20px);box-shadow:var(--shadow)}
.stage-btn{min-width:clamp(215px,19vw,310px);padding:13px 24px;border-radius:16px;background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033;font-size:clamp(17px,1.5vw,25px);box-shadow:0 0 20px rgba(255,209,102,.42),var(--shadow)}
.stage-btn.waiting{background:#33445f;color:#aebbd0;box-shadow:none;opacity:.62;cursor:not-allowed}
.stage-btn.go{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825;animation:goGlow .72s ease-in-out infinite alternate}
.stage-btn.live{background:#263a5e;color:#c6d1e2;box-shadow:none;opacity:.78;cursor:default}
@keyframes goGlow{to{filter:brightness(1.14);box-shadow:0 0 28px rgba(85,230,165,.74),var(--shadow)}}

/* Intro */
.intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.cover-card{position:relative;width:min(1160px,100%);height:100%;background:linear-gradient(145deg,rgba(31,48,80,.97),rgba(17,29,50,.97));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,52px)}
.cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 20%,rgba(88,166,255,.10),transparent 28%),radial-gradient(circle at 82% 18%,rgba(255,209,102,.08),transparent 24%),radial-gradient(circle at 50% 100%,rgba(85,230,165,.08),transparent 36%)}
.cover-inner{position:relative;z-index:2;max-width:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.45);color:var(--gold);font-weight:1000;font-size:clamp(12px,1.02vw,17px);letter-spacing:.04em;text-transform:uppercase}
.cover-title{font-size:clamp(46px,6vw,92px);line-height:.94;margin:20px 0 14px;max-width:900px;text-shadow:0 8px 25px rgba(0,0,0,.35)}
.cover-title em{color:var(--gold);font-style:normal}
.cover-subtitle{font-size:clamp(19px,1.7vw,29px);color:#dbe7fb;max-width:760px;line-height:1.3;margin:0}
.cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:min(360px,80vw)}
.cover-mini-steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:2}
.cover-step{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#e6eefb;font-size:clamp(14px,1.15vw,19px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.cover-step strong{color:var(--gold)}
.cover-arrow{font-size:clamp(18px,1.4vw,24px);color:rgba(255,209,102,.92);font-weight:1000}
.cover-animation{position:absolute;left:0;right:0;bottom:10px;height:128px;pointer-events:none;z-index:1}
.float-shape{position:absolute;bottom:0;opacity:.95;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));animation:floatBob 3.8s ease-in-out infinite alternate}
.float-shape.shape-1{left:10%;animation-duration:4.2s}
.float-shape.shape-2{left:28%;bottom:18px;animation-duration:3.5s;animation-delay:.4s}
.float-shape.shape-3{left:49%;bottom:-4px;animation-duration:4.6s;animation-delay:.2s}
.float-shape.shape-4{left:68%;bottom:14px;animation-duration:3.9s;animation-delay:.7s}
.float-shape.shape-5{left:84%;bottom:2px;animation-duration:4.4s;animation-delay:.3s}
@keyframes floatBob{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-14px) scale(1.04)}}


/* Universal Game Setup — streamlined v6 */
.setup-screen{gap:10px}
.setup-topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;min-height:58px}
.setup-title-wrap{min-width:0;display:flex;align-items:center}.setup-title-wrap h1{margin:0;font-size:clamp(36px,3.25vw,54px);line-height:1}
.setup-back{width:auto;min-width:50px;padding:0 14px;font-size:clamp(22px,1.8vw,28px)}
.setup-history{display:flex;align-items:center;gap:7px}.setup-history .icon-btn{font-size:25px}.setup-history .icon-btn:disabled{filter:grayscale(.85) brightness(.7);opacity:.42;cursor:not-allowed;box-shadow:none}
.setup-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(245px,1.16fr) repeat(3,minmax(185px,1fr));grid-template-rows:1fr 1fr;gap:10px}
.setup-panel{min-width:0;min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.player-bank{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;padding:12px;gap:9px}
.setup-panel-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(21px,1.85vw,29px);font-weight:1000;color:var(--gold)}
.setup-count{font-size:clamp(18px,1.45vw,23px);color:#d7e2f2;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:999px}
.player-entry{flex:0 0 auto;width:100%;height:52px;min-height:52px;resize:none;overflow:hidden;border:2px solid rgba(255,255,255,.13);outline:none;border-radius:12px;background:#101d33;color:#f7fbff;padding:10px 12px;font:800 clamp(18px,1.45vw,23px)/1.25 "Trebuchet MS",Arial,sans-serif}
.player-entry:focus{border-color:rgba(255,209,102,.72);box-shadow:0 0 0 3px rgba(255,209,102,.08)}
.player-entry::placeholder{color:#91a3bb;opacity:1}
.player-tags{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:2px 4px 4px}
.player-tag{width:100%;flex:0 0 auto;border:2px solid rgba(255,255,255,.18);border-radius:10px;background:#2b4775;color:#fff;padding:7px 10px;font-size:clamp(17px,1.35vw,22px);line-height:1.12;font-weight:1000;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.player-tag:active{cursor:grabbing}.player-tag.selected{outline:3px solid var(--gold);outline-offset:2px}.player-tag.assigned{color:#172033}
.touch-drag-ghost{position:fixed!important;z-index:99999!important;pointer-events:none!important;margin:0!important;opacity:.92;transform:translate(-50%,-50%) scale(1.04);box-shadow:0 16px 32px rgba(0,0,0,.38)!important}.player-bank.drag-over{outline:3px solid var(--gold);outline-offset:-3px;background:rgba(255,209,102,.06)}
.group-card{display:flex;flex-direction:column;padding:10px;gap:8px;transition:border-color .15s ease,background .15s ease}
.group-card.drag-over{border-color:var(--gold);background:rgba(255,209,102,.08)}
.group-header{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center}
.group-name-input{width:100%;min-width:0;border:0;outline:none;border-radius:11px;background:#2b4775;color:#fff;padding:10px 11px;font-weight:1000;font-size:clamp(19px,1.55vw,25px);line-height:1.15;text-align:center}
.group-name-input:focus{box-shadow:0 0 0 3px rgba(255,209,102,.20)}
.group-colour{width:48px;height:48px;border:2px solid rgba(255,255,255,.55);border-radius:9px;padding:0;background:transparent;cursor:pointer;overflow:hidden}
.group-colour::-webkit-color-swatch-wrapper{padding:0}.group-colour::-webkit-color-swatch{border:0;border-radius:6px}.group-colour::-moz-color-swatch{border:0;border-radius:6px}
.group-drop{flex:1;min-height:0;border:2px dashed rgba(255,255,255,.20);border-radius:13px;padding:7px;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));align-items:stretch;gap:5px;overflow:hidden}
.group-drop .player-tag{height:100%;min-height:0;display:flex;align-items:center;font-size:clamp(16px,1.2vw,20px);line-height:1.05;padding:4px 9px}
.group-entry{width:100%;height:100%;min-height:0;resize:none;overflow:hidden;border:2px solid rgba(255,255,255,.14);outline:none;border-radius:9px;background:rgba(255,255,255,.055);color:#fff;padding:5px 8px;font:800 clamp(14px,1.05vw,18px)/1.15 "Trebuchet MS",Arial,sans-serif}
.group-entry:focus{border-color:rgba(255,209,102,.62);background:rgba(255,255,255,.085)}
.group-entry::placeholder{color:#8fa1b9;opacity:1}
.group-player-count{flex:0 0 auto;text-align:center;color:#a9bad1;font-size:clamp(16px,1.25vw,20px);font-weight:1000;line-height:1;padding:3px 0 1px}
.group-card.full .group-drop{border-color:rgba(85,230,165,.55)}.group-card.full .group-player-count{color:#9ff0c8}
.setup-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.setup-action{border:0;border-radius:12px;min-height:44px;padding:7px 8px;background:#2c4774;color:#fff;font-weight:1000;font-size:clamp(16px,1.25vw,21px);cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.18);white-space:nowrap}
.setup-action:disabled{filter:grayscale(.8) brightness(.72);opacity:.5;cursor:not-allowed;box-shadow:none}.setup-action.valid{background:linear-gradient(135deg,#65e5a8,#21bd75);color:#0a3825}.setup-action.primary{background:linear-gradient(135deg,#ffd166,#ffb703);color:#172033}
.setup-toast{position:fixed;left:50%;bottom:72px;z-index:120;max-width:min(760px,calc(100vw - 36px));padding:12px 18px;border-radius:14px;background:rgba(25,39,66,.97);border:2px solid rgba(255,255,255,.16);box-shadow:0 16px 38px rgba(0,0,0,.38);color:#f4f8ff;font-size:clamp(17px,1.35vw,22px);line-height:1.25;font-weight:900;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,14px) scale(.98);transition:opacity .18s ease,transform .18s ease}
.setup-toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.setup-toast.good{background:rgba(23,72,58,.97);border-color:rgba(85,230,165,.58);color:#c5f7dd}
.setup-toast.bad{background:rgba(79,31,43,.98);border-color:rgba(255,114,128,.62);color:#ffd4d8}
.setup-toast strong{color:#fff}
.start-disabled{filter:grayscale(.88) brightness(.65);opacity:.52;cursor:not-allowed!important;box-shadow:none!important}
@media(max-width:1000px){.setup-grid{grid-template-columns:minmax(225px,1.08fr) repeat(3,minmax(155px,1fr));gap:7px}.setup-actions{gap:6px}.setup-action{min-height:42px;padding:7px 5px;font-size:clamp(16px,1.65vw,20px)}.group-card{padding:7px}.player-bank{padding:8px}.player-tag{font-size:clamp(16px,1.8vw,20px);padding:7px 9px}.group-drop .player-tag{font-size:clamp(14px,1.55vw,18px);padding:4px 7px}.group-name-input{font-size:clamp(17px,1.8vw,21px)}.group-player-count{font-size:clamp(14px,1.55vw,18px)}.setup-toast{bottom:64px;font-size:clamp(16px,1.7vw,20px)}}

/* Game */
.scoreboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.score-card{min-width:0;background:rgba(25,39,66,.93);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 9px;display:flex;align-items:center;justify-content:space-between;gap:7px;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.score-card .gname{font-weight:1000;color:#172033;padding:5px 7px;border-radius:8px;font-size:clamp(9px,.82vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}
.score-card .score{font-size:clamp(20px,1.85vw,31px);font-weight:1000}
.game-main{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(7px,.9vh,12px);min-height:0}
.round-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.round-label{font-size:clamp(16px,1.38vw,23px);font-weight:1000;color:var(--gold)}
.type-pill{padding:7px 13px;border-radius:999px;background:#24395f;color:#dfeaff;font-weight:900;font-size:clamp(11px,.95vw,15px)}
.toolbar .stage-btn{min-width:clamp(210px,19vw,290px)}
.arena{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}
.challenge-panel{min-height:0;background:linear-gradient(145deg,rgba(32,49,82,.97),rgba(18,30,52,.97));border-radius:22px;border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);padding:clamp(12px,1.45vw,22px);display:flex;flex-direction:column;gap:9px;overflow:hidden}
.pre-question{display:grid;place-items:center;min-height:100%;font-size:clamp(29px,3vw,53px);font-weight:1000;color:var(--gold);text-align:center}
.live-challenge{display:flex;flex-direction:column;gap:9px;min-height:0;height:100%}
.instruction{text-align:center;font-size:clamp(18px,1.55vw,26px);font-weight:1000;color:var(--gold)}
.teacher-note{text-align:center;color:#d3dfef;font-size:clamp(12px,1vw,16px);font-weight:800;display:none}
.sort-board{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0;flex:1}
.shape-group{border:3px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.055);padding:10px;min-height:0;display:flex;flex-direction:column}
.shape-group.target{border-style:dashed;border-color:rgba(255,209,102,.62)}
.shape-group.reveal-correct{border-style:solid;border-color:rgba(85,230,165,.72);background:rgba(85,230,165,.10);box-shadow:0 0 0 2px rgba(85,230,165,.10),0 0 18px rgba(85,230,165,.10)}
.shape-cell.correct-cell,.sorted-cell.correct-cell{border-color:rgba(85,230,165,.75);background:rgba(85,230,165,.16)}
.group-heading{text-align:center;border-radius:12px;background:#2b4775;padding:8px 12px;font-size:clamp(15px,1.25vw,21px);font-weight:1000}
.shape-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:center;justify-items:center;padding:9px}
.shape-cell{width:100%;min-height:80px;border-radius:14px;background:rgba(255,255,255,.07);display:grid;place-items:center;border:2px solid rgba(255,255,255,.09)}
.empty-slot{width:64%;height:66%;border:3px dashed rgba(255,255,255,.25);border-radius:13px}
.identify-board{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0;flex:1}
.sorted-group{border:3px solid rgba(255,255,255,.18);border-radius:18px;background:rgba(255,255,255,.055);padding:10px;display:flex;flex-direction:column}
.sorted-label{text-align:center;border-radius:12px;background:#2b4775;padding:8px 12px;font-size:clamp(15px,1.2vw,20px);font-weight:1000}
.sorted-shapes{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:8px}
.sorted-cell{min-height:70px;border-radius:13px;background:rgba(255,255,255,.07);display:grid;place-items:center;border:2px solid rgba(255,255,255,.09)}
.rule-question{text-align:center;font-size:clamp(16px,1.35vw,22px);font-weight:1000;color:#e7effb}
.rule-blank{display:inline-flex;align-items:center;justify-content:center;min-width:170px;min-height:54px;padding:6px 18px;margin:0 4px;border-radius:14px;border:3px dashed rgba(255,209,102,.6);color:var(--gold);background:rgba(255,255,255,.03)}
.rule-blank.filled{border-style:solid;border-color:rgba(85,230,165,.72);background:rgba(85,230,165,.16);color:#c9ffe3;box-shadow:0 0 0 2px rgba(85,230,165,.10),0 0 18px rgba(85,230,165,.10)}

.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:clamp(150px,21vh,220px)}
.player-card{--group:#ddd;--glow:rgba(255,255,255,.5);border:4px solid rgba(255,255,255,.18);border-radius:20px;padding:10px 12px;color:#172033;background:var(--group);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:9px;position:relative;overflow:hidden;text-align:center;filter:brightness(.68) saturate(.72);transition:filter .18s ease,transform .13s ease,border-color .18s ease,box-shadow .18s ease}
.player-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.14),transparent 65%);transform:translateX(-120%)}
.player-card.readying::after,.player-card.live::after{animation:sweep 1.15s infinite}
@keyframes sweep{to{transform:translateX(120%)}}
.player-card.checked{filter:brightness(.91) saturate(.88);border-color:rgba(255,255,255,.72);box-shadow:0 0 16px var(--glow),0 0 28px var(--glow),var(--shadow)}
.player-card.preview{filter:brightness(.78) saturate(.75)}
.player-card.live{filter:none;border-color:rgba(255,255,255,.58)}
.player-card.locked{filter:brightness(.62) saturate(.55);opacity:.72}
.player-card.round-winner{border-color:var(--gold);filter:brightness(1.06);transform:translateY(-3px);box-shadow:0 0 24px rgba(255,209,102,.56),var(--shadow)}
.player-head{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;position:relative;z-index:2}
.player-name{font-size:clamp(20px,1.9vw,34px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-score{min-width:38px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.58);font-size:clamp(14px,1.05vw,18px);font-weight:1000}
.ready-btn{align-self:center;min-width:145px;border:2px solid rgba(23,32,51,.25);border-radius:13px;padding:10px 18px;background:rgba(255,255,255,.46);color:#172033;font-size:clamp(17px,1.45vw,24px);font-weight:1000;position:relative;z-index:2}
.choice-area{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;position:relative;z-index:2}
.answer-btn{min-width:0;min-height:66px;border:2px solid rgba(23,32,51,.22);border-radius:12px;padding:7px 5px;background:#f7fbff;color:#172033;font-size:clamp(13px,1.13vw,19px);font-weight:1000;overflow:hidden;box-shadow:0 4px 0 rgba(23,32,51,.22);display:flex;align-items:center;justify-content:center;text-align:center}
.answer-btn.shape-answer{min-height:80px}
.answer-btn.preview-choice{opacity:.42;cursor:not-allowed;box-shadow:none}
.answer-btn.correct-flash{background:var(--good);color:#0b3d2a}
.answer-btn.wrong-flash{background:var(--bad);color:white;animation:shake .28s ease}
.answer-btn:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.status-line{text-align:center;color:#d6e2f4;font-size:clamp(13px,1.05vw,18px);font-weight:900;min-height:22px;display:none}
.status-line strong{color:var(--gold)}
.answer-reveal{display:none}

.shape-symbol{display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.13));flex:none}
.shape-symbol.circle{border-radius:50%}.shape-symbol.square,.shape-symbol.rectangle{border-radius:0}.shape-symbol.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}.shape-symbol.pentagon{clip-path:polygon(50% 0,96% 35%,79% 100%,21% 100%,4% 35%)}
.shape-symbol.small{width:34px;height:34px}.shape-symbol.medium{width:47px;height:47px}.shape-symbol.large{width:59px;height:59px}
.shape-symbol.rectangle.small{width:47px;height:30px}.shape-symbol.rectangle.medium{width:63px;height:40px}.shape-symbol.rectangle.large{width:76px;height:48px}
.shape-symbol[data-color="red"]{background:#ef5147}.shape-symbol[data-color="blue"]{background:#2f80d3}.shape-symbol[data-color="green"]{background:#4bae46}.shape-symbol[data-color="yellow"]{background:#f2c42f}.shape-symbol[data-color="purple"]{background:#8a58bd}

/* Overlays and end */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,8,16,.77);backdrop-filter:blur(5px);display:grid;place-items:center;padding:24px}
.result-card{width:min(930px,92vw);background:linear-gradient(145deg,#243a60,#14233d);border:2px solid rgba(255,255,255,.15);border-radius:28px;padding:clamp(22px,2.7vw,40px);text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.55)}
.result-icon{font-size:clamp(58px,6.5vw,100px)}
.result-card h2{font-size:clamp(32px,3.7vw,60px);margin:3px 0 8px;color:var(--gold)}
.result-card p{font-size:clamp(16px,1.4vw,23px);line-height:1.35;margin:8px 0;color:#dbe7f8}
.round-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.round-score{padding:12px;border-radius:14px;color:#172033;font-weight:1000;font-size:clamp(15px,1.25vw,21px)}
.round-score b{display:block;font-size:clamp(26px,2.5vw,42px)}
.completed-note{margin:14px auto;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 16px;max-width:820px;font-size:clamp(16px,1.35vw,22px)}
.overlay-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:17px}
.round-overlay{position:fixed;inset:0;z-index:90;background:rgba(4,9,18,.66);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px}
.round-win-card{width:min(720px,92vw);background:linear-gradient(145deg,#243f6d,#132847);border:2px solid rgba(255,255,255,.16);border-radius:30px;box-shadow:0 28px 80px rgba(0,0,0,.58);padding:28px 34px;text-align:center;overflow:hidden}
.round-win-card .trophy-pop{font-size:clamp(70px,6vw,102px);line-height:1;animation:trophyPop .55s cubic-bezier(.2,.9,.2,1.25)}
.round-win-card h2{margin:8px 0 6px;font-size:clamp(34px,3vw,50px);color:#ffd166}
.round-win-card .winner-name{font-size:clamp(38px,3.25vw,58px);font-weight:1000;line-height:1.04;margin:8px 0 14px}
.round-win-card .group-awards{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
.round-win-card .group-award{display:inline-flex;align-items:center;gap:14px;padding:11px 18px;border-radius:17px;color:#172033;font-size:clamp(19px,1.45vw,26px);font-weight:1000}
.round-win-card .point-pop{display:inline-block;padding:7px 13px;border-radius:999px;background:#fff;color:#173425;font-size:clamp(22px,1.7vw,30px);font-weight:1000;animation:pointPop .75s .32s both cubic-bezier(.2,.9,.2,1.3)}
.round-win-card .no-point{font-size:clamp(20px,1.5vw,27px);font-weight:1000;color:#dfe9fb;margin-top:10px}
@keyframes trophyPop{0%{transform:scale(.62) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes pointPop{0%{transform:translateY(10px) scale(.8);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.end-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
.winner-panel,.ranking-panel{background:linear-gradient(145deg,rgba(31,48,80,.97),rgba(18,30,52,.97));border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:var(--shadow);padding:clamp(21px,2.4vw,38px);min-height:0}
.winner-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.trophy{font-size:clamp(82px,10vw,165px)}
.winner-panel h2{font-size:clamp(34px,4.2vw,68px);line-height:1;margin:8px 0}.winner-panel p{font-size:clamp(16px,1.4vw,23px);color:#d6e2f4;margin:8px 0}
.winner-chip{margin:13px 0;padding:13px 27px;border-radius:18px;color:#172033;font-size:clamp(25px,2.8vw,45px);font-weight:1000;box-shadow:var(--shadow)}
.ranking-panel{overflow:auto}.ranking-panel h3{margin:0 0 14px;font-size:clamp(24px,2.2vw,37px)}
.rank-row{display:grid;grid-template-columns:50px 1fr 92px;gap:11px;align-items:center;padding:9px;border-radius:14px;background:rgba(255,255,255,.06);margin:7px 0}.rank-num{font-size:clamp(22px,1.9vw,32px);font-weight:1000;color:var(--gold);text-align:center}.rank-group{padding:9px 11px;border-radius:10px;color:#172033;font-weight:1000;font-size:clamp(15px,1.25vw,21px)}.rank-score{font-size:clamp(24px,2.1vw,36px);font-weight:1000;text-align:center}.rank-score small{display:block;font-size:.38em;line-height:1.15}
.confetti{position:fixed;top:-20px;width:12px;height:20px;z-index:70;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(840deg);opacity:.8}}

@media(max-aspect-ratio:4/3){.intro-center{grid-template-columns:1fr}.rules-card{display:none}.end-wrap{grid-template-columns:1fr}.ranking-panel{max-height:42vh}.players{min-height:190px}.answer-btn{font-size:13px}.topbar{grid-template-columns:1fr auto}}
@media(max-width:900px){.brand p{display:none}.score-card{padding:4px}.score-card .gname{font-size:9px}.players{gap:6px}.player-card{padding:8px 6px}.choice-area{gap:4px}.answer-btn{padding:6px 3px;font-size:11px}.player-name{font-size:18px}.player-score{font-size:12px}.stage-btn{min-width:170px;padding:10px 14px}.shape-symbol.large{width:46px;height:46px}.shape-symbol.medium{width:39px;height:39px}.shape-symbol.small{width:31px;height:31px}.cover-card{padding:24px 16px}.cover-actions .primary-btn,.cover-actions .secondary-btn{min-width:0;width:min(320px,100%)}.cover-animation{height:98px}.cover-mini-steps{gap:8px}.cover-step{padding:8px 12px}}

<body>
<div id="app"></div>
<div id="overlayRoot"></div>
<script>
(() => {
'use strict';

const STORAGE_KEY='SgLDC_QuickShapeSort_BattleRoyale_v11';
const SETUP_KEY='SgLDC_Universal_GameSetup_v1';
const groupOrder=['red','yellow','green','orange','purple','blue'];
const DEFAULT_GROUP_COLORS=['#ff7f88','#ffe29a','#bfdda8','#ffc58f','#cfa7f3','#a9c8e8'];
let groups={};
let setupConfig=null;
let setupDraft=null;
let setupValidated=false;
let selectedPlayerId=null;
let setupCheckedOnce=false;
let setupDirty=false;
let setupSavedSignature=null;
let setupUndoStack=[];
let setupRedoStack=[];
let setupHistoryApplying=false;
let activePointerDrag=null;
let suppressTouchClickUntil=0;

function setupErrorSound(){
  try{if(typeof wrongSound==='function'){wrongSound();return;}if(typeof badSound==='function'){badSound();return;}}catch(e){}
}
function blankSetupDraft(){return{
  schema:'sgldc-game-setup',version:1,
  players:Array.from({length:0},()=>null),
  groups:groupOrder.map((id,i)=>({id,name:`Group ${i+1}`,color:DEFAULT_GROUP_COLORS[i],memberIds:[]}))
};}
function normalizeSetup(raw){
  if(!raw||typeof raw!=='object')return null;
  let players=[];
  if(Array.isArray(raw.players))players=raw.players.map((p,i)=>typeof p==='string'?{id:`p${String(i+1).padStart(2,'0')}`,name:p}:{id:String(p?.id||`p${String(i+1).padStart(2,'0')}`),name:String(p?.name||'')});
  let gs=Array.isArray(raw.groups)?raw.groups:[];
  const normGroups=groupOrder.map((id,i)=>{
    const g=gs[i]||{};
    const memberIds=Array.isArray(g.memberIds)?g.memberIds.map(String):Array.isArray(g.players)?g.players.map(name=>players.find(p=>p.name===name)?.id).filter(Boolean):[];
    const name=String(g.name??'').trim()||`Group ${i+1}`;
    return{id,name,color:/^#[0-9a-f]{6}$/i.test(String(g.color||''))?String(g.color):DEFAULT_GROUP_COLORS[i],memberIds};
  });
  return{schema:'sgldc-game-setup',version:1,players,groups:normGroups};
}
function playerSetupErrors(cfg){
  const names=cfg.players.map(p=>p.name.trim()).filter(Boolean),errors=[];
  if(names.length!==30)errors.push(`30 player names required (${names.length} entered)`);
  if(names.some(n=>[...n].length>12))errors.push('Player names must be 12 characters or fewer');
  return errors;
}
function groupSetupErrors(cfg){
  const errors=[];
  if(cfg.groups.some((g,i)=>[...(g.name.trim()||`Group ${i+1}`)].length>12))errors.push('Group names must be 12 characters or fewer');
  return errors;
}
function baseSetupErrors(cfg){return [...playerSetupErrors(cfg),...groupSetupErrors(cfg)];}
function groupingComplete(cfg){const ids=new Set(cfg.players.map(p=>p.id));const assigned=cfg.groups.flatMap(g=>g.memberIds);return cfg.groups.every(g=>g.memberIds.length===5)&&assigned.length===30&&new Set(assigned).size===30&&assigned.every(id=>ids.has(id));}
function setupReady(cfg){return !!cfg&&baseSetupErrors(cfg).length===0&&groupingComplete(cfg);}
function applySetup(cfg){
  groups={};
  groupOrder.forEach((id,i)=>{const g=cfg.groups[i];groups[id]={name:g.name.trim()||`Group ${i+1}`,color:g.color,players:g.memberIds.map(pid=>cfg.players.find(p=>p.id===pid)?.name).filter(Boolean)};});
}
function loadSetup(){try{const cfg=normalizeSetup(JSON.parse(localStorage.getItem(SETUP_KEY)||'null'));if(setupReady(cfg)){applySetup(cfg);return cfg;}}catch(e){}return null;}
function persistSetup(cfg){try{localStorage.setItem(SETUP_KEY,JSON.stringify(cfg));}catch(e){}}
function setupSignature(cfg){
  const n=normalizeSetup(cfg);
  if(!n)return '';
  return JSON.stringify({players:n.players.map(p=>({id:p.id,name:p.name})),groups:n.groups.map(g=>({name:g.name,color:g.color,memberIds:[...g.memberIds]}))});
}
function rosterReady(cfg=setupDraft){
  if(!cfg)return false;
  const names=cfg.players.map(p=>p.name.trim()).filter(Boolean);
  return names.length===30&&!names.some(n=>[...n].length>12)&&groupSetupErrors(cfg).length===0;
}
function recomputeSetupValidation(){setupValidated=rosterReady(setupDraft);setupCheckedOnce=setupValidated;}
function refreshSetupButtons(){
  const randomize=$('#randomizeBtn'),add=$('#addToGameBtn'),download=$('#downloadSetupBtn');
  const rosterOK=rosterReady(setupDraft);
  if(randomize)randomize.disabled=!rosterOK;
  if(download)download.disabled=!rosterOK;
  if(add)add.disabled=!!setupSavedSignature&&!setupDirty;
}
function markSetupDirty(){
  setupDirty=true;recomputeSetupValidation();refreshSetupButtons();
}
function cloneSetup(cfg){return cfg?normalizeSetup(JSON.parse(JSON.stringify(cfg))):null;}
function setupHistoryEntry(){
  if(!setupDraft)return null;
  let cfg;
  try{cfg=currentDraftFromValidatedUI();}catch(e){cfg=setupDraft;}
  return{cfg:cloneSetup(cfg),validated:!!setupValidated,checked:!!setupCheckedOnce};
}
function refreshHistoryButtons(){const u=$('#undoSetupBtn'),r=$('#redoSetupBtn');if(u)u.disabled=!setupUndoStack.length;if(r)r.disabled=!setupRedoStack.length;}
function recordSetupHistory(){
  if(setupHistoryApplying)return;
  const entry=setupHistoryEntry();if(!entry?.cfg)return;
  const sig=setupSignature(entry.cfg)+'|'+entry.validated+'|'+entry.checked;
  const last=setupUndoStack[setupUndoStack.length-1];
  const lastSig=last?setupSignature(last.cfg)+'|'+last.validated+'|'+last.checked:'';
  if(sig!==lastSig)setupUndoStack.push(entry);
  if(setupUndoStack.length>60)setupUndoStack.shift();
  setupRedoStack=[];refreshHistoryButtons();
}
function applySetupHistoryEntry(entry,label){
  if(!entry?.cfg)return;
  setupHistoryApplying=true;setupDraft=cloneSetup(entry.cfg);selectedPlayerId=null;
  setupDraft.groups.forEach((g,i)=>{const n=$(`#groupName-${i}`),c=$(`#groupColor-${i}`);if(n)n.value=g.name;if(c)c.value=g.color;});
  recomputeSetupValidation();setupDirty=setupSavedSignature!==setupSignature(setupDraft);setupHistoryApplying=false;renderSetupTagsAndGroups();refreshSetupButtons();refreshHistoryButtons();setupStatus(`<strong>${label}.</strong> Review the setup, then add the player names to the game if needed.`,'good');
}
function undoSetup(){if(!setupUndoStack.length)return;const current=setupHistoryEntry();if(current)setupRedoStack.push(current);applySetupHistoryEntry(setupUndoStack.pop(),'Undo complete');}
function redoSetup(){if(!setupRedoStack.length)return;const current=setupHistoryEntry();if(current)setupUndoStack.push(current);applySetupHistoryEntry(setupRedoStack.pop(),'Redo complete');}
function armTextHistory(el){
  if(!el)return;let captured=false;
  el.addEventListener('focus',()=>{captured=false;});
  el.addEventListener('beforeinput',()=>{if(!captured){recordSetupHistory();captured=true;}});
  el.addEventListener('blur',()=>{captured=false;});
}
function clearPointerDragVisuals(){
  document.querySelectorAll('.group-card.drag-over,.player-bank.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(activePointerDrag?.ghost)activePointerDrag.ghost.remove();
  activePointerDrag=null;
}
function pointerTargetAt(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const drop=el.closest?.('.group-drop');if(drop)return{type:'group',index:Number(drop.dataset.groupIndex)};
  const bank=el.closest?.('.player-bank');if(bank)return{type:'bank'};
  return null;
}
function positionPointerGhost(x,y){if(activePointerDrag?.ghost){activePointerDrag.ghost.style.left=x+'px';activePointerDrag.ghost.style.top=y+'px';}}
function beginPointerDrag(e,tag,player){
  if(!setupDraft||e.pointerType==='mouse'||activePointerDrag)return;
  e.preventDefault();selectedPlayerId=null;document.querySelectorAll('.player-tag').forEach(t=>t.classList.remove('selected'));
  const ghost=tag.cloneNode(true);ghost.classList.add('touch-drag-ghost');ghost.classList.remove('selected');const r=tag.getBoundingClientRect();ghost.style.width=r.width+'px';document.body.appendChild(ghost);
  activePointerDrag={pointerId:e.pointerId,playerId:player.id,ghost,startX:e.clientX,startY:e.clientY,dragged:false};positionPointerGhost(e.clientX,e.clientY);try{tag.setPointerCapture(e.pointerId);}catch(err){}
}
function movePointerDrag(e){
  if(!activePointerDrag||activePointerDrag.pointerId!==e.pointerId)return;e.preventDefault();
  if(Math.hypot(e.clientX-activePointerDrag.startX,e.clientY-activePointerDrag.startY)>7)activePointerDrag.dragged=true;
  positionPointerGhost(e.clientX,e.clientY);document.querySelectorAll('.group-card.drag-over,.player-bank.drag-over').forEach(el=>el.classList.remove('drag-over'));
  const target=pointerTargetAt(e.clientX,e.clientY);if(target?.type==='group')$(`#groupCard-${target.index}`)?.classList.add('drag-over');else if(target?.type==='bank')$('#playerTags')?.closest('.player-bank')?.classList.add('drag-over');
}
function endPointerDrag(e,player){
  if(!activePointerDrag||activePointerDrag.pointerId!==e.pointerId)return;e.preventDefault();
  const drag=activePointerDrag,target=pointerTargetAt(e.clientX,e.clientY),wasDragged=drag.dragged;clearPointerDragVisuals();suppressTouchClickUntil=Date.now()+450;
  if(wasDragged&&target?.type==='group')movePlayerToGroup(drag.playerId,target.index);else if(wasDragged&&target?.type==='bank')movePlayerToBank(drag.playerId);else if(!wasDragged)togglePlayerSelection(player);
}
function togglePlayerSelection(player){
  if(selectedPlayerId===player.id){selectedPlayerId=null;document.querySelectorAll('.player-tag').forEach(t=>t.classList.remove('selected'));return;}
  selectedPlayerId=player.id;document.querySelectorAll('.player-tag').forEach(t=>t.classList.toggle('selected',t.dataset.playerId===player.id));setupStatus(`<strong>${escapeHTML(player.name)}</strong> selected. Tap a group box to move this player.`);
}

function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}


const QUESTIONS=[
  {

      {correct:{shape:'square',colour:'purple',size:'large'},distractors:[{shape:'rectangle',colour:'purple',size:'large'},{shape:'triangle',colour:'purple',size:'large'}]},

      {correct:{shape:'triangle',colour:'green',size:'large'},distractors:[{shape:'triangle',colour:'green',size:'small'},{shape:'triangle',colour:'green',size:'medium'}]},
      {correct:{shape:'rectangle',colour:'purple',size:'large'},distractors:[{shape:'rectangle',colour:'purple',size:'small'},{shape:'rectangle',colour:'purple',size:'medium'}]}
    ]
  },
  {

    groups:[
      {label:'Group A',items:[{shape:'triangle',colour:'red',size:'small'},{shape:'triangle',colour:'blue',size:'large'},{shape:'triangle',colour:'green',size:'medium'}]},
      {label:'Group B',items:[{shape:'square',colour:'purple',size:'small'},{shape:'rectangle',colour:'red',size:'large'},{shape:'square',colour:'blue',size:'medium'}]}
    ],
    options:['By number of vertices','By colour','By size'],answer:'By number of vertices'
  },
  {

    steps:[
      {correct:{shape:'square',colour:'yellow',size:'small'},distractors:[{shape:'triangle',colour:'yellow',size:'small'},{shape:'pentagon',colour:'yellow',size:'small'}]},
      {correct:{shape:'rectangle',colour:'purple',size:'large'},distractors:[{shape:'triangle',colour:'purple',size:'large'},{shape:'pentagon',colour:'purple',size:'large'}]},
      {correct:{shape:'square',colour:'blue',size:'medium'},distractors:[{shape:'circle',colour:'blue',size:'medium'},{shape:'triangle',colour:'blue',size:'medium'}]}

  },

  },
  {

}
function downloadSetup(){
  const bankEntry=$('#playerNamesInput');if(bankEntry?.value.trim()){const names=splitNameBatch(bankEntry.value);bankEntry.value='';if(names.length)addNamesToBank(names);}
  const cfg=currentDraftFromValidatedUI(),errors=[...playerSetupErrors(cfg),...groupSetupErrors(cfg)];if(errors.length){setupStatus(`<strong>Cannot download:</strong> ${errors.join(' · ')}`,'bad');setupErrorSound();return;}const blob=new Blob([serializeSetupText(cfg)],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Game_Setup.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);setupStatus('<strong>Game_Setup.txt downloaded.</strong> Player names, group names, colours and assignments are included.','good');
}
async function handleSetupUpload(e){
  const file=e.target.files?.[0];if(!file)return;
  try{
    const text=await file.text(),cfg=parseCompatibleSetupFile(text);if(!cfg)throw new Error('Invalid setup file');recordSetupHistory();setupDraft=cfg;selectedPlayerId=null;
    setupDraft.groups.forEach((g,i)=>{$(`#groupName-${i}`).value=g.name||`Group ${i+1}`;$(`#groupColor-${i}`).value=g.color;});
    recomputeSetupValidation();setupDirty=setupSavedSignature!==setupSignature(cfg);renderSetupTagsAndGroups();
    const assigned=cfg.groups.reduce((n,g)=>n+g.memberIds.length,0),nameErrors=cfg.players.some(p=>[...p.name.trim()].length>12),groupErrors=groupSetupErrors(cfg);
    if(nameErrors||groupErrors.length){setupStatus(`<strong>Uploaded setup needs attention:</strong> ${nameErrors?'Player names must be 12 characters or fewer':groupErrors.join(' · ')}`,'bad');}
    else setupStatus(`<strong>Game_Setup.txt loaded.</strong> ${cfg.players.length}/30 player names · ${assigned}/30 assigned a group.`,'good');
    refreshSetupButtons();refreshHistoryButtons();
  }catch(err){setupStatus('<strong>Upload failed:</strong> this is not a compatible SgLDC game setup file.','bad');}
  finally{e.target.value='';}
}

function scoreBoardHTML(){return `<div class="scoreboard">${groupOrder.map(g=>`<div class="score-card" data-group="${g}"><span class="gname" style="background:${groups[g].color}">${escapeHTML(groups[g].name)}</span><span class="score">${state.scores[g]}</span></div>`).join('')}</div>`;}

function renderRound(){
  if(!state)state=loadState()||freshState();
  if(state.roundIndex>=10||state.finished){renderEnd();return;}
  overlayRoot.innerHTML='';phase='checkin';readyLanes=new Set();stepIndex=0;playerScores=[0,0,0];laneLocked=[false,false,false];processing=false;roundCorrectAdds={};
  const roster=state.rounds[state.roundIndex],q=QUESTIONS[state.roundIndex];
  app.innerHTML=`<main class="screen">
    <div class="topbar">
      <div class="brand"><div class="brand-badge">◯△</div><div><h1>Quick Shape Sort</h1></div></div>
      <div class="toolbar"><button class="stage-btn waiting" id="stageBtn" disabled>WAITING FOR PLAYERS</button><button class="icon-btn" id="muteBtn" title="Mute or unmute">${muted?'🔇':'🔊'}</button><button class="icon-btn" id="fullBtn" title="Full screen">⛶</button><button class="icon-btn" id="homeBtn" title="Home">⌂</button></div>
    </div>
    ${scoreBoardHTML()}
    <section class="game-main">
      <div class="round-line"><div class="round-label">Round ${state.roundIndex+1} of 10</div><div class="type-pill">${q.type==='sort'?'Complete a group':'Identify the rule'}</div></div>
      <div class="arena">
        <div class="challenge-panel"><div class="pre-question" id="preQuestion">Get ready for the next battle!</div><div class="live-challenge hidden" id="liveChallenge"></div></div>
        <div class="players">${roster.map((p,i)=>playerCard(p,i)).join('')}</div>
      </div>
      <div class="status-line" id="statusText">Players, tap <strong>Ready?</strong> to report in.</div>
    </section>
  </main>`;
  bindToolbar();
  $('#stageBtn').onclick=handleStageButton;
  document.querySelectorAll('.ready-btn').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();checkInPlayer(Number(btn.dataset.lane));},{passive:false}));
  if(state.roundCompleted&&state.lastResult)showStoredResult();
}

function playerCard(p,i){return `<div class="player-card readying" data-lane="${i}" style="--group:${p.color};--glow:${hexToRgba(p.color,.50)}"><div class="player-head"><span class="player-name">${escapeHTML(p.player)}</span><span class="player-score hidden" id="score-${i}">0</span></div><button class="ready-btn" data-lane="${i}">Ready?</button><div class="choice-area hidden" id="choices-${i}"></div></div>`;}

function checkInPlayer(lane){
  if(phase!=='checkin'||readyLanes.has(lane))return;
  const card=document.querySelector(`.player-card[data-lane="${lane}"]`),btn=card?.querySelector('.ready-btn');if(!card||!btn)return;
  ensureAudio();readyLanes.add(lane);btn.disabled=true;btn.textContent='Ready!👍';card.classList.remove('readying');card.classList.add('checked');tone(560+lane*80,.16,'triangle',.08);
  setStatus(`<strong>${readyLanes.size} of 3</strong> players ready.`);
  if(readyLanes.size===3){const b=$('#stageBtn');b.disabled=false;b.className='stage-btn';b.textContent='START ROUND';setStatus('<strong>All players are ready.</strong> Press Start Round when the class is settled.');tone(660,.12,'triangle',.08);setTimeout(()=>tone(880,.18,'triangle',.09),130);}
}

function handleStageButton(){
  if(phase==='checkin'&&readyLanes.size===3)showQuestion();
  else if(phase==='preview')goLive();
  else if(phase==='answered')showCorrectAnswer();
  else if(phase==='revealed')finishRoundSequence();
  else if(phase==='postround')nextRound();
}

function showQuestion(){
  phase='preview';const q=QUESTIONS[state.roundIndex];
  $('#preQuestion').classList.add('hidden');$('#liveChallenge').classList.remove('hidden');renderChallenge(q);renderChoices(q,true);
  document.querySelectorAll('.player-card').forEach(card=>{card.classList.remove('checked');card.classList.add('preview');card.querySelector('.ready-btn').classList.add('hidden');card.querySelector('.choice-area').classList.remove('hidden');if(q.type==='sort')card.querySelector('.player-score').classList.remove('hidden');});
  const b=$('#stageBtn');b.className='stage-btn go';b.textContent='GO!';b.disabled=false;
  setStatus('<strong>Question shown.</strong> Read it aloud, then press GO!');
}

function goLive(){
  phase='live';laneLocked=[false,false,false];
  document.querySelectorAll('.player-card').forEach(card=>{card.classList.remove('preview');card.classList.add('live');});
  document.querySelectorAll('.answer-btn').forEach(btn=>{btn.disabled=false;btn.classList.remove('preview-choice');});
  const b=$('#stageBtn');b.className='stage-btn live';b.textContent='BUZZERS LIVE';b.disabled=true;
  setStatus('<strong>BUZZERS LIVE!</strong> Tap the best answer.');
}

function renderChallenge(q){
  const box=$('#liveChallenge');
  if(q.type==='sort'){
    box.innerHTML=`<div class="instruction">${q.title}</div><div class="sort-board"><div class="shape-group"><div class="group-heading">${q.sourceLabel}</div><div class="shape-grid">${q.source.map(s=>`<div class="shape-cell">${shapeHTML(s)}</div>`).join('')}</div></div><div class="shape-group target" id="targetGroup"><div class="group-heading">${q.targetLabel}</div><div class="shape-grid" id="targetGrid">${q.steps.map(()=>'<div class="shape-cell"><div class="empty-slot"></div></div>').join('')}</div></div></div>`;
  }else{
    box.innerHTML=`<div class="instruction">These shapes were sorted by <span class="rule-blank" id="ruleBlank">_____</span>.</div><div class="identify-board">${q.groups.map(g=>`<div class="sorted-group"><div class="sorted-label">${g.label}</div><div class="sorted-shapes">${g.items.map(s=>`<div class="sorted-cell">${shapeHTML(s)}</div>`).join('')}</div></div>`).join('')}</div>`;
  }
}

function renderChoices(q,preview=false){
  if(q.type==='sort')renderSortChoices(q,preview);else renderRuleChoices(q,preview);
}
function renderSortChoices(q,preview=false){
  const step=q.steps[stepIndex],set=[step.correct,...step.distractors];
  for(let lane=0;lane<3;lane++){
    const zone=$(`#choices-${lane}`);zone.innerHTML='';
    shuffle(set).forEach((shape,idx)=>{const btn=document.createElement('button');btn.className='answer-btn shape-answer'+(preview?' preview-choice':'');btn.disabled=preview;btn.innerHTML=shapeHTML(shape);btn.dataset.correct=shape===step.correct?'1':'0';btn.addEventListener('pointerdown',e=>{e.preventDefault();selectSortAnswer(lane,btn.dataset.correct==='1',btn);},{passive:false});zone.appendChild(btn);});
  }
}
function renderRuleChoices(q,preview=false){
  for(let lane=0;lane<3;lane++){
    const zone=$(`#choices-${lane}`);zone.innerHTML='';
    shuffle(q.options).forEach(opt=>{const btn=document.createElement('button');btn.className='answer-btn'+(preview?' preview-choice':'');btn.disabled=preview;btn.textContent=opt;btn.dataset.answer=opt;btn.addEventListener('pointerdown',e=>{e.preventDefault();selectRuleAnswer(lane,opt,btn);},{passive:false});zone.appendChild(btn);});
  }
}

function selectSortAnswer(lane,isCorrect,btn){
  if(phase!=='live'||processing||laneLocked[lane])return;
  if(isCorrect){
    processing=true;playerScores[lane]++;const gid=state.rounds[state.roundIndex][lane].groupId;state.correctTotals[gid]++;roundCorrectAdds[gid]=(roundCorrectAdds[gid]||0)+1;updatePlayerScores();btn.classList.add('correct-flash');correctSound();
    const q=QUESTIONS[state.roundIndex],cells=$('#targetGrid').children;cells[stepIndex].innerHTML=shapeHTML(q.steps[stepIndex].correct);
    document.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);
    stepIndex++;
    setTimeout(()=>{processing=false;if(stepIndex>=q.steps.length)finishSortRound();else{laneLocked=[false,false,false];document.querySelectorAll('.player-card').forEach(c=>c.classList.remove('locked'));renderSortChoices(q,false);}},330);
  }else{
    laneLocked[lane]=true;btn.classList.add('wrong-flash');wrongSound();document.querySelector(`.player-card[data-lane="${lane}"]`)?.classList.add('locked');document.querySelectorAll(`.player-card[data-lane="${lane}"] .answer-btn`).forEach(b=>b.disabled=true);
    setTimeout(()=>btn.classList.remove('wrong-flash'),500);
    if(laneLocked.every(Boolean)){setTimeout(()=>{laneLocked=[false,false,false];document.querySelectorAll('.player-card').forEach(c=>c.classList.remove('locked'));renderSortChoices(QUESTIONS[state.roundIndex],false);setStatus('<strong>No correct answer yet.</strong> Try this shape again!');},650);}
  }
}

function selectRuleAnswer(lane,answer,btn){
  if(phase!=='live'||processing||laneLocked[lane])return;const q=QUESTIONS[state.roundIndex];
  if(answer===q.answer){processing=true;playerScores[lane]=1;const gid=state.rounds[state.roundIndex][lane].groupId;state.correctTotals[gid]++;roundCorrectAdds[gid]=(roundCorrectAdds[gid]||0)+1;updatePlayerScores();btn.classList.add('correct-flash');correctSound();document.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);setTimeout(()=>finishRuleRound(lane),420);}
  else{laneLocked[lane]=true;btn.classList.add('wrong-flash');wrongSound();document.querySelector(`.player-card[data-lane="${lane}"]`)?.classList.add('locked');document.querySelectorAll(`.player-card[data-lane="${lane}"] .answer-btn`).forEach(b=>b.disabled=true);setTimeout(()=>btn.classList.remove('wrong-flash'),500);if(laneLocked.every(Boolean))setTimeout(()=>finishNoWinnerRuleRound(),550);}
}
function updatePlayerScores(){playerScores.forEach((n,i)=>{const e=$(`#score-${i}`);if(e)e.textContent=n;});}

function finishSortRound(){const max=Math.max(...playerScores),winnerLanes=[0,1,2].filter(i=>playerScores[i]===max);finishRound(winnerLanes,`${QUESTIONS[state.roundIndex].targetLabel} completed.`);}
function finishRuleRound(lane){finishRound([lane],`Correct rule: ${QUESTIONS[state.roundIndex].answer}.`);}
function finishNoWinnerRuleRound(){finishRound([],`Correct rule: ${QUESTIONS[state.roundIndex].answer}. No group point was awarded.`);}

function finishRound(winnerLanes,note){
  phase='answered';processing=true;const roster=state.rounds[state.roundIndex],winners=winnerLanes.map(i=>roster[i]);
  state.roundCompleted=true;state.lastResult={winnerLanes,winners,awardedGroupIds:winners.map(w=>w.groupId),roundCorrectAdds:{...roundCorrectAdds},playerScores:[...playerScores],note,answerRevealed:false,finalized:false,pointsAwarded:false};saveState();
  document.querySelectorAll('.player-card').forEach(c=>c.classList.remove('live','preview','locked'));winnerLanes.forEach(i=>document.querySelector(`.player-card[data-lane="${i}"]`)?.classList.add('round-winner'));
  document.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);
  const b=$('#stageBtn');b.className='stage-btn';b.textContent='👁 SHOW CORRECT ANSWER';b.disabled=false;
}

function formatNames(winners){if(!winners.length)return'No round winner';if(winners.length===1)return escapeHTML(winners[0].player);if(winners.length===2)return `${escapeHTML(winners[0].player)} and ${escapeHTML(winners[1].player)}`;return `${escapeHTML(winners[0].player)}, ${escapeHTML(winners[1].player)} and ${escapeHTML(winners[2].player)}`;}
function formatGroups(winners){if(!winners.length)return'No group point was awarded.';if(winners.length===1)return `<span style="color:${winners[0].color};font-weight:1000">${escapeHTML(winners[0].groupName)}</span> earns <strong>1 point</strong>.`;return winners.map(w=>`<span style="color:${w.color};font-weight:1000">${escapeHTML(w.groupName)}</span>`).join(' and ')+' earn <strong>1 point each</strong>.';}
function showResultOverlay(r){
  const roster=state.rounds[state.roundIndex],names=formatNames(r.winners),title=!r.winners.length?'No winner this round':r.winners.length===1?`${names} wins the round!`:`${names} win the round!`;
  overlayRoot.innerHTML=`<div class="overlay"><div class="result-card"><div class="result-icon">${r.winners.length?'🏆':'🔎'}</div><h2>${title}</h2><p>${formatGroups(r.winners)}</p><div class="round-scores">${roster.map((p,i)=>`<div class="round-score" style="background:${p.color}">${escapeHTML(p.player)}<b>${r.playerScores[i]}</b>correct answer${r.playerScores[i]===1?'':'s'}</div>`).join('')}</div><div class="completed-note">${r.note}</div><div class="overlay-actions"><button class="secondary-btn" id="replayBtn">↺ Replay This Round</button><button class="primary-btn" id="showAnswerBtn">👁 Show Correct Answer</button></div></div></div>`;
  $('#replayBtn').onclick=replayRound;$('#showAnswerBtn').onclick=showCorrectAnswer;
}
function answerRevealHTML(q){
  if(q.type==='sort'){
    return `<div class="answer-reveal"><span>Correct shapes:</span><div class="answer-shapes">${q.steps.map(step=>`<div class="answer-shape">${shapeHTML(step.correct)}</div>`).join('')}</div></div>`;
  }
  return `<div class="answer-reveal"><span>Correct sorting rule:</span><span class="answer-rule">${q.answer}</span></div>`;
}

function showCorrectAnswer(){
  const r=state.lastResult,q=QUESTIONS[state.roundIndex];if(!r)return;
  overlayRoot.innerHTML='';phase='revealed';r.answerRevealed=true;saveState();
  document.querySelectorAll('.answer-btn').forEach(btn=>{btn.disabled=true;btn.classList.remove('wrong-flash');});
  if(q.type==='sort'){
    const group=$('#targetGroup');if(group)group.classList.add('reveal-correct');
    const cells=[...$('#targetGrid').children];
    q.steps.forEach((step,i)=>{if(cells[i]){cells[i].classList.add('correct-cell');cells[i].innerHTML=shapeHTML(step.correct);}});
  }else{
    const blank=$('#ruleBlank');if(blank){blank.textContent=q.answer;blank.classList.add('filled');}
    document.querySelectorAll('.answer-btn').forEach(btn=>{if((btn.dataset.answer||'').toLowerCase()===q.answer)btn.classList.add('correct-flash');});
  }
  const b=$('#stageBtn');b.className='stage-btn';b.textContent='🏁 FINISH ROUND';b.disabled=false;
  setStatus('<strong>Correct answer shown.</strong> Continue when ready.');
}

function updateScoreboard(){groupOrder.forEach(g=>{const el=document.querySelector(`.score-card[data-group="${g}"] .score`);if(el)el.textContent=state.scores[g]||0;});}
function awardRoundPointsIfNeeded(){const r=state.lastResult;if(!r||r.pointsAwarded)return;for(const g of r.awardedGroupIds||[])state.scores[g]=(state.scores[g]||0)+1;r.pointsAwarded=true;saveState();updateScoreboard();}
function showPointsOverlay(){
  const r=state.lastResult;if(!r)return;awardRoundPointsIfNeeded();
  if(r.winners.length===1){
    const w=r.winners[0];
    overlayRoot.innerHTML=`<div class="round-overlay"><div class="round-win-card"><div class="trophy-pop">🏆</div><h2>Round Winner!</h2><div class="winner-name">${escapeHTML(w.player)}</div><div class="group-award" style="background:${w.color}"><span>${escapeHTML(w.groupName)}</span><span class="point-pop">+1 POINT</span></div></div></div>`;
  }else if(r.winners.length>1){
    overlayRoot.innerHTML=`<div class="round-overlay"><div class="round-win-card"><div class="trophy-pop">🏆</div><h2>Round Winners!</h2><div class="winner-name">${formatNames(r.winners)}</div><div class="group-awards">${r.winners.map(w=>`<div class="group-award" style="background:${w.color}"><span>${escapeHTML(w.groupName)}</span><span class="point-pop">+1 POINT</span></div>`).join('')}</div></div></div>`;
  }else{
    overlayRoot.innerHTML=`<div class="round-overlay"><div class="round-win-card"><div class="trophy-pop">💡</div><h2>Correct Answer Revealed</h2><div class="no-point">No winner this round · no point added.</div></div></div>`;
  }
  confetti(r.winners.length?50:16);
  setTimeout(()=>{overlayRoot.innerHTML='';phase='postround';const b=$('#stageBtn');b.className='stage-btn';b.textContent=state.roundIndex===9?'🏁 SEE FINAL SCORES':'NEXT ROUND →';b.disabled=false;},2200);
}
function finishRoundSequence(){const r=state.lastResult;if(!r)return;phase='postround';r.finalized=true;saveState();const b=$('#stageBtn');b.className='stage-btn waiting';b.textContent=r.winners&&r.winners.length?'ADDING POINT…':'ROUND COMPLETE';b.disabled=true;showPointsOverlay();}

function nextRound(){
  overlayRoot.innerHTML='';
  state.roundIndex++;
  state.roundCompleted=false;
  state.lastResult=null;
  if(state.roundIndex>=10){
    state.finished=true;
    saveState();
    renderEnd();
  }else{
    saveState();
    renderRound();
  }
}

function showStoredResult(){
  const r=state.lastResult,q=QUESTIONS[state.roundIndex];
  phase='answered';
  $('#preQuestion').classList.add('hidden');
  $('#liveChallenge').classList.remove('hidden');
  renderChallenge(q);
  document.querySelectorAll('.player-card').forEach((card,i)=>{
    card.classList.remove('readying','checked');
    card.querySelector('.ready-btn').classList.add('hidden');
    card.querySelector('.choice-area').classList.add('hidden');
    card.querySelector('.player-score').classList.remove('hidden');
    if(r.winnerLanes.includes(i))card.classList.add('round-winner');
  });
  playerScores=[...r.playerScores];
  updatePlayerScores();
  if(r.answerRevealed){
    showCorrectAnswer();
    if(r.finalized){
      overlayRoot.innerHTML='';
      awardRoundPointsIfNeeded();
      phase='postround';
      const b=$('#stageBtn');
      b.className='stage-btn';
      b.textContent=state.roundIndex===9?'🏁 SEE FINAL SCORES':'NEXT ROUND →';
      b.disabled=false;
    }
  }else{
    const b=$('#stageBtn');
    b.className='stage-btn';
    b.textContent='👁 SHOW CORRECT ANSWER';
    b.disabled=false;
  }
}

function renderEnd(){
  overlayRoot.innerHTML='';if(!state)state=loadState();const ranking=groupOrder.map(g=>({id:g,...groups[g],score:state.scores[g]||0,correct:state.correctTotals[g]||0})).sort((a,b)=>b.score-a.score||b.correct-a.correct),top=ranking[0].score,leaders=ranking.filter(x=>x.score===top);let winners=leaders,tieNote='';
  if(leaders.length>1){const best=Math.max(...leaders.map(x=>x.correct)),next=leaders.filter(x=>x.correct===best);winners=next;tieNote=next.length===1?`Champion decided by tie-breaker: most correct answers overall (${best}).`:`Tie-breaker also tied at ${best} correct answers, so the championship is shared.`;}
  const winnerText=winners.length===1?winners[0].name:winners.map(w=>w.name.replace(' Group','')).join(' & ')+' Groups',winnerColor=winners.length===1?winners[0].color:'linear-gradient(90deg,#ffd166,#a9c8e8,#cfa7f3)';
  app.innerHTML=`<main class="screen"><div class="topbar"><div class="brand"><div class="brand-badge">🏁</div><div><h1>Battle Complete!</h1><p>All 30 pupils have taken part.</p></div></div><div></div>${toolbar()}</div><section class="end-wrap"><div class="winner-panel"><div class="trophy">🏆</div><p>${winners.length===1?'Champion Group':'Joint Champions'}</p><div class="winner-chip" style="background:${winnerColor}">${escapeHTML(winnerText)}</div><h2>${top} point${top===1?'':'s'}</h2><p>Excellent shape sorting!</p>${tieNote?`<p>${tieNote}</p>`:''}<button class="primary-btn" id="againBtn">⚡ New Battle</button></div><div class="ranking-panel"><h3>Final Leaderboard</h3>${ranking.map((r,i)=>`<div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-group" style="background:${r.color}">${escapeHTML(r.name)}</div><div class="rank-score">${r.score}<small>${r.correct} correct</small></div></div>`).join('')}</div></section></main>`;
  bindToolbar();confetti(90);$('#againBtn').onclick=()=>{if(confirm('Start a fresh battle with a new random player order?')){state=freshState();saveState();renderRound();}};
}
function confetti(count=45){const colors=['#ffd166','#55e6a5','#ff6b7a','#a9c8e8','#cfa7f3','#ffc58f'];for(let i=0;i<count;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=(2.2+Math.random()*2.1)+'s';p.style.animationDelay=(Math.random()*.45)+'s';p.style.setProperty('--drift',(-120+Math.random()*240)+'px');p.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000);}}

document.addEventListener('keydown',e=>{if(phase==='checkin'&&['1','2','3'].includes(e.key))checkInPlayer(Number(e.key)-1);if(e.key==='Enter'&&!$('#stageBtn')?.disabled)$('#stageBtn').click();});
setupConfig=loadSetup();if(setupConfig)applySetup(setupConfig);renderIntro();
})();
</script>
</body>
</html>
