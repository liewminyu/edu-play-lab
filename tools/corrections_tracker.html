<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Corrections Tracker</title>
<style>
  :root{
    --ink:#34313f;
    --muted:#746f80;
    --glass:rgba(255,255,255,.72);
    --glass-strong:rgba(255,255,255,.9);
    --line:rgba(93,83,111,.12);
    --shadow:0 14px 40px rgba(73,55,95,.12);
    --shadow-soft:0 8px 22px rgba(73,55,95,.09);
    --topical:#ef7898;
    --topical-deep:#c95776;
    --unit:#9f83dc;
    --unit-deep:#795db7;
    --done:#a1a0aa;
    --good:#61a77f;
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 10% 15%, rgba(255,203,213,.85), transparent 30%),
      radial-gradient(circle at 86% 14%, rgba(210,199,255,.78), transparent 32%),
      radial-gradient(circle at 70% 85%, rgba(194,235,226,.72), transparent 32%),
      linear-gradient(135deg,#fff6f4 0%,#f5efff 48%,#edfafa 100%);
    background-attachment:fixed;
  }

  .shell{max-width:1500px;margin:0 auto;padding:28px 28px 48px}
  .topbar{
    position:sticky;top:14px;z-index:20;
    display:flex;align-items:center;gap:18px;justify-content:space-between;
    padding:17px 20px;border:1px solid rgba(255,255,255,.72);
    border-radius:24px;background:rgba(255,255,255,.67);
    backdrop-filter:blur(18px);box-shadow:var(--shadow);
  }
  .brand{min-width:220px}
  .brand h1{font-size:clamp(1.4rem,2vw,2rem);line-height:1;margin:0 0 6px;font-weight:850;letter-spacing:-.04em}
  .brand p{margin:0;color:var(--muted);font-size:.88rem}
  .toolbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  button,.file-label{
    border:0;cursor:pointer;font:inherit;font-weight:750;color:#4c4658;
    background:rgba(255,255,255,.9);padding:10px 13px;border-radius:14px;
    box-shadow:0 4px 13px rgba(61,44,80,.07);
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  button:hover,.file-label:hover{transform:translateY(-1px);box-shadow:0 7px 17px rgba(61,44,80,.11);background:#fff}
  button:active,.file-label:active{transform:translateY(0)}
  button:focus-visible,.file-label:focus-visible,input:focus-visible{outline:3px solid rgba(133,104,197,.22);outline-offset:2px}
  .icon-btn{display:inline-flex;align-items:center;gap:7px}
  .icon{font-size:1.05rem;line-height:1}
  input[type=file]{display:none}

  .clock-wrap{text-align:right;min-width:170px}
  #clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.5rem;letter-spacing:-.03em}
  #date{font-size:.78rem;color:var(--muted);margin-top:3px}

  .summary{
    margin:22px 2px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap
  }
  .remaining-total{font-size:.92rem;color:#625b6e}
  .remaining-total strong{font-size:1.05rem;color:#3d3846}
  .hint{font-size:.8rem;color:#827b8d}

  .board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .column{
    padding:18px;border:1px solid rgba(255,255,255,.68);border-radius:28px;
    background:rgba(255,255,255,.35);backdrop-filter:blur(9px);
  }
  .column-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}
  .column-title{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:880;letter-spacing:-.02em}
  .dot{width:12px;height:12px;border-radius:999px;box-shadow:0 0 0 5px rgba(255,255,255,.5)}
  .topical .dot{background:var(--topical)}
  .unit .dot{background:var(--unit)}
  .add-btn{padding:8px 11px;font-size:.83rem}
  .topical .add-btn{color:var(--topical-deep)}
  .unit .add-btn{color:var(--unit-deep)}

  .cards{display:grid;gap:14px}
  .card{
    position:relative;overflow:hidden;
    border-radius:21px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--shadow-soft);padding:16px 16px 14px;
  }
  .card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px}
  .topical .card:before{background:linear-gradient(#f5a0b5,#e36b90)}
  .unit .card:before{background:linear-gradient(#b6a0ec,#9071d3)}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-left:2px}
  .worksheet-title{margin:0;font-size:1rem;font-weight:880;letter-spacing:-.01em}
  .meta{font-size:.76rem;color:var(--muted);margin-top:5px}
  .card-actions{display:flex;gap:5px}
  .mini{padding:7px 9px;border-radius:11px;font-size:.79rem;box-shadow:none;background:#f8f6fa}

  .student-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:13px}
  .student{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;
    border:1px solid rgba(99,87,118,.08);border-radius:13px;background:rgba(250,249,252,.95);
    box-shadow:none;font-weight:720;font-size:.89rem;
  }
  .student:hover{box-shadow:none}
  .student .check{
    flex:0 0 20px;width:20px;height:20px;border-radius:7px;
    border:2px solid rgba(91,80,111,.18);display:grid;place-items:center;font-size:.72rem;
    transition:.15s ease;
  }
  .topical .student.done .check{background:#f4b0c2;border-color:#f4b0c2;color:white}
  .unit .student.done .check{background:#bba9ea;border-color:#bba9ea;color:white}
  .student.done{color:var(--done);background:rgba(248,248,249,.7)}
  .student.done .name{text-decoration:line-through;text-decoration-thickness:1.5px}
  .all-clear{margin-top:12px;padding:10px 12px;border-radius:13px;background:rgba(208,239,220,.55);color:#4e7d61;font-size:.82rem;font-weight:780}

  .empty{
    text-align:center;padding:30px 16px;border-radius:20px;border:1.5px dashed rgba(99,87,118,.17);
    color:#857d90;background:rgba(255,255,255,.36);font-size:.9rem
  }

  dialog{
    border:0;border-radius:24px;padding:0;width:min(520px,calc(100vw - 32px));
    box-shadow:0 26px 80px rgba(55,39,78,.25);background:#fff;
  }
  dialog::backdrop{background:rgba(56,44,69,.22);backdrop-filter:blur(5px)}
  .modal{padding:22px}
  .modal h2{margin:0 0 6px;font-size:1.2rem}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:.86rem}
  .field{display:grid;gap:6px;margin:13px 0}
  .field label{font-size:.78rem;font-weight:800;color:#6d6578}
  .field input{
    width:100%;border:1px solid #e7e1ec;border-radius:13px;padding:11px 12px;font:inherit;color:var(--ink);background:#fbfafd
  }
  .student-editor{display:grid;gap:7px;max-height:280px;overflow:auto;padding-right:3px}
  .edit-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}
  .remove-student{padding:9px 11px;background:#fff4f5;color:#b95769;box-shadow:none}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .primary{background:#6f5b9c;color:white}
  .primary:hover{background:#65528f}
  .danger{background:#fff0f2;color:#b64d63}
  .new-student-row{display:flex;gap:7px}
  .new-student-row input{flex:1}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:rgba(54,47,64,.92);color:white;padding:10px 14px;border-radius:12px;
    opacity:0;pointer-events:none;transition:.2s ease;font-size:.84rem;z-index:100
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:900px){
    .topbar{position:relative;top:0;align-items:flex-start;flex-wrap:wrap}
    .toolbar{order:3;width:100%;justify-content:flex-start}
    .board{grid-template-columns:1fr}
    .clock-wrap{margin-left:auto}
  }
  @media(max-width:560px){
    .shell{padding:14px 12px 30px}
    .topbar{border-radius:20px;padding:15px}
    .clock-wrap{min-width:auto}
    #clock{font-size:1.15rem}
    .column{padding:12px;border-radius:22px}
    .student-list{grid-template-columns:1fr 1fr}
    .icon-btn .label-text{display:none}
  }

  @media print{
    body{background:white}
    .topbar,.summary .hint,.add-btn,.card-actions{display:none!important}
    .shell{max-width:none;padding:0}
    .board{gap:14px}
    .column{background:white;border:0;padding:0}
    .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>Corrections Tracker</h1>
      <p>Tap a student when corrections are cleared.</p>
    </div>

    <div class="toolbar">
      <button class="icon-btn" id="downloadBtn" title="Download current tracker">
        <span class="icon">⇩</span><span class="label-text">Download List</span>
      </button>
      <label class="file-label icon-btn" for="uploadInput" title="Re-upload a saved tracker">
        <span class="icon">⇧</span><span class="label-text">Re-upload List</span>
      </label>
      <input id="uploadInput" type="file" accept=".json,application/json" />
      <button class="icon-btn" id="fullscreenBtn" title="Enter fullscreen">
        <span class="icon">⛶</span><span class="label-text">Fullscreen</span>
      </button>
    </div>

    <div class="clock-wrap">
      <div id="clock">--:--:--</div>
      <div id="date">Loading date…</div>
    </div>
  </header>

  <div class="summary">
    <div class="remaining-total"><strong id="remainingTotal">0</strong> corrections remaining</div>
    <div class="hint">Tap again to undo · Changes save automatically on this device</div>
  </div>

  <main class="board">
    <section class="column topical">
      <div class="column-head">
        <div class="column-title"><span class="dot"></span>Topical Worksheets</div>
        <button class="add-btn" data-add="topical">＋ Add worksheet</button>
      </div>
      <div class="cards" id="topicalCards"></div>
    </section>

    <section class="column unit">
      <div class="column-head">
        <div class="column-title"><span class="dot"></span>Unit Worksheets</div>
        <button class="add-btn" data-add="unit">＋ Add worksheet</button>
      </div>
      <div class="cards" id="unitCards"></div>
    </section>
  </main>
</div>

<dialog id="editDialog">
  <form method="dialog" class="modal" id="editForm">
    <h2 id="modalTitle">Edit worksheet</h2>
    <p>Add, rename or remove students directly from this card.</p>

    <div class="field">
      <label for="worksheetName">Worksheet name</label>
      <input id="worksheetName" autocomplete="off" />
    </div>

    <div class="field">
      <label>Students</label>
      <div class="student-editor" id="studentEditor"></div>
    </div>

    <div class="field">
      <label for="newStudent">Add student</label>
      <div class="new-student-row">
        <input id="newStudent" placeholder="Student name" autocomplete="off" />
        <button type="button" id="addStudentBtn">＋ Add</button>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="danger" id="deleteWorksheetBtn">Delete worksheet</button>
      <button type="button" id="cancelEditBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const SEED_DATA = {"topical": [{"title": "Shapes", "students": ["Kaiden", "Brayden", "Zhan Jun", "Cyrus", "Aakhash"]}, {"title": "Volume", "students": ["Evans", "Damien", "Brayden", "Kaiden", "Aakhash"]}, {"title": "2-Step Word Problems", "students": ["Ron", "Damien", "Shiyi", "Jun Yue", "Kaiden", "Nyla"]}, {"title": "Time", "students": ["Leo", "Kaiden", "Brayden", "Hasya", "Ron", "Samar", "Damien", "Aakhash"]}, {"title": "Picture Graphs", "students": ["Jun Yue", "Damien", "Jacob", "Kaiden", "Brayden", "Zhan Jun", "Cyrus", "Aakhash"]}], "unit": [{"title": "Review 4", "students": ["Cyrus", "Raidah", "Kaiden", "Jun Yue"]}, {"title": "Review 6", "students": ["Jun Yue", "Nyla", "Cyrus", "Ron", "Brayden", "Adam", "Kaiden", "Zhan Jun", "Jacob", "Leo", "Aakhash", "Damien"]}, {"title": "Picture Graphs", "students": ["Ron", "Hasya", "Adam", "Kaiden"]}, {"title": "Volume", "students": ["Cyrus", "Damien", "Ron", "Brayden", "Darrence", "Aakhash"]}, {"title": "Addition and Subtraction", "students": ["Shiyi", "Aakhash", "Brayden", "Ron", "Kaiden", "Nyla", "Raidah", "Darrence", "Jun Yue", "Adam", "Cyrus"]}]};
const STORAGE_KEY = "correctionsTracker.v1";

function normalizeData(raw){
  const out = {topical:[], unit:[]};
  for (const type of ["topical","unit"]){
    const arr = Array.isArray(raw?.[type]) ? raw[type] : [];
    out[type] = arr.map(item => ({
      id: item.id || crypto.randomUUID(),
      title: String(item.title || "Untitled worksheet"),
      students: Array.isArray(item.students)
        ? item.students.map(s => typeof s === "string"
            ? {id:crypto.randomUUID(), name:s, done:false}
            : {id:s.id || crypto.randomUUID(), name:String(s.name || "Student"), done:Boolean(s.done)})
        : []
    }));
  }
  return out;
}

let data;
try{
  const saved = localStorage.getItem(STORAGE_KEY);
  data = saved ? normalizeData(JSON.parse(saved)) : normalizeData(SEED_DATA);
}catch{
  data = normalizeData(SEED_DATA);
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  updateTotal();
}

function esc(text){
  return String(text).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[ch]));
}

function render(){
  for (const type of ["topical","unit"]){
    const host = document.getElementById(type + "Cards");
    host.innerHTML = "";
    if (!data[type].length){
      host.innerHTML = `<div class="empty">No worksheets here yet.<br>Use <strong>＋ Add worksheet</strong> to create one.</div>`;
      continue;
    }

    for (const worksheet of data[type]){
      const remaining = worksheet.students.filter(s => !s.done).length;
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.type = type;
      card.dataset.id = worksheet.id;

      const studentsHTML = worksheet.students.length
        ? `<div class="student-list">` + worksheet.students.map(s => `
            <button class="student ${s.done ? "done" : ""}" data-student="${s.id}" title="Tap to ${s.done ? "undo" : "clear"}">
              <span class="check">${s.done ? "✓" : ""}</span>
              <span class="name">${esc(s.name)}</span>
            </button>`).join("") + `</div>`
        : `<div class="all-clear">No students listed.</div>`;

      const clearHTML = worksheet.students.length && remaining === 0
        ? `<div class="all-clear">✓ All corrections cleared</div>` : "";

      card.innerHTML = `
        <div class="card-head">
          <div>
            <h3 class="worksheet-title">${esc(worksheet.title)}</h3>
            <div class="meta">${remaining} remaining · ${worksheet.students.length} student${worksheet.students.length === 1 ? "" : "s"}</div>
          </div>
          <div class="card-actions">
            <button class="mini edit-card" title="Edit worksheet">✎ Edit</button>
          </div>
        </div>
        ${studentsHTML}
        ${clearHTML}
      `;
      host.appendChild(card);
    }
  }
  updateTotal();
}

function updateTotal(){
  let total = 0;
  for (const type of ["topical","unit"]){
    for (const w of data[type]) total += w.students.filter(s => !s.done).length;
  }
  document.getElementById("remainingTotal").textContent = total;
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove("show"), 1700);
}

document.addEventListener("click", e => {
  const studentBtn = e.target.closest(".student");
  if (studentBtn){
    const card = studentBtn.closest(".card");
    const type = card.dataset.type;
    const worksheet = data[type].find(w => w.id === card.dataset.id);
    const student = worksheet?.students.find(s => s.id === studentBtn.dataset.student);
    if (!student) return;

    student.done = !student.done;
    save();

    const justClearedAll = student.done && worksheet.students.length > 0 && worksheet.students.every(s => s.done);
    if (justClearedAll){
      render();
      setTimeout(() => {
        if (confirm(`All students for "${worksheet.title}" are cleared.\n\nRemove this worksheet card?`)){
          data[type] = data[type].filter(w => w.id !== worksheet.id);
          save();
          render();
          toast("Worksheet removed");
        }
      }, 50);
    }else{
      render();
    }
    return;
  }

  const editBtn = e.target.closest(".edit-card");
  if (editBtn){
    const card = editBtn.closest(".card");
    openEditor(card.dataset.type, card.dataset.id);
    return;
  }

  const add = e.target.closest("[data-add]");
  if (add){
    const type = add.dataset.add;
    const worksheet = {id:crypto.randomUUID(), title:"New Worksheet", students:[]};
    data[type].push(worksheet);
    save(); render();
    openEditor(type, worksheet.id, true);
  }
});

let editContext = null;
let editDraft = null;
const dialog = document.getElementById("editDialog");
const editor = document.getElementById("studentEditor");
const worksheetName = document.getElementById("worksheetName");
const newStudent = document.getElementById("newStudent");

function openEditor(type, id, isNew=false){
  const worksheet = data[type].find(w => w.id === id);
  if (!worksheet) return;
  editContext = {type, id, isNew};
  editDraft = JSON.parse(JSON.stringify(worksheet));
  document.getElementById("modalTitle").textContent = isNew ? "Add worksheet" : "Edit worksheet";
  worksheetName.value = editDraft.title;
  renderStudentEditor(editDraft);
  newStudent.value = "";
  dialog.showModal();
  setTimeout(() => worksheetName.select(), 40);
}

function renderStudentEditor(worksheet){
  editor.innerHTML = "";
  if (!worksheet.students.length){
    editor.innerHTML = `<div class="empty" style="padding:15px">No students yet.</div>`;
    return;
  }
  for (const s of worksheet.students){
    const row = document.createElement("div");
    row.className = "edit-row";
    row.dataset.sid = s.id;
    row.innerHTML = `
      <input value="${esc(s.name)}" aria-label="Student name" />
      <button type="button" class="remove-student" title="Remove student">Remove</button>
    `;
    editor.appendChild(row);
  }
}

function syncEditorIntoDraft(){
  if (!editDraft) return;
  editDraft.title = worksheetName.value.trim() || "Untitled worksheet";

  const byId = new Map(editDraft.students.map(s => [s.id, s]));
  const rows = [...editor.querySelectorAll(".edit-row")];
  editDraft.students = rows.map(row => {
    const existing = byId.get(row.dataset.sid);
    return {
      id: row.dataset.sid,
      name: row.querySelector("input").value.trim() || "Student",
      done: existing ? existing.done : false
    };
  });
}

document.getElementById("addStudentBtn").addEventListener("click", () => {
  if (!editDraft) return;
  syncEditorIntoDraft();
  const name = newStudent.value.trim();
  if (!name) return;
  editDraft.students.push({id:crypto.randomUUID(), name, done:false});
  newStudent.value = "";
  renderStudentEditor(editDraft);
  newStudent.focus();
});

newStudent.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    e.preventDefault();
    document.getElementById("addStudentBtn").click();
  }
});

editor.addEventListener("click", e => {
  const btn = e.target.closest(".remove-student");
  if (!btn) return;
  const row = btn.closest(".edit-row");
  row.remove();
  if (!editor.querySelector(".edit-row")){
    editor.innerHTML = `<div class="empty" style="padding:15px">No students yet.</div>`;
  }
});

document.getElementById("editForm").addEventListener("submit", e => {
  e.preventDefault();
  if (!editContext || !editDraft) return;
  syncEditorIntoDraft();
  const idx = data[editContext.type].findIndex(w => w.id === editContext.id);
  if (idx >= 0) data[editContext.type][idx] = editDraft;
  save(); render(); dialog.close(); editContext = null; editDraft = null; toast("Worksheet updated");
});

document.getElementById("cancelEditBtn").addEventListener("click", () => {
  if (editContext?.isNew){
    data[editContext.type] = data[editContext.type].filter(w => w.id !== editContext.id);
    save(); render();
  }
  dialog.close(); editContext = null; editDraft = null;
});

document.getElementById("deleteWorksheetBtn").addEventListener("click", () => {
  if (!editContext) return;
  const worksheet = data[editContext.type].find(w => w.id === editContext.id);
  if (!worksheet) return;
  if (confirm(`Delete "${worksheet.title}"?`)){
    data[editContext.type] = data[editContext.type].filter(w => w.id !== worksheet.id);
    save(); render(); dialog.close(); editContext = null; editDraft = null; toast("Worksheet deleted");
  }
});

dialog.addEventListener("cancel", e => {
  e.preventDefault();
  document.getElementById("cancelEditBtn").click();
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  const payload = {
    app:"Corrections Tracker",
    version:1,
    exportedAt:new Date().toISOString(),
    topical:data.topical,
    unit:data.unit
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `Corrections_Tracker_${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("List downloaded");
});

document.getElementById("uploadInput").addEventListener("change", async e => {
  const file = e.target.files?.[0];
  if (!file) return;
  try{
    const parsed = JSON.parse(await file.text());
    const candidate = ("topical" in parsed || "unit" in parsed) ? parsed : parsed.data;
    if (!candidate || (!Array.isArray(candidate.topical) && !Array.isArray(candidate.unit))){
      throw new Error("Wrong format");
    }
    if (confirm("Replace the current tracker with this uploaded list?")){
      data = normalizeData(candidate);
      save(); render(); toast("List re-uploaded");
    }
  }catch(err){
    alert("I couldn't read that file. Please upload a JSON file previously downloaded from this tracker.");
  }
  e.target.value = "";
});

document.getElementById("fullscreenBtn").addEventListener("click", async () => {
  try{
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch{
    alert("Fullscreen is not available in this browser.");
  }
});

function updateClock(){
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("en-SG",{
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
  });
  document.getElementById("date").textContent = now.toLocaleDateString("en-SG",{
    weekday:"short",day:"numeric",month:"short",year:"numeric"
  });
}
updateClock(); setInterval(updateClock,1000);

render();
</script>
</body>
</html>
