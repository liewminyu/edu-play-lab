<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Fraction Translator</title>
<style>
:root{
  --navy:#0b3d70; --blue:#55a9ea; --line:#d9e7f1; --muted:#6c8398;
  --orange:#ffad55; --orangeLine:#d4740a; --teal:#86d1d9; --tealLine:#168d99;
  --green:#8fd25d; --greenLine:#4f9b35; --purple:#c894e0; --purpleLine:#7a419a;
  --good:#eff9eb; --bad:#fff1ed;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f9fc;color:var(--navy);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{width:100vw;height:100vh;min-height:590px;background:linear-gradient(125deg,#ffdcea 0%,#efe4ff 48%,#dff5ff 100%);padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.topbar{height:66px;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px}
.title{font-size:clamp(28px,2.8vw,44px);font-weight:900;letter-spacing:.2px;white-space:nowrap}
.mode-tabs,.top-actions{display:flex;gap:8px;align-items:center}
.tab,.icon-btn,.small-btn,.seg-btn,.answer-btn{border:2px solid #d5e4ee;background:#fff;border-radius:16px;font-weight:900;box-shadow:0 3px 10px rgba(11,61,112,.06)}
.tab{min-width:122px;height:50px;padding:0 18px;font-size:18px}
.tab.active,.seg-btn.active{background:#e9f5ff;border-color:#4da5e7;box-shadow:0 0 0 4px rgba(77,165,231,.13)}
.icon-btn{width:50px;height:50px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:25px;height:25px;stroke:var(--navy);stroke-width:2.15;fill:none;stroke-linecap:round;stroke-linejoin:round}
.panel{flex:1;min-height:0;background:rgba(255,255,255,.95);border-radius:30px;padding:16px 18px;box-shadow:0 12px 35px rgba(49,71,107,.08);overflow:hidden}
.view{display:none;width:100%;height:100%;min-height:0}.view.active{display:grid}
.stage{min-height:0;border:1.5px solid var(--line);background:linear-gradient(180deg,#fcfeff,#fff);border-radius:24px;padding:14px 16px 16px;overflow:hidden}
.prompt{font-size:clamp(22px,2vw,31px);font-weight:900}
.small-btn{height:43px;padding:0 17px;font-size:15px}.small-btn.primary{background:#52a8e8;border-color:#52a8e8;color:#fff}.small-btn.green{background:#8ed05e;border-color:#8ed05e;color:#164e27}.small-btn.relation-choice{min-width:74px;font-size:29px;line-height:1}.small-btn.relation-choice.active{background:#e9f5ff;border-color:#4da5e7;box-shadow:0 0 0 4px rgba(77,165,231,.13)}
.frac{display:inline-grid;grid-template-rows:auto 3px auto;place-items:center;min-width:58px;line-height:1;font-weight:900}.frac .bar{height:3px;background:currentColor;width:100%;margin:3px 0}
.word{font-weight:900;color:#5e4580}
.model{display:grid;place-items:center;min-width:0;min-height:0}
.faded .model svg,.order-faded .card-pic svg{opacity:.18}.hidden-pics .model svg,.order-hidden .card-pic svg{opacity:0}

/* MATCH */
#matchView{grid-template-rows:1fr}
.match-stage{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;max-width:1180px;width:100%;margin:0 auto}
.match-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.match-body{min-height:0;display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:18px;align-items:stretch}
.match-picture{border:2px solid #d9e6ef;border-radius:24px;background:linear-gradient(180deg,#fffaf3,#fff);display:grid;place-items:center;padding:16px;overflow:hidden}
.match-picture .model{width:min(88%,390px);height:min(92%,390px)}
.answer-panel{border:2px solid #d9e6ef;border-radius:24px;background:#fbfdff;padding:18px;display:grid;grid-template-rows:auto 1fr auto 1fr;gap:10px;min-height:0}
.answer-label{font-size:18px;font-weight:900;color:var(--muted)}
.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:center}
.answer-btn{min-height:72px;padding:8px 12px;font-size:clamp(19px,1.7vw,26px);background:#fff}
.answer-btn.notation{font-size:clamp(27px,2.4vw,38px)}
.answer-btn.selected{background:#eaf5ff;border-color:#4da5e7;box-shadow:0 0 0 4px rgba(77,165,231,.13)}
.answer-btn.correct{background:var(--good);border-color:#71b754}.answer-btn.wrong{background:var(--bad);border-color:#dc8675}
.match-footer{display:flex;align-items:center;justify-content:center;gap:10px;min-height:43px}
.feedback{min-width:120px;text-align:center;font-weight:900;font-size:18px}.feedback.good{color:#458934}.feedback.bad{color:#b84e3d}

/* COMPARE */
#compareView{grid-template-rows:1fr}
.compare-stage{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;max-width:1180px;width:100%;margin:0 auto}
.compare-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;min-height:42px}
.compare-area{min-height:0;display:grid;grid-template-columns:minmax(280px,420px) 110px minmax(280px,420px);gap:12px;align-items:stretch;justify-content:center;max-width:1080px;width:100%;margin:0 auto}
.compare-card{min-height:0;border:2px solid #d9e6ef;border-radius:24px;background:#fbfdff;display:grid;grid-template-rows:1fr auto;place-items:center;padding:10px 14px 12px;overflow:hidden}
.compare-card.a-card{background:linear-gradient(180deg,#fffaf3,#fff)}.compare-card.b-card{background:linear-gradient(180deg,#f1fcff,#fff)}
.compare-card .model{width:min(94%,360px);height:min(100%,330px)}
.card-caption{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:3px;min-height:76px}.card-caption .frac{font-size:clamp(42px,4.2vw,62px)}.card-caption .word{font-size:clamp(15px,1.45vw,21px)}
.relation-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.relation-symbol{width:88px;height:88px;border-radius:26px;border:2px solid #d7e4ee;background:#fff;display:grid;place-items:center;font-size:52px;font-weight:900;box-shadow:0 7px 20px rgba(11,61,112,.08)}
.relation-symbol.selected{background:#eef7ff;border-color:#7bb8e5;color:#0b3d70}.relation-symbol.correct{background:#eef9eb;border-color:#9dd37c;color:#3f8131}.relation-symbol.wrong{background:#fff1ee;border-color:#df8c79;color:#b34a38}.same-note{font-size:14px;font-weight:900;color:#71879a;text-align:center;line-height:1.2}
.compare-footer{display:flex;justify-content:center;gap:9px;align-items:center;flex-wrap:wrap}

/* ORDER */
#orderView{grid-template-rows:auto auto 1fr auto;gap:10px;max-width:1180px;width:100%;margin:0 auto}
.order-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.seg-btn{height:42px;padding:0 14px;border-radius:13px;font-size:15px}
.order-prompt{text-align:center;font-size:clamp(21px,1.9vw,29px);font-weight:900}
.order-zone{min-height:0;border:1.5px solid var(--line);border-radius:24px;background:#fbfdff;padding:16px;display:grid;place-items:center;overflow:hidden}
.card-row{min-height:0;width:100%;display:flex;gap:14px;align-items:stretch;justify-content:center;padding:4px 6px 6px}
.order-card{flex:1 1 0;max-width:300px;min-width:0;border:2px solid #d9e6ef;border-radius:22px;background:#fff;display:grid;grid-template-rows:1fr auto;place-items:center;padding:10px 10px 18px;touch-action:none;user-select:none;position:relative;transition:transform .12s,box-shadow .12s,border-color .12s;overflow:hidden}
.order-card .drag-hint{position:absolute;top:7px;right:10px;font-size:18px;color:#a2b4c2;font-weight:900}.order-card.dragging{opacity:.96;transform:scale(1.035);box-shadow:0 16px 32px rgba(11,61,112,.22);border-color:#4da5e7;z-index:20}.order-card.touch-dragging{position:fixed!important;margin:0!important;pointer-events:none;z-index:9999;transition:none!important}
.drag-placeholder{flex:1 1 0;max-width:300px;border:3px dashed #9fc9ea;border-radius:22px;background:#eef7fe}.order-card.correct{border-color:#64ad4a;background:#f0faec;box-shadow:0 0 0 4px rgba(100,173,74,.13)}.order-card.wrong{animation:shake .28s ease 0s 2;border-color:#d87c69}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.card-pic{width:min(90%,210px);height:min(100%,190px);display:grid;place-items:center}.order-card .frac{font-size:clamp(39px,4vw,56px)}
.order-feedback{min-height:26px;text-align:center;font-weight:900;font-size:18px}.order-feedback.good{color:#39822c}.order-feedback.bad{color:#b94b36}
.order-footer{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
#orderView.count-4 .card-row{gap:10px}#orderView.count-4 .order-card{max-width:245px;padding:8px 8px 18px}#orderView.count-4 .card-pic{width:min(84%,175px);height:min(100%,160px)}#orderView.count-4 .order-card .frac{font-size:clamp(34px,3.3vw,48px)}

@media(max-width:980px){
  .app{padding:10px}.topbar{height:58px}.tab{min-width:104px;height:44px;font-size:15px}.icon-btn{width:44px;height:44px}
  .match-body{grid-template-columns:36% 1fr;gap:10px}.match-picture .model{width:min(92%,320px);height:min(92%,320px)}
  .compare-area{grid-template-columns:minmax(220px,1fr) 82px minmax(220px,1fr);max-width:900px}.relation-symbol{width:72px;height:72px;font-size:44px}
  .order-card{max-width:240px}.card-pic{width:min(86%,160px);height:min(100%,150px)}
}
@media(max-height:720px){
  .app{padding:8px 12px;gap:6px}.topbar{height:50px}.title{font-size:28px}.tab{height:40px}.icon-btn{width:40px;height:40px;border-radius:12px}.panel{padding:10px 12px}
  .stage{padding:9px 11px}.prompt{font-size:22px}.small-btn{height:36px}.match-stage,.compare-stage{gap:6px}.match-body{gap:10px}.answer-panel{padding:11px;gap:6px}.answer-btn{min-height:56px}.answer-label{font-size:15px}
  .compare-area{grid-template-columns:minmax(210px,1fr) 78px minmax(210px,1fr);max-width:860px}.compare-card{border-radius:19px;padding:6px 10px 8px}.compare-card .model{width:min(90%,290px);height:min(100%,245px)}.relation-symbol{width:66px;height:66px;font-size:40px}.card-caption .frac{font-size:40px}
  #orderView{gap:6px}.order-zone{padding:9px}.order-card{padding:7px 7px 15px}.card-pic{width:min(84%,150px);height:min(100%,135px)}.order-card .frac{font-size:38px}.seg-btn{height:36px}.order-footer .small-btn{height:35px}
  #orderView.count-4 .card-pic{width:min(80%,130px);height:min(100%,118px)}#orderView.count-4 .order-card .frac{font-size:33px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="title">Fraction Translator</div>
    <div class="mode-tabs" aria-label="Mode">
      <button class="tab active" data-mode="match">Match</button>
      <button class="tab" data-mode="compare">Compare 2</button>
      <button class="tab" data-mode="order">Order</button>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="randomBtn" aria-label="New question" title="New question">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6"/></svg>
      </button>
      <button class="icon-btn" id="fullscreenBtn" aria-label="Toggle fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg>
      </button>
    </div>
  </header>

  <main class="panel">
    <section id="matchView" class="view active">
      <div class="stage match-stage">
        <div class="match-head"><div class="prompt">Match the fraction.</div></div>
        <div class="match-body">
          <div class="match-picture"><div class="model" id="matchModel"></div></div>
          <div class="answer-panel">
            <div class="answer-label">Fraction notation</div>
            <div class="answer-grid" id="notationChoices"></div>
            <div class="answer-label">Words</div>
            <div class="answer-grid" id="wordChoices"></div>
          </div>
        </div>
        <div class="match-footer">
          <button class="small-btn green" id="newMatchBtn">New question</button>
          <button class="small-btn primary" id="checkMatchBtn">Check match</button>
          <div class="feedback" id="matchFeedback"></div>
        </div>
      </div>
    </section>

    <section id="compareView" class="view">
      <div class="stage compare-stage" id="compareStage">
        <div class="compare-head"><div class="prompt">Compare the fractions.</div></div>
        <div class="compare-area">
          <article class="compare-card a-card">
            <div class="model" id="compareModelA"></div>
            <div class="card-caption"><div id="compareFracA"></div><div class="word" id="compareWordA"></div></div>
          </article>
          <div class="relation-col">
            <div class="relation-symbol" id="relationSymbol">?</div>
            <div class="same-note">same whole</div>
          </div>
          <article class="compare-card b-card">
            <div class="model" id="compareModelB"></div>
            <div class="card-caption"><div id="compareFracB"></div><div class="word" id="compareWordB"></div></div>
          </article>
        </div>
        <div class="compare-footer">
          <button class="small-btn green" id="newCompareBtn">New question</button>
          <button class="small-btn relation-choice" id="lessCompareBtn" data-relation="&lt;">&lt;</button>
          <button class="small-btn relation-choice" id="greaterCompareBtn" data-relation="&gt;">&gt;</button>
          <button class="small-btn primary" id="checkCompareBtn">Check</button>
        </div>
      </div>
    </section>

    <section id="orderView" class="view">
      <div class="order-toolbar">
        <div class="toolbar-left">
          <button class="seg-btn active" data-dir="desc">Greatest → Smallest</button>
          <button class="seg-btn" data-dir="asc">Smallest → Greatest</button>
          <button class="seg-btn active" data-count="3">Order 3</button>
          <button class="seg-btn" data-count="4">Order 4</button>
        </div>
        <div class="toolbar-right">
          <button class="small-btn" id="fadeOrderBtn">Fade pictures</button>
          <button class="small-btn primary" id="checkOrderBtn">Check order</button>
        </div>
      </div>
      <div class="order-prompt" id="orderPrompt">Drag the fractions from greatest to smallest.</div>
      <div class="order-zone" id="orderZone"><div class="card-row" id="cardRow"></div></div>
      <div class="order-footer">
        <button class="small-btn green" id="newOrderBtn">New question</button>
        <button class="small-btn" id="hideOrderBtn">Hide pictures</button>
        <div class="order-feedback" id="orderFeedback"></div>
      </div>
    </section>
  </main>
</div>
<script>
(()=>{
  const state={mode:'match',matchDen:4,matchShape:'circle',notationChoice:null,wordChoice:null,compareA:3,compareB:7,compareShape:'circle',compareChoice:null,compareChecked:false,orderDir:'desc',orderCount:3,orderDens:[2,4,7],orderPics:'on',orderShape:'circle',orderPalette:2};
  const singular={2:'half',3:'third',4:'quarter',5:'fifth',6:'sixth',7:'seventh',8:'eighth',9:'ninth',10:'tenth',11:'eleventh',12:'twelfth'};
  const palettes=[['#ffad55','#d4740a'],['#86d1d9','#168d99'],['#c894e0','#7a419a'],['#9fd567','#4f9b35']];
  const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function randomDen(exclude=[]){const pool=range(2,12).filter(d=>!exclude.includes(d));return pool[Math.floor(Math.random()*pool.length)];}
  function wordFor(d){return `one-${singular[d]}`;}
  function fracHTML(d){return `<span class="frac"><span>1</span><span class="bar"></span><span>${d}</span></span>`;}
  function pictureSVG(d,shape,color,line,size=340){
    if(shape==='bar'){
      const bw=size*.88,bh=size*.36,x=(size-bw)/2,y=(size-bh)/2;let rects='';
      for(let i=0;i<d;i++){const rw=bw/d;rects+=`<rect x="${x+i*rw}" y="${y}" width="${rw}" height="${bh}" fill="${i===0?color:'#fff'}" stroke="${line}" stroke-width="${Math.max(3,size*.012)}"/>`;}
      return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" aria-label="one out of ${d} equal parts shaded">${rects}</svg>`;
    }
    const cx=size/2,cy=size/2,r=size*.39;let parts='';
    for(let i=0;i<d;i++){
      const a1=-Math.PI/2+i*2*Math.PI/d,a2=-Math.PI/2+(i+1)*2*Math.PI/d;
      const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      parts+=`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z" fill="${i===0?color:'#fff'}" stroke="${line}" stroke-width="${Math.max(3,size*.012)}"/>`;
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" aria-label="one out of ${d} equal parts shaded">${parts}</svg>`;
  }

  /* MATCH */
  function makeMatchChoices(){
    const dens=shuffle([state.matchDen,...shuffle(range(2,12).filter(d=>d!==state.matchDen)).slice(0,3)]);
    const words=shuffle(dens);
    const nWrap=document.getElementById('notationChoices'),wWrap=document.getElementById('wordChoices');nWrap.innerHTML='';wWrap.innerHTML='';
    dens.forEach(d=>{const b=document.createElement('button');b.className='answer-btn notation';b.dataset.den=d;b.innerHTML=fracHTML(d);b.addEventListener('click',()=>{state.notationChoice=d;renderMatchSelection();});nWrap.appendChild(b);});
    words.forEach(d=>{const b=document.createElement('button');b.className='answer-btn';b.dataset.den=d;b.textContent=wordFor(d);b.addEventListener('click',()=>{state.wordChoice=d;renderMatchSelection();});wWrap.appendChild(b);});
  }
  function renderMatchSelection(){
    document.querySelectorAll('#notationChoices .answer-btn').forEach(b=>{b.classList.remove('correct','wrong');b.classList.toggle('selected',Number(b.dataset.den)===state.notationChoice);});
    document.querySelectorAll('#wordChoices .answer-btn').forEach(b=>{b.classList.remove('correct','wrong');b.classList.toggle('selected',Number(b.dataset.den)===state.wordChoice);});
    const fb=document.getElementById('matchFeedback');fb.textContent='';fb.className='feedback';
  }
  function newMatch(){state.matchDen=randomDen();state.matchShape=Math.random()<.5?'circle':'bar';state.notationChoice=null;state.wordChoice=null;const [c,l]=palettes[Math.floor(Math.random()*palettes.length)];document.getElementById('matchModel').innerHTML=pictureSVG(state.matchDen,state.matchShape,c,l,390);makeMatchChoices();renderMatchSelection();}
  function checkMatch(){
    const fb=document.getElementById('matchFeedback');
    if(state.notationChoice==null||state.wordChoice==null){fb.textContent='Choose both.';fb.className='feedback bad';return;}
    const okN=state.notationChoice===state.matchDen,okW=state.wordChoice===state.matchDen;
    document.querySelectorAll('#notationChoices .answer-btn').forEach(b=>{const d=Number(b.dataset.den);b.classList.remove('correct','wrong');if(d===state.notationChoice)b.classList.add(okN?'correct':'wrong');if(!okN&&d===state.matchDen)b.classList.add('correct');});
    document.querySelectorAll('#wordChoices .answer-btn').forEach(b=>{const d=Number(b.dataset.den);b.classList.remove('correct','wrong');if(d===state.wordChoice)b.classList.add(okW?'correct':'wrong');if(!okW&&d===state.matchDen)b.classList.add('correct');});
    fb.textContent=okN&&okW?'Correct!':'Try again.';fb.className='feedback '+(okN&&okW?'good':'bad');
  }

  /* COMPARE */
  function newCompare(){
    state.compareA=randomDen();
    state.compareB=randomDen([state.compareA]);
    state.compareShape=Math.random()<.5?'circle':'bar';
    state.compareChoice=null;
    state.compareChecked=false;
    renderCompare();
  }
  function compareRelation(){return state.compareA<state.compareB?'>':'<';}
  function chooseCompare(symbol){
    state.compareChoice=symbol;
    state.compareChecked=false;
    renderCompare();
  }
  function checkCompare(){
    if(!state.compareChoice)return;
    state.compareChecked=true;
    renderCompare();
  }
  function renderCompare(){
    document.getElementById('compareModelA').innerHTML=pictureSVG(state.compareA,state.compareShape,palettes[0][0],palettes[0][1],350);
    document.getElementById('compareModelB').innerHTML=pictureSVG(state.compareB,state.compareShape,palettes[1][0],palettes[1][1],350);
    document.getElementById('compareFracA').innerHTML=fracHTML(state.compareA);
    document.getElementById('compareFracB').innerHTML=fracHTML(state.compareB);
    document.getElementById('compareWordA').textContent=wordFor(state.compareA);
    document.getElementById('compareWordB').textContent=wordFor(state.compareB);
    const rel=document.getElementById('relationSymbol');
    rel.textContent=state.compareChoice||'?';
    rel.className='relation-symbol';
    if(state.compareChoice) rel.classList.add('selected');
    if(state.compareChecked){
      rel.classList.remove('selected');
      rel.classList.add(state.compareChoice===compareRelation()?'correct':'wrong');
    }
    document.querySelectorAll('.relation-choice').forEach(b=>{
      b.classList.toggle('active',b.dataset.relation===state.compareChoice);
    });
  }

  /* ORDER */
  function newOrder(){
    state.orderDens=shuffle(range(2,12)).slice(0,state.orderCount);
    state.orderPics='on';
    // Every fraction in an ordering question uses the SAME whole.
    // Only the number of equal parts changes.
    state.orderShape=Math.random()<.5?'circle':'bar';
    state.orderPalette=Math.floor(Math.random()*palettes.length);
    renderOrder();
  }
  function orderPicture(d){
    const [c,l]=palettes[state.orderPalette];
    return pictureSVG(d,state.orderShape,c,l,230);
  }
  function renderOrder(){
    const view=document.getElementById('orderView');view.classList.toggle('count-4',state.orderCount===4);view.classList.toggle('order-faded',state.orderPics==='faded');view.classList.toggle('order-hidden',state.orderPics==='off');
    document.querySelectorAll('[data-dir]').forEach(b=>b.classList.toggle('active',b.dataset.dir===state.orderDir));document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===state.orderCount));
    document.getElementById('orderPrompt').textContent=state.orderDir==='desc'?'Drag the fractions from greatest to smallest.':'Drag the fractions from smallest to greatest.';
    const row=document.getElementById('cardRow');row.innerHTML='';
    state.orderDens.forEach((d,i)=>{const card=document.createElement('div');card.className='order-card';card.dataset.den=d;card.innerHTML=`<span class="drag-hint">⋮⋮</span><div class="card-pic">${orderPicture(d)}</div><div>${fracHTML(d)}</div>`;enableDrag(card,row);row.appendChild(card);});
    const fb=document.getElementById('orderFeedback');fb.textContent='';fb.className='order-feedback';document.getElementById('fadeOrderBtn').textContent=state.orderPics==='faded'?'Show pictures':'Fade pictures';document.getElementById('hideOrderBtn').textContent=state.orderPics==='off'?'Show pictures':'Hide pictures';
  }
  function syncOrder(row){state.orderDens=[...row.children].filter(c=>c.classList.contains('order-card')).map(c=>Number(c.dataset.den));}
  function enableDrag(card,row){
    let pointerDragging=false;
    card.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;if(e.button!==undefined&&e.button!==0)return;pointerDragging=true;card.setPointerCapture?.(e.pointerId);card.classList.add('dragging');e.preventDefault();});
    card.addEventListener('pointermove',e=>{if(!pointerDragging)return;let target=null;for(const s of [...row.children].filter(x=>x!==card&&x.classList.contains('order-card'))){const r=s.getBoundingClientRect();if(e.clientX<r.left+r.width/2){target=s;break;}}if(target)row.insertBefore(card,target);else row.appendChild(card);});
    const finish=()=>{if(!pointerDragging)return;pointerDragging=false;card.classList.remove('dragging');syncOrder(row);};card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',finish);
    let touchDragging=false,placeholder=null,offsetX=0,offsetY=0;
    const move=t=>{card.style.left=(t.clientX-offsetX)+'px';card.style.top=(t.clientY-offsetY)+'px';};
    card.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0],r=card.getBoundingClientRect();touchDragging=true;offsetX=t.clientX-r.left;offsetY=t.clientY-r.top;placeholder=document.createElement('div');placeholder.className='drag-placeholder';placeholder.style.width=r.width+'px';placeholder.style.height=r.height+'px';row.insertBefore(placeholder,card);card.classList.add('dragging','touch-dragging');card.style.width=r.width+'px';card.style.height=r.height+'px';card.style.left=r.left+'px';card.style.top=r.top+'px';document.body.appendChild(card);move(t);e.preventDefault();},{passive:false});
    card.addEventListener('touchmove',e=>{if(!touchDragging||e.touches.length!==1)return;const t=e.touches[0];move(t);let before=null;for(const s of [...row.children].filter(x=>x.classList.contains('order-card'))){const r=s.getBoundingClientRect();if(t.clientX<r.left+r.width/2){before=s;break;}}if(before)row.insertBefore(placeholder,before);else row.appendChild(placeholder);e.preventDefault();},{passive:false});
    const endTouch=e=>{if(!touchDragging)return;touchDragging=false;card.classList.remove('dragging','touch-dragging');card.removeAttribute('style');if(placeholder?.parentNode){row.insertBefore(card,placeholder);placeholder.remove();}else row.appendChild(card);placeholder=null;syncOrder(row);if(e.cancelable)e.preventDefault();};card.addEventListener('touchend',endTouch,{passive:false});card.addEventListener('touchcancel',endTouch,{passive:false});
  }
  function checkOrder(){
    const expected=[...state.orderDens].sort((a,b)=>state.orderDir==='desc'?a-b:b-a);const ok=state.orderDens.every((d,i)=>d===expected[i]);const cards=[...document.querySelectorAll('.order-card')];cards.forEach(c=>c.classList.remove('correct','wrong'));const fb=document.getElementById('orderFeedback');
    if(ok){cards.forEach(c=>c.classList.add('correct'));fb.textContent='Correct!';fb.className='order-feedback good';}else{cards.forEach(c=>c.classList.add('wrong'));fb.textContent='Try again.';fb.className='order-feedback bad';setTimeout(()=>cards.forEach(c=>c.classList.remove('wrong')),650);}
  }

  /* EVENTS */
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('matchView').classList.toggle('active',state.mode==='match');document.getElementById('compareView').classList.toggle('active',state.mode==='compare');document.getElementById('orderView').classList.toggle('active',state.mode==='order');}));
  document.getElementById('newMatchBtn').addEventListener('click',newMatch);document.getElementById('checkMatchBtn').addEventListener('click',checkMatch);
  document.getElementById('newCompareBtn').addEventListener('click',newCompare);
  document.getElementById('lessCompareBtn').addEventListener('click',()=>chooseCompare('<'));
  document.getElementById('greaterCompareBtn').addEventListener('click',()=>chooseCompare('>'));
  document.getElementById('checkCompareBtn').addEventListener('click',checkCompare);
  document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{state.orderDir=b.dataset.dir;renderOrder();}));document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>{state.orderCount=Number(b.dataset.count);newOrder();}));
  document.getElementById('newOrderBtn').addEventListener('click',newOrder);document.getElementById('checkOrderBtn').addEventListener('click',checkOrder);document.getElementById('fadeOrderBtn').addEventListener('click',()=>{state.orderPics=state.orderPics==='faded'?'on':'faded';renderOrder();});document.getElementById('hideOrderBtn').addEventListener('click',()=>{state.orderPics=state.orderPics==='off'?'on':'off';renderOrder();});
  document.getElementById('randomBtn').addEventListener('click',()=>state.mode==='match'?newMatch():state.mode==='compare'?newCompare():newOrder());
  document.getElementById('fullscreenBtn').addEventListener('click',async()=>{try{const active=document.fullscreenElement||document.webkitFullscreenElement;if(!active){const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}else{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}}catch(e){console.warn('Fullscreen unavailable',e);}});

  newMatch();newCompare();newOrder();
})();
</script>
</body>
</html>
