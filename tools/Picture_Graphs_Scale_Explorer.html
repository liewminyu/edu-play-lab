<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Picture Graph Scale Explorer</title>
<style>
  :root{
    --ink:#2f2850;
    --muted:#736b8c;
    --paper:#fffdf9;
    --panel:#ffffff;
    --line:#e6def2;
    --pink:#ff9fc7;
    --peach:#ffc38e;
    --yellow:#ffe784;
    --mint:#a8e6cf;
    --blue:#9fd8ff;
    --lav:#c7b1ff;
    --good:#2b9b72;
    --warn:#b47a00;
    --bad:#c84e66;
    --shadow:0 16px 38px rgba(67,50,105,.14);
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter, ui-rounded, "Segoe UI", Arial, sans-serif;color:var(--ink)}
  body{
    background:
      radial-gradient(circle at 10% 8%, rgba(255,159,199,.22), transparent 25%),
      radial-gradient(circle at 90% 12%, rgba(159,216,255,.24), transparent 25%),
      radial-gradient(circle at 80% 90%, rgba(168,230,207,.22), transparent 28%),
      linear-gradient(135deg,#fff8fb 0%,#fffdf7 48%,#f7fbff 100%);
    overflow-x:hidden;
  }

  .app{min-height:100vh;padding:24px}
  .shell{max-width:1500px;margin:auto}

  .topbar{
    display:flex;align-items:center;gap:18px;justify-content:space-between;
    background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
    border:2px solid #fff;border-radius:28px;padding:16px 20px;box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .badge{
    width:58px;height:58px;border-radius:18px;display:grid;place-items:center;
    font-size:32px;background:linear-gradient(145deg,var(--pink),var(--lav));
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),0 8px 16px rgba(110,82,150,.14);
  }
  h1{font-size:clamp(22px,3vw,38px);line-height:1.05;margin:0;font-weight:900;letter-spacing:-.03em}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .btn{
    border:0;border-radius:16px;padding:12px 16px;font:inherit;font-weight:800;color:var(--ink);
    background:#fff;box-shadow:0 6px 14px rgba(65,50,95,.09);cursor:pointer;
    border:2px solid #eee7f6;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.icon{width:46px;height:46px;padding:0;font-size:21px}
  .fullscreen-btn{
    display:grid;place-items:center;
    background:linear-gradient(180deg,#fff,#fff7fb);
    border-color:#efcfe0;
    box-shadow:0 7px 0 #e9c5d8,0 10px 18px rgba(86,58,105,.10);
  }
  .fullscreen-btn svg{
    width:24px;height:24px;fill:none;stroke:#65406f;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .fullscreen-btn:hover{background:#fffafd}
  .fullscreen-btn:active{transform:translateY(3px);box-shadow:0 4px 0 #e9c5d8,0 7px 12px rgba(86,58,105,.09)}

  .tabs{
    display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0;
  }
  .tab{
    border:0;border-radius:18px;padding:13px 10px;font:inherit;font-weight:900;color:var(--ink);
    cursor:pointer;box-shadow:0 7px 16px rgba(65,50,95,.08);border:2px solid rgba(255,255,255,.7);
    transition:.15s transform,.15s box-shadow;
  }
  .tab:hover{transform:translateY(-2px)}
  .tab.active{outline:4px solid rgba(47,40,80,.16);box-shadow:0 10px 20px rgba(65,50,95,.13)}

  .main{
    display:grid;grid-template-columns:minmax(0,2.1fr) minmax(320px,.9fr);gap:16px;
    align-items:stretch;
  }
  .card{
    background:rgba(255,255,255,.9);border:2px solid #fff;border-radius:28px;
    box-shadow:var(--shadow);padding:18px;
  }

  .graph-head{
    display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,31vw,340px);align-items:start;gap:14px;margin-bottom:12px
  }
  .graph-title h2{font-size:clamp(22px,2.4vw,34px);margin:0;font-weight:950;letter-spacing:-.02em}
  .graph-title{min-width:0}.graph-title p{margin:0;color:var(--ink);font-weight:800;font-size:clamp(16px,1.45vw,22px);line-height:1.25;height:2.5em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .status-pill{
    justify-self:end;border-radius:999px;padding:10px 14px;font-weight:900;font-size:14px;
    border:2px solid transparent;
  }
  .status-pill.good{color:#176e51;background:#e9fff6;border-color:#bcead9}
  .status-pill.warn{color:#815900;background:#fff8dd;border-color:#f5df8c}
  .status-pill.bad{color:#9c3044;background:#fff0f3;border-color:#f4bec8}

  .graph-wrap{
    display:block;
  }
  .count-table{
    border:2px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;
  }
  .count-table .th{
    padding:11px 12px;text-align:center;background:linear-gradient(90deg,#f3edff,#fff2f8);
    font-weight:950;border-bottom:2px solid var(--line)
  }
  .count-row{
    display:grid;grid-template-columns:1fr 58px;min-height:65px;align-items:center;
    border-bottom:1px solid var(--line);
  }
  .count-row:last-child{border-bottom:0}
  .count-row .name{padding:8px 12px;font-weight:850}
  .count-row .num{
    display:grid;place-items:center;height:100%;background:#faf8ff;border-left:1px solid var(--line);
    font-size:24px;font-weight:950
  }

  .picture-graph{
    border:2px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;min-height:380px;
  }
  .side-table-wrap{margin-bottom:14px}
  .control-card .count-table{margin-bottom:16px}
  .control-card .count-row{min-height:58px}
  .control-card .count-row .num{font-size:22px}
  .control-card h3{margin-top:4px}
  .symbol-chip{display:inline-flex;align-items:center;justify-content:center;min-width:1.1em}
  .picture-graph .pg-title{
    padding:10px 14px;text-align:center;font-weight:950;font-size:22px;
    background:linear-gradient(90deg,#ffdff0,#fff0c7,#dff7ff);
    border-bottom:2px solid var(--line)
  }
  .pg-row{
    display:grid;grid-template-columns:150px 1fr;min-height:78px;align-items:center;
    border-bottom:1px solid var(--line);
  }
  .pg-row:last-of-type{border-bottom:0}
  .row-name{
    height:100%;display:flex;align-items:center;padding:10px 14px;font-weight:900;
    background:#fbf9ff;border-right:1px solid var(--line)
  }
  .symbols{
    min-width:0;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .symbol{
    font-size:36px;line-height:1;display:inline-block;filter:drop-shadow(0 2px 0 rgba(80,65,20,.08));
  }
  .half-symbol{
    width:19px;height:38px;overflow:hidden;display:inline-block;position:relative;flex:0 0 19px;
  }
  .half-symbol span{
    position:absolute;left:0;top:0;font-size:36px;line-height:1;width:40px;
  }
  .invalid-marker{
    display:flex;align-items:center;gap:9px;color:var(--bad);font-weight:850;font-size:15px;
  }
  .invalid-marker .x{
    width:30px;height:30px;border-radius:10px;background:#ffe8ed;display:grid;place-items:center;
    font-weight:950;font-size:18px
  }
  .key{
    display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
    border-top:2px solid var(--line);padding:11px 14px;font-weight:900;font-size:19px;background:#fffef8;
  }
  .key .key-symbol{font-size:31px}
  .key strong{font-size:24px}

  .control-card h3{font-size:24px;margin:0 0 5px;font-weight:950}
  .scale-display{
    background:linear-gradient(135deg,#fff0f6,#fff9db,#eefaff);
    border:2px solid #eee1ee;border-radius:22px;padding:16px;text-align:center;margin-bottom:13px;
  }
  .scale-display .tiny{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:850}
  .scale-display .big{font-size:32px;font-weight:950;margin-top:4px}
  .scale-buttons{
    display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;
  }
  .scale-btn{
    padding:12px 8px;border-radius:15px;border:2px solid #ece4f5;background:#fff;
    font:inherit;font-weight:950;font-size:18px;cursor:pointer;color:var(--ink);
  }
  .scale-btn:hover{background:#fbf8ff}
  .scale-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}


  @media (max-width:1050px){
    .main{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .graph-head{grid-template-columns:minmax(0,1fr) 250px}
    .app{padding:10px}.topbar{border-radius:20px}
    .tabs{grid-template-columns:repeat(2,1fr)}
    .count-table{display:grid;grid-template-columns:repeat(2,1fr)}
    .count-table .th{grid-column:1/-1}
    .pg-row{grid-template-columns:110px 1fr}
  }
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="badge">⭐</div>
        <div>
          <h1>Picture Graph Scale Explorer</h1>
          
        </div>
      </div>
      <div class="toolbar">
        <button class="btn icon" id="prevBtn" title="Previous graph">←</button>
        <button class="btn icon" id="nextBtn" title="Next graph">→</button>
        <button class="btn icon fullscreen-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Enter fullscreen">
          <svg id="fullscreenIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <section class="main">
      <div class="card">
        <div class="graph-head">
          <div class="graph-title">
            <p id="graphDescriptor"></p>
          </div>
          <div class="status-pill good" id="statusPill">Works well, no half symbols needed</div>
        </div>

        <div class="graph-wrap">
          <div class="picture-graph">
            <div class="pg-title" id="pictureTitle"></div>
            <div id="rows"></div>
            <div class="key">
              <span>Each</span><span class="key-symbol" id="keySymbol">🍭</span><span>stands for</span><strong id="keyValue">1</strong><span id="unitText">lollipops</span>.
            </div>
          </div>
        </div>
      </div>

      <aside class="card control-card">
        <div class="side-table-wrap">
          <div class="count-table" id="countTable"></div>
        </div>
        <h3>Choose a scale</h3>

        <div class="scale-display">
          <div class="big"><span id="scaleSymbol">🍭</span> = <span id="scaleBig">1</span></div>
        </div>

        <div class="scale-buttons" id="scaleButtons"></div>

      </aside>
    </section>

  </div>
</div>

<script>
const datasets = [
  {
    tab:"Graph A",
    color:"#ffb0cf",
    title:"Lollipops",
    descriptor:"This picture graph shows the number of lollipops shared with each child.",
    units:"lollipops",
    symbol:"🍭",
    values:[["Aisha",20],["Ben",15],["Chloe",10],["Dylan",5]],
    scales:[1,2,4,5,10,20],
    recommended:5
  },
  {
    tab:"Graph B",
    color:"#ffd780",
    title:"Ice Cream",
    descriptor:"This picture graph shows the number of ice creams eaten by each child.",
    units:"ice creams",
    symbol:"🍦",
    values:[["Hana",18],["Imran",12],["Jia",9],["Kumar",6]],
    scales:[1,2,3,4,6,9],
    recommended:3
  },
  {
    tab:"Graph C",
    color:"#aee7cf",
    title:"Cupcakes",
    descriptor:"This picture graph shows the number of cupcakes Mrs Tan baked.",
    units:"cupcakes",
    symbol:"🧁",
    values:[["Chocolate",24],["Walnut",18],["Banana",12],["Blueberry",6]],
    scales:[1,2,3,4,6,12],
    recommended:6
  },
  {
    tab:"Graph D",
    color:"#cbb6ff",
    title:"Candies",
    descriptor:"This picture graph shows the number of candies collected each day.",
    units:"candies",
    symbol:"🍬",
    values:[["Monday",16],["Tuesday",12],["Wednesday",8],["Thursday",4]],
    scales:[1,2,4,6,8,10],
    recommended:4
  },
  {
    tab:"Graph E",
    color:"#9fd8ff",
    title:"Doughnuts",
    descriptor:"This picture graph shows the number of doughnuts with each glaze.",
    units:"doughnuts",
    symbol:"🍩",
    values:[["Chocolate",30],["Strawberry",20],["Matcha",15],["Vanilla",10]],
    scales:[1,2,5,6,10,20],
    recommended:5
  }
];

let current = 0;
let currentScale = 1;

const el = id => document.getElementById(id);

function canRepresent(value, scale){
  // Whole and half symbols means increments of scale/2.
  return Number.isInteger((value * 2) / scale);
}
function symbolCount(value, scale){
  return value / scale;
}
function totalVisualSymbols(data, scale){
  return data.values.reduce((sum,[,v]) => { const n=v/scale; return sum + Math.floor(n) + (Math.abs(n-Math.floor(n)-.5)<1e-9 ? 1 : 0); }, 0);
}
function usesHalfSymbols(data, scale){
  return data.values.some(([,v]) => Math.abs((v/scale)-Math.floor(v/scale)-.5) < 1e-9);
}
function classify(data, scale){
  const impossible = data.values.filter(([,v]) => !canRepresent(v,scale));
  if(impossible.length) return {type:"bad", title:"This scale does not work.", impossible};
  const visual = totalVisualSymbols(data,scale);
  if(usesHalfSymbols(data,scale)) return {type:"warn", title:"This scale works, but half symbols are needed.", impossible:[]};
  if(visual > 28) return {type:"warn", title:"It works, but it is crowded.", impossible:[]};
  return {type:"good", title:"This scale works well, no half symbols needed.", impossible:[]};
}
function makeSymbols(value,scale,symbol){
  if(!canRepresent(value,scale)){
    return `<div class="invalid-marker"><span class="x">×</span><span>${value} cannot be shown.</span></div>`;
  }
  const n = value/scale;
  const whole = Math.floor(n);
  const half = Math.abs(n-whole-.5) < 1e-9;
  let out="";
  for(let i=0;i<whole;i++) out += `<span class="symbol">${symbol}</span>`;
  if(half) out += `<span class="half-symbol" title="half a symbol"><span>${symbol}</span></span>`;
  if(!out) out = `<span style="color:#8e86a3;font-weight:800">0 symbols</span>`;
  return out;
}
function renderTabs(){
  el("tabs").innerHTML=datasets.map((d,i)=>
    `<button class="tab ${i===current?'active':''}" data-i="${i}" style="background:${d.color}">${d.tab}</button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=+b.dataset.i;currentScale=1;render();});
}
function renderScaleButtons(data){
  el("scaleButtons").innerHTML=data.scales.map(s=>
    `<button class="scale-btn ${s===currentScale?'active':''}" data-scale="${s}">${s}</button>`
  ).join("");
  document.querySelectorAll(".scale-btn").forEach(b=>b.onclick=()=>{currentScale=+b.dataset.scale;renderGraphOnly();});
}
function renderCountTable(data){
  el("countTable").innerHTML=
    data.values.map(([name,v])=>`<div class="count-row"><div class="name">${name}</div><div class="num">${v}</div></div>`).join("");
}
function renderGraphOnly(){
  const data=datasets[current];
  el("scaleBig").textContent=currentScale;
  el("scaleSymbol").textContent=data.symbol;
  el("keySymbol").textContent=data.symbol;
  el("keyValue").textContent=currentScale;
  el("unitText").textContent=data.units;
  el("rows").innerHTML=data.values.map(([name,v])=>
    `<div class="pg-row"><div class="row-name">${name}</div><div class="symbols">${makeSymbols(v,currentScale,data.symbol)}</div></div>`
  ).join("");
  renderScaleButtons(data);

  const c=classify(data,currentScale);
  const pill=el("statusPill");
  pill.className=`status-pill ${c.type}`;
  pill.textContent=c.type==="good" ? "Works well, no half symbols needed" : c.type==="warn" ? (usesHalfSymbols(data,currentScale) ? "Works, but half symbols are needed" : "Works, but crowded") : "Does not work";


}
function render(){
  const data=datasets[current];
  renderTabs();
  el("graphDescriptor").textContent=data.descriptor;
  el("pictureTitle").textContent=data.title;
  renderCountTable(data);
  renderGraphOnly();
}
el("prevBtn").onclick=()=>{current=(current+datasets.length-1)%datasets.length;currentScale=1;render();};
el("nextBtn").onclick=()=>{current=(current+1)%datasets.length;currentScale=1;render();};

function fullscreenIcon(expanded){
  return expanded
    ? '<path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M9 21v-4a2 2 0 0 0-2-2H3M15 21v-4a2 2 0 0 1 2-2h4"/>'
    : '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>';
}

async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(err){
    console.warn("Fullscreen unavailable:", err);
  }
}

el("fullscreenBtn").onclick=toggleFullscreen;

document.addEventListener("fullscreenchange",()=>{
  const active=!!document.fullscreenElement;
  el("fullscreenIcon").innerHTML=fullscreenIcon(active);
  el("fullscreenBtn").title=active?"Exit fullscreen":"Fullscreen";
  el("fullscreenBtn").setAttribute("aria-label",active?"Exit fullscreen":"Enter fullscreen");
});

render();
</script>
</body>
</html>
