<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GET Money Maker</title>
<style>
:root{
  --navy:#103f69;--muted:#71899d;--line:#d8e6ee;--purple:#7257e8;--purple2:#f4efff;
  --pink:#eaa8c1;--pink2:#fff3f7;--blue:#65b9e9;--blue2:#eef9ff;--yellow:#f5c13d;
  --shadow:0 9px 24px rgba(32,73,104,.10)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--navy);background:linear-gradient(135deg,#ffeef4 0%,#f1edff 52%,#edf9ff 100%)}
button,input{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:64px minmax(0,1fr);gap:9px;padding:9px 14px 12px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.brand{font-size:38px;font-weight:900;letter-spacing:.1px}
.top-actions{display:flex;align-items:center;gap:8px}
.btn{height:42px;border:2px solid #d7e4eb;background:#fff;border-radius:13px;padding:0 14px;font-weight:900;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 10px rgba(33,73,105,.04)}
.btn:hover:not(:disabled){background:#f9fbfd}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.icon{width:44px;min-width:44px;padding:0;font-size:21px}
.main{min-height:0;background:rgba(255,255,255,.97);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:minmax(230px,26%) minmax(0,74%)}
.panel{border-right:1px solid #e7eef3;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;min-width:0;min-height:0;background:linear-gradient(180deg,#fff 0%,#fffefe 100%)}
.panel-title{font-size:25px;font-weight:900;text-align:center}
.quick-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{height:56px;min-width:64px;padding:0 16px;border-radius:18px;border:2px solid #d7e4eb;background:#fff;font-size:25px;font-weight:900;box-shadow:0 4px 12px rgba(33,73,105,.06);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.chip:active{transform:translateY(1px)}
.workspace{padding:14px 16px 12px;display:flex;flex-direction:column;min-width:0;min-height:0}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.get-card{width:min(760px,94%);background:#fff;border:2px solid #dce8ef;border-radius:28px;box-shadow:0 9px 24px rgba(32,73,104,.10);padding:24px 26px 28px;display:flex;flex-direction:column;gap:18px}
.card-title{text-align:center;font-size:34px;font-weight:900;color:var(--navy);margin-bottom:2px}
.get-row{display:grid;grid-template-columns:126px minmax(0,1fr);gap:16px;align-items:center}
.get-label{height:100px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),0 6px 14px rgba(32,73,104,.10)}
.get-label.g{background:var(--blue)}
.get-label.e{background:var(--pink)}
.get-label.t{background:var(--purple)}
.get-letter{font-size:45px;font-weight:900;line-height:.9}
.get-word{font-size:15px;font-weight:900;margin-top:8px}
.get-input{width:100%;height:82px;border:3px solid #d8e6ee;background:#fff;border-radius:24px;text-align:center;font-weight:900;font-size:clamp(26px,3vw,42px);outline:none;padding:0 20px;box-shadow:0 4px 12px rgba(33,73,105,.05)}
.get-input:focus{border-color:#8f72e6;box-shadow:0 0 0 5px rgba(143,114,230,.12)}
.get-row.g .get-input{border-color:#a7d8f2}.get-row.e .get-input{border-color:#f1bfd4}.get-row.t .get-input{border-color:#c8b8f6}
.actions{height:58px;display:flex;gap:9px;align-items:center;justify-content:center;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);background:#143f64;color:#fff;padding:10px 15px;border-radius:14px;font-weight:900;opacity:0;pointer-events:none;transition:.18s;z-index:999}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-height:720px){
  .app{grid-template-rows:54px minmax(0,1fr);gap:7px;padding:7px 10px 9px}.brand{font-size:30px}.btn{height:38px}
  .panel{padding:12px;gap:12px}.panel-title{font-size:21px}.chip{height:48px;min-width:58px;font-size:22px}
  .get-card{width:min(700px,94%);padding:18px 22px 20px;gap:12px}.card-title{font-size:28px}.get-row{grid-template-columns:108px minmax(0,1fr);gap:13px}.get-label{height:78px}.get-letter{font-size:36px}.get-word{font-size:13px;margin-top:6px}.get-input{height:66px}.actions{height:48px}
}
@media(max-width:900px){
  .main{grid-template-columns:minmax(190px,30%) minmax(0,70%)}.brand{font-size:30px}.panel{padding:12px}.chip{height:50px;min-width:56px;padding:0 12px}
  .get-card{width:96%;padding:20px}.get-row{grid-template-columns:102px minmax(0,1fr);gap:12px}.get-label{height:82px}.get-letter{font-size:36px}.get-input{height:68px;font-size:clamp(23px,3.5vw,34px)}
}
@media(max-width:700px){
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.panel{border-right:0;border-bottom:1px solid #e7eef3;flex-direction:row;padding:10px 12px;gap:12px}.panel-title{font-size:18px;white-space:nowrap}.quick-row{flex-wrap:nowrap}.chip{height:42px;min-width:48px;border-radius:14px;font-size:20px}.workspace{padding:10px}.get-card{padding:16px;gap:10px}.card-title{font-size:25px}.get-row{grid-template-columns:82px minmax(0,1fr);gap:10px}.get-label{height:66px;border-radius:18px}.get-letter{font-size:30px}.get-word{font-size:11px;margin-top:4px}.get-input{height:58px;border-radius:18px;padding:0 12px}.actions{height:46px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">GET Money Maker</div>
    <div class="top-actions">
      <button class="btn" id="resetBtn" type="button">↺ Reset</button>
      <button class="btn icon" id="fullscreenBtn" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
    </div>
  </header>
  <main class="main">
    <aside class="panel">
      <div class="panel-title">Quick insert</div>
      <div class="quick-row">
        <button class="chip" type="button" tabindex="-1" data-insert="?">?</button>
        <button class="chip" type="button" tabindex="-1" data-insert="$">$</button>
        <button class="chip" type="button" tabindex="-1" data-insert="¢">¢</button>
      </div>
    </aside>
    <section class="workspace">
      <div class="stage-wrap">
        <div class="get-card" id="getCard">
          <div class="card-title">GET Mystery!</div>
          <div class="get-row g">
            <div class="get-label g"><div class="get-letter">G</div><div class="get-word">Group</div></div>
            <input class="get-input" id="inputG" data-key="G" type="text" autocomplete="off" spellcheck="false" inputmode="text" aria-label="Groups">
          </div>
          <div class="get-row e">
            <div class="get-label e"><div class="get-letter">E</div><div class="get-word">Each</div></div>
            <input class="get-input" id="inputE" data-key="E" type="text" autocomplete="off" spellcheck="false" inputmode="text" aria-label="Each">
          </div>
          <div class="get-row t">
            <div class="get-label t"><div class="get-letter">T</div><div class="get-word">Total</div></div>
            <input class="get-input" id="inputT" data-key="T" type="text" autocomplete="off" spellcheck="false" inputmode="text" aria-label="Total">
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="clearBtn" type="button">Clear card</button>
        <button class="btn primary" id="saveBtn" type="button">Save as image</button>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
let activeInput=null,toastTimer=null,lastSelection={start:0,end:0};
const $=s=>document.querySelector(s);
const inputs=[$('#inputG'),$('#inputE'),$('#inputT')];
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1600)}
function rememberSelection(inp){
  if(!inp)return;
  activeInput=inp;
  lastSelection.start=inp.selectionStart??inp.value.length;
  lastSelection.end=inp.selectionEnd??lastSelection.start;
}
inputs.forEach(inp=>{
  ['focus','pointerdown','click','keyup','select','input'].forEach(evt=>inp.addEventListener(evt,()=>rememberSelection(inp)));
});
function refocusActive(pos){
  if(!activeInput||!document.body.contains(activeInput))return;
  try{activeInput.focus({preventScroll:true})}catch(_){activeInput.focus()}
  try{activeInput.setSelectionRange(pos,pos)}catch(_){ }
  rememberSelection(activeInput);
}
function insertText(txt){
  if(!activeInput||!document.body.contains(activeInput)){toast('Tap a box first.');return}
  const s=Number.isFinite(lastSelection.start)?lastSelection.start:(activeInput.selectionStart??activeInput.value.length);
  const e=Number.isFinite(lastSelection.end)?lastSelection.end:(activeInput.selectionEnd??s);
  activeInput.value=activeInput.value.slice(0,s)+txt+activeInput.value.slice(e);
  activeInput.dispatchEvent(new Event('input',{bubbles:true}));
  const pos=s+txt.length;
  lastSelection={start:pos,end:pos};
  refocusActive(pos);
}
document.querySelectorAll('[data-insert]').forEach(b=>{
  // iPad/Safari: insert on pointer-down and never let the button take focus.
  // This keeps the text field active and the on-screen keyboard open.
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(e.pointerType==='mouse' && e.button!==0)return;
    insertText(b.dataset.insert);
  });
  b.addEventListener('pointerup',e=>e.preventDefault());
  b.addEventListener('click',e=>e.preventDefault());
});
function clearCard(){inputs.forEach(i=>i.value='');activeInput=inputs[0];lastSelection={start:0,end:0};refocusActive(0);toast('Card cleared.')}
function resetAll(){clearCard()}
function validate(){
  const vals=inputs.map(i=>i.value.trim());
  if(vals.some(v=>!v)){toast('Fill in G, E and T first.');return false}
  const unknowns=vals.filter(v=>v==='?').length;
  if(unknowns!==1){toast('Make exactly one of G, E or T ?');return false}
  return true;
}
function roundRect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fillRound(ctx,x,y,w,h,r,fill,stroke,line=0){roundRect(ctx,x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke&&line){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function fitFont(ctx,text,maxW,start,min=30){let s=start;while(s>min){ctx.font=`900 ${s}px Trebuchet MS, Arial`;if(ctx.measureText(text).width<=maxW)break;s-=2}return s}
function drawLabel(ctx,x,y,w,h,color,letter,word){
  fillRound(ctx,x,y,w,h,30,color);
  ctx.fillStyle='rgba(0,0,0,.08)';fillRound(ctx,x,y+h-10,w,10,8,'rgba(0,0,0,.08)');
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 66px Trebuchet MS, Arial';ctx.fillText(letter,x+w/2,y+h*.43);
  ctx.font='900 25px Trebuchet MS, Arial';ctx.fillText(word,x+w/2,y+h*.76);
}
function drawInput(ctx,x,y,w,h,text,border){
  fillRound(ctx,x,y,w,h,28,'#fff',border,4);
  const fs=fitFont(ctx,text,w-48,58,28);ctx.font=`900 ${fs}px Trebuchet MS, Arial`;ctx.fillStyle='#103f69';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x+w/2,y+h/2+1,w-44);
}
function saveImage(){
  if(!validate())return;
  const vals={G:$('#inputG').value.trim(),E:$('#inputE').value.trim(),T:$('#inputT').value.trim()};
  const W=1200,H=900;
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#fff1f6');grad.addColorStop(.5,'#f5f0ff');grad.addColorStop(1,'#eefaff');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  fillRound(ctx,70,70,1060,760,42,'rgba(255,255,255,.98)','#d8e6ee',4);
  ctx.fillStyle='#103f69';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 62px Trebuchet MS, Arial';ctx.fillText('GET Mystery!',W/2,150);
  const rows=[
    {letter:'G',word:'Group',value:vals.G,color:'#65b9e9',border:'#a7d8f2'},
    {letter:'E',word:'Each',value:vals.E,color:'#eaa8c1',border:'#f1bfd4'},
    {letter:'T',word:'Total',value:vals.T,color:'#7257e8',border:'#c8b8f6'}
  ];
  rows.forEach((r,i)=>{const y=235+i*180;drawLabel(ctx,165,y,180,130,r.color,r.letter,r.word);drawInput(ctx,380,y+13,655,104,r.value,r.border)});
  canvas.toBlob(blob=>{
    if(!blob){toast('Could not save image.');return}
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='GET-Mystery-card.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Image saved.');
  },'image/png');
}
$('#clearBtn').onclick=clearCard;$('#resetBtn').onclick=resetAll;$('#saveBtn').onclick=saveImage;
$('#fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
// Do not auto-focus on load; iPad will show the keyboard when the student taps a field.
</script>
</body>
</html>
