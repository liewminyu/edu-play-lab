<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Feast: Check & Celebrate v5 — 2 Empathy</title>
<style>
:root{
  --candy-ink:#4b2b50;--candy-deep:#6d3b74;--candy-pink:#ff8fbd;--candy-hot:#f45a9b;
  --candy-mint:#8fe6c7;--candy-blue:#91dcff;--candy-lemon:#ffe47f;--candy-lilac:#c9a9ff;
  --candy-peach:#ffbd88;--candy-cream:#fffaf3;--candy-paper:#fffefe;--candy-line:#ead7ef;
  --text:var(--candy-ink);--muted:#765d7c;--good:#62d5a8;--bad:#ff6683;
  --shadow:0 12px 28px rgba(89,46,93,.18)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff7ff;color:var(--text);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(145deg,#c8f1ff 0%,#e7e4ff 35%,#fce7ff 64%,#fff0d6 100%)}
body::after{content:"";position:fixed;left:-2vw;right:-2vw;bottom:-5vh;height:13vh;z-index:0;pointer-events:none;border-radius:55% 55% 0 0/65% 65% 0 0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.98) 0 30px,rgba(255,174,205,.88) 30px 60px);box-shadow:0 -9px 25px rgba(105,53,105,.08)}
button,input{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}
#app{position:relative;width:100%;height:100%;z-index:2}.screen{width:100%;height:100%;padding:clamp(9px,1.15vw,18px);display:flex;flex-direction:column;gap:10px}
.topbar{display:grid;grid-template-columns:minmax(360px,1fr) auto minmax(160px,1fr);align-items:center;gap:13px;min-height:58px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-badge{font-size:clamp(31px,3vw,48px);filter:drop-shadow(0 4px 2px rgba(255,255,255,.9)) drop-shadow(0 5px 7px rgba(89,46,93,.18))}
.brand h1{margin:0;font-size:clamp(22px,2.35vw,40px);line-height:1;color:var(--candy-ink);text-shadow:0 3px 0 #fff,0 6px 14px rgba(108,58,116,.15);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:5px 0 0;color:#765d7c;font-size:clamp(11px,1vw,16px)}
.round-pill{padding:8px 14px;border-radius:999px;background:#fff0f7;border:2px solid #ffc0da;box-shadow:0 3px 0 #edbdd1;color:#d94785;font-weight:1000;font-size:clamp(14px,1.05vw,18px);white-space:nowrap}
.toolbar{display:flex;gap:8px;justify-content:flex-end}.icon-btn,.primary-btn,.secondary-btn,.soft-btn,.correct-btn,.try-btn,.check-btn{border:0;cursor:pointer;font-weight:1000;transition:transform .11s ease,filter .13s ease,opacity .13s ease}
.icon-btn:active,.primary-btn:active,.secondary-btn:active,.soft-btn:active,.correct-btn:active,.try-btn:active,.check-btn:active{transform:translateY(3px)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:linear-gradient(180deg,#fff,#fff4fb);color:var(--candy-deep);border:2px solid #efcde2;box-shadow:0 6px 0 #dca9c7,0 10px 18px rgba(89,46,93,.12);font-size:21px}
.primary-btn{padding:13px 22px;border-radius:15px;background:linear-gradient(180deg,#ff9fca,#f45a9b);color:#fff;border:2px solid #e14a8a;box-shadow:0 6px 0 #c93d79,0 12px 22px rgba(120,45,93,.20);text-shadow:0 2px 0 rgba(118,34,85,.20);font-size:clamp(16px,1.3vw,22px)}
.secondary-btn{padding:13px 20px;border-radius:15px;background:linear-gradient(180deg,#fff,#f8efff);color:var(--candy-deep);border:2px solid #d8baf0;box-shadow:0 6px 0 #b99ada,0 11px 18px rgba(89,46,93,.13);font-size:clamp(15px,1.2vw,20px)}
.soft-btn{padding:11px 17px;border-radius:14px;background:linear-gradient(180deg,#a6e6ff,#69c8f5);color:#22546a;border:2px solid #58b8e4;box-shadow:0 5px 0 #3da0d1;font-size:clamp(14px,1.1vw,19px)}
.correct-btn,.check-btn{padding:12px 18px;border-radius:14px;background:linear-gradient(180deg,#9cf0cf,#59d39f);color:#275d49;border:2px solid #4fc492;box-shadow:0 5px 0 #38ad7d;font-size:clamp(15px,1.15vw,20px)}
.try-btn{padding:12px 18px;border-radius:14px;background:linear-gradient(180deg,#ffe993,#ffc861);color:#6a4727;border:2px solid #e8ae45;box-shadow:0 5px 0 #cf9330;font-size:clamp(15px,1.15vw,20px)}
button:disabled{filter:grayscale(.8) brightness(.88);opacity:.45;cursor:not-allowed;box-shadow:none!important;transform:none!important}

/* Cover */
.intro-center{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.cover-card{position:relative;width:min(1160px,100%);height:100%;background:rgba(255,250,253,.90);border:3px solid rgba(255,255,255,.95);border-radius:38px;box-shadow:0 18px 0 rgba(204,154,206,.28),0 28px 60px rgba(89,46,93,.15);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(28px,4vw,52px)}
.cover-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 14% 18%,rgba(145,220,255,.35),transparent 20%),radial-gradient(circle at 83% 19%,rgba(255,228,127,.33),transparent 22%),radial-gradient(circle at 46% 100%,rgba(143,230,199,.30),transparent 34%)}
.cover-inner{position:relative;z-index:2;max-width:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.cover-chip{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:#fff0f7;border:2px solid #ffb7d5;color:#cc3f7d;box-shadow:0 4px 0 #f3bfd3;font-weight:1000;font-size:clamp(12px,1.02vw,17px);letter-spacing:.04em;text-transform:uppercase}
.cover-title{font-size:clamp(50px,6vw,92px);line-height:.94;margin:20px 0 14px;color:var(--candy-ink);text-shadow:0 5px 0 #fff,0 9px 0 rgba(201,169,255,.35),0 15px 28px rgba(104,55,110,.15)}.cover-title em{color:#f45a9b;font-style:normal}.cover-subtitle{font-size:clamp(19px,1.7vw,29px);color:#755c7b;max-width:790px;line-height:1.3;margin:0;font-weight:900}.cover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}.cover-note{margin-top:18px;color:#765d7c;font-weight:900}.cover-note.good{color:#39705a}.cover-note.bad{color:#9a4860}
.candy-scene{position:absolute;inset:auto 0 8px 0;height:148px;pointer-events:none;z-index:1;overflow:hidden}.candy-float{position:absolute;display:block;font-size:72px;line-height:1;filter:drop-shadow(0 8px 8px rgba(91,48,94,.18));animation:candyBob 3.8s ease-in-out infinite alternate}.candy-float.c1{left:6%;bottom:4px}.candy-float.c2{left:22%;bottom:18px;animation-delay:.35s}.candy-float.c3{left:39%;bottom:0;animation-duration:4.6s}.candy-float.c4{left:56%;bottom:20px;animation-delay:.55s}.candy-float.c5{left:72%;bottom:6px;animation-duration:4.1s}.candy-float.c6{left:87%;bottom:14px;animation-delay:.2s}@keyframes candyBob{from{transform:translateY(3px) rotate(-2deg)}to{transform:translateY(-12px) rotate(3deg)}}

/* Review */
.review-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.question-panel{min-height:0;background:rgba(255,254,252,.94);border:3px solid #fff;box-shadow:0 9px 0 rgba(207,166,211,.30),0 15px 30px rgba(89,46,93,.12);border-radius:30px;color:var(--candy-ink);padding:clamp(12px,1.25vw,20px);display:flex;flex-direction:column;overflow:hidden}.question-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.stage-chip{padding:7px 13px;border-radius:999px;background:#f2e8ff;color:#694c72;border:2px solid #dbc6ed;font-weight:1000;font-size:clamp(13px,1vw,17px)}.sheet-label{font-size:clamp(12px,.95vw,16px);font-weight:1000;color:#8b6a91}.prompt{margin:4px auto 10px;text-align:center;max-width:1100px;font-size:clamp(28px,2.55vw,46px);line-height:1.14;font-weight:1000;letter-spacing:-.025em}.prompt.small{font-size:clamp(24px,2.15vw,38px)}
.responder-banner{min-height:74px;margin:3px auto 12px;width:min(780px,96%);border-radius:20px;background:linear-gradient(180deg,#fff9bf,#ffe47f);border:3px solid #e9c64d;box-shadow:0 6px 0 #d3aa36;display:flex;align-items:center;justify-content:center;gap:14px;padding:9px 18px;color:#6b4b34}.responder-banner .who{font-size:clamp(14px,1vw,17px);font-weight:1000;text-transform:uppercase;letter-spacing:.04em}.responder-banner .name{font-size:clamp(29px,2.5vw,44px);font-weight:1000;color:#5b3561}.responder-banner.empty{background:#f7effb;border-color:#dfc7e7;box-shadow:0 5px 0 #d1b9da;color:#846e89}.responder-banner.empty .name{font-size:clamp(19px,1.5vw,25px);color:#846e89}
.answer-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:11px;position:relative}.answer-wrap.locked{filter:blur(1px) saturate(.65);opacity:.42;pointer-events:none}.tap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:1040px;width:100%;margin:0 auto}.tap-option,.word-btn{min-height:82px;border:3px solid rgba(255,255,255,.88);border-radius:18px;padding:12px 15px;background:#fff4bf;color:#593a60;font-size:clamp(21px,1.85vw,32px);font-weight:1000;box-shadow:0 6px 0 rgba(91,48,94,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}.tap-option:nth-child(3n+2),.word-btn:nth-child(3n+2){background:#dff8ff}.tap-option:nth-child(3n+3),.word-btn:nth-child(3n+3){background:#ffe0ef}.tap-option.selected,.word-btn.selected{outline:5px solid #69c8f5;outline-offset:-5px}.tap-option.wrong,.word-btn.wrong{animation:shake .28s ease;outline:5px solid #ff617e;outline-offset:-5px}.tap-option.correct-choice,.word-btn.correct-choice{outline:5px solid #54c997;outline-offset:-5px;box-shadow:0 0 0 4px rgba(84,201,151,.24),0 6px 0 #43aa7e}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.multi-check-row,.teacher-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px}.feedback{min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(17px,1.3vw,22px);font-weight:1000;color:#785a7f}.feedback.try{color:#8a5f2f}.feedback.good{color:#36745c}.model-answer{max-width:950px;width:100%;margin:4px auto 0;padding:13px 17px;border-radius:16px;background:#e9fff5;border:3px solid #8adcb8;color:#38604f;font-size:clamp(18px,1.45vw,24px);font-weight:900;text-align:center;line-height:1.35}
.word-sentence{font-size:clamp(28px,2.5vw,43px);font-weight:1000;line-height:1.3;text-align:center;margin:0 auto 14px;max-width:1060px}.inline-blank{display:inline-block;min-width:185px;border-bottom:4px solid #6d4f75;color:#d94785;padding:0 7px}
.pad-shell{width:min(1000px,98%);margin:0 auto;display:flex;flex-direction:column;gap:7px}.pad-paper{position:relative;height:230px;border:3px solid #e4cbe2;border-radius:20px;background-color:#fffefb;background-image:linear-gradient(rgba(145,220,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(201,169,255,.15) 1px,transparent 1px);background-size:26px 26px;box-shadow:inset 0 2px 7px rgba(91,48,94,.06),0 5px 0 #dcc5db;overflow:hidden}.answer-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.pad-tools{display:flex;justify-content:center;gap:7px}.pad-tools button,.photo-toolbar button{border:2px solid #e0cce7;background:#fff;color:#65496c;border-radius:11px;padding:7px 12px;font-weight:1000;cursor:pointer}
.photo-capture-shell{width:min(980px,98%);margin:0 auto}.photo-empty{min-height:245px;border:4px dashed #d9bfe4;border-radius:24px;background:#fff8fb;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.photo-empty .camera{font-size:58px}.photo-empty h3{margin:5px 0;font-size:clamp(22px,1.8vw,30px)}.photo-empty p{margin:3px 0 12px;color:#7d6683;font-weight:900}.camera-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border-radius:14px;background:linear-gradient(180deg,#a6e6ff,#69c8f5);color:#22546a;border:2px solid #58b8e4;box-shadow:0 5px 0 #3da0d1;font-weight:1000;cursor:pointer}.camera-btn input{display:none}.photo-privacy{margin-top:11px;color:#8a728f;font-size:13px;font-weight:900}.photo-workspace{display:flex;flex-direction:column;gap:7px}.photo-toolbar{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap}.photo-stage{position:relative;height:min(40vh,330px);border-radius:20px;overflow:hidden;background:#fff;border:3px solid #e2cce5;box-shadow:0 6px 0 #d4bfd8}.photo-stage img{width:100%;height:100%;object-fit:contain;display:block}.photo-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

.side-panel{min-height:0;display:flex;flex-direction:column;gap:10px}.side-card{background:rgba(255,255,255,.91);border:2px solid #ead8ed;box-shadow:0 5px 0 #dcc8e1,0 8px 15px rgba(89,46,93,.10);border-radius:22px;padding:13px;min-height:0}.side-card h3{margin:0 0 8px;font-size:18px;color:#5f3d66}.current-student{padding:10px;border-radius:15px;background:#fff7c8;border:2px solid #f2d064;text-align:center;font-weight:1000;color:#684960}.current-student strong{display:block;font-size:clamp(21px,1.6vw,29px);margin-top:3px}.mini-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:1000;color:#775c7d}.mini-row .big{font-size:31px;color:#e64f91}.mini-track{height:10px;border-radius:999px;background:#efe5f2;overflow:hidden;margin:8px 0}.mini-fill{height:100%;background:linear-gradient(90deg,#91dcff,#ff8fbd);border-radius:999px}.side-btn{width:100%;border:2px solid #dfc7e7;background:#fff;color:#684d70;border-radius:12px;padding:9px;font-weight:1000;cursor:pointer;margin-top:7px}.roster-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;max-height:210px;overflow:auto}.roster-mini span{padding:4px 3px;border-radius:7px;background:#f7ecfb;color:#684d70;font-size:11px;font-weight:1000;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roster-mini span.used{background:#e5e2e7;color:#aaa0ad;text-decoration:line-through;filter:grayscale(1)}

/* Modals */
#overlayRoot{position:relative;z-index:90}.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(75,43,80,.32);backdrop-filter:blur(5px);display:grid;place-items:center;padding:22px}.modal-card{width:min(1050px,96vw);max-height:92vh;overflow:auto;background:rgba(255,250,253,.98);border:4px solid #fff;border-radius:34px;box-shadow:0 18px 0 rgba(177,129,185,.30),0 34px 80px rgba(85,44,91,.25);padding:24px 28px}.modal-head{text-align:center}.modal-head h2{margin:4px 0 6px;font-size:clamp(34px,3.2vw,54px);color:#5b3561;text-shadow:0 3px 0 #fff}.modal-head p{margin:0;color:#7a627f;font-weight:900;font-size:clamp(15px,1.15vw,20px)}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.mode-btn{border:3px solid #fff;border-radius:24px;min-height:190px;padding:20px 14px;cursor:pointer;box-shadow:0 8px 0 rgba(91,48,94,.15);font-weight:1000;color:#5b3a61}.mode-btn span{display:block;font-size:58px}.mode-btn strong{display:block;font-size:clamp(21px,1.7vw,29px);margin-top:8px}.mode-btn small{display:block;font-size:15px;margin-top:5px;color:#785f7d}.mode-btn.volunteer{background:#fff4bf}.mode-btn.random{background:#dff8ff}.mode-btn.group{background:#ffe0ef}.mode-btn:hover{filter:brightness(1.03);transform:translateY(-2px)}
.roster-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px}.person-btn{border:3px solid #fff;border-top:7px solid var(--gc,#c9a9ff);border-radius:15px;padding:10px 6px;background:#fff;color:#5d3d63;box-shadow:0 5px 0 #dbc8de;font-weight:1000;font-size:clamp(14px,1.05vw,18px);cursor:pointer;min-height:62px}.person-btn small{display:block;font-size:10px;color:#876f8c;margin-top:3px}.person-btn.used{background:#e8e5e9;color:#aaa2ad;border-top-color:#c7c2c9;box-shadow:0 4px 0 #d5d1d6;text-decoration:line-through;filter:grayscale(1);cursor:not-allowed}.back-row{display:flex;justify-content:center;margin-top:15px}
.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.group-btn{border:3px solid #fff;border-top:9px solid var(--gc,#c9a9ff);border-radius:20px;background:#fff;padding:14px;box-shadow:0 6px 0 #dcc8e1;color:#5b3a61;cursor:pointer;text-align:left}.group-btn h3{margin:0 0 8px;font-size:23px}.group-btn .group-count{font-weight:1000;color:#8a6c90;margin-bottom:8px}.group-names{display:flex;flex-wrap:wrap;gap:5px}.group-names span{padding:4px 7px;border-radius:999px;background:#f5eafa;font-size:12px;font-weight:1000}.group-names span.used{background:#e7e3e8;color:#aaa1ac;text-decoration:line-through;filter:grayscale(1)}.group-btn:disabled{opacity:.5}
.name-reveal-card{width:min(720px,92vw);text-align:center;background:linear-gradient(160deg,#fff7c6,#ffe88e);border:4px solid #fff;border-radius:36px;box-shadow:0 16px 0 rgba(190,155,66,.25),0 34px 80px rgba(85,44,91,.25);padding:34px}.name-reveal-card .spark{font-size:70px;animation:pop .5s cubic-bezier(.2,.9,.2,1.25)}.name-reveal-card h2{margin:6px 0 3px;font-size:clamp(25px,2vw,34px);color:#795d37}.name-reveal-card .picked-name{font-size:clamp(48px,5vw,82px);line-height:1;font-weight:1000;color:#5b3561;text-shadow:0 4px 0 #fff;margin:10px 0}.name-reveal-card .group-label{font-size:18px;font-weight:1000;color:#795f80}.name-reveal-card .ready-note{margin-top:15px;color:#6b4d70;font-weight:1000}@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* Reward choice */

function normalizeSetup(raw){

 if(Array.isArray(raw.players))players=raw.players.map((p,i)=>typeof p==='string'?{id:`p${String(i+1).padStart(2,'0')}`,name:p}:{id:String(p?.id||`p${String(i+1).padStart(2,'0')}`),name:String(p?.name||'')});

function showModelAnswer(q){const f=$('#feedback');f.innerHTML=`<div class="model-answer"><strong>Answer:</strong> ${esc(q.answer)}${q.accept?`<br><span style="font-size:.82em">${esc(q.accept)}</span>`:''}</div><div style="margin-top:10px"><button class="secondary-btn" id="continueNoReward">Continue →</button></div>`;$('#continueNoReward').onclick=nextQuestion}
function correctFlow(q){if(!responderReady())return;goodSound();$$('.tap-option,.word-btn,#markCorrect,#tryAgain,#showAnswer,#checkMulti').forEach(x=>{if(x)x.disabled=true});const f=$('#feedback');f.innerHTML=`<div class="model-answer correct-hold"><div class="correct-title">✓ Correct!</div><div class="correct-answer-line"><strong>Answer:</strong> ${esc(q.answer)}</div>${q.accept?`<div class="accept-note">${esc(q.accept)}</div>`:''}</div><div class="correct-next-row"><button class="primary-btn pick-one-btn" id="pickOneBtn">🎉 Pick One</button></div>`;$('#pickOneBtn').onclick=()=>showRewardChoice(q)}

function openPickMode(){const used=pickedSet(),remaining=setupConfig.players.length-used.size;if(!remaining){openUsedCycle();return}$('#overlayRoot').innerHTML=`<div class="modal-backdrop"><section class="modal-card"><div class="modal-head"><span class="cover-chip">Pick a Student</span><h2>Who will answer?</h2><p>Previously picked students stay greyed out.</p></div><div class="mode-grid"><button class="mode-btn volunteer" id="modeVolunteer"><span>🙋</span><strong>Volunteer</strong><small>Choose a raised hand</small></button><button class="mode-btn random" id="modeRandom"><span>🎲</span><strong>Pick Someone</strong><small>${remaining} students available</small></button><button class="mode-btn group" id="modeGroup"><span>👥</span><strong>Pick from Group</strong><small>Choose a group, then one student is picked</small></button></div></section></div>`;$('#modeVolunteer').onclick=openVolunteer;$('#modeRandom').onclick=pickRandom;$('#modeGroup').onclick=openGroupPicker}
function openVolunteer(){const used=pickedSet();$('#overlayRoot').innerHTML=`<div class="modal-backdrop"><section class="modal-card"><div class="modal-head"><span class="cover-chip">Volunteer</span><h2>Choose the student</h2><p>Grey names have already answered.</p></div><div class="roster-grid">${setupConfig.players.map(p=>{const g=groupForPlayer(p.id),u=used.has(p.id);return `<button class="person-btn ${u?'used':''}" data-person="${esc(p.id)}" ${u?'disabled':''} style="--gc:${g?.color||'#c9a9ff'}">${esc(p.name)}<small>${esc(g?.name||'')}</small></button>`}).join('')}</div><div class="back-row"><button class="secondary-btn" id="backModes">← Back</button></div></section></div>`;$('#backModes').onclick=openPickMode;$$('[data-person]').forEach(b=>b.onclick=()=>chooseStudent(b.dataset.person))}
function pickRandom(){const available=setupConfig.players.filter(p=>!pickedSet().has(p.id));if(!available.length){openUsedCycle();return}const p=available[Math.floor(Math.random()*available.length)];chooseStudent(p.id)}
function openGroupPicker(){const used=pickedSet();$('#overlayRoot').innerHTML=`<div class="modal-backdrop"><section class="modal-card"><div class="modal-head"><span class="cover-chip">Pick from Group</span><h2>Choose a group</h2><p>The computer will pick one student from that group who has not answered yet.</p></div><div class="group-grid">${setupConfig.groups.map(g=>{const available=g.memberIds.filter(id=>!used.has(id));return `<button class="group-btn" data-group="${g.id}" ${available.length?'':'disabled'} style="--gc:${g.color}"><h3>${esc(g.name)}</h3><div class="group-count">${available.length} available</div><div class="group-names">${g.memberIds.map(id=>`<span class="${used.has(id)?'used':''}">${esc(playerById(id)?.name||'')}</span>`).join('')}</div></button>`}).join('')}</div><div class="back-row"><button class="secondary-btn" id="backModes">← Back</button></div></section></div>`;$('#backModes').onclick=openPickMode;$$('[data-group]').forEach(b=>b.onclick=()=>{const g=setupConfig.groups.find(x=>x.id===b.dataset.group),available=g.memberIds.filter(id=>!pickedSet().has(id));if(!available.length)return;chooseStudent(available[Math.floor(Math.random()*available.length)])})}
function openUsedCycle(){$('#overlayRoot').innerHTML=`<div class="modal-backdrop"><section class="name-reveal-card"><div class="spark">🎉</div><h2>Everyone has answered once!</h2><div class="ready-note">Reset the participation cycle so names can be used again.</div><div style="margin-top:18px"><button class="primary-btn" id="resetCycle">Reset Names</button></div></section></div>`;$('#resetCycle').onclick=()=>{state.pickedIds=[];saveState();openPickMode()}}
function chooseStudent(id){setResponder(id);const p=playerById(id),g=groupForPlayer(id);softPop();$('#overlayRoot').innerHTML=`<div class="modal-backdrop"><section class="name-reveal-card"><div class="spark">⭐</div><h2>You're up!</h2><div class="picked-name">${esc(p?.name||'')}</div><div class="group-label">${esc(g?.name||'')}</div><div class="ready-note">Answer the question on screen.</div></section></div>`;renderSidePanel();updateResponderBanner(p);setTimeout(()=>{$('#overlayRoot').innerHTML='';$('#answerWrap')?.classList.remove('locked')},1150)}
function updateResponderBanner(p){const b=$('#responderBanner');if(!b)return;b.classList.remove('empty');b.innerHTML=`<span class="who">Answering now</span><span class="name">${esc(p?.name||'')}</span>`}

function renderSidePanel(){const side=$('#sidePanel');if(!side||!state||!setupConfig)return;const used=pickedSet(),p=playerById(currentResponderId()),pct=Math.round(used.size/setupConfig.players.length*100);side.innerHTML=`<section class="side-card"><h3>Current responder</h3><div class="current-student">${p?'Answering now':'Waiting for pick'}<strong>${p?esc(p.name):'—'}</strong></div><button class="side-btn" id="repickBtn" ${p?'':'disabled'}>↻ Pick a different student</button></section><section class="side-card"><div class="mini-row"><span><span class="big">${used.size}</span> picked</span><span>/ 30</span></div><div class="mini-track"><div class="mini-fill" style="width:${pct}%"></div></div><button class="side-btn" id="rosterBtn">Show names</button><div class="roster-mini hidden" id="rosterMini">${setupConfig.players.map(x=>`<span class="${used.has(x.id)?'used':''}">${esc(x.name)}</span>`).join('')}</div><button class="side-btn" id="partyBtn">🎉 View Party</button></section>`;$('#repickBtn')?.addEventListener('click',()=>{const old=currentResponderId();delete state.responders[state.q];const elsewhere=Object.entries(state.responders).some(([q,id])=>Number(q)!==state.q&&id===old);if(!elsewhere)state.pickedIds=state.pickedIds.filter(id=>id!==old);saveState();updateResponderBanner(null);$('#answerWrap')?.classList.add('locked');openPickMode();renderSidePanel()});$('#rosterBtn').onclick=()=>{const r=$('#rosterMini');r.classList.toggle('hidden');$('#rosterBtn').textContent=r.classList.contains('hidden')?'Show names':'Hide names'};$('#partyBtn').onclick=()=>showPartyOverlay(null,false)}

function rewardVisual(choice){if(choice.kind==='balloon')return `<div class="balloon-preview ${choice.shape}" style="--bc:${choice.color}"><div class="balloon-body"></div><div class="knot"></div><div class="string"></div></div>`;if(choice.kind==='plate')return `<div class="plate-preview" style="--pc:${choice.color}"></div>`;if(choice.kind==='gift')return `<div class="gift-preview" style="--gc:${choice.color}"></div>`;if(choice.kind==='bunting')return `<div class="bunting-preview" style="--fc:${choice.color==='rainbow'?'#ff8fbd':choice.color}"><i></i><i style="${choice.color==='rainbow'?'background:#91dcff':''}"></i><i style="${choice.color==='rainbow'?'background:#ffe47f':''}"></i><i style="${choice.color==='rainbow'?'background:#8fe6c7':''}"></i></div>`;if(choice.kind==='hat')return `<div class="hat-preview" style="--hc:${choice.color}"></div>`;return `<span>${choice.icon||'🎉'}</span>`}
function showRewardChoice(q){const p=playerById(currentResponderId()),set=PARTY_SETS[q.party];$('#overlayRoot').innerHTML=`<div class="modal-backdrop"><section class="modal-card reward-card"><span class="cover-chip">Correct!</span><h2>${esc(p?.name||'')}, you get to choose!</h2><div class="student-line">${esc(set.label)}</div><p class="reward-prompt">Tap one item to add it to Daniel’s birthday party.</p><div class="reward-grid">${set.choices.map((c,i)=>`<button class="reward-option" data-reward="${i}"><div class="reward-visual">${rewardVisual(c)}</div><div class="reward-label">${esc(c.label)}</div></button>`).join('')}</div></section></div>`;$$('[data-reward]').forEach(b=>b.onclick=()=>selectReward(q,Number(b.dataset.reward)))}
function selectReward(q,index){const set=PARTY_SETS[q.party],choice=set.choices[index],r={q:state.q,category:q.party,choiceId:choice.id,label:choice.label,kind:choice.kind,icon:choice.icon||'',color:choice.color||'',shape:choice.shape||'',studentId:currentResponderId(),isNew:true};state.rewards=(state.rewards||[]).filter(x=>x.q!==state.q);state.rewards.push(r);saveState();goodSound();showPartyOverlay(r,true)}

const POS={
 balloon:[{left:'5%',top:'18%'},{left:'10%',top:'34%'},{right:'6%',top:'18%'},{right:'11%',top:'35%'}],
 food:[{left:'27%',bottom:'146px'},{left:'35%',bottom:'133px'},{right:'35%',bottom:'138px'},{right:'27%',bottom:'148px'}],
 bunting:[{left:'28%',top:'118px'},{left:'43%',top:'104px'},{right:'28%',top:'118px'}],
 drink:[{left:'22%',bottom:'126px'},{left:'43%',bottom:'120px'},{right:'22%',bottom:'128px'}],
 plate:[{left:'31%',bottom:'92px'},{left:'45%',bottom:'88px'},{right:'31%',bottom:'92px'}],
 gift:[{left:'12%',bottom:'34px'},{left:'21%',bottom:'28px'},{right:'20%',bottom:'30px'},{right:'11%',bottom:'34px'}],
 sweets:[{left:'29%',bottom:'184px'},{right:'29%',bottom:'184px'},{left:'41%',bottom:'171px'}],
 dino:[{left:'7%',bottom:'164px'},{right:'7%',bottom:'176px'},{left:'14%',bottom:'144px'}],
 caketop:[{left:'49%',bottom:'270px'},{left:'52%',bottom:'266px'}],
 hat:[{right:'13%',bottom:'160px'},{left:'14%',bottom:'164px'}],
 confetti:[{left:'28%',top:'68px'},{right:'28%',top:'68px'}]
};
function choiceFromReward(r){const set=PARTY_SETS[r.category];return set?.choices.find(c=>c.id===r.choiceId)||r}
function partyItemHTML(r,idxInCat){const c=choiceFromReward(r),pos=(POS[r.category]||[{left:'50%',top:'50%'}])[idxInCat%(POS[r.category]||[1]).length],style=Object.entries(pos).map(([k,v])=>`${k}:${v}`).join(';');let inner='';let cls=r.category;if(r.category==='balloon')inner=`<div class="balloon-preview party-balloon ${c.shape}" style="--bc:${c.color}"><div class="balloon-body"></div><div class="knot"></div><div class="string"></div></div>`;else if(r.category==='plate')inner=`<div class="plate-preview" style="--pc:${c.color}"></div>`;else if(r.category==='gift')inner=`<div class="gift-preview" style="--gc:${c.color}"></div>`;else if(r.category==='bunting'){const fc=c.color==='rainbow'?'#ff8fbd':c.color;inner=`<div class="party-bunting-choice" style="--fc:${fc}"><i></i><i style="${c.color==='rainbow'?'background:#91dcff':''}"></i><i style="${c.color==='rainbow'?'background:#ffe47f':''}"></i><i style="${c.color==='rainbow'?'background:#8fe6c7':''}"></i></div>`}else if(r.category==='hat')inner=`<div class="hat-preview" style="--hc:${c.color}"></div>`;else inner=c.icon||r.icon||'🎉';return `<div class="party-item ${cls}" style="${style}">${inner}</div>`}
function partyStageHTML(newReward=null){const counts={};const items=(state?.rewards||[]).map(r=>{const i=counts[r.category]||0;counts[r.category]=i+1;let html=partyItemHTML(r,i);if(!newReward||r.q!==newReward.q)html=html.replace('party-item ','party-item old ');return html}).join('');return `<div class="party-stage"><div class="party-backdrop"><div class="backdrop-scallops"></div><div class="backdrop-stars"><i></i><i></i><i></i><i></i><i></i></div></div><div class="curtain curtain-left"></div><div class="curtain curtain-right"></div><div class="rosette r1"></div><div class="rosette r2"></div><div class="rosette r3"></div><div class="candy-cloud cloud1"></div><div class="candy-cloud cloud2"></div><div class="stage-bunting-line"><div class="base-flags"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="dino-sign"><small>ROAR & CELEBRATE</small>Daniel's <span>Dino Feast!</span></div><div class="party-rug"></div><div class="floor-dots"></div><div class="dessert-stand stand-left"><i></i><b></b></div><div class="dessert-stand stand-right"><i></i><b></b></div><div class="party-table"></div><div class="cake-base"><div class="layer1"></div><div class="layer2"></div><div class="icing"></div><div class="candles"><i></i><i></i><i></i></div></div><div class="dino-host">🦖</div><div class="dino-footprints">● ● ●</div>${items}<div class="party-caption">${state?.rewards?.length||0} party choices added</div></div>`}
function showPartyOverlay(newReward=null,fromReward=false){const p=newReward?playerById(newReward.studentId):null;$('#overlayRoot').innerHTML=`<div class="modal-backdrop"><section class="party-overlay-card"><div class="party-overlay-copy"><span class="cover-chip">Daniel’s Birthday Party</span><h2>${newReward?`${esc(p?.name||'')} added ${esc(newReward.label)}!`:'Our party so far'}</h2><p>${newReward?'Great answer. The party is getting bigger!':'Every correct answer adds another student choice.'}</p></div>${partyStageHTML(newReward)}<div class="party-actions">${fromReward?`<button class="primary-btn" id="nextPartyBtn">Next Question ➜</button>`:`<button class="secondary-btn" id="closeParty">Back to question</button>`}</div></section></div>`;softPop();if(fromReward){$('#nextPartyBtn').onclick=nextQuestion}else $('#closeParty').onclick=()=>{$('#overlayRoot').innerHTML=''}}
function nextQuestion(){clearTimeout(autoAdvanceTimer);cleanupDrawing();$('#overlayRoot').innerHTML='';state.q++;if(state.q>=QUESTIONS.length){state.finished=true;saveState();renderFinish()}else{saveState();renderQuestion(true)}}

function makeDrawingController(canvas,undoBtn,redoBtn,clearBtn,color='#4b2b50',width=4){if(!canvas)return null;const ctx=canvas.getContext('2d');let strokes=[],redo=[],drawing=false,current=null;function resize(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}function redraw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.lineWidth=width;strokes.forEach(s=>{if(!s.length)return;ctx.beginPath();s.forEach((p,i)=>{const x=p.x*r.width,y=p.y*r.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()})}function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}const down=e=>{e.preventDefault();drawing=true;current=[point(e)];strokes.push(current);redo=[];try{canvas.setPointerCapture(e.pointerId)}catch(err){}};const move=e=>{if(!drawing)return;e.preventDefault();current.push(point(e));redraw()};const up=e=>{if(!drawing)return;drawing=false;current=null;redraw()};canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);const ro=new ResizeObserver(resize);ro.observe(canvas);setTimeout(resize,30);undoBtn&& (undoBtn.onclick=()=>{if(strokes.length){redo.push(strokes.pop());redraw()}});redoBtn&&(redoBtn.onclick=()=>{if(redo.length){strokes.push(redo.pop());redraw()}});clearBtn&&(clearBtn.onclick=()=>{if(strokes.length){redo.push(...strokes.splice(0));redraw()}});return{destroy(){ro.disconnect();canvas.removeEventListener('pointerdown',down);canvas.removeEventListener('pointermove',move);canvas.removeEventListener('pointerup',up);canvas.removeEventListener('pointercancel',up)}}}
function bindPhoto(q){const input=$('#photoInput'),retake=$('#photoRetake'),handler=e=>{const f=e.target.files?.[0];if(!f)return;loadPhoto(f);e.target.value=''};input&&input.addEventListener('change',handler);retake&&retake.addEventListener('change',handler)}
function loadPhoto(file){if(photoUrl)URL.revokeObjectURL(photoUrl);photoController?.destroy?.();photoUrl=URL.createObjectURL(file);const img=$('#photoPreview');img.onload=()=>{$('#photoEmpty').classList.add('hidden');$('#photoWorkspace').classList.remove('hidden');photoController=makeDrawingController($('#photoCanvas'),$('#photoUndo'),$('#photoRedo'),$('#photoClear'),'#ff365f',5)};img.src=photoUrl}
function cleanupDrawing(){canvasControllers.forEach(c=>c?.destroy?.());canvasControllers=[];photoController?.destroy?.();photoController=null;if(photoUrl){try{URL.revokeObjectURL(photoUrl)}catch(e){}photoUrl=null}}

function renderFinish(){cleanupDrawing();const used=pickedSet().size;$('#overlayRoot').innerHTML='';$('#app').innerHTML=`<main class="screen">${topbar('Review Complete')}<section class="finish-card"><div class="finish-copy"><span class="cover-chip">Review Complete</span><h2>The Feast is ready!</h2><p>${used} students answered today and ${state.rewards.length} party choices were added.</p><div class="cover-actions"><button class="secondary-btn" id="homeFinish">⌂ Home</button><button class="primary-btn" id="againFinish">↻ Start Again</button></div></div><div class="finish-scene">${partyStageHTML()}</div></section></main>`;bindToolbar();goodSound();$('#homeFinish').onclick=renderCover;$('#againFinish').onclick=()=>{state=blankState();saveState();renderQuestion(true)}}
window.addEventListener('beforeunload',cleanupDrawing);renderCover();
})();
</script>
</body>
